# Code-Development — Python project declaration.
#
# WHY THIS FILE EXISTS (added at contract v1.2.0). `.ruff_cache/` and `.pytest_cache/` were already at the repo
# root: ruff and pytest have been RUN here for some time while nothing declared them, nothing
# configured them, and no gate enforced them. That is an undeclared habit, and an undeclared habit
# is the thing that silently changes. This file declares exactly what is true and REFUSES to
# declare what is not — because a config that names a gate nobody runs is the same skeleton this
# repo exists to prevent.
#
# MEASURED BEFORE WRITING ANY OF IT (instrument: `ruff check . --show-files`, `ruff format --check`,
# `python3 -m pytest -q`, all run at v1.2.0):
#   - ruff saw exactly SIX Python files then; re-measured at v1.3.0 after the harness was
#     split into modules, it sees 8. The count is not typed into a document: README's
#     generated facts block computes it from scripts/*.py on every run.
#   - `ruff check .` -> All checks passed, exit 0. Safe to enforce at that version, and enforced since.
#   - `ruff format --check` -> every file would be reformatted. Not adopted; see [tool.ruff.format].
#   - `python3 -m pytest -q` -> "no tests ran". Not adopted; see [tool.pytest] below.

# THIS FILE DESCRIBES THE HARNESS, NOT THE REPOSITORY.
# The atlas is polyglot and is not a Python project; Python is simply what the contract
# harness happens to be written in. A `pyproject.toml` at the root of a polyglot repository reads
# as "this is a Python package" to both humans and tooling, so the name says otherwise explicitly.
# The languages themselves declare their own authority in languages/<lang>/tools.yaml — that is
# the roster, and it is not Python-shaped. Nothing here is installed or published.

[project]
name = "code-development-harness"
version = "0.0.0"                     # NOT the repository version. The contract version lives in
                                      # VERSION and is read at a declared line per site by atlas.py check;
                                      # duplicating it here would be a second declaration that goes
                                      # stale first. See docs/VERSIONING.md.
description = "Contract harness for the Code-Development engineering atlas. The atlas is polyglot; only this harness is Python."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3,<7"]       # the single runtime dep, mirrored from scripts/requirements.txt
keywords = ["engineering-atlas", "polyglot", "contract-verification", "ai-agents", "mcp"]

# FOUND FROM AN INSTALL. Before 2.28.0 an installed package named no link at all, so an agent
# handed only `pip show` had no route back to the atlas, its entry or its instructions.
[project.urls]
Homepage = "https://github.com/HeartlandTechnology/Code-Development"
"Agent entry" = "https://raw.githubusercontent.com/HeartlandTechnology/Code-Development/main/.agent/bootstrap.json"
"LLM instructions" = "https://raw.githubusercontent.com/HeartlandTechnology/Code-Development/main/llms.txt"
Changelog = "https://github.com/HeartlandTechnology/Code-Development/blob/main/docs/VERSIONING.md"

[project.optional-dependencies]
quality = ["ruff>=0.6"]

# THE HARNESS IS INSTALLABLE; THE ATLAS IS POINTED AT. This is the whole external interface, and
# the split is deliberate. Shipping the policy content inside the wheel would create a second copy
# that ages exactly like a vendored tree — so the CLI resolves WHICH atlas it is running against
# (--atlas-root, CODE_DEVELOPMENT_ROOT, or a pinned `root:` in a consumer's .atlas.yaml) and PRINTS
# the rule that decided it. An explicit pin and a lucky fall-through are the same answer with very
# different trust, and `atlas --where` is how a consumer tells them apart.
[project.scripts]
atlas = "atlas_cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}
# WHAT SHIPS. A wheel that silently gains a module is worse than an enumerated roster, so this list
# is asserted against scripts/*.py by `atlas.py check` — every script must be HERE or in
# atlas.yaml/context_policy/install_footprint/development_only, and a script in neither fails the
# build. The development instruments are deliberately absent: a consumer should not pay to carry
# this repository's own mutation harness, shape gate, platform auditor and benchmark.
py-modules = [
    "atlas_cli", "atlas", "atlascore", "atlasindex", "agentaudit",
    "agentpolicy", "agentrun", "contextcost", "doctor", "knowledge", "packmanifest",
]

[tool.ruff]
# The harness and the Python examples. `languages/` holds prose and manifests, not a package.
include = ["scripts/*.py", "examples/**/*.py"]
line-length = 120                     # matches .editorconfig; column width is a rule of thumb, never a
                                      # gate — see docs/ENGINEERING-CONCEPTS.md

[tool.ruff.lint]
# ENFORCED, because it passed clean on the real tree at the version it was added (exit 0, zero
# findings), and the sweep is re-run on every change. A guard that
# fires on correct code gets disabled, so nothing is enabled here that this repo does not already
# satisfy. Widen deliberately, one rule family at a time, each with a clean sweep before it lands.
select = ["E", "F", "I",              # pycodestyle errors, pyflakes, import sorting
          # 2.28.0, each measured at ZERO findings first: comprehension idioms, a collapsed nested
          # if, a returned condition, an any/all loop, a ternary over an if-block, and no else
          # after return/raise/continue — guard clauses. PERF401 was measured too and REJECTED:
          # 31 error-collecting loops with no safe fix, whose messages would hide in generators.
          "C4", "SIM102", "SIM103", "SIM108", "SIM110", "RET505", "RET506", "RET508"]
ignore = ["E501"]                     # line length is governed by line-length above, not by a lint error

[tool.ruff.lint.per-file-ignores]
# E402 is WRONG here, and the exemption carries its reason inline rather than being a snooze button.
# atlas_test.py must `sys.path.insert(0, ROOT/"scripts")` BEFORE `import atlas`, because the module
# it tests is not installed — you cannot import from a directory that is not yet on the path. Moving
# that import to the top, as the rule asks, breaks the harness. Scoped to the one file so the rule
# keeps protecting every other file.
"scripts/atlas_test.py" = ["E402"]
# Same reason, same shape: agent_test.py imports the three agent modules after putting
# scripts/ on the path, because they are not installed either. Two files, one reason,
# both scoped — never a repository-wide disable of a rule that is right everywhere else.
"scripts/agent_test.py" = ["E402"]

[tool.ruff.format]
# NOT ENFORCED, AND THIS IS A DECISION, NOT AN OVERSIGHT.
# Measured at v1.3.0: `ruff format --check` would reformat every Python file in the repo,
# including the contract harness itself. Those files carry deliberate dense layout and
# load-bearing comment blocks. Rewriting all of them to satisfy a formatter nobody asked for is
# churn that would bury the next real diff, and `code-quality.md` §6 puts column width in the
# "rule of thumb, never a gate" column. If it is ever adopted it must land as ONE commit that
# reformats everything, reviewed on purpose — never as a CI gate switched on quietly.
quote-style = "double"

# [tool.pytest.ini_options] IS DELIBERATELY ABSENT.
# `python3 -m pytest -q` collects ZERO tests here and exits 0 — indistinguishable from a clean pass,
# which is the precise defect this repository's own §8 warns about. The contract's mutation tests
# are a custom harness run directly:
#
#     python3 scripts/atlas_test.py     -> "atlas tests: N/N pass" with N asserted, exit 0
#
# declared in that file's own docblock and wired into .github/workflows/atlas-ci.yml. Declaring a
# pytest section now would add a second, empty test surface whose green exit means nothing. When a
# real pytest suite exists, configure it here and give it a failing case first.
