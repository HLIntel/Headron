name: ClusterFuzzLite

# Coverage-guided fuzzing of the manifest grammar and the router on every pull request.
#
# BOUNDED ON PURPOSE: 120 seconds, code-change mode, so it explores what this diff touched rather
# than running a campaign on a gate. The long campaigns belong on a schedule, not on a merge path.
# The same target also runs as a deterministic corpus in Atlas CI, so it is exercised even when
# this job cannot build — a fuzz target nobody can run is a skeleton.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the grammar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c # main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
          output-sarif: true
