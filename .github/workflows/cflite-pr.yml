name: ClusterFuzzLite

# Coverage-guided fuzzing of the manifest grammar and the router on every pull request.
#
# BOUNDED ON PURPOSE: 120 seconds, code-change mode, so it explores what this diff touched rather
# than running a campaign on a gate. The long campaigns belong on a schedule, not on a merge path.
# The same target also runs as a deterministic corpus in Atlas CI, so it is exercised even when
# this job cannot build — a fuzz target nobody can run is a skeleton.
on:
  pull_request:
    branches: [main]
    # NOT A REQUIRED CHECK, so a path filter is safe here: a pull request that touches none of what the
    # targets build from or read (docs, wiki, records) spent four minutes building fuzzers whose
    # code-change mode then had nothing to explore. The Atlas CI corpus replay still runs on every PR.
    paths:
      - "fuzz/**"
      - "scripts/**"
      - "languages/**"
      - "config/**"
      - "atlas.yaml"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite-pr.yml"

permissions:
  contents: read

concurrency:
  group: cflite-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz the grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 120
          mode: code-change
          sanitizer: address
