name: mcp-registry-publish

# Publishes server.json to the official MCP Registry. Manual only: a run publishes a public record,
# so it never fires on push or on a schedule. Authenticates with GitHub OIDC, so no secret is stored.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install mcp-publisher v1.8.1, checksum pinned
        env:
          SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "${SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          install -m 0755 mcp-publisher "$RUNNER_TEMP/mcp-publisher"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Log in with GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
