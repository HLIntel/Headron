name: ClusterFuzzLite

# Coverage-guided fuzzing of the manifest grammar and the router, nightly on main.
#
# MOVED OFF THE PULL REQUEST PATH: the 4-minute build plus a 120-second code-change run was the longest
# job on every pull request and was not a required check. The same target still runs as a deterministic
# corpus in Atlas CI on every pull request, so a fuzz target nobody can build still fails the PR.
# This run is a batch campaign on the default branch, not a diff-scoped one.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflite-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz the grammar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Build fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          sanitizer: address

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: batch
          sanitizer: address
