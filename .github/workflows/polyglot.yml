name: Polyglot examples

# THE SCHEDULED HALF OF THE EXAMPLE GATE. atlas.yaml/example_runners sends any pack whose toolchain
# must be INSTALLED here, so a pull request never pays for it. Until 2.29.0 that promise named a
# workflow that did not exist, so those examples were declared and never run anywhere but a laptop.
# The toolchains come from the GENERATED Brewfile, so this list cannot drift from the runners.

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polyglot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Examples with installed toolchains
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install harness dependency
        run: python -m pip install --quiet --require-hashes -r scripts/requirements.lock.txt

      - name: Install the declared toolchains
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew bundle --file=Brewfile && brew bundle check --file=Brewfile

      - name: Install toolchains published outside Homebrew, verified by digest
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, sys, tarfile, urllib.request
          sys.path.insert(0, "scripts")
          from atlascore import atlas  # the strict loader: a duplicate key is refused, not resolved
          runners = atlas()["example_runners"]
          bindir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "official"
          for name, spec in runners.items():
              rel = (spec or {}).get("official")
              if not rel:
                  continue
              entry = json.load(urllib.request.urlopen(rel["index"]))[str(rel["version"])]["aarch64-macos"]
              blob = urllib.request.urlopen(entry["tarball"]).read()
              if hashlib.sha256(blob).hexdigest() != entry["shasum"]:
                  raise SystemExit(f"{name}: digest mismatch — refusing to install")
              out = bindir / name
              out.mkdir(parents=True, exist_ok=True)
              tar = out / "t.tar.xz"
              tar.write_bytes(blob)
              tarfile.open(tar).extractall(out, filter="data")
              top = next(p for p in out.iterdir() if p.is_dir())
              with open(os.environ["GITHUB_PATH"], "a") as path:
                  path.write(f"{top}\n")
              print(f"{name} {rel['version']}: digest verified")
          PY

      - name: Run every example
        run: python scripts/exrun.py
