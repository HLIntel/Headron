name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check repository surface
        run: |
          test -f docs/GITHUB-FINALIZATION.md
          test -f wiki/TOOL-ORCHESTRATION.md

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install harness dependency
        run: python -m pip install --quiet --require-hashes -r scripts/requirements.lock.txt
        # --require-hashes makes the install deterministic: pip refuses anything whose bytes
        # do not match the lock, so a compromised or re-uploaded artifact fails the build
        # rather than entering it.

      - name: Check patch hygiene
        run: git diff --check

      - name: Exercise directory routing (a language guide must route to its own pack)
        run: python scripts/atlas.py route languages/python/README.md

      - name: Exercise code routing
        run: python scripts/atlas.py route scripts/atlas.py

      - name: Exercise task planning
        run: python scripts/atlas.py plan scripts/atlas.py --task implementation

      - name: Exercise the mastery loop
        run: python scripts/atlas.py learn rust

      - name: Refuse duplicate structures and code blobs
        # By AST, not by text: two functions can share no characters and be the same function.
        run: python scripts/astshape.py

      - name: Exercise every example the runner can build
        # An example that nobody runs is a skeleton. This runs each one and REPORTS the ones whose
        # toolchain is absent on the runner rather than passing over them silently.
        run: python scripts/exrun.py

      - name: Fuzz the bounded pool
        # Bounded on purpose: a fuzz run with no time limit is an unbounded job, and this one is a
        # gate, not a campaign. The long campaigns belong on a schedule, not on every pull request.
        working-directory: examples/go
        run: go test -run '^$' -fuzz FuzzPool -fuzztime 30s .

      - name: Run the fuzz target's corpus
        # The coverage-guided campaign is ClusterFuzzLite's job; this proves the target itself still
        # holds every invariant, on a fixed corpus, wherever atheris is absent.
        run: python fuzz/fuzz_manifest_entry.py

      - name: Report which paths have not been re-examined lately
        # In CONTRACT VERSIONS, not days: a date says when somebody typed, a version says which
        # tree the path was last true of. Not part of `check` — it reads git history and measures
        # committed state, so a correct edit could not satisfy it until it landed.
        run: python scripts/freshness.py

      - name: Report what the repository hands over before a route
        # The entry path, in bytes, against its declared band — and the lazily-reached tree beside
        # it, so "45% markdown" is read against "this is what you are actually handed".
        run: python scripts/contextcost.py

      - name: Build and verify the retrieval index
        # Built on DECLARED boundaries only and invalidated by content checksum. `verify` on a
        # fresh build must be silent; a stale chunk here means the boundary rule moved under it.
        run: |
          python scripts/atlasindex.py build
          python scripts/atlasindex.py verify

      - name: Measure whether the atlas actually helps
        # Held-out tasks reported separately from the fixed ones, K and the chance baseline
        # printed, and the two arms that need a real agent reported NOT RUN rather than simulated.
        run: python scripts/bench.py

      - name: Prove the agent controls refuse what they claim to
        # THE AUTONOMOUS PROFILE, ENFORCED RATHER THAN DECLARED. One planted defect per control,
        # a held-out contract the policy was never tuned against, and its own case count asserted —
        # a control that never refuses anything and a broken one print the same nothing.
        run: python scripts/agent_test.py

      - name: Run the reference task contract under the policy
        # On a clean checkout this reaches `controls_verified`: every control was exercised and
        # denied nothing, and NOT ONE GATE RAN. The word `verified` is reserved for a run that
        # executed them, because a dry run borrowing it is the exact claim this record refuses.
        run: python scripts/agentrun.py

      - name: Mutation-test the harness itself
        run: python scripts/atlas_test.py

      - name: Report hard-invariant ownership
        run: python scripts/atlas.py invariants

      - name: Run repository harness
        run: python scripts/atlas.py check
