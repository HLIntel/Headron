name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-24.04
    # RAISED FROM 10 AT CONTRACT 3.37.0, AND IT IS MEANT TO FALL AGAIN. MEASURED: the planted suite
    # reached 205 cases and 332 s on the author's machine, and this job was CANCELLED by its own
    # 10-minute wall at 10m07s — a deadline killing a healthy run, which reads from outside exactly
    # like a hung one. The cost is structural: every planted case clears the caches and re-runs the
    # WHOLE contract check, so each case pays for link checking and pack validation that cannot see
    # its plant. The fix is to scope each case to the checks that can observe it, using the
    # agreement graph (file -> the declarations it answers for). THAT LANDED, AND THIS FELL WITH IT:
    # the reductions took the suite 5m32s -> 4m27s locally and this job 8m35s -> 7m25s IN CI, both
    # measured, so the wall came back to 12 — not to 10, because the run it killed was 10m07s and a
    # deadline set at the last observed failure has no headroom for the next rule. A bound falls on
    # evidence and rises only with raised_for; this fall carries its own measurement.
    # RAISED FOR 3.49.0, 12 -> 14: the mutation step ran 9m29s and 9m46s on main at 3.48.0 and
    # 10m57s at 3.49.0 (262 planted cases); every step passed and the wall still killed the job
    # at 12m01s. Falls again when per-case check scoping lands, the structural cost named above.
    timeout-minutes: 14

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check repository surface
        run: |
          test -f docs/GITHUB-FINALIZATION.md
          test -f wiki/TOOL-ORCHESTRATION.md

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install harness dependency
        run: python -m pip install --quiet --require-hashes -r scripts/requirements.lock.txt
        # --require-hashes makes the install deterministic: pip refuses anything whose bytes
        # do not match the lock, so a compromised or re-uploaded artifact fails the build
        # rather than entering it.

      - name: Check patch hygiene
        run: git diff --check

      - name: Check compact agent context before the long mutation suite
        run: python scripts/cli_test.py --brief-smoke

      # FIRST OF THE LONG WORK, and deliberately (3.34.0). The compact context check above is cheap
      # and catches a broken packet before this step spends its mutation budget. This step is the longest by far, and
      # running it last gave it only what the earlier steps left of `timeout-minutes` — MEASURED:
      # the job reached it at 2m12s, the suite ran 8m05s, and the 10-minute budget cancelled it
      # mid-run on two separate pull requests. Nothing below it is a prerequisite, so moving it
      # first hands it the whole budget without raising the cap or weakening a required check.
      - name: Mutation-test the harness itself
        run: python scripts/atlas_test.py

      - name: Exercise directory routing (a language guide must route to its own pack)
        run: python scripts/atlas.py route languages/python/README.md

      - name: Exercise code routing
        run: python scripts/atlas.py route scripts/atlas.py

      - name: Exercise task planning
        run: python scripts/atlas.py plan scripts/atlas.py --task implementation

      - name: Exercise the mastery loop
        run: python scripts/atlas.py learn rust

      - name: Refuse duplicate structures and code blobs
        # By AST, not by text: two functions can share no characters and be the same function.
        run: python scripts/astshape.py

      - name: Exercise every example the runner can build
        # An example that nobody runs is a skeleton. This runs each one and REPORTS the ones whose
        # toolchain is absent on the runner rather than passing over them silently.
        run: python scripts/exrun.py

      - name: Fuzz the bounded pool
        # Bounded on purpose: a fuzz run with no time limit is an unbounded job, and this one is a
        # gate, not a campaign. The long campaigns belong on a schedule, not on every pull request.
        working-directory: examples/go
        run: go test -run '^$' -fuzz FuzzPool -fuzztime 30s .

      - name: Run every fuzz target's corpus
        # The coverage-guided campaign is ClusterFuzzLite's job; this proves each target itself still
        # holds every invariant, on a fixed corpus, wherever atheris is absent. A GLOB, not a list:
        # naming one target left fuzz_jsonc unrun by any gate until the sweep found it.
        run: for target in fuzz/fuzz_*.py; do python "$target" || exit 1; done

      - name: Report which paths have not been re-examined lately
        # In CONTRACT VERSIONS, not days: a date says when somebody typed, a version says which
        # tree the path was last true of. Not part of `check` — it reads git history and measures
        # committed state, so a correct edit could not satisfy it until it landed.
        run: python scripts/freshness.py

      - name: Report what the repository hands over before a route
        # The entry path, in bytes, against its declared band — and the lazily-reached tree beside
        # it, so "45% markdown" is read against "this is what you are actually handed".
        run: python scripts/contextcost.py

      - name: Hold every Markdown file to its class
        # Living notes capped, current and reachable; records append-only; generated files left to their generators.
        run: python scripts/mdshape.py

      - name: Run the enforcement rung Thea ships, on Thea itself
        # `--tracked` and never a bare `check`, which swept zero files and exited 0. This rung had
        # never run on this repository until 3.32.0, and running it found three defects in it.
        run: python scripts/enforce.py check --tracked

      - name: Build and verify the retrieval index
        # Built on DECLARED boundaries only and invalidated by content checksum. `verify` on a
        # fresh build must be silent; a stale chunk here means the boundary rule moved under it.
        run: |
          python scripts/atlasindex.py build
          python scripts/atlasindex.py verify

      - name: Measure whether the atlas actually helps
        # Held-out tasks reported separately from the fixed ones, K and the chance baseline
        # printed, and the two arms that need a real agent reported NOT RUN rather than simulated.
        run: python scripts/bench.py

      - name: Prove the agent controls refuse what they claim to
        # THE AUTONOMOUS PROFILE, ENFORCED RATHER THAN DECLARED. One planted defect per control,
        # a held-out contract the policy was never tuned against, and its own case count asserted —
        # a control that never refuses anything and a broken one print the same nothing.
        run: python scripts/agent_test.py

      - name: Run the reference task contract under the policy
        # On a clean checkout this reaches `controls_verified`: every control was exercised and
        # denied nothing, and NOT ONE GATE RAN. The word `verified` is reserved for a run that
        # executed them, because a dry run borrowing it is the exact claim this record refuses.
        run: python scripts/agentrun.py

      - name: Report hard-invariant ownership
        run: python scripts/atlas.py invariants

      # THE LINTER RAN LOCALLY AND NOWHERE ELSE (3.10.0): verify's done set named it and no workflow did,
      # found the moment ci_enforces_contract was derived from done_set instead of a typed list.
      - name: Install the pinned linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.16.8"
          args: --version

      - name: Lint the harness
        run: ruff check .

      - name: Run repository harness
        run: python scripts/atlas.py check

  # PROOF OF CHANGE (3.48.0). A pull request that names its contract in its body
  # (`Thea-Contract: path/to/task.thea`) has its DIFF, base..head, judged against that contract's
  # scope, and the outcome — contract hash, base, head — attested, so the check mark is a signed
  # claim about this exact change rather than a badge. No line, no claim: it says so and passes.
  receipt:
    name: Receipt
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Install harness dependency
        run: python -m pip install --quiet --require-hashes -r scripts/requirements.lock.txt

      - name: Judge the diff against the contract the pull request names
        id: receipt
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          p=$(printf '%s\n' "$BODY" | sed -n 's/^Thea-Contract:[[:space:]]*\([^[:space:]]*\).*$/\1/p' | head -n 1)
          if [ -z "$p" ]; then
            echo "no Thea-Contract line: scope NOT checked, nothing attested"
            exit 0
          fi
          case "$p" in *..*) echo "refused: $p traverses"; exit 1;; esac
          printf '%s' "$p" | grep -Eq '^[A-Za-z0-9_./-]+\.thea$' || { echo "refused: $p is not a .thea path"; exit 1; }
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          THEA_BASE="$BASE_SHA" python scripts/agentrun.py --json "$p" > receipt.json
          echo "attest=true" >> "$GITHUB_OUTPUT"

      - name: Attest the receipt
        if: steps.receipt.outputs.attest == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: receipt.json
