name: Atlas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          check-latest: false

      - name: Check patch hygiene
        run: git diff --check

      - name: Exercise code routing
        run: python scripts/atlas.py route scripts/atlas.py

      - name: Exercise task planning
        run: python scripts/atlas.py plan scripts/atlas.py --task implementation

      - name: Run repository harness
        run: python scripts/atlas.py check
