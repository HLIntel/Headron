# TYPED JUDGMENTS — the small decisions an agent makes on every task, asked as CLOSED questions.
#
# Read with `thea judge` (the list), `thea judge <id>` (the card), and answered with
# `thea judge <id> <answer> <p> [--fact F]`: ONE line out, and the exit code is the verdict
# (0 act · 3 below the bar, take `below` · 2 refused). `thea judge --calibrate <tsv>` scores the bar
# against what actually happened, so a bar that is too low is MEASURED, never argued.
#
# WHY CLOSED. A decision written as prose is unscorable: nobody can tell afterwards whether it was
# right, so nobody learns. A closed question has a fixed answer set, a declared meaning for each
# answer (`when`, or `true_when`/`false_when`), a probability, and a bar: code acts on the answer only
# at or above the bar and otherwise does what `below` says. A declared FACT (`hard`) forces an answer
# whatever the probability says — a fact is checked, a probability is only believed.
# No model is called: the caller supplies the answer and the probability, from any model or by hand.
# Each judgment names the agent failure it PREVENTS (`prevents`, an id in atlas.yaml/agent_failure_modes),
# so a judgment joins the failure → move → guard graph instead of standing on its own.
#
# kinds: yes_no · choice (one of N, unordered) · score (one of N, ordered low → high).
# below: ask (the user) · escalate (a stronger judge) · default:<answer> (the safe answer, named).
# judgment_record_errors (atlasinv) refuses a record missing a field, an answer it does not offer,
# a bar a coin flip clears, and a hard fact forcing an answer that does not exist, and a `prevents` naming no failure.

reply_shape:
  kind: choice
  asks: what shape does the reply to this turn take
  options: [one_line, short_list, table, explanation]
  when:
    one_line: the answer is a verdict, a value, a path or a done/blocked/deferred state
    short_list: several independent outcomes or steps, at most five
    table: two or more things compared on the same axes
    explanation: the reader asked why or how, or the action is irreversible, security-sensitive or order-sensitive
  act_at: 0.6
  below: default:short_list
  hard: {asked_to_explain: explanation, irreversible: explanation}
  verified_by: the reader acts on the reply without asking a follow-up question; a follow-up asking what it meant is a fail
  prevents: a_turn_spent_rewording_instead_of_building

work_kind:
  kind: choice
  asks: what kind of work is this request
  options: [lookup, edit, bugfix, feature, research, operations, decision]
  when:
    lookup: a fact that already exists somewhere readable — answer from it, change nothing
    edit: a named change to a named artifact, behaviour unchanged elsewhere
    bugfix: observed behaviour differs from intended — reproduce before changing anything
    feature: new behaviour that nothing provides yet
    research: the answer is not in any local source and must be fetched and cited
    operations: a running system, a host, a deploy or a schedule changes state
    decision: two or more approaches and the reader must pick — answer with `thea decide` shape
  act_at: 0.7
  below: ask
  hard: {reproduction_failed: bugfix}
  verified_by: the route taken matched the kind found at the end; a lookup that turned into a bugfix is a fail
  prevents: a_first_idea_argued_as_the_only_option

needs_confirmation:
  kind: yes_no
  asks: does this action need the user's yes before it runs
  true_when: it is irreversible, outward-facing (publishes, sends, pays, deletes) or spends a shared quota
  false_when: it is local, reversible, and inside the task the user stated
  act_at: 0.9
  below: default:yes
  hard: {irreversible: 'yes', outward: 'yes', spends_money: 'yes'}
  verified_by: no action the user later reverses ran without a yes, and no reversible local step stopped to ask
  prevents: a_local_tweak_that_edited_a_public_repository

model_rung:
  kind: score
  asks: what is the cheapest model rung that can do this work
  options: [local, small, mid, frontier]
  when:
    local: extraction, counting, formatting or a closed classification over text already in hand
    small: a read-only sweep or a first draft that a gate will check
    mid: a multi-file change with a gate that proves it
    frontier: architecture, a novel design, or a call that is expensive if wrong and has no gate
  act_at: 0.7
  below: escalate
  hard: {no_gate: frontier}
  verified_by: the rung finished the work without a retry on a higher rung; a retry is a fail for the rung picked
  prevents: a_model_config_change_without_an_eval

refusal_is_correct:
  kind: yes_no
  asks: did this guard refusal stop a command that really was wrong
  true_when: running the command as written would have produced a wrong verdict, a lost write or an unsafe effect
  false_when: the command was correct and the guard matched its shape, not its effect
  act_at: 0.8
  below: escalate
  hard: {reproduced_the_defect: 'yes'}
  verified_by: a refusal judged false becomes a planted case that the guard must then admit
  prevents: a_check_proven_on_one_shape_of_input

stop_searching:
  kind: yes_no
  asks: is the evidence gathered enough to answer
  true_when: two independent sources agree, or one primary source answers the exact question asked
  false_when: the only source is secondary, the sources disagree, or the question has a part nothing answered
  act_at: 0.75
  below: default:no
  hard: {budget_spent: 'yes'}
  verified_by: the answer given was not reversed by the next source read; a reversal is a fail
  prevents: a_search_that_skips_what_it_cannot_see

suite_skippable:
  kind: yes_no
  asks: can this diff skip the planted suite during iteration, because it cannot break a planted case
  true_when: the suite would pass on this diff, so running it spends minutes and learns nothing
  false_when: the diff can break a planted case, or nothing has shown the prediction right in this band
  act_at: 0.95
  below: default:no
  verified_by: every prediction is resolved against a real suite run, audited runs included, and the bar holds on the resolved rows; landing always runs the full suite
  prevents: a_local_green_read_as_a_verdict

failure_shape:
  kind: choice
  asks: which declared agent failure shape is this tool error an instance of
  options: [none, a_count_typed_into_prose, a_value_quoted_by_hand, a_quote_that_outlived_its_text, an_interpreter_below_the_declared_floor, a_required_kind_added_without_its_fixture, a_success_rendering_read_as_an_answer, a_wait_that_matches_itself, a_leading_dash_argument_read_as_an_option, a_credential_typed_into_a_command, a_backtick_inside_a_double_quoted_shell_string, a_pull_that_leaves_a_half_merge]
  when:
    none: the error is ordinary work, and no declared shape's move is what clears it
    a_count_typed_into_prose: a generated block drifted from a number typed by hand — regenerate it
    a_value_quoted_by_hand: a hand-quoted scalar broke the format's parser — emit it with the format's own writer
    a_quote_that_outlived_its_text: an edit or test anchor names text the file no longer holds — read the file again first
    an_interpreter_below_the_declared_floor: a system interpreter older than the declared floor ran the script — run it through the declared runner
    a_required_kind_added_without_its_fixture: a guard counts zero of a newly required kind — add the kind to the valid fixture
    a_success_rendering_read_as_an_answer: a verdict was piped into a filter, so the exit code read was the filter's — keep the gate's own code
    a_wait_that_matches_itself: a process wait matched its own shell — bracket the pattern or wait on a pid
    a_leading_dash_argument_read_as_an_option: a literal starting with a dash was read as an option — print it with an end-of-options marker
    a_credential_typed_into_a_command: a credential value sits in the command text — refer to it by name
    a_backtick_inside_a_double_quoted_shell_string: a backtick inside double quotes ran as a command — use a quoted heredoc
    a_pull_that_leaves_a_half_merge: a bare pull can stop in a half merge — rebase or fast-forward only
  act_at: 0.8
  below: default:none
  hard:
    generated_block_drifted: a_count_typed_into_prose
    yaml_parse_error: a_value_quoted_by_hand
    replace_anchor_missing: a_quote_that_outlived_its_text
    tomllib_missing: an_interpreter_below_the_declared_floor
    case_count_moved: a_required_kind_added_without_its_fixture
    refused_piped_verdict: a_success_rendering_read_as_an_answer
    refused_self_matching_wait: a_wait_that_matches_itself
    refused_leading_dash_literal: a_leading_dash_argument_read_as_an_option
    refused_typed_credential: a_credential_typed_into_a_command
    refused_backtick_in_double_quotes: a_backtick_inside_a_double_quoted_shell_string
    refused_bare_pull: a_pull_that_leaves_a_half_merge
  verified_by: the next similar call that applied the named shape's move cleared the error; a retry that cleared it without that move resolves to none
  prevents: a_contract_repaired_one_named_field_at_a_time

gate_sufficient:
  kind: yes_no
  asks: is the narrow gate that passed on this change enough evidence, so the broader suite run next would pass too
  true_when: the broader suite run next on the same tree, with no edit between, passed as the narrow gate did
  false_when: the broader suite failed where the narrow gate passed, or a changed file has no test the narrow gate ran
  act_at: 0.9
  below: default:no
  hard: {changed_file_untested: 'no'}
  verified_by: the next broader suite run on the same tree, with no edit between, agreed with the narrow gate; a broader failure after a yes is a fail
  prevents: a_local_green_read_as_a_verdict

edge_relevant:
  kind: yes_no
  asks: is this lesson, a declared failure shape attached to the file or command at hand, relevant to the work that follows
  true_when: the shape's own signature fires on an errored call in the work that follows, before the next person message
  false_when: the turn ends without the shape's signature firing on any errored call
  act_at: 0.8
  below: default:yes
  verified_by: the shape's declared signature fired, or did not, on the calls after the lesson was shown and before the next person message; a lesson whose shape declares no signature is never scored
  prevents: a_fixed_context_that_grows_unmeasured
