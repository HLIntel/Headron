<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc">
  <title id="title">Headron Desktop proof graph for mobile</title>
  <desc id="desc">A compact mobile proof graph showing a changed API, the selected proof obligations, a missing consumer check and an explained delivery decision.</desc>
  <style>
    .bg{fill:#04110c}.frame{fill:#071711;stroke:#2b5342;stroke-width:1.5}.card{fill:#0b1d15;stroke:#2b5342;stroke-width:1.5}.row{fill:#10261c;stroke:#2b5342;stroke-width:1.5}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee}.muted{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#b8c7bd}.micro{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#8b9f92;font-size:11px;letter-spacing:1.2px}.brand{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:19px;font-weight:700}.hero{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:25px;font-weight:700;letter-spacing:-.4px}.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:16px;font-weight:650}.body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#b8c7bd;font-size:14px}.good{fill:#62d793}.warn{fill:#e6b85c}.warnbg{fill:rgba(230,184,92,.13);stroke:#e6b85c;stroke-width:1.5}.line{stroke:#3fbf74;stroke-width:3;fill:none;stroke-linecap:round}
  </style>
  <rect class="bg" width="390" height="760" rx="24"/>
  <rect x="15" y="15" width="360" height="730" rx="18" class="frame"/>
  <g transform="translate(38 45)"><path d="M0 12 13 5l13 7v16l-13 7L0 28Z" fill="none" stroke="#62d793" stroke-width="3.5"/><text x="39" y="25" class="brand">Headron Desktop</text></g>
  <text x="38" y="120" class="hero">A change carries</text><text x="38" y="149" class="hero">its proof.</text>
  <text x="38" y="176" class="body">The checks each change needs, explained.</text>
  <rect x="38" y="207" width="314" height="118" rx="12" class="card"/>
  <text x="58" y="235" class="micro">CHANGE INTELLIGENCE</text><text x="58" y="269" class="label">payments/api.ts</text><text x="58" y="296" class="body">API shape changed · consumer impact</text>
  <path d="M195 325V352" class="line"/><circle cx="195" cy="352" r="6" fill="#62d793"/>
  <rect x="38" y="352" width="314" height="193" rx="12" class="card"/>
  <text x="58" y="380" class="micro">HEADRON SELECTS EVIDENCE</text>
  <rect x="58" y="398" width="274" height="35" rx="7" class="row"/><text x="74" y="421" class="label" font-size="14">Contract validation</text>
  <rect x="58" y="444" width="274" height="35" rx="7" class="row"/><text x="74" y="467" class="label" font-size="14">Consumer checks</text>
  <rect x="58" y="490" width="274" height="35" rx="7" class="row"/><text x="74" y="513" class="label" font-size="14">Payment flow</text>
  <path d="M195 545V572" class="line"/><circle cx="195" cy="572" r="6" fill="#e6b85c"/>
  <rect x="38" y="572" width="314" height="118" rx="12" class="card"/>
  <text x="58" y="600" class="micro">DELIVERY DECISION</text>
  <rect x="58" y="615" width="274" height="51" rx="8" class="warnbg"/><text x="74" y="637" class="warn" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="12" font-weight="700">NEEDS EVIDENCE</text><text x="74" y="656" class="text" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="14">Consumer check · NOT RUN</text>
  <text x="195" y="720" text-anchor="middle" class="good" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="13" font-weight="700">Explain trust, not just pass/fail</text>
</svg>
