<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Thea Desktop verification graph</title>
  <desc id="desc">A software change is classified into proof obligations, evidence and an explanation before a delivery decision. The same verification contract connects agents, GitHub and CI.</desc>
  <style>
    .bg{fill:#04110c}.surface{fill:#0b1d15;stroke:#1c3a2c;stroke-width:1.5}.surface2{fill:#10261c;stroke:#2b5342;stroke-width:1.5}.line{stroke:#3fbf74;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.line-muted{stroke:#2b5342;stroke-width:2;fill:none;stroke-linecap:round}.text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee}.muted{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#b8c7bd}.micro{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#8b9f92;font-size:15px;letter-spacing:1.3px}.brand{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:26px;font-weight:700}.hero{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:31px;font-weight:700;letter-spacing:-.6px}.label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ecf3ee;font-size:19px;font-weight:650}.body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#b8c7bd;font-size:17px}.small{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#b8c7bd;font-size:15px}.good{fill:#62d793}.warn{fill:#e6b85c}.goodbg{fill:rgba(63,191,116,.14);stroke:#3fbf74;stroke-width:1.5}.warnbg{fill:rgba(230,184,92,.13);stroke:#e6b85c;stroke-width:1.5}
    @media (max-width:640px){.hero{font-size:28px}.label{font-size:18px}.body{font-size:16px}.micro{font-size:14px}.small{font-size:14px}}
  </style>
  <rect class="bg" width="1200" height="690" rx="28"/>
  <g opacity=".18" fill="#3fbf74"><circle cx="78" cy="70" r="2"/><circle cx="108" cy="70" r="2"/><circle cx="138" cy="70" r="2"/><circle cx="78" cy="100" r="2"/><circle cx="108" cy="100" r="2"/><circle cx="138" cy="100" r="2"/><circle cx="1050" cy="76" r="2"/><circle cx="1080" cy="76" r="2"/><circle cx="1110" cy="76" r="2"/></g>
  <rect x="40" y="40" width="1120" height="610" rx="20" fill="#071711" stroke="#2b5342" stroke-width="1.5"/>
  <path d="M40 126H1160" class="line-muted"/>
  <path d="M218 126V650" class="line-muted"/>
  <g transform="translate(70 70)"><path d="M0 14 15 5l15 9v18l-15 9L0 32Z" fill="none" stroke="#62d793" stroke-width="4"/><path d="M9 21h12" stroke="#62d793" stroke-width="4" stroke-linecap="round"/><text x="47" y="30" class="brand">Thea Desktop</text></g>
  <text x="1088" y="92" text-anchor="end" class="micro">LIVE PROOF VIEW</text>
  <g transform="translate(64 162)"><rect width="130" height="47" rx="9" fill="rgba(63,191,116,.14)"/><circle cx="22" cy="23" r="5" fill="#62d793"/><text x="38" y="29" class="label" font-size="16">Overview</text><text x="38" y="87" class="muted" font-size="16">Changes</text><text x="38" y="135" class="muted" font-size="16">Proof graph</text><text x="38" y="183" class="muted" font-size="16">Agents</text><text x="38" y="231" class="muted" font-size="16">Policy</text></g>
  <text x="258" y="177" class="hero">From a change to a trusted decision</text>
  <text x="258" y="208" class="body">Thea selects the smallest honest proof plan — then explains the verdict.</text>
  <rect x="258" y="242" width="222" height="265" rx="13" class="surface"/>
  <text x="282" y="279" class="micro">CHANGE</text><text x="282" y="320" class="label">payments/api.ts</text><text x="282" y="350" class="body">API shape changed</text>
  <rect x="282" y="385" width="174" height="41" rx="8" class="surface2"/><text x="300" y="411" class="small">Consumer impact</text>
  <rect x="282" y="439" width="145" height="41" rx="8" class="surface2"/><text x="300" y="465" class="small">Risk: explained</text>
  <path d="M480 373H525" class="line"/><circle cx="525" cy="373" r="7" fill="#62d793"/>
  <rect x="525" y="242" width="295" height="265" rx="13" class="surface"/>
  <text x="549" y="279" class="micro">VERIFICATION GRAPH</text>
  <rect x="549" y="301" width="247" height="48" rx="8" class="surface2"/><text x="569" y="331" class="label" font-size="17">Contract validation</text>
  <rect x="549" y="364" width="247" height="48" rx="8" class="surface2"/><text x="569" y="394" class="label" font-size="17">Consumer checks</text>
  <rect x="549" y="427" width="247" height="48" rx="8" class="surface2"/><text x="569" y="457" class="label" font-size="17">Payment flow</text>
  <path d="M820 325H860M820 388H860M820 451H860" class="line"/><circle cx="860" cy="325" r="7" fill="#62d793"/><circle cx="860" cy="388" r="7" fill="#62d793"/><circle cx="860" cy="451" r="7" fill="#e6b85c"/>
  <rect x="860" y="242" width="266" height="265" rx="13" class="surface"/>
  <text x="884" y="279" class="micro">DELIVERY DECISION</text>
  <rect x="884" y="303" width="218" height="62" rx="10" class="warnbg"/><text x="902" y="329" class="warn" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="15" font-weight="700">NEEDS EVIDENCE</text><text x="902" y="352" class="text" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="16">Consumer check · NOT RUN</text>
  <text x="884" y="404" class="label">Why</text><text x="884" y="432" class="body">An API change can affect</text><text x="884" y="456" class="body">downstream consumers.</text><text x="884" y="480" class="good">Run the missing proof.</text>
  <rect x="258" y="535" width="868" height="82" rx="12" class="surface2"/>
  <text x="282" y="568" class="micro">ONE VERIFICATION CONTRACT</text>
  <text x="282" y="599" class="body">CLI</text><circle cx="326" cy="593" r="4" fill="#62d793"/><text x="345" y="599" class="body">AI agents</text><circle cx="429" cy="593" r="4" fill="#62d793"/><text x="448" y="599" class="body">GitHub</text><circle cx="510" cy="593" r="4" fill="#62d793"/><text x="529" y="599" class="body">CI</text>
  <text x="1098" y="589" text-anchor="end" class="good" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,system-ui,sans-serif" font-size="17" font-weight="700">Explain trust, not just pass/fail</text>
</svg>
