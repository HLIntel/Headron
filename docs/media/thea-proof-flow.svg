<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">Thea proof flow</title>
  <desc id="desc">Two rows, each left to right. Thea Software: contract, change to proof, fast-loop evidence, one core verdict. Desktop: workspace, agents and tools, verify, receipts.</desc>
  <style>
    .node{fill:#e6f2e7;stroke:#6f9f73;stroke-width:1.5}
    .core{fill:#cfe9d2;stroke:#4f9a58;stroke-width:2}
    .arrow{stroke:#6f9f73;stroke-width:2;fill:none;stroke-linecap:round}
    .text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#14301a;font-size:16px}
    .core-text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#103d17;font-size:16px;font-weight:700}
    .row-label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#14301a;font-size:19px;font-weight:700}
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f9f73"/>
    </marker>
  </defs>

  <!-- Row 1: Thea Software -->
  <text class="row-label" x="0" y="76">Thea Software</text>
  <rect class="node" x="190" y="40" width="170" height="60" rx="8"/>
  <text class="text" x="275" y="76" text-anchor="middle">Contract</text>
  <line class="arrow" x1="366" y1="70" x2="394" y2="70" marker-end="url(#head)"/>
  <rect class="node" x="400" y="40" width="170" height="60" rx="8"/>
  <text class="text" x="485" y="76" text-anchor="middle">Change to proof</text>
  <line class="arrow" x1="576" y1="70" x2="604" y2="70" marker-end="url(#head)"/>
  <rect class="node" x="610" y="40" width="170" height="60" rx="8"/>
  <text class="text" x="695" y="76" text-anchor="middle">Fast-loop evidence</text>
  <line class="arrow" x1="786" y1="70" x2="814" y2="70" marker-end="url(#head)"/>
  <rect class="core" x="820" y="40" width="170" height="60" rx="8"/>
  <text class="core-text" x="905" y="76" text-anchor="middle">One core verdict</text>

  <!-- Row 2: Desktop -->
  <text class="row-label" x="0" y="166">Desktop</text>
  <rect class="node" x="190" y="130" width="170" height="60" rx="8"/>
  <text class="text" x="275" y="166" text-anchor="middle">Workspace</text>
  <line class="arrow" x1="366" y1="160" x2="394" y2="160" marker-end="url(#head)"/>
  <rect class="node" x="400" y="130" width="170" height="60" rx="8"/>
  <text class="text" x="485" y="166" text-anchor="middle">Agents and tools</text>
  <line class="arrow" x1="576" y1="160" x2="604" y2="160" marker-end="url(#head)"/>
  <rect class="node" x="610" y="130" width="170" height="60" rx="8"/>
  <text class="text" x="695" y="166" text-anchor="middle">Verify</text>
  <line class="arrow" x1="786" y1="160" x2="814" y2="160" marker-end="url(#head)"/>
  <rect class="node" x="820" y="130" width="170" height="60" rx="8"/>
  <text class="text" x="905" y="166" text-anchor="middle">Receipts</text>
</svg>
