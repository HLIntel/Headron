<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="458" viewBox="0 8 1000 450" role="img" aria-labelledby="title desc">
  <title id="title">Thea proof flow</title>
  <desc id="desc">Thea Software runs left to right: a contract declares the checks, a change maps to the smallest honest proof plan, quick evidence runs first, and one core verdict decides. That verdict flows down into Desktop, which runs left to right: workspace, agents and tools, verify, and receipts.</desc>
  <style>
    .node{fill:#e6f2e7;stroke:#6f9f73;stroke-width:1.5}
    .core{fill:#cfe9d2;stroke:#4f9a58;stroke-width:2}
    .arrow{stroke:#6f9f73;stroke-width:2;fill:none;stroke-linecap:round}
    .link{stroke:#4f9a58;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .chip{fill:#ffffff;stroke:#6f9f73;stroke-width:1}
    .chip-core{fill:#4f9a58;stroke:none}
    .tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#2f7a4a;font-size:13px;font-weight:700;letter-spacing:1.4px}
    .title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#14301a;font-size:19px;font-weight:700}
    .core-title{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#0f3a17;font-size:19px;font-weight:700}
    .desc{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#3f5a46;font-size:15px}
    .chiptext{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#2f5a3c;font-size:12px;font-weight:700;letter-spacing:1px}
    .chiptext-core{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#ffffff;font-size:12px;font-weight:700;letter-spacing:1px}
    .hero{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#14301a;font-size:30px;font-weight:700;letter-spacing:-.4px}
    .sub{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#3f5a46;font-size:17px}
    .note{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#3f5a46;font-size:14px;font-style:italic}
    .row-label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#14301a;font-size:19px;font-weight:700}
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f9f73"/>
    </marker>
    <marker id="head-core" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9a58"/>
    </marker>
  </defs>
  <text class="hero" x="6" y="38">From a change to a trusted decision</text>
  <text class="sub" x="6" y="66">Thea selects the smallest honest proof plan, then explains the verdict.</text>
  <!-- Row 1: Thea Software -->
  <text class="row-label" x="6" y="100">Thea Software</text>
  <rect class="node" x="6" y="114" width="220" height="130" rx="12"/>
  <text class="tag" x="24" y="142">01 · CONTRACT</text>
  <text class="title" x="24" y="172">Contract</text>
  <text class="desc" x="24" y="198">Checks declared per file</text>
  <rect class="chip" x="24" y="210" width="111" height="24" rx="12"/>
  <text class="chiptext" x="79.5" y="226" text-anchor="middle">ATLAS.YAML</text>
  <rect class="node" x="262" y="114" width="220" height="130" rx="12"/>
  <text class="tag" x="280" y="142">02 · PROOF</text>
  <text class="title" x="280" y="172">Change to proof</text>
  <text class="desc" x="280" y="198">Smallest honest plan</text>
  <rect class="chip" x="280" y="210" width="115" height="24" rx="12"/>
  <text class="chiptext" x="337.5" y="226" text-anchor="middle">PER CHANGE</text>
  <rect class="node" x="518" y="114" width="220" height="130" rx="12"/>
  <text class="tag" x="536" y="142">03 · EVIDENCE</text>
  <text class="title" x="536" y="172">Fast-loop evidence</text>
  <text class="desc" x="536" y="198">Quick checks run first</text>
  <rect class="chip" x="536" y="210" width="102" height="24" rx="12"/>
  <text class="chiptext" x="587" y="226" text-anchor="middle">FAST FIRST</text>
  <rect class="core" x="774" y="114" width="220" height="130" rx="12"/>
  <text class="tag" x="792" y="142">04 · VERDICT</text>
  <text class="core-title" x="792" y="172">One core verdict</text>
  <text class="desc" x="792" y="198">PASS, FAIL or NOT RUN</text>
  <rect class="chip-core" x="792" y="210" width="117" height="24" rx="12"/>
  <text class="chiptext-core" x="850.5" y="226" text-anchor="middle">ONE VERDICT</text>
  <line class="arrow" x1="230" y1="180" x2="258" y2="180" marker-end="url(#head)"/>
  <line class="arrow" x1="486" y1="180" x2="514" y2="180" marker-end="url(#head)"/>
  <line class="arrow" x1="742" y1="180" x2="770" y2="180" marker-end="url(#head)"/>
  <!-- Link: verdict feeds the desktop row -->
  <path class="link" d="M884 244 V274 H116 V316" marker-end="url(#head-core)"/>
  <text class="note" x="500" y="268" text-anchor="middle">verdicts feed the desktop</text>
  <!-- Row 2: Desktop -->
  <text class="row-label" x="6" y="300">Desktop</text>
  <rect class="node" x="6" y="320" width="220" height="130" rx="12"/>
  <text class="tag" x="24" y="348">01 · WORKSPACE</text>
  <text class="title" x="24" y="378">Workspace</text>
  <text class="desc" x="24" y="404">Rules, files, agents</text>
  <rect class="chip" x="24" y="416" width="115" height="24" rx="12"/>
  <text class="chiptext" x="81.5" y="432" text-anchor="middle">ONE WINDOW</text>
  <rect class="node" x="262" y="320" width="220" height="130" rx="12"/>
  <text class="tag" x="280" y="348">02 · AGENTS</text>
  <text class="title" x="280" y="378">Agents and tools</text>
  <text class="desc" x="280" y="404">Claude, Codex, Cursor</text>
  <rect class="chip" x="280" y="416" width="104" height="24" rx="12"/>
  <text class="chiptext" x="332" y="432" text-anchor="middle">ANY AGENT</text>
  <rect class="node" x="518" y="320" width="220" height="130" rx="12"/>
  <text class="tag" x="536" y="348">03 · VERIFY</text>
  <text class="title" x="536" y="378">Verify</text>
  <text class="desc" x="536" y="404">Same core verdict shown</text>
  <rect class="chip" x="536" y="416" width="127" height="24" rx="12"/>
  <text class="chiptext" x="599.5" y="432" text-anchor="middle">SAME VERDICT</text>
  <rect class="node" x="774" y="320" width="220" height="130" rx="12"/>
  <text class="tag" x="792" y="348">04 · RECEIPTS</text>
  <text class="title" x="792" y="378">Receipts</text>
  <text class="desc" x="792" y="404">Every verdict kept</text>
  <rect class="chip" x="792" y="416" width="103" height="24" rx="12"/>
  <text class="chiptext" x="843.5" y="432" text-anchor="middle">AUDITABLE</text>
  <line class="arrow" x1="230" y1="386" x2="258" y2="386" marker-end="url(#head)"/>
  <line class="arrow" x1="486" y1="386" x2="514" y2="386" marker-end="url(#head)"/>
  <line class="arrow" x1="742" y1="386" x2="770" y2="386" marker-end="url(#head)"/>
</svg>
