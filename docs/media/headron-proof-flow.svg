<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Headron verification architecture</title>
  <desc id="desc">A task is routed with context and a contract, checked through focused or full verification, and reported with results and an optional receipt. An illustrative desktop and phone show a possible Harness view.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1b35"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#142b4a"/><stop offset="1" stop-color="#0c1c34"/></linearGradient>
    <linearGradient id="glow"><stop stop-color="#39d7f0"/><stop offset="1" stop-color="#7796ff"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#55c9e9"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif} .title{fill:#f3f8ff;font-size:25px;font-weight:700;letter-spacing:.3px} .sub{fill:#a9bfd6;font-size:14px} .tag{fill:#69d7f1;font-size:11px;font-weight:700;letter-spacing:1.1px} .heading{fill:#f4f8ff;font-size:17px;font-weight:700} .body{fill:#b7c8db;font-size:13px} .small{fill:#9eb3ca;font-size:11px} .ui{fill:#cad9e9;font-size:10px} .card{fill:url(#card);stroke:#294c70;stroke-width:1.2}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="588" rx="22" fill="url(#bg)" stroke="#244765" stroke-width="2"/>
  <circle cx="1090" cy="48" r="100" fill="#1f7dab" opacity=".06"/>
  <path d="M32 33h28v28H32z" fill="none" stroke="#62d9f4" stroke-width="2" transform="rotate(45 46 47)"/>
  <text class="title" x="78" y="47">From task to evidence</text>
  <text class="sub" x="78" y="71">A clear route for agents · checks with named outcomes · evidence you can inspect</text>
  <path d="M32 92H1168" stroke="#264762"/>

  <g transform="translate(32 116)">
    <text class="tag" x="0" y="0">REASONING AND ROUTING</text>
    <rect class="card" x="0" y="19" width="210" height="155" rx="14"/>
    <text class="tag" x="18" y="44">SYSTEM 1</text>
    <text class="heading" x="18" y="70">Fast route</text>
    <text class="body" x="18" y="95">Focused work and</text><text class="body" x="18" y="114">bounded context</text>
    <rect x="18" y="132" width="91" height="23" rx="7" fill="#123d52"/><text class="small" x="28" y="148">Task + scope</text>
    <rect class="card" x="236" y="19" width="210" height="155" rx="14"/>
    <text class="tag" x="254" y="44">SHARED FOUNDATION</text>
    <text class="heading" x="254" y="70">Context + contract</text>
    <text class="body" x="254" y="95">Relevant routes, rules</text><text class="body" x="254" y="114">and required checks</text>
    <rect x="254" y="132" width="111" height="23" rx="7" fill="#163b55"/><text class="small" x="264" y="148">Defined boundaries</text>
    <rect class="card" x="472" y="19" width="210" height="155" rx="14"/>
    <text class="tag" x="490" y="44">SYSTEM 2</text>
    <text class="heading" x="490" y="70">Deliberate route</text>
    <text class="body" x="490" y="95">Broader or higher-risk</text><text class="body" x="490" y="114">work calls for planning</text>
    <rect x="490" y="132" width="96" height="23" rx="7" fill="#25355c"/><text class="small" x="500" y="148">Risk + plan</text>
    <path d="M232 96h-22M446 96h22" stroke="#55c9e9" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <g transform="translate(32 326)">
    <text class="tag" x="0" y="0">VERIFICATION AND EVIDENCE</text>
    <rect class="card" x="0" y="18" width="327" height="152" rx="14"/>
    <text class="heading" x="18" y="50">Checks</text>
    <text class="body" x="18" y="75">Focused gates or the full done set</text>
    <text class="body" x="18" y="96">Run results keep their actual status</text>
    <text class="small" x="18" y="132" fill="#7edebc">PASS</text><text class="small" x="73" y="132">FAIL</text><text class="small" x="119" y="132">SKIP</text><text class="small" x="170" y="132">NOT RUN</text>
    <rect class="card" x="355" y="18" width="327" height="152" rx="14"/>
    <text class="heading" x="373" y="50">Results + receipt</text>
    <text class="body" x="373" y="75">Inspect outcomes and their limits</text>
    <text class="body" x="373" y="96">Write a tree-bound receipt when requested</text>
    <text class="small" x="373" y="132">Evidence supports review and landing</text>
    <path d="M327 94h24" stroke="#55c9e9" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <path d="M373 293v23" stroke="#55c9e9" stroke-width="2" marker-end="url(#arrow)"/>

  <g transform="translate(750 116)">
    <text class="tag" x="0" y="0">HARNESS SURFACE · ILLUSTRATIVE</text>
    <text class="sub" x="0" y="24">A view of tasks, context and evidence</text>
    <rect x="0" y="46" width="408" height="254" rx="14" fill="#081321" stroke="#477492" stroke-width="2"/>
    <rect x="1" y="47" width="406" height="28" rx="12" fill="#142b43"/>
    <circle cx="16" cy="61" r="3" fill="#62a8c8"/><circle cx="28" cy="61" r="3" fill="#62a8c8"/><circle cx="40" cy="61" r="3" fill="#62a8c8"/>
    <text class="ui" x="58" y="65">HEADRON HARNESS</text>
    <path d="M102 75v225" stroke="#24415b"/>
    <text class="ui" x="16" y="101">Overview</text><text class="ui" x="16" y="125">Tasks</text><text class="ui" x="16" y="149">Context</text><text class="ui" x="16" y="173">Evidence</text>
    <text class="heading" x="120" y="109">Task overview</text>
    <rect x="120" y="125" width="263" height="48" rx="8" fill="#112a42" stroke="#294e6b"/>
    <text class="ui" x="134" y="145">Contract + context</text><text class="small" x="134" y="162">Scope · routes · checks</text>
    <rect x="120" y="185" width="263" height="48" rx="8" fill="#112a42" stroke="#294e6b"/>
    <text class="ui" x="134" y="205">Verification results</text><text class="small" x="134" y="222">Outcomes · optional receipt</text>
    <path d="M165 300v13h82v-13M129 313h154" stroke="#477492" stroke-width="3" stroke-linecap="round"/>
    <rect x="301" y="177" width="94" height="166" rx="15" fill="#081321" stroke="#78a6c1" stroke-width="2"/>
    <rect x="332" y="183" width="32" height="4" rx="2" fill="#78a6c1"/>
    <text class="ui" x="314" y="210">TASK</text><rect x="313" y="219" width="69" height="35" rx="6" fill="#14334b"/><text class="small" x="320" y="240">Context</text>
    <rect x="313" y="263" width="69" height="35" rx="6" fill="#14334b"/><text class="small" x="320" y="284">Results</text>
    <text class="small" x="0" y="360">Device layouts are a concept, not a live product claim.</text>
  </g>
  <path d="M32 538H1168" stroke="#264762"/>
  <text class="sub" x="32" y="565">Contracts guide work. Verification reports what ran. Receipts preserve the result.</text>
</svg>
