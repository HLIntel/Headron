schema: 1
language: haskell
provenance:
  authored: '2026-09-22'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must be confirmed against
    docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: GHC
  package_manager: cabal/stack
  formatter: ormolu
  lsp: haskell-language-server
  debugger: GHCi :break
  profiler: GHC -prof + eventlog
  test: hspec/tasty
  fuzz: QuickCheck
  mutation: none
  security: hlint+weeder
  docs: https://www.haskell.org/documentation/
  research: https://gitlab.haskell.org/ghc/ghc/-/wikis/home
profiles:
  implementation:
  - cabal/stack
  - ormolu
  - haskell-language-server
  - hspec/tasty
  debugging:
  - GHCi :break
  - hspec/tasty
  endpoint:
  - hspec/tasty
  security:
  - hlint+weeder
  - hspec/tasty
  performance:
  - GHC -prof + eventlog
  - hspec/tasty
  reliability:
  - hspec/tasty
  - QuickCheck
  polyglot:
  - schema_or_abi
  - hspec/tasty
policy:
  default_tools:
  - GHC
  - ormolu
  - hspec/tasty
  optional_tools:
  - GHCi :break
  - GHC -prof + eventlog
  - QuickCheck
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
