schema: 1
language: haskell
provenance:
  authored: '2026-09-22'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: ghc
  package_manager: cabal|stack
  formatter: ormolu
  lsp: haskell-language-server
  debugger: builtin:GHCi :break
  profiler:
  - ghc -prof
  - builtin:eventlog
  test: lib:hspec / tasty
  fuzz: lib:QuickCheck
  mutation: none
  security:
  - hlint
  - weeder
  docs: https://www.haskell.org/documentation/
  research: https://gitlab.haskell.org/ghc/ghc/-/wikis/home
profiles:
  implementation:
  - cabal|stack
  - ormolu
  - haskell-language-server
  - lib:hspec / tasty
  debugging:
  - builtin:GHCi :break
  - lib:hspec / tasty
  endpoint:
  - lib:hspec / tasty
  security:
  - hlint
  - weeder
  - lib:hspec / tasty
  performance:
  - ghc -prof
  - builtin:eventlog
  - lib:hspec / tasty
  reliability:
  - lib:hspec / tasty
  - lib:QuickCheck
  polyglot:
  - concept:schema-or-ABI boundary
  - lib:hspec / tasty
policy:
  default_tools:
  - ghc
  - ormolu
  - lib:hspec / tasty
  optional_tools:
  - builtin:GHCi :break
  - ghc -prof
  - builtin:eventlog
  - lib:QuickCheck
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  test: hspec or tasty, as the project chooses
