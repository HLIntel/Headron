schema: 2
language: cpp
provenance:
  since: '1.0.0'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - mull
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: clang++|g++
  package_manager:
  - cmake
  - vcpkg
  formatter: clang-format
  lsp: clangd
  debugger: lldb|gdb
  profiler: perf
  test:
  - ctest
  - lib:Catch2
  fuzz: builtin:libFuzzer (clang -fsanitize=fuzzer)
  mutation: mull
  security:
  - clang-tidy
  - builtin:-fsanitize=address,undefined
  docs: https://en.cppreference.com/w/cpp
  research: https://isocpp.org/std/the-standard
profiles:
  implementation:
  - cmake
  - vcpkg
  - clang-format
  - clangd
  - ctest
  - lib:Catch2
  debugging:
  - lldb|gdb
  - ctest
  - lib:Catch2
  endpoint:
  - ctest
  - lib:Catch2
  security:
  - clang-tidy
  - builtin:-fsanitize=address,undefined
  - ctest
  - lib:Catch2
  performance:
  - perf
  - ctest
  - lib:Catch2
  reliability:
  - ctest
  - lib:Catch2
  - builtin:libFuzzer (clang -fsanitize=fuzzer)
  polyglot:
  - concept:schema-or-ABI boundary
  - ctest
  - lib:Catch2
policy:
  default_tools:
  - clang++|g++
  - clang-format
  - ctest
  - lib:Catch2
  optional_tools:
  - lldb|gdb
  - perf
  - builtin:libFuzzer (clang -fsanitize=fuzzer)
  - mull
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  security: clang-tidy plus the address and undefined-behaviour sanitizers
