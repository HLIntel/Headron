  fuzz: go test -fuzz
  mutation: gremlins
  security:
  - govulncheck
  - gosec
  docs: https://go.dev/doc/
  research: https://go.dev/blog/
profiles:
  implementation:
  - go mod
  - gofmt
  - goimports
  - gopls
  - go test
  debugging:
  - dlv
  - go test
  endpoint:
  - go test
  security:
  - govulncheck
  - gosec
  - go test
  performance:
  - pprof
  - go test
  reliability:
  - go test
  - go test -fuzz
  polyglot:
  - concept:schema-or-ABI boundary
  - go test
policy:
  default_tools:
  - go
  - gofmt
  - goimports
  - go test
