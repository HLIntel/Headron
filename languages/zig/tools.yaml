schema: 2
language: zig
provenance:
  since: '1.0.0'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: zig
  package_manager: zig build
  formatter: zig fmt
  lsp: zls
  debugger: lldb|gdb
  profiler: perf
  test: zig test
  fuzz: none
  mutation: none
  security:
  - builtin:ReleaseSafe
  - builtin:UBSan
  docs: https://ziglang.org/documentation/master/
  research: https://ziglang.org/news/
profiles:
  implementation:
  - zig build
  - zig fmt
  - zls
  - zig test
  debugging:
  - lldb|gdb
  - zig test
  endpoint:
  - zig test
  security:
  - builtin:ReleaseSafe
  - builtin:UBSan
  - zig test
  performance:
  - perf
  - zig test
  reliability:
  - zig test
  polyglot:
  - concept:schema-or-ABI boundary
  - zig test
policy:
  default_tools:
  - zig
  - zig fmt
  - zig test
  optional_tools:
  - lldb|gdb
  - perf
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  fuzz: ReleaseSafe with UBSan
  package_manager: zig build, resolving build.zig.zon
