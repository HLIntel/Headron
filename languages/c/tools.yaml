schema: 1
language: c
provenance:
  authored: '2026-09-22'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must be confirmed against
    docs before a task relies on them
  verify:
  - mull
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: clang/gcc
  package_manager: cmake+vcpkg
  formatter: clang-format
  lsp: clangd
  debugger: lldb/gdb
  profiler: perf
  test: ctest
  fuzz: libFuzzer
  mutation: mull
  security: clang-tidy+ASan/UBSan
  docs: https://en.cppreference.com/w/c
  research: https://www.open-std.org/jtc1/sc22/wg14/
profiles:
  implementation:
  - cmake+vcpkg
  - clang-format
  - clangd
  - ctest
  debugging:
  - lldb/gdb
  - ctest
  endpoint:
  - ctest
  security:
  - clang-tidy+ASan/UBSan
  - ctest
  performance:
  - perf
  - ctest
  reliability:
  - ctest
  - libFuzzer
  polyglot:
  - schema_or_abi
  - ctest
policy:
  default_tools:
  - clang/gcc
  - clang-format
  - ctest
  optional_tools:
  - lldb/gdb
  - perf
  - libFuzzer
  - mull
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
