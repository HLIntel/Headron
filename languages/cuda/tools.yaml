schema: 2
language: cuda
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: nvcc
  package_manager: none
  formatter: clang-format
  lsp: clangd
  debugger: cuda-gdb
  profiler: nsys|ncu
  benchmark: nsys|ncu
  test:
  - ctest
  - compute-sanitizer
  fuzz: none
  mutation: none
  security: compute-sanitizer
  docs: https://docs.nvidia.com/cuda/
  research: https://developer.nvidia.com/blog
profiles:
  implementation:
  - clang-format
  - clangd
  - ctest
  - compute-sanitizer
  debugging:
  - cuda-gdb
  - ctest
  - compute-sanitizer
  endpoint:
  - ctest
  - compute-sanitizer
  security:
  - compute-sanitizer
  - ctest
  performance:
  - nsys|ncu
  - ctest
  - compute-sanitizer
  reliability:
  - ctest
  - compute-sanitizer
  polyglot:
  - concept:schema-or-ABI boundary
  - ctest
  - compute-sanitizer
policy:
  default_tools:
  - nvcc
  - clang-format
  - ctest
  - compute-sanitizer
  optional_tools:
  - cuda-gdb
  - nsys|ncu
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: ncu reports per-kernel counters; a host-side timer measures the launch, not the work
  package_manager: no package manager; dependencies are wired in CMake
  profiler: Nsight Systems (nsys) and Nsight Compute (ncu)
  security: compute-sanitizer memcheck and racecheck
