schema: 2
language: mojo
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - lib:benchmark
  - mojo-lsp-server
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: mojo
  package_manager: pixi|uv
  formatter: mojo format
  lsp: mojo-lsp-server
  debugger: mojo debug
  profiler: none
  benchmark: lib:benchmark
  test: mojo run
  fuzz: none
  mutation: none
  security: none
  docs: https://mojolang.org/docs/
  research: https://www.modular.com/blog
runner:
  benchmark: mojo
profiles:
  implementation:
  - pixi|uv
  - mojo format
  - mojo-lsp-server
  - mojo run
  debugging:
  - mojo debug
  - mojo run
  endpoint:
  - mojo run
  security:
  - mojo run
  performance:
  - mojo run
  reliability:
  - mojo run
  polyglot:
  - concept:schema-or-ABI boundary
  - mojo run
policy:
  default_tools:
  - mojo
  - mojo format
  - mojo run
  optional_tools:
  - mojo debug
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: the Mojo standard library ships a benchmark module
  compiler_or_runtime: ships in the Modular MAX toolchain
  test: tests are a TestSuite run with `mojo run`; upstream removed the `mojo test` subcommand
  package_manager: the install guide names pixi and uv; the magic CLI is no longer documented
