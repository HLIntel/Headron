schema: 2
language: lean4
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: lean
  package_manager: lake
  formatter: none
  lsp: lean --server
  debugger: none
  profiler: builtin:set_option profiler true
  benchmark: none
  test: lake test
  fuzz: none
  mutation: none
  security: none
  docs: https://lean-lang.org/documentation/
  research: https://leanprover-community.github.io/
profiles:
  implementation:
  - lake
  - lean --server
  - lake test
  debugging:
  - lake test
  endpoint:
  - lake test
  security:
  - lake test
  performance:
  - builtin:set_option profiler true
  - lake test
  reliability:
  - lake test
  polyglot:
  - concept:schema-or-ABI boundary
  - lake test
policy:
  default_tools:
  - lean
  - lake test
  optional_tools:
  - builtin:set_option profiler true
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: proof checking time is the measurement that matters, and `lake` reports it
  debugger: no stepping debugger; the proof state is the instrument
