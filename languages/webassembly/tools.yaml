schema: 2
language: webassembly
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - wasmtime
  - twiggy
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime:
  - wasmtime
  - wasm-tools
  package_manager: none
  formatter: none
  lsp: none
  debugger: lldb
  profiler: none
  benchmark: wasmtime
  test: concept:host toolchain tests under wasmtime
  fuzz: none
  mutation: none
  security: none
  docs: https://webassembly.github.io/spec/
  research: https://bytecodealliance.org/articles
runner:
  test: wasmtime
profiles:
  implementation:
  - concept:host toolchain tests under wasmtime
  debugging:
  - lldb
  - concept:host toolchain tests under wasmtime
  endpoint:
  - concept:host toolchain tests under wasmtime
  security:
  - concept:host toolchain tests under wasmtime
  performance:
  - wasm-opt
  - twiggy
  - concept:host toolchain tests under wasmtime
  reliability:
  - concept:host toolchain tests under wasmtime
  polyglot:
  - concept:schema-or-ABI boundary
  - concept:host toolchain tests under wasmtime
policy:
  default_tools:
  - wasmtime
  - wasm-tools
  - concept:host toolchain tests under wasmtime
  optional_tools:
  - lldb
  - wasm-opt
  - twiggy
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  formatter: wasm-tools print converts binary modules to text; it is not a source formatter.
  profiler: twiggy measures code size; use a host runtime profiler for execution behavior. wasm-opt optimizes modules.
  security: wasm-tools validate checks module validity, not vulnerability or host security.
  benchmark: run the module under the host runtime and time it there
  debugger: lldb, attached through wasmtime -g
  package_manager: no package manager; cargo component or wit-deps on the host side
