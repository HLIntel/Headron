schema: 2
language: dockerfile
provenance:
  since: 3.54.0
  basis: primary documentation for the format; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - dockerfile-language-server
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: hadolint
  package_manager: none
  formatter: none
  lsp: dockerfile-language-server
  debugger: none
  profiler: none
  benchmark: none
  test: none
  fuzz: none
  mutation: none
  security: none
  docs: https://docs.docker.com/reference/dockerfile/
  research: https://github.com/hadolint/hadolint
profiles:
  implementation:
  - hadolint
  debugging:
  - hadolint
  endpoint: []
  security: []
  performance: []
  reliability:
  - hadolint
  polyglot:
  - concept:schema-or-ABI boundary
policy:
  default_tools:
  - hadolint
  optional_tools:
  - none
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
