schema: 1
language: nim
provenance:
  authored: '2026-09-22'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must be confirmed against
    docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: nim
  package_manager: nimble
  formatter: nimpretty
  lsp: nimlangserver
  debugger: gdb/lldb (--debugger:native)
  profiler: perf/valgrind
  test: testament+unittest
  fuzz: none
  mutation: none
  security: none
  docs: https://nim-lang.org/docs/manual.html
  research: https://nim-lang.org/blog.html
profiles:
  implementation:
  - nimble
  - nimpretty
  - nimlangserver
  - testament+unittest
  debugging:
  - gdb/lldb (--debugger:native)
  - testament+unittest
  endpoint:
  - testament+unittest
  security:
  - testament+unittest
  performance:
  - perf/valgrind
  - testament+unittest
  reliability:
  - testament+unittest
  polyglot:
  - schema_or_abi
  - testament+unittest
policy:
  default_tools:
  - nim
  - nimpretty
  - testament+unittest
  optional_tools:
  - gdb/lldb (--debugger:native)
  - perf/valgrind
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
