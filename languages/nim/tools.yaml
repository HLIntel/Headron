schema: 1
language: nim
provenance:
  authored: '2026-09-22'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: nim
  package_manager: nimble
  formatter: nimpretty
  lsp: nimlangserver
  debugger: gdb|lldb
  profiler: perf|valgrind
  test:
  - testament
  - builtin:unittest
  fuzz: none
  mutation: none
  security: none
  docs: https://nim-lang.org/docs/manual.html
  research: https://nim-lang.org/blog.html
profiles:
  implementation:
  - nimble
  - nimpretty
  - nimlangserver
  - testament
  - builtin:unittest
  debugging:
  - gdb|lldb
  - testament
  - builtin:unittest
  endpoint:
  - testament
  - builtin:unittest
  security:
  - testament
  - builtin:unittest
  performance:
  - perf|valgrind
  - testament
  - builtin:unittest
  reliability:
  - testament
  - builtin:unittest
  polyglot:
  - concept:schema-or-ABI boundary
  - testament
  - builtin:unittest
policy:
  default_tools:
  - nim
  - nimpretty
  - testament
  - builtin:unittest
  optional_tools:
  - gdb|lldb
  - perf|valgrind
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
