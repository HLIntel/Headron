schema: 2
language: fsharp
provenance:
  since: '1.0.0'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: dotnet
  package_manager: dotnet add package
  formatter: fantomas
  lsp: fsautocomplete
  debugger: netcoredbg
  profiler: dotnet-trace
  test: dotnet test
  fuzz: lib:FsCheck
  mutation: dotnet stryker
  security:
  - dotnet list package --vulnerable
  - lib:FSharpLint
  docs: https://learn.microsoft.com/dotnet/fsharp/
  research: https://fsharp.org/
profiles:
  implementation:
  - dotnet add package
  - fantomas
  - fsautocomplete
  - dotnet test
  debugging:
  - netcoredbg
  - dotnet test
  endpoint:
  - dotnet test
  security:
  - dotnet list package --vulnerable
  - lib:FSharpLint
  - dotnet test
  performance:
  - dotnet-trace
  - dotnet test
  reliability:
  - dotnet test
  - lib:FsCheck
  polyglot:
  - concept:schema-or-ABI boundary
  - dotnet test
policy:
  default_tools:
  - dotnet
  - fantomas
  - dotnet test
  optional_tools:
  - netcoredbg
  - dotnet-trace
  - lib:FsCheck
  - dotnet stryker
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  compiler_or_runtime: the .NET SDK
  lsp: fsautocomplete, as used by Ionide
  package_manager: packages from NuGet
  test: dotnet test over Expecto or xUnit
