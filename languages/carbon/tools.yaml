schema: 2
language: carbon
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: carbon
  package_manager: none
  formatter: none
  lsp: none
  debugger: none
  profiler: none
  benchmark: none
  test: bazel test
  fuzz: none
  mutation: none
  security: none
  docs: https://github.com/carbon-language/carbon-lang/tree/trunk/docs
  research: https://github.com/carbon-language/carbon-lang/tree/trunk/docs/design
profiles:
  implementation:
  - bazel test
  debugging:
  - bazel test
  endpoint:
  - bazel test
  security:
  - bazel test
  performance:
  - bazel test
  reliability:
  - bazel test
  polyglot:
  - concept:schema-or-ABI boundary
  - bazel test
policy:
  default_tools:
  - carbon
  - bazel test
  optional_tools: []
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: experimental toolchain; nothing established to measure with
  compiler_or_runtime: experimental; built in-tree with bazel
