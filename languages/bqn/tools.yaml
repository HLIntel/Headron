schema: 2
language: bqn
provenance:
  since: '1.0.0'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: CBQN
  package_manager: none
  formatter: none
  lsp: none
  debugger: none
  profiler: none
  test: none
  fuzz: none
  mutation: none
  security: none
  docs: https://mlochbaum.github.io/BQN/
  research: https://mlochbaum.github.io/BQN/community/
profiles:
  implementation:
  - CBQN
  debugging:
  - CBQN
  endpoint: []
  security: []
  performance: []
  reliability: []
  polyglot:
  - concept:schema-or-ABI boundary
policy:
  default_tools:
  - CBQN
  optional_tools: []
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  test: assertions plus •Show; CBQN ships no test runner
