schema: 2
language: sql
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - pg_prove
  - sql-language-server
  - sqlsmith
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: psql|sqlite3
  package_manager: none
  formatter: sqlfluff
  lsp: sql-language-server
  debugger: builtin:EXPLAIN ANALYZE
  profiler: builtin:pg_stat_statements
  benchmark: builtin:EXPLAIN ANALYZE
  test: lib:pgTAP
  fuzz: sqlsmith
  mutation: none
  security:
  - sqlfluff
  - concept:least-privilege roles
  docs: https://www.postgresql.org/docs/
  research: https://www.sqlite.org/docs.html
runner:
  benchmark: psql
  profiler: psql
  test: pg_prove
profiles:
  implementation:
  - sqlfluff
  - sql-language-server
  - lib:pgTAP
  debugging:
  - builtin:EXPLAIN ANALYZE
  - lib:pgTAP
  endpoint:
  - lib:pgTAP
  security:
  - sqlfluff
  - concept:least-privilege roles
  - lib:pgTAP
  performance:
  - builtin:pg_stat_statements
  - lib:pgTAP
  reliability:
  - lib:pgTAP
  - sqlsmith
  polyglot:
  - concept:schema-or-ABI boundary
  - lib:pgTAP
policy:
  default_tools:
  - psql|sqlite3
  - sqlfluff
  - lib:pgTAP
  optional_tools:
  - builtin:EXPLAIN ANALYZE
  - builtin:pg_stat_statements
  - sqlsmith
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: the plan and the actual rows are the measurement; a wall-clock number without the plan
    cannot be acted on
  compiler_or_runtime: PostgreSQL (psql) or SQLite (sqlite3)
