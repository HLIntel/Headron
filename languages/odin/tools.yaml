  lsp: ols
  debugger: gdb/lldb
  profiler: perf
  test: odin test
  fuzz: none
  mutation: none
  security: odin check
  docs: https://odin-lang.org/docs/
  research: https://odin-lang.org/news/
profiles:
  implementation:
  - odinfmt (ols)
  - ols
  - odin test
  debugging:
  - gdb/lldb
  - odin test
  endpoint:
  - odin test
  security:
  - odin check
  - odin test
  performance:
  - perf
  - odin test
  reliability:
  - odin test
  polyglot:
  - schema_or_abi
  - odin test
policy:
  default_tools:
  - odin
  - odinfmt (ols)
  - odin test
  optional_tools:
  - gdb/lldb
  - perf
  avoid_by_default:
