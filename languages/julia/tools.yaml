schema: 2
language: julia
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - julia
  - Supposition.jl
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: julia
  package_manager: builtin:Pkg
  formatter: lib:JuliaFormatter.jl
  lsp: lib:LanguageServer.jl
  debugger: lib:Debugger.jl / Infiltrator.jl
  profiler:
  - builtin:Profile
  - lib:BenchmarkTools.jl
  benchmark: lib:BenchmarkTools.jl
  test: builtin:Test (stdlib)
  fuzz: lib:Supposition.jl
  mutation: none
  security:
  - lib:Aqua.jl
  - lib:JET.jl
  docs: https://docs.julialang.org/
  research: https://julialang.org/blog/
runner:
  test: julia
profiles:
  implementation:
  - builtin:Pkg
  - lib:JuliaFormatter.jl
  - lib:LanguageServer.jl
  - builtin:Test (stdlib)
  debugging:
  - lib:Debugger.jl / Infiltrator.jl
  - builtin:Test (stdlib)
  endpoint:
  - builtin:Test (stdlib)
  security:
  - lib:Aqua.jl
  - lib:JET.jl
  - builtin:Test (stdlib)
  performance:
  - builtin:Profile
  - lib:BenchmarkTools.jl
  - builtin:Test (stdlib)
  reliability:
  - builtin:Test (stdlib)
  - lib:Supposition.jl
  polyglot:
  - concept:schema-or-ABI boundary
  - builtin:Test (stdlib)
policy:
  default_tools:
  - julia
  - lib:JuliaFormatter.jl
  - builtin:Test (stdlib)
  optional_tools:
  - lib:Debugger.jl / Infiltrator.jl
  - builtin:Profile
  - lib:BenchmarkTools.jl
  - lib:Supposition.jl
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  test: driven as `julia --project -e 'using Pkg; Pkg.test()'`; the entry names the binary because a quoted recipe is not a tool name
  debugger: Debugger.jl, or Infiltrator.jl for a breakpoint in place
