schema: 2
language: markdown
provenance:
  since: 3.54.0
  basis: primary documentation for the format; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - marksman
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: none
  package_manager: none
  formatter: prettier
  lsp: marksman
  debugger: none
  profiler: none
  benchmark: none
  test: none
  fuzz: none
  mutation: none
  security: none
  docs: https://spec.commonmark.org/
  research: https://github.github.com/gfm/
profiles:
  implementation:
  - concept:the reader of the file
  debugging: []
  endpoint: []
  security: []
  performance: []
  reliability: []
  polyglot:
  - concept:schema-or-ABI boundary
policy:
  default_tools:
  - prettier
  optional_tools: []
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
