schema: 2
language: headron
provenance:
  since: 3.54.0
  basis: primary documentation for the format; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - none
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: headron
  package_manager: none
  formatter: none
  lsp: none
  debugger: none
  profiler: none
  benchmark: none
  test: none
  fuzz: none
  mutation: none
  security: none
  docs: https://github.com/HLIntel/Headron/blob/main/HEADRON.md
  research: https://github.com/HLIntel/Headron/tree/main/examples/headron
profiles:
  implementation:
  - headron
  debugging:
  - headron
  endpoint: []
  security: []
  performance: []
  reliability:
  - headron
  polyglot:
  - concept:schema-or-ABI boundary
policy:
  default_tools:
  - headron
  optional_tools:
  - none
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
