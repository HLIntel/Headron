schema: 2
language: elixir
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - lib:benchee
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: elixir
  package_manager: mix
  formatter: mix format
  lsp: elixir-ls
  debugger: builtin:IEx.pry
  profiler: builtin::fprof / observer
  benchmark: lib:benchee
  test: builtin:ExUnit
  fuzz: lib:stream_data
  mutation: none
  security:
  - mix sobelow
  - mix deps.audit
  docs: https://hexdocs.pm/elixir/
  research: https://elixir-lang.org/blog/
profiles:
  implementation:
  - mix
  - mix format
  - elixir-ls
  - builtin:ExUnit
  debugging:
  - builtin:IEx.pry
  - builtin:ExUnit
  endpoint:
  - builtin:ExUnit
  security:
  - mix sobelow
  - mix deps.audit
  - builtin:ExUnit
  performance:
  - builtin::fprof / observer
  - builtin:ExUnit
  reliability:
  - builtin:ExUnit
  - lib:stream_data
  polyglot:
  - concept:schema-or-ABI boundary
  - builtin:ExUnit
policy:
  default_tools:
  - elixir
  - mix format
  - builtin:ExUnit
  optional_tools:
  - builtin:IEx.pry
  - builtin::fprof / observer
  - lib:stream_data
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  compiler_or_runtime: elixir on the BEAM (Erlang/OTP)
  package_manager: mix, resolving from hex
  profiler: :fprof and observer
