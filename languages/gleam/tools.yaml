schema: 2
language: gleam
provenance:
  since: 1.0.0
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify:
  - lib:benchee
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime: gleam
  package_manager: gleam add
  formatter: gleam format
  lsp: gleam lsp
  debugger: none
  profiler: none
  benchmark: lib:benchee
  test: gleam test
  fuzz: none
  mutation: none
  security: none
  docs: https://gleam.run/documentation/
  research: https://tour.gleam.run/
runner:
  benchmark: gleam
profiles:
  implementation:
  - gleam add
  - gleam format
  - gleam lsp
  - gleam test
  debugging:
  - gleam test
  endpoint:
  - gleam test
  security:
  - gleam test
  performance:
  - gleam test
  reliability:
  - gleam test
  polyglot:
  - concept:schema-or-ABI boundary
  - gleam test
policy:
  default_tools:
  - gleam
  - gleam format
  - gleam test
  optional_tools: []
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  benchmark: through the Erlang target
  compiler_or_runtime: compiles to the Erlang and JavaScript targets
