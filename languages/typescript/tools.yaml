schema: 2
language: typescript
provenance:
  since: '1.0.0'
  basis: primary documentation for the language; entries under verify are from prior knowledge and must
    be confirmed against docs before a task relies on them
  verify: []
  none_means: no established tool is known for this role; do not invent one
authority:
  compiler_or_runtime:
  - node
  - tsc
  package_manager: pnpm
  formatter: prettier
  lsp: typescript-language-server
  debugger: node --inspect
  profiler: node --cpu-prof
  test: vitest
  fuzz: lib:fast-check
  mutation: stryker
  security:
  - eslint
  - npm audit
  docs: https://www.typescriptlang.org/docs/
  research: https://github.com/microsoft/TypeScript/wiki
profiles:
  implementation:
  - pnpm
  - prettier
  - typescript-language-server
  - vitest
  debugging:
  - node --inspect
  - vitest
  endpoint:
  - vitest
  security:
  - eslint
  - npm audit
  - vitest
  performance:
  - node --cpu-prof
  - vitest
  reliability:
  - vitest
  - lib:fast-check
  polyglot:
  - concept:schema-or-ABI boundary
  - vitest
policy:
  default_tools:
  - node
  - tsc
  - prettier
  - vitest
  optional_tools:
  - node --inspect
  - node --cpu-prof
  - lib:fast-check
  - stryker
  avoid_by_default:
  - duplicate_linters
  - tools_not_in_this_manifest_without_a_recorded_reason
  warnings: non_blocking
  blockers:
  - compile_failure
  - test_failure
  - security_failure
notes:
  compiler_or_runtime: node with tsc
