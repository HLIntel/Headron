version: 2.13.0
default_flow: MODEL.md -> docs/INDEX.md -> atlas.yaml -> runtime_adapter -> language_guide -> operating_card -> tool_manifest -> boundary -> task_route -> scoped_tools -> verify

hard_invariants:
  - no_unbounded_growth
  - immutable_first
  - schema_first
  - explicit_deadlines
  - least_privilege
  - independent_verification
  - auditable_changes
  - rollback_high_impact
  - one_source_of_truth
  - atlas_consistency
  - ide_is_not_enforcement
  - ci_enforces_contract
  - polyglot_boundaries_are_contracts
  - durable_artifacts_are_reachable_or_declared
  - mcp_is_task_scoped
  - native_language_tools_are_authoritative
  - production_boundaries_are_contracts
  - code_blobs_are_bounded
  - tool_surfaces_are_bounded
  - context_is_progressively_disclosed
  - goal_acceptance_is_explicit
  - model_choice_is_task_scoped
  - task_verification_is_explicit
  - warnings_are_classified
  - new_violations_cannot_hide_in_baseline
  - autonomous_profile_is_enforced

# EVERY INSTRUMENT, WHAT IT PROVES, AND WHO CLOSES WHAT IT DOES NOT.
#
# A number with no instrument beside it is rhetoric, and an instrument whose limits are unnamed is
# read as proving more than it does. Until 1.3.0 those limits lived in README prose as "blind
# spots": true, dated, and owned by nobody. Here every entry MUST name a closer — another
# instrument, or a command a person runs — and `atlas.py check` fails on an entry that leaves
# `closed_by` empty and on any scripts/*.py this roster does not name. A blind spot with no owner
# is therefore unrepresentable rather than merely discouraged.
#
# README's instrument table is GENERATED from this block, so it cannot drift from it.
instruments:
  'atlas.py check':
    script: scripts/atlas.py
    proves: the repository satisfies its own contract — links, routes, guides, cards, manifests,
      labels, generated blocks and files, hard invariants
    does_not_prove: that a declared tool exists anywhere, or that a manifest names the right tools
    closed_by: '`packprobe.py --mode smoke` answers existence and execution; each pack''s
      provenance.basis states what is unconfirmed against a real toolchain'
  'atlas.py route / plan':
    script: scripts/atlascore.py
    proves: the route for one artifact, the precedence rule that resolved it and the evidence for
      that rule, as text or as a JSON record
    does_not_prove: that the thing routed to is correct for the task
    closed_by: the task profile's own gates, run by `atlas.py plan --change <class>`
  'atlas.py index':
    script: scripts/atlasgen.py
    proves: every generated block and generated file in the tree matches what the declaration
      renders, and rewrites them when it does not — idempotently, so a second run is a no-op
    does_not_prove: that a generated document says something worth saying
    closed_by: 'a human reviewer for the wording; `atlas_test.py` plants a hand edit and asserts
      both that check() catches it and that `index --write` repairs it'
  'atlas.py invariants':
    script: scripts/atlasinv.py
    proves: every hard invariant in atlas.yaml is CHECKED by a function or DECLARED with its
      reason, and names which
    does_not_prove: that a declared invariant is true of a consuming system
    closed_by: 'the consuming repository runs its own contract; none is declared here, so the
      roster is empty by construction'
  'atlas_test.py':
    script: scripts/atlas_test.py
    proves: the contract still FAILS on a planted defect — one case per rule, its own case count
      asserted, and this harness cross-checked against the jsonschema library when it is installed
    does_not_prove: the truth of a manifest's tool names
    closed_by: '`packprobe.py --mode smoke` for the ones this machine can run; provenance.basis
      for the rest'
  'check_contract.py':
    script: scripts/check_contract.py
    proves: the contract runs from the repository root, from scripts/ and from an unrelated
      directory
    does_not_prove: anything about the contract's content
    closed_by: '`atlas.py check`, which it calls'
  'packprobe.py':
    script: scripts/packprobe.py
    proves: 'per pack and in total — how many declared entries there are, how many are commands,
      and (--mode version|smoke) which of them run here and what version they report'
    does_not_prove: that a pack was ever exercised end to end, or that a tool absent here is absent
      elsewhere
    closed_by: 'a codespace with that one toolchain installed (.devcontainer/README.md) plus the
      pack''s provenance.verify list; absence on one machine is a fact about the machine'
  'atlas.py doctor':
    script: scripts/doctor.py
    proves: which capabilities THIS machine has — interpreter, PyYAML, git, gh, ruff, jsonschema —
      and, for each one missing, what stops working because of it
    does_not_prove: that a present tool is new enough, or anything about the language toolchains
      the packs declare
    closed_by: '`packprobe.py --mode smoke`, which runs the language toolchains pack by pack; a
      version floor is declared per pack in its manifest and in pyproject for the harness'
  'astshape.py':
    script: scripts/astshape.py
    proves: no two Python functions in this repository share a canonical AST — names, literals and
      docstrings erased — and none exceeds the declared line or nesting caps
    does_not_prove: anything about the 34 language packs, whose formatters and linters are their
      own declared authority, and nothing about whether a unique function is a GOOD one
    closed_by: 'each pack declares its own formatter and linter in its manifest; `ruff` covers this
      repository''s own Python, and a human reviewer covers whether the shape earns its place'
  'exrun.py':
    script: scripts/exrun.py
    proves: every example under examples/ RUNS on this machine and its own assertions hold —
      routed by this repository's own router, with the recipe declared per route
    does_not_prove: anything about a toolchain that is absent here, or about the rest of a pack's
      declarations
    closed_by: 'CI runs it on every pull request with the runner''s toolchains, and
      `packprobe.py --mode smoke` covers the declarations an example does not exercise'
  'ghaudit.py':
    script: scripts/ghaudit.py
    proves: the live GitHub controls — visibility, secret scanning, rulesets, required checks,
      topics, licence — match config/github-controls.json, and REFUSES rather than reporting when
      it cannot reach the API
    does_not_prove: that a required check is a good check, or that a bypass actor did not use its
      bypass
    closed_by: 'the check''s own workflow, and `gh api .../rulesets` history; bypasses are listed
      in the audit output so the reader sees who can skip'
  'agentpolicy.py':
    script: scripts/agentpolicy.py
    proves: the five verdicts the autonomous profile names — path, command, budget, approval and
      scope — decided from atlas.yaml/agent_policy and the task contract, with the control that
      refused named in every denial
    does_not_prove: that the process asking for a verdict is the one being bounded; an agent that
      never calls it is not constrained by it
    closed_by: 'the host sandbox declared in agent_policy/sandbox_requirements, which refuses what
      the runner cannot see; `agentrun.py` is the one caller this repository ships'
  'agentaudit.py':
    script: scripts/agentaudit.py
    proves: the event stream for a task recomputes — every event carries the hash of the one before
      it, so a removed or edited event is named with its sequence number
    does_not_prove: that an event was written for something that happened; a chain covers what it
      contains, never what was never appended
    closed_by: '`agentrun.py` is what appends, and `agent_test.py` plants a missing event; a stream
      the subject cannot write to at all is the host''s job, not this repository''s'
  'agentrun.py':
    script: scripts/agentrun.py
    proves: a task contract validates, resolves against the router, and runs under every control —
      and that the final record's changed files, gates and budgets match what was planned
    does_not_prove: that the sandbox rows marked host-observed are satisfied; it prints those
      UNOBSERVED rather than claiming them
    closed_by: 'the host, per row of agent_policy/sandbox_requirements, and CI runs the reference
      contract on every pull request so the enforcement path cannot rot unnoticed'
  'agent_test.py':
    script: scripts/agent_test.py
    proves: every control REFUSES its planted defect and ALLOWS the reference contract — a negative
      case per control, a held-out contract the policy has not been tuned against, and its own case
      count asserted
    does_not_prove: that the controls are the right controls, or that a real agent calls them
    closed_by: 'a human reviewer for the first; for the second, the runner is the only shipped
      caller and the host sandbox is what covers an agent that bypasses it'
  'atlas_cli.py':
    script: scripts/atlas_cli.py
    proves: which atlas an invocation runs against and WHICH rule decided it — an explicit root, the
      environment, a consumer's pinned config, or the checkout the entry point came from
    does_not_prove: that the resolved atlas is the one the consumer intended, or that a pinned ref
      is the ref they reviewed
    closed_by: '`atlas --where` prints the rule so a consumer can see it in CI output, and the
      pinned `ref` in .atlas.yaml is reviewed in the consuming repository''s own diff'
  'atlasci.py':
    script: scripts/atlasci.py
    proves: every file in a consumer's diff resolves to a route, and what each required gate would
      run as on that route — failing on a file the atlas cannot place
    does_not_prove: that those gates PASSED; it runs inside a repository whose toolchain it cannot
      see, and a workflow printing green over gates it did not run is the shape this atlas refuses
    closed_by: 'the consuming repository''s own CI, which owns its toolchain and runs the gates
      this step named'
  'knowledge.py':
    script: scripts/knowledge.py
    proves: the knowledge declaration is complete and self-consistent — every data class names how
      it fails, every layer names what it must never hold, every retrieval default that would
      otherwise win is named as forbidden, and every asymmetry names where it is applied
    does_not_prove: that any index was actually BUILT this way; a declaration is not an ingestion
    closed_by: 'the retrieval_change gate, which requires a chunk-boundary test, a freshness stamp
      and a citation check — and a citation a reader can open'
  'contextcost.py':
    script: scripts/contextcost.py
    proves: what this repository hands over BEFORE a route is resolved, in bytes, against a
      declared band per entry path — and how much larger the lazily-reached tree is, so the
      entry cost is read against something rather than on its own
    does_not_prove: that the bytes on the entry path are the RIGHT bytes; a short document that
      misroutes every reader costs more than a long one that routes correctly
    closed_by: 'the router''s own evidence line, which says WHICH rule resolved a route, and a
      human reviewer for whether the entry document earns its place'
  'ruff check':
    script: scripts/packmanifest.py
    proves: lint over every Python file in this repository, configured in pyproject.toml
    does_not_prove: formatting, which `ruff format` would rewrite in every file
    closed_by: 'a deliberate single commit that reformats everything at once, with the reason
      recorded in pyproject.toml — never a gate switched on quietly'

# DATE-SHAPED IDENTIFIERS THAT BELONG TO SOMEBODY ELSE.
# This repository stamps its own claims with the CONTRACT VERSION they were measured at, never
# with a calendar date: a date says when someone typed, a version says which tree it was true of,
# and only the second can be re-checked. The exception is a version an external project publishes
# in date form — MCP versions its specification that way. Those are declared here, once, and
# `atlas.py check` refuses any other date in a tracked text file. An external version is an
# identity; a measurement date is a rendering of one.
# HOW AN EXAMPLE IS RUN, PER ROUTE. Declared here so the runner holds no second roster: it routes
# each file under examples/ with this repository's own router and looks the recipe up by route.
# A route with no entry is reported as unexercised rather than skipped silently — an example
# nobody can run is a skeleton, and the repository refuses those everywhere else.
# THE SHAPE OF THE CODE, MEASURED BY AST RATHER THAN BY TEXT.
# Two functions can share no characters and be structurally identical — rename the variables,
# reflow the lines, swap the docstring, and a text scanner sees nothing. A generator repeats a
# SHAPE far more often than a string, because the shape is what it learned. scripts/astshape.py
# erases every name, literal and docstring, hashes what is left, and refuses a second copy.
# Each cap is a RATCHET: it may only fall, and lowering one must name what was removed.
code_shape:
  # THESE ARE A MEASUREMENT, NOT AN ENDORSEMENT. Set to the worst function in the tree so the
  # gate is live and cannot regress, with the target stated beside it. The ratchet only falls, and
  # lowering a cap must name what was removed to earn it.
  max_function_lines: 221          # atlas.py check(); TARGET 60. It has fallen 278 -> 262 -> 259
                                   # -> 239 -> 232 -> 221, each step a function the gate refused
                                   # and a split that earned it. The last fall was atlas_test.py
                                   # main() for the third time: the agent-control and entry-cost
                                   # fixtures moved out to agent_and_entry_cases(). The NEXT rule
                                   # added does not go in check() — it gets its own *_errors()
                                   # function, and its fixture gets its own *_cases().
  max_nesting_depth: 6             # astshape.py canonical(); TARGET 4
  min_structural_nodes: 25         # below this, two three-line guards are not a finding
  allowed_duplicate_structures: 0  # NOT a ratchet — zero, and it has held every run: import it,
                                   # write the same shape twice

example_runners:
  python:     {steps: [[python3, '{file}']]}
  bash:       {steps: [[bash, '{file}']]}
  typescript: {steps: [[node, '{file}']]}
  # Directory-scoped: the Go example is a real module, so it is vetted, TESTED (which runs
  # the fuzz target's seed corpus) and then run — once for the package, not once per file.
  go:         {per: directory, steps: [[go, vet, .], [go, test, -count=1, .], [go, run, .]]}
  sql:        {steps: [[sqlite3, ':memory:', '.read {file}']]}
  rust:       {steps: [[rustc, --edition, '2021', -D, warnings, '{file}', -o, '{out}'], ['{out}']]}
  c:          {steps: [[clang, -std=c17, -Wall, -Wextra, -Werror, '-fsanitize=address,undefined',
                        '{file}', -o, '{out}'], ['{out}']]}
  swift:      {steps: [[swiftc, -parse-as-library, '{file}', -o, '{out}'], ['{out}']]}

external_versions:
  mcp_specification: '2026-07-28'

artifact_routes:
  '.py': python
  '.pyi': python
  '.rs': rust
  '.go': go
  '.ts': typescript
  '.tsx': typescript
  # The JavaScript family routes to the TypeScript pack deliberately: the toolchain it
  # declares (node, tsc, eslint, vitest) is the one that answers for these files, and a
  # separate pack would restate it. A route is a toolchain, not a syntax.
  '.js': typescript
  '.mjs': typescript
  '.cjs': typescript
  '.jsx': typescript
  '.c': c
  '.h': c
  '.cpp': cpp
  '.cc': cpp
  '.hpp': cpp
  '.zig': zig
  '.mojo': mojo
  '.jl': julia
  '.ex': elixir
  '.exs': elixir
  '.gleam': gleam
  '.nim': nim
  '.v': v
  '.odin': odin
  '.ha': hare
  '.fut': futhark
  '.hs': haskell
  '.lhs': haskell
  '.fs': fsharp
  '.fsx': fsharp
  '.chpl': chapel
  '.bqn': bqn
  # NOT '.fs': that is F#'s, and declaring it here silently took the route over —
  # PyYAML keeps the LAST duplicate key and says nothing. Forth keeps .fth and .4th.
  '.fth': forth
  '.4th': forth
  '.ua': uiua
  '.lean': lean4
  '.carbon': carbon
  '.roc': roc
  '.qs': quantum/qsharp
  '.slq': quantum/silq
  '.cu': cuda
  '.cuh': cuda
  '.sql': sql
  '.sh': bash
  '.bash': bash
  '.ml': ocaml
  '.mli': ocaml
  '.scala': scala
  '.sc': scala
  '.swift': swift
  '.r': r
  '.wat': webassembly
  '.wasm': webassembly

routing_policy:
  precedence:
    - explicit_path_or_task_override
    - artifact_extension
    - project_manifest
    - language_directory
    - issue_labels
    - generic_fallback
  canonical_outputs:
    guide: languages/<route>/README.md
    operating_card: languages/<route>/OPERATING.md
    tool_manifest: languages/<route>/tools.yaml
    runtime: models/<runtime>/README.md
    mcp: integrations/MCP-LANGUAGE-MATRIX.md
    operations: wiki/LANGUAGE-OPERATIONS.md
    verification: docs/VERIFY.md
    finalization: docs/GITHUB-FINALIZATION.md
    github_backend: docs/GITHUB-BACKEND.md
  issue_labels:
    kind_prefix: 'kind/'
    language_prefix: 'lang/'
    area_prefix: 'area/'
    runtime_prefix: 'runtime/'
    mcp_prefix: 'mcp/'
    risk_prefix: 'risk/'
    status_prefix: 'status/'

model_routes:
  architecture: [claude, openai_codex]
  interactive_edit: [cursor, vscode]
  deterministic_repo_edit: [openai_codex, opencode]
  terminal_parallelism: [opencode]
  tool_orchestration: [hermes]
  research: [generic_llm, claude]
  verification: [native_toolchain, github_actions]

context_policy:
  default: [model, index, atlas, target_language, operating_card, tool_manifest, task_profile]
  boundary_addons: [api, db, cache, queue, abi, ffi, cloud]
  forbidden_default: [whole_repo_dump, unrelated_language_packs, duplicate_tool_queries]

  # WHAT IS HANDED OVER BEFORE A ROUTE IS RESOLVED, IN BYTES, AS A RATCHET.
  #
  # Measured at 2.13.0: this tree is 45% markdown by weight, and that number on its own says
  # nothing — 78 of those files are language packs no session reads until a route names one. The
  # number that decides whether a repository is a blob is not how much prose it CONTAINS, it is
  # how much it HANDS OVER before the reader has asked anything. Nothing measured that, so the
  # entry path could grow a page at a time and every count in this contract would stay green.
  #
  # Each budget is set to the MEASURED size of its path, so the gate is live and cannot regress,
  # and like every ratchet here it may only fall. Lowering one names what was removed to earn it;
  # RAISING one is refused by `atlas.py check` outright rather than argued about in review.
  # WHAT INSTALLING THE HARNESS COSTS, AS A RATCHET. A CLI that drags a dependency tree behind it
  # is a CLI nobody installs twice, and the weight arrives one convenient import at a time — each
  # one obviously worth it on the day it is added. So the count is declared and the bytes are
  # bounded: ONE runtime dependency, standard library otherwise, and the policy content is POINTED
  # AT rather than shipped, because a wheel carrying the atlas would be a vendored copy that ages.
  install_footprint:
    runtime_dependencies: 1
    module_bytes: 306000
    slack_bytes: 24000

  entry_paths:
    agent:
      why: what ONE runtime loads automatically with no route resolved and no question asked
      # AN INSTRUMENT IS WRONG IN ITS SCOPE LONG BEFORE IT IS WRONG IN ITS MATH. The first version
      # of this summed CLAUDE.md + AGENTS.md + llms.txt, and no session has ever loaded all three:
      # a runtime reads the ONE convention it knows. Summing them measured a reader that does not
      # exist and overstated the entry cost by roughly the number of conventions served — which
      # would then have been paid for by deleting a convention, the opposite of the right answer.
      # The cost is the WORST single alternative plus what every runtime reads regardless.
      measure: worst_alternative
      alternatives: [CLAUDE.md, AGENTS.md, llms.txt]
      files: [.agent/bootstrap.json]
      # A BAND, NOT A POINT. Three of these four files are GENERATED, so their size moves a little
      # whenever a declaration does; a ceiling set to the exact measurement would fire on correct
      # work every time, and the reaction to a noisy guard is never to fix it — it is to silence it.
      # The band refuses a RISE past the ceiling and equally refuses slack accumulating beneath it,
      # so the declaration cannot quietly become a ceiling nobody is near.
      budget_bytes: 7124
      slack_bytes: 512
    human:
      why: the landing page and the two indexes a person opens before anything else
      measure: sum
      files: [README.md, MODEL.md, docs/INDEX.md]
      budget_bytes: 36679
      slack_bytes: 2048

verification_policy:
  severity:
    blocker: merge_blocking
    error: merge_blocking
    warning: non_blocking_but_actionable
    info: report_only
    baseline: tracked_only_existing_findings
  baseline_rule: new_findings_must_not_be_absorbed_into_baseline
  independent_verifier: native_toolchain_or_github_security
  profiles:
    source_change:
      required: [formatter, compiler_or_typechecker, unit_tests]
    api_change:
      required: [schema_validation, contract_tests, endpoint_tests, compatibility_check]
    dependency_change:
      required: [dependency_graph, dependency_review, vulnerability_scan, tests]
    security_sensitive:
      required: [codeql, secret_scan, static_analysis, tests]
    concurrency_change:
      required: [race_detection, cancellation_tests, timeout_tests, stress_test]
    performance_change:
      required: [benchmark, profiler, representative_workload, regression_threshold]
    retrieval_change:
      required: [chunk_boundary_test, freshness_stamp, hybrid_recall_check, citation_check]
    quantum_change:
      required: [simulator_run, shot_count_declared, noise_model_declared, resource_estimate,
                 classical_baseline_comparison]
  tiers:
    fast: [formatter, compiler_or_typechecker, focused_tests]
    standard: [fast, static_analysis, applicable_security_and_dependency_checks]
    deep: [standard, property_or_fuzz, mutation_if_mature, performance_if_relevant]
    release: [deep, integration_tests, artifact_verification, supply_chain_verification]

# FUNCTIONALITY FIRST — THE ORDER A FEATURE IS BUILT IN, DECLARED SO IT CAN BE ARGUED WITH.
# The failure it prevents: a presentation layer built against an interface that does not exist yet,
# which then dictates the schema underneath it. Each step names the gate class that judges it, so
# the order is not advice — it is the sequence in which this repository's own gates apply.
build_order:
  - step: schema_and_types          # migrations, DDL, typed attributes, indexes, units
    gate: api_change
  - step: state_machine             # the transitions, as pure functions with no I/O
    gate: source_change
  - step: integration_tests         # the transitions against a real store, including the edges
    gate: source_change
  - step: api_contract              # the schema exposed, with limits, timeouts and idempotency
    gate: api_change
  - step: presentation              # last, and a plain CLI must already do everything it can do
    gate: source_change
build_order_rule: a step may not begin until the step above it has passed its gate

task_profiles:
  default: [native, focused_context, focused_verify]
  implementation: [native, semantic_context, tests, diff_review]
  debugging: [native_debugger, focused_repro, regression_test, diff_review]
  endpoint: [native_http, schema_contract, integration_test, browser_if_needed]
  database: [native_db, read_only_dbhub, migration_test, plan_review]
  security: [native_security, codeql, semgrep, secret_scan, dependency_review]
  reliability: [timeouts, cancellation, health_readiness, telemetry, smoke_test]
  mutation: [existing_tests, mutation_tool_if_mature, bounded_mutants, regression_gate]
  performance: [profiler, benchmark, representative_workload, regression_threshold]
  polyglot: [schema_or_abi, native_tools_both_sides, boundary_test, e2e_if_needed]
  research: [primary_sources, isolated_context, prototype, measurement]
  # RETRIEVAL IS A TASK WITH ITS OWN FAILURES AND NO SOURCE-CHANGE GATE NOTICES ONE. A chunk that
  # ends mid-function, an index invalidated by mtime and an answer with no citation all pass a
  # formatter, a typechecker and a unit suite.
  retrieval: [ast_chunking, hybrid_search, checksum_invalidation, sidecar_metadata, citations]
  autonomous_agent: [narrow_tools, sandbox, budget, approval, audit]
  # QUANTUM IS A DOMAIN WITH ITS OWN DECLARATIONS, NOT ANOTHER LANGUAGE CONVENTION. A quantum
  # result with no shot count, no noise model and no classical baseline is not a measurement, and
  # nothing in a normal source-change gate would notice that. The profile names what must be
  # DECLARED before the run; quantum_change below is what must be produced by it.
  quantum: [native_simulator, shots_declared, noise_model_declared, qubit_budget_declared,
            resource_estimate, classical_baseline]

# THREE CLASSES OF DATA, AND THE FAILURE EACH ONE HAS THAT THE OTHERS DO NOT.
#
# A system that treats all three the same reaches for the mechanism it knows: everything becomes
# a document, gets embedded, and a question with an exact answer is served by similarity. The
# measured cost of that is not a wrong answer, it is a PLAUSIBLE one — a row that exists is
# paraphrased, a row that does not is invented, and neither is distinguishable from the other in
# the output. Each class below names how it is retrieved, what must be recorded beside it, and the
# way it fails, so the choice is made once here rather than re-guessed per question.
data_classes:
  structured:
    examples: [relational tables, key-value stores, columnar files, time series]
    retrieval: a deterministic query the agent WRITES and the system RUNS — never a fact recalled
    chunking: none; a row is already a unit and splitting one destroys its identity
    required_metadata: [schema_version, primary_key, units]
    gate: schema_validation
    fails_by: a query that returns zero rows and reads exactly like an empty result — ABSENT IS
      NOT ZERO, and the two are the same output unless the query prints its own row count
  semi_structured:
    examples: [json documents, yaml declarations, front matter, log lines, api payloads]
    retrieval: a path expression or a schema-validated extractor, with the schema named
    chunking: by declared node, never by length — a split object is not a smaller object
    required_metadata: [schema_id, source, extracted_at_contract]
    fails_by: a field that moved rather than vanished, so the extractor reads a default and every
      downstream number is confidently wrong
  unstructured:
    examples: [prose, raw source files, pdf and office documents, transcripts, issue threads]
    retrieval: hybrid — dense similarity for meaning AND sparse keyword for exact symbols
    chunking: ast_boundaries
    required_metadata: [path, checksum, symbols, route, last_verified_contract]
    fails_by: a chunk that ends mid-function, which retrieves as a confident fragment of something
      that was never true on its own

# WHERE A FACT LIVES, AND WHY IT MAY NOT LIVE ANYWHERE ELSE.
#
# The three layers are not a ranking, they are a decision about VOLATILITY. Putting a volatile fact
# in the layer that cannot be updated is the defect, and its signature is that nothing in the
# output looks wrong: a stale weight and a fresh one produce the same confident sentence. Each
# layer therefore declares what it must NEVER hold, and who closes the gap when it does.
knowledge_layers:
  parametric:
    holds: [behaviour, output shape, domain vocabulary, refusal style, formatting conventions]
    never_holds: anything that changes without a release — a version, a price, a file, a roster,
      a schedule, a threshold
    staleness: silent, and undetectable from the output alone
    closed_by: the retrieved layer, which carries a freshness stamp the parametric layer cannot
  retrieved:
    holds: [source files, live declarations, records, documentation, measurements]
    never_holds: the rules for HOW to answer — a retrieved instruction is an injection surface
    staleness: visible, because every record carries its checksum and the contract it was read at
    closed_by: the invalidation rule below, and a citation the reader can open
  in_context:
    holds: [the task, the plan, the diff, the last few tool results]
    never_holds: durable knowledge; a fact that mattered twice belongs in a file, not in a window
    staleness: bounded by the session, which is why it is the wrong place for anything reusable
    closed_by: the entry paths and the budgets in context_policy

# HOW SOMETHING IS INDEXED, STATED ONCE SO IT IS NOT RE-DECIDED PER INGESTION.
retrieval_policy:
  chunking: ast_boundaries
  # A FIXED CHARACTER COUNT IS THE DEFAULT AND IT IS THE DEFECT. It splits a function in half and
  # both halves retrieve well, because similarity does not know the unit was broken.
  never_chunk_by: [fixed_character_count, fixed_token_count, page_boundary]
  search: [dense_similarity, sparse_keyword]
  search_rule: hybrid, because a dense-only index cannot find an exact symbol and a keyword-only
    index cannot find a paraphrase — and the question that needs each one looks the same
  invalidation: content_checksum
  # NEVER A MODIFICATION TIME. A checkout, a clone and a format-on-save all move mtime without
  # changing a byte, and a restored file changes bytes without moving it far enough to notice.
  never_invalidate_by: [modification_time, file_size, cache_ttl_alone]
  sidecar_fields: [path, checksum, symbols, route, class, last_verified_contract]
  citation_rule: every retrieved claim carries the path and the checksum it was read at, or it is
    reported as unsourced rather than blended into the answer

# TWO WORDS THAT BELONG TOGETHER, AND THE REASON THE PAIR IS UNEQUAL.
#
# Almost every rule in this repository is one of these underneath. Naming the pair makes the rule
# portable: the same asymmetry that decides where a guard goes also decides how a budget is set
# and what a refusal costs. `atlas.py why <id>` prints one; the roster is checked, so a pair
# cannot be added without saying where it is applied.
asymmetries:
  prevention_detection:
    pair: [cheap_to_prevent, expensive_to_detect]
    why: a defect made unrepresentable costs one design decision; the same defect detected costs a
      guard, its tests, its exemptions and every future reader who has to understand it
    applied_at: the duplicate-key loader, the parse-first check, and never_writable
  silence_noise:
    pair: [silent_failure, noisy_failure]
    why: a noisy failure is bounded by the time it takes to read; a silent one is unbounded,
      because nothing marks when it began
    applied_at: every roster that prints its count, and every gate that prints its coverage
  write_read:
    pair: [written_once, read_forever]
    why: the cost of a declaration is paid by one author; the cost of prose that restates it is
      paid by every reader, on every session, forever
    applied_at: the generated blocks, the entry-path ratchet, and the instrument roster
  loss_upside:
    pair: [bounded_loss, unbounded_upside]
    why: a search that can only lose what it declared in advance may run as long as it likes; one
      that cannot is a position, not an experiment
    applied_at: the task-contract budgets, the audit byte cap, and the refusal to auto-execute
  sensitivity_specificity:
    pair: [proves_it_bites, proves_it_bites_nothing_else]
    why: a mutation test answers the first and says nothing about the second, and only the second
      decides whether a guard survives contact with a real tree
    applied_at: the clean-sweep requirement beside every planted defect
  declaration_rendering:
    pair: [declared_identity, rendered_form]
    why: a rendering changes without notice and the break is silent; an identity is what a
      consumer may branch on
    applied_at: the route record, the gate ids, and the frozen output schema

# ONE IMPLEMENTATION, EVERY LANGUAGE. `atlas do <file> <action>` resolves an action through the
# pack the file routes to, so `format` runs that pack's declared formatter and nothing here knows
# which one that is. Change a pack's test runner and the action follows it; add a pack and it
# inherits all of these for free. This is what makes 35 manifests usable rather than descriptive —
# before it they were read BY the contract and by nobody else.
#
# `takes_file` is the whole subtlety: a formatter acts on one file, a test runner acts on a project,
# and appending a path to the second is how a green suite becomes a run of nothing.
pack_actions:
  format:  {role: formatter,           takes_file: true}
  check:   {role: compiler_or_runtime, takes_file: true}
  lsp:     {role: lsp,                 takes_file: false}
  test:    {role: test,                takes_file: false}
  scan:    {role: security,            takes_file: true}
  debug:   {role: debugger,            takes_file: true}
  profile: {role: profiler,            takes_file: true}
  bench:   {role: benchmark,           takes_file: false}
  fuzz:    {role: fuzz,                takes_file: false}
  mutate:  {role: mutation,            takes_file: false}
  deps:    {role: package_manager,     takes_file: false}

# THE STEPS A PROCESS MAY BE MADE OF. A free-text sequence is a sentence with bullet points: two
# processes would spell the same step differently and no instrument could tell they matched.
process_steps:
  route: resolve the artifact to a pack, a card and a manifest before reading anything else
  scope: declare the paths and commands this task may touch, and refuse the rest
  retrieve: load what the route named, plus the callers and tests of the symbol being changed
  plan: pick the task profile and change class, and resolve the gates they require
  edit: the smallest change that satisfies the objective, and no refactor beside it
  fast_verify: the cheapest gate that can fail, before the expensive one — localise, then prove
  full_verify: every gate the change class requires, judged on the exit code
  diff_audit: compare the diff against the paths the plan declared, before claiming anything
  accept: the acceptance record, INCLUDING the gates that did not run and why
  record: the outcome and the audit stream that can be recomputed
  escalate: stop, name the missing dependency or the approval needed, and do not proceed

# A PROCESS IS THE ONE THING A CONSUMER WANTS AND THE ONE THING THIS TREE ONLY EVER IMPLIED.
# `task_profiles` says which tools, `verification_policy` says which gates, `build_order` says in
# what order a feature is built, `tool_profiles` says what may be activated — four rosters a
# reader had to join by hand, from prose, every single time. A consuming repository therefore
# depended on a PARAGRAPH, which is re-worded without notice, instead of on an identifier.
#
# Each process below joins them once under an id. `atlas process <id> --json` is the external
# reference; the generated documents are views of this, never a second definition.
#
# STOPPING CONDITIONS ARE PART OF THE PROCESS, NOT ADVICE BESIDE IT. A process with no declared
# stop is one that expands until something else notices, which is the failure the agent controls
# were built for — so `atlas.py check` refuses a process that declares none.
processes:
  implementation:
    task_profile: implementation
    change_class: source_change
    sequence: [route, scope, retrieve, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [diff, gate_results, audit_stream]
    stop_when: [gate_refused, scope_expanded, budget_exhausted]
    escalate_when: [plan_drift, approval_required]
  debugging:
    task_profile: debugging
    change_class: source_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, diff_audit, record]
    artifacts: [reproduction, regression_test, diff, gate_results]
    stop_when: [reproduction_not_obtained, gate_refused, budget_exhausted]
    escalate_when: [root_cause_outside_scope]
  endpoint:
    task_profile: endpoint
    change_class: api_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [schema, contract_test, integration_test, gate_results]
    stop_when: [schema_unversioned, gate_refused, scope_expanded]
    escalate_when: [breaking_change_detected, approval_required]
  security:
    task_profile: security
    change_class: security_sensitive
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [finding_list, gate_results, dependency_delta]
    stop_when: [secret_detected, gate_refused]
    escalate_when: [approval_required, production_access_needed]
  dependency_change:
    task_profile: default
    change_class: dependency_change
    sequence: [route, scope, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [lockfile_delta, dependency_graph, gate_results]
    stop_when: [lock_outside_declared_range, gate_refused]
    escalate_when: [approval_required]
  performance:
    task_profile: performance
    change_class: performance_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, accept, record]
    artifacts: [baseline, benchmark_result, profile, gate_results]
    stop_when: [workload_not_representative, regression_threshold_crossed]
    escalate_when: [measurement_not_reproducible]
  polyglot:
    task_profile: polyglot
    change_class: api_change
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [schema_or_abi, boundary_test, gate_results]
    stop_when: [boundary_untested, gate_refused]
    escalate_when: [both_sides_need_changing]
  autonomous_agent:
    task_profile: autonomous_agent
    change_class: source_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record, escalate]
    artifacts: [task_contract, audit_stream, gate_results, environment_fingerprint]
    stop_when: [budget_exhausted, scope_expanded, policy_denied, audit_chain_broken]
    escalate_when: [approval_required, plan_drift]

tool_profiles:
  core-code: [native, github, serena_when_supported]
  docs: [native_docs, context7_when_needed]
  browser: [native_http, playwright]
  database: [native_db, dbhub_read_only]
  security: [native_security, codeql, semgrep, github_secret_controls, dependency_review]
  polyglot: [core-code, schema_abi, boundary_tests]

# THE AUTONOMOUS PROFILE, AS CONTROLS SOMETHING ENFORCES RATHER THAN WORDS AN AGENT READS.
#
# `task_profiles/autonomous_agent` has named five controls since 2.0.0 — narrow_tools, sandbox,
# budget, approval, audit — and until 2.13.0 not one of them was enforced by anything in this tree.
# An agent that simply did not read CLAUDE.md was subject to none of them. That is the gap this
# block closes, and it is the same gap three other rosters here already close: a DECLARED control
# and an ENFORCED control look identical from outside, and only the second survives being ignored.
#
# Every entry below names the FUNCTION that decides it. `atlas.py check` refuses a control whose
# enforcer does not resolve to a callable, exactly as it refuses an invariant with no owner and an
# instrument with no closer — so a control cannot be added here and left unwired.
#
# WHAT THIS IS NOT. A Python runner is not a security boundary, and saying so is not a disclaimer:
# it is the reason `sandbox_requirements` is addressed to the HOST and says so per row. The runner
# refuses what it can see. A sandbox refuses what it cannot.
agent_policy:
  schema: tools/agent-task.schema.json
  reference_contract: tools/agent-task.example.json
  controls:
    narrow_tools:
      enforced_by: agentpolicy.command_verdict
      refuses: a command outside the contract's allowed_commands, or matching a denied_commands
        pattern whatever the contract allows
    sandbox:
      enforced_by: agentpolicy.path_verdict
      refuses: a read or write outside allowed_paths, inside forbidden_paths, or escaping the
        repository root by traversal or symlink
    budget:
      enforced_by: agentpolicy.budget_verdict
      refuses: the call that would cross a declared budget, BEFORE it runs — a budget checked
        afterwards is a report, not a control
    approval:
      enforced_by: agentpolicy.approval_verdict
      refuses: a high-impact action whose token is absent, expired, or bound to a different
        contract, base commit, action or diff
    audit:
      enforced_by: agentaudit.append
      refuses: nothing at write time, because it RECORDS; the chain it writes is what
        `agentaudit.py verify` refuses when the hashes no longer recompute

  # WHAT A CONTRACT MAY NOT RAISE. A contract is written by the same agent these controls bound,
  # so a budget it declares for itself is a preference. These are the ceilings; a contract may
  # declare less and never more, and `agentpolicy.budget_verdict` reads the lower of the two.
  default_budgets:
    tool_calls: 40
    wall_clock_seconds: 900
    files_changed: 20
    lines_changed: 600
    retries: 3
    output_bytes: 1000000

  # REFUSED WHATEVER THE CONTRACT ALLOWS. Each pattern is searched against the quoted argv, and
  # each names WHY, because a deny list whose rows carry no reason is edited by whoever is blocked.
  # This is not the boundary — `allowed_commands` is. This is the floor under it.
  denied_commands:
    privilege_escalation:
      pattern: '^(sudo|doas|su)\b'
      why: a runner that can elevate has no budget, because everything below it can be rewritten
    piped_remote_code:
      pattern: '\b(curl|wget)\b[^|]*\|\s*(sh|bash|zsh|python3?)\b'
      why: fetching and executing in one step leaves nothing for a reviewer or an audit to name
    history_rewrite:
      pattern: '^git\s+(push\s+(-f|--force)|reset\s+--hard|clean\s+-[a-zA-Z]*f|filter-branch|update-ref\s+-d)\b'
      why: the repository is the evidence; an agent that can rewrite it can hide the change it made
    credential_read:
      pattern: '(\.ssh/|\.aws/|\.netrc|id_rsa|id_ed25519|\.claude-keys|/credentials\b)'
      why: a task that needs a credential asks for approval; a task that reads one is exfiltration
    recursive_delete:
      pattern: '\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r'
      why: the one command whose mistake cannot be reviewed afterwards
    audit_tampering:
      pattern: '\.agent/audit'
      why: an audit stream the subject can edit records what the subject chose to record

  # PATHS NO CONTRACT MAY ALLOW, WHATEVER IT DECLARES. Two shapes, both of which a contract
  # written by the agent it bounds would otherwise permit itself:
  #   - the policy that bounds the task, the runner that applies it, and the audit stream that
  #     records it. A task that can edit any of those is not bounded by them.
  #   - a GENERATED file. Editing one is a write to the output instead of the declaration, and the
  #     next `index --write` silently reverts it — which reads as sabotage and is a wrong-file
  #     write. The generated roster is NOT restated here; it is read from the generator, because a
  #     second copy of it would narrow the first time a generated file was added beside it.
  never_writable:
    - .agent/audit
    - tools/agent-task.schema.json
    - scripts/agentpolicy.py
    - scripts/agentaudit.py
    - scripts/agentrun.py

  # ADDRESSED TO THE HOST, NOT TO THE RUNNER, AND EACH ROW SAYS WHICH. `observed_by: host` means
  # this repository cannot prove it and does not claim to; the runner prints those rows as
  # UNOBSERVED rather than passing over them, so a task that ran outside a sandbox never reads as
  # one that ran inside it. `atlas.py check` refuses a row whose observer does not resolve.
  sandbox_requirements:
    filesystem:
      requirement: the repository writable, everything else read-only or absent
      observed_by: agentpolicy.path_verdict
    workspace_lifetime:
      requirement: an isolated temporary directory, removed when the task ends
      observed_by: agentrun.workspace_report
    home_directory:
      requirement: no access to the invoking user's home, ssh keys, or cloud configuration
      observed_by: host
    network:
      requirement: default deny, with an explicit per-task allowlist
      observed_by: host
    identity:
      requirement: a non-root user holding no ambient cloud or registry credentials
      observed_by: host
    resources:
      requirement: bounded cpu, memory and process count, killed by the host rather than asked
      observed_by: host

  # AN APPROVAL IS BOUND TO WHAT WAS APPROVED, OR IT IS A HABIT. A generic "yes, proceed" survives
  # the diff growing, the base commit moving and the action changing underneath it — which is the
  # failure, not an edge case. Each binding below is a field of the token; each invalidation is a
  # comparison `agentpolicy.approval_verdict` makes before the action runs.
  approval:
    required_for: [network_enablement, dependency_change, workflow_change, security_change,
                   production_access, push, merge, release]
    approver_roles: [owner, security]
    expires_after_seconds: 900
    binds_to: [contract_hash, repository, base_commit, action, diff_hash]
    invalidated_by: [expiry, base_commit_changed, diff_hash_changed, action_changed,
                     allowed_paths_changed]

  # AN AUDIT IS A CHAIN OR IT IS A LOG. A log the subject can append to can also be rewritten, and
  # a rewritten log is indistinguishable from an honest one. Each event carries the hash of the one
  # before it, so a removed or edited event breaks every hash after it and `agentaudit.py verify`
  # names the first break.
  audit:
    stream: .agent/audit
    # EVERY STORE CYCLES, AND THE BOUND IS IN BYTES. A count of events says nothing about a
    # stream whose events grow; the cap is refused at append time and the refusal is itself the
    # last event, so a truncated stream and a finished one are never the same file.
    max_stream_bytes: 4000000
    chain: sha256 over the previous event hash and this event's canonical body
    redaction: arguments and output are recorded as hashes and byte counts, never echoed — but the
      event kind, the exit code and the paths are recorded in full, because a log redacted past the
      point of establishing what happened is not an audit
    events: [task_created, plan_resolved, policy_denied, command_started, command_finished,
             file_changed, approval_presented, approval_refused, budget_exhausted, gate_result,
             scope_expanded, task_finished]

# A GATE IS A WORD UNTIL SOMETHING CAN RESOLVE IT TO A COMMAND.
#
# `verification_policy` names the gates a change class requires and the packs declare the tools,
# and nothing joined the two: a runner reading "unit_tests" had no way to learn what runs them
# here, so the gate was satisfied by an agent saying it was. Each gate below names the MANIFEST
# AUTHORITY ROLE that answers it, which makes the 35 tool manifests load-bearing rather than
# descriptive — change a pack's test runner and the gate resolves to the new one.
#
# `role: none` is a real answer and the more useful half of this table: a gate that no pack tool
# can run is a DECLARATION or a platform control, and saying which beats resolving it to the
# nearest command that would have printed a zero. Every `none` names what closes it, and
# `atlas.py check` refuses a gate with no entry and a `none` with no closer.
gate_tools:
  formatter: {role: formatter}
  compiler_or_typechecker: {role: compiler_or_runtime}
  unit_tests: {role: test}
  tests: {role: test}
  focused_tests: {role: test}
  schema_validation: {role: test}
  contract_tests: {role: test}
  endpoint_tests: {role: test}
  race_detection: {role: test}
  cancellation_tests: {role: test}
  timeout_tests: {role: test}
  stress_test: {role: test}
  static_analysis: {role: security}
  dependency_graph: {role: package_manager}
  vulnerability_scan: {role: package_manager}
  benchmark: {role: benchmark}
  profiler: {role: profiler}
  property_or_fuzz: {role: fuzz}
  mutation_if_mature: {role: mutation}
  simulator_run: {role: compiler_or_runtime}
  compatibility_check:
    role: none
    closed_by: no tool in one pack answers whether two versions of an API agree; the breaking and
      public_schema risk modifiers add consumer_impact_review, which is a person
  dependency_review:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  codeql:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  secret_scan:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  representative_workload:
    role: none
    closed_by: a DECLARATION about what the benchmark ran, not a command; the performance task
      profile requires it be named and a reviewer judges whether it is representative
  regression_threshold:
    role: none
    closed_by: a declared number the benchmark's own output is compared against
  shot_count_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  noise_model_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  resource_estimate:
    role: none
    closed_by: the simulator's own estimator, reported beside the run rather than gated on
  classical_baseline_comparison:
    role: none
    closed_by: a second run of the classical implementation, named in the quantum task profile
  artifact_verification:
    role: none
    closed_by: the release workflow's provenance step, which signs what it built
  supply_chain_verification:
    role: none
    closed_by: the platform's dependency and provenance controls, audited live
  integration_tests: {role: test}
  chunk_boundary_test: {role: test}
  hybrid_recall_check: {role: test}
  citation_check: {role: test}
  freshness_stamp:
    role: none
    closed_by: a declaration recorded beside the index — the checksum and the contract version each
      record was read at; a stamp produced at query time restates when the question was asked
  authorization_tests: {role: test}
  session_invalidation_test: {role: test}
  signature_verification_test: {role: test}
  replay_protection_test: {role: test}
  delivery_retry_test: {role: test}
  quota_accounting_test: {role: test}
  rotation_test: {role: test}
  revocation_path_test: {role: test}
  known_answer_tests: {role: test}
  forward_compatibility_test: {role: test}
  invariant_property_test: {role: fuzz}
  no_plaintext_at_rest_check: {role: security}
  allocation_profile: {role: profiler}
  load_test: {role: benchmark}
  performance_if_relevant:
    role: none
    closed_by: the performance_change gate, which is the class to pick when it IS relevant; a tier
      entry that is optional by name cannot be resolved to a command without deciding that question
  consumer_impact_review:
    role: none
    closed_by: a person who knows who calls this; no tool in the producing repository can see the
      consumers, which is the whole reason a breaking change needs one
  parameter_review:
    role: none
    closed_by: a reviewer against the primary specification for the algorithm in question
  lock_order_review:
    role: none
    closed_by: a reviewer; a deadlock a test did not reach is not a deadlock a linter finds
  side_channel_note:
    role: none
    closed_by: a written statement of what was and was not considered, read at review
  cache_behaviour_note:
    role: none
    closed_by: a written statement beside the benchmark, because the number alone hides the cause
  migration_path:
    role: none
    closed_by: a document the reviewer reads, naming the steps and the point of no return
  rollback_rehearsal:
    role: none
    closed_by: the rehearsal itself, against a real store, in the release tier — a rollback never
      exercised is a plan, not a control
  version_bump:
    role: none
    closed_by: the contract's own version-site check, which refuses a tree whose declared sites disagree
  deprecation_window:
    role: none
    closed_by: a declared period, stated at the point of deprecation rather than at removal
  deprecation_policy_check:
    role: none
    closed_by: the repository's declared policy for how long a surface survives after it is replaced
  generated_client_regeneration:
    role: none
    closed_by: the consuming repository's own build, which is where a stale generated client fails
  applicable_security_and_dependency_checks: {role: security}

# A CHANGE CLASS IS THE FLOOR, AND ON ITS OWN IT IS TOO COARSE. `api_change` gates an added
# optional field and a removed endpoint identically, so the gates that matter for the second are
# absent from the first and nobody notices — the class passed. A MODIFIER only ever ADDS gates, so
# the class remains the floor and a modifier cannot be used to get a cheaper run. `atlas.py check`
# refuses a modifier whose `applies_to` is not a declared change class.
risk_modifiers:
  additive_endpoint:
    applies_to: api_change
    adds: [deprecation_policy_check]
  breaking_endpoint:
    applies_to: api_change
    adds: [consumer_impact_review, migration_path, version_bump, deprecation_window]
  auth_boundary:
    applies_to: api_change
    adds: [authorization_tests, session_invalidation_test, codeql, secret_scan]
  webhook:
    applies_to: api_change
    adds: [signature_verification_test, replay_protection_test, delivery_retry_test]
  public_schema:
    applies_to: api_change
    adds: [consumer_impact_review, version_bump, generated_client_regeneration]
  rate_limit:
    applies_to: api_change
    adds: [load_test, quota_accounting_test]
  credential_handling:
    applies_to: security_sensitive
    adds: [rotation_test, no_plaintext_at_rest_check, revocation_path_test]
  cryptography:
    applies_to: security_sensitive
    adds: [known_answer_tests, parameter_review, side_channel_note]
  shared_mutable_state:
    applies_to: concurrency_change
    adds: [invariant_property_test, lock_order_review]
  hot_path:
    applies_to: performance_change
    adds: [allocation_profile, cache_behaviour_note]
  schema_migration:
    applies_to: dependency_change
    adds: [forward_compatibility_test, rollback_rehearsal]

# WHAT A NATIVE TOOL IS AUTHORITATIVE FOR — AND WHAT NO ENTRY IN A MANIFEST ANSWERS AT ALL.
# `native_language_tools_are_authoritative` is true, and it was read as more than it says: a
# compiler accepting a program proves the program is well formed, never that it is correct, and a
# green unit suite proves nothing about how the thing behaves in production. Collapsing those into
# one word per pack is how a passing gate becomes a claim nobody made. Every manifest role belongs
# to EXACTLY ONE class below, and the two classes with no role are the point of the table: they
# are declared empty, with a closer, rather than silently answered by the nearest tool.
authority_classes:
  syntax:
    roles: [formatter]
    closed_by: the formatter is the authority and there is nothing above it
  type:
    roles: [compiler_or_runtime, lsp]
    closed_by: a type that holds says nothing about the value flowing through it — behavior below
  behavior:
    roles: [test, fuzz, mutation, debugger]
    closed_by: tests answer for the cases written; property and mutation runs widen that, and the
      gap that remains is named per change class in verification_policy
  security:
    roles: [security]
    closed_by: a pack's scanner plus the repository-level gates in the security_sensitive profile
  performance:
    roles: [benchmark, profiler]
    closed_by: a benchmark answers for the workload it ran; the representative workload is named
      by the performance_change gate
  supply_chain:
    roles: [package_manager]
    closed_by: dependency review and vulnerability scanning in the dependency_change gate
  reference:
    roles: [docs, research]
    closed_by: primary documentation is the source; a summary of it is not
  boundary:
    roles: []
    closed_by: NOTHING IN ONE PACK — a boundary is a contract between two, so it is answered by the
      polyglot task profile's boundary test and by the schema or ABI both sides read
  operational:
    roles: []
    closed_by: NOTHING IN A MANIFEST — no declared tool proves production readiness; the running
      service's own telemetry, the reliability task profile and the release tier answer for it

branch_policy:
  default_base: main
  permanent_language_branches: false
  language_lane_pattern: 'lang/<language>/<topic>'
  topic_patterns:
    feature: 'feat/<topic>'
    fix: 'fix/<topic>'
    research: 'research/<topic>'
    security: 'security/<topic>'
  worktree_pattern: '../Code-Development-wt/<language>-<topic>'
  isolation_rule: one_mutable_writer_per_worktree

issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  debugging: [vscode, language_debugger, runtime_debugger, profiler]
  gpu: [cuda, mojo, futhark, chapel, julia]
  security: [static_analysis, dependency_scan, secret_scan, codeql]
  polyglot: [schema, ownership, compatibility, integration_test]
  drift: [links, routes, versions, orphans, dependencies, environment]
  mcp: [github, serena, playwright, context7, dbhub, semgrep]
  routing: [atlas, extension, manifest, issue_labels, task_profile]
  branch: [worktree, language_lane, topic_branch, merge]
  endpoint: [schema, http, webhook, integration_test]
  database: [schema, migration, transaction, query_plan]
  mutation: [property_test, fuzz, mutation_test, regression]
  blob: [module_size, generated_artifact, binary_artifact, payload_size]

runtime_roles:
  vscode: interactive_ide_agent_host
  opencode: terminal_agent_workspace
  github_actions: authoritative_repository_verification
  cli: deterministic_local_harness
