context_policy:
  default: [model, index, atlas, target_language, operating_card, tool_manifest, task_profile]
  boundary_addons: [api, db, cache, queue, abi, ffi, cloud]
  forbidden_default: [whole_repo_dump, unrelated_language_packs, duplicate_tool_queries]

  # WHAT IS HANDED OVER BEFORE A ROUTE IS RESOLVED, IN BYTES, AS A RATCHET.
  #
  # Measured at 2.25.0: this tree is 45% markdown by weight, and that number on its own says
  # nothing — 78 of those files are language packs no session reads until a route names one. The
  # number that decides whether a repository is a blob is not how much prose it CONTAINS, it is
  # how much it HANDS OVER before the reader has asked anything. Nothing measured that, so the
  # entry path could grow a page at a time and every count in this contract would stay green.
  #
  # Each budget is set to the MEASURED size of its path, so the gate is live and cannot regress,
  # and like every ratchet here it may only fall. Lowering one names what was removed to earn it;
  # RAISING one is refused by `atlas.py check` outright rather than argued about in review.
  # WHAT INSTALLING THE HARNESS COSTS, AS A RATCHET. A CLI that drags a dependency tree behind it
  # is a CLI nobody installs twice, and the weight arrives one convenient import at a time — each
  # one obviously worth it on the day it is added. So the count is declared and the bytes are
  # bounded: ONE runtime dependency, standard library otherwise, and the policy content is POINTED
  # AT rather than shipped, because a wheel carrying the atlas would be a vendored copy that ages.
  install_footprint:
    runtime_dependencies: 1
    module_bytes: 200704
    slack_bytes: 10240
    # A RISE MUST NAME WHAT EARNED IT. Written as only-falls, this ratchet twice refused a genuine
    # capability and was twice paid for by removing something real — which is the ratchet working.
    # The third time the honest answer was different: an absolute that gets worked around is worse
    # than a rule with a declared escape, and this is the same escape the context budget already
    # carries. `check` refuses a raise that names nothing.
    raised_for: 'mechanism_doc_errors in contextcost. PROPORTIONALITY: the case was met the
      moment it ran — every pattern and systems document named ZERO of the instruments built to
      implement them, and it found three more the first time it was enforced. A document that
      describes a mechanism and points at nothing reads as guidance while actually being a map of
      where enforcement used to be missing. REVERSIBILITY: one function, one caller, and its
      roster is derived from the instrument declaration rather than typed. It also carries
      identity.py (a consumer who forks this atlas must re-own it), the markdown fence check,
      tighten_ratchets and read_jsonc, each argued at the version that added it'
    # WHAT A CONSUMER'S INSTALL DOES NOT CARRY. The footprint counted every script in the tree and
    # therefore grew whenever an INSTRUMENT was added — which is the wrong scope, not a tight
    # ceiling: a repository's own mutation harness, its shape gate, its platform auditor and its
    # benchmark are development tools, and shipping them would make every consumer pay for the
    # verification of a repository they do not have. They stay in the tree and out of the wheel,
    # and `atlas.py check` refuses a script that is in neither list.
    development_only:
      - branchstate
      - abtest
      - freshness
      - langbar
      # These two maintain THIS repository — its generated documents and its 26 invariants.
      # A consumer routing a file in their own tree needs neither, and shipping them made
      # every install carry 55 KB of somebody else's maintenance.
      - atlasgen
      - atlasinv
      - atlas_test
      - agent_test
      - astshape
      - bench
      - check_contract
      - exrun
      - ghaudit
      - packprobe
      - atlasci

  # HOW MANY PACKS SHIP SOMETHING THAT RUNS — COUNTED, BECAUSE A CLEAN PASS OVER TEN EXAMPLES AND
  # A CLEAN PASS OVER THIRTY-FIVE PRINT THE SAME WORD. `exrun` reported "10 passed, 0 failed" and
  # said nothing about the routes it never looked at, which is a roster narrowing silently: the
  # exact shape this repository refuses everywhere else, living inside one of its own instruments.
  #
  # A pack with no example is DECLARED, never EXERCISED — rung two of tool_claims at best. The
  # number is a ratchet: it may only fall, so an added pack must arrive with something that runs
  # or lower this line on purpose, and it can never quietly get worse.
  example_coverage:
    routes_without_example: 24
    why_not_zero: writing an example in a language whose toolchain cannot be RUN here would ship a
      skeleton, and this repository refuses those everywhere else; each one lands when its
      toolchain can execute it and its assertions have actually held

  # HOW FAR BEHIND A PATH MAY FALL BEFORE SOMEBODY LOOKS AT IT, in contract versions rather than
  # days. A date says when somebody typed; a version says which tree the path was last true of,
  # and only the second can be compared against what the contract now says. Noticed by reading a
  # directory listing and seeing several paths last touched many versions back while the rules
  # they encode had moved underneath them — "which section am I forgetting" was being answered by
  # scrolling, which finds the ones you happen to look at.
  review_horizon:
    max_minors_behind: 8
    # LOOKED AT IT, IT IS CORRECT — a third state, and without it this guard rewards a cosmetic
    # commit. A path can be stale, exempt-forever, or EXAMINED AND FINE, and only the third is
    # what most healthy paths actually are. Recording the contract version it was examined at
    # resets its clock without touching the file, so nobody has to fake an edit to clear a
    # warning. A reviewed entry ages exactly like a commit does: past the horizon it asks again.
    reviewed:
      .editorconfig: '2.26.0'
      .gitignore: '2.26.0'
    exempt:
      LICENSE: a copyright record, not a document that tracks the contract
      examples: an example changes when its LANGUAGE does, which is not on this repository's clock
      languages: 35 packs move with their own toolchains; packprobe and provenance.verify are what
        answer for them, not a version distance

  entry_paths:
    agent:
      why: what ONE runtime loads automatically with no route resolved and no question asked
      # AN INSTRUMENT IS WRONG IN ITS SCOPE LONG BEFORE IT IS WRONG IN ITS MATH. The first version
      # of this summed CLAUDE.md + AGENTS.md + llms.txt, and no session has ever loaded all three:
      # a runtime reads the ONE convention it knows. Summing them measured a reader that does not
      # exist and overstated the entry cost by roughly the number of conventions served — which
      # would then have been paid for by deleting a convention, the opposite of the right answer.
      # The cost is the WORST single alternative plus what every runtime reads regardless.
      measure: worst_alternative
      alternatives: [CLAUDE.md, AGENTS.md, llms.txt]
      files: [.agent/bootstrap.json]
      # A BAND, NOT A POINT. Three of these four files are GENERATED, so their size moves a little
      # whenever a declaration does; a ceiling set to the exact measurement would fire on correct
      # work every time, and the reaction to a noisy guard is never to fix it — it is to silence it.
      # The band refuses a RISE past the ceiling and equally refuses slack accumulating beneath it,
      # so the declaration cannot quietly become a ceiling nobody is near.
      budget_bytes: 7424
      slack_bytes: 512
      # A RISE NAMES WHAT EARNED IT — the same escape the install footprint carries, made
      # consistent here rather than shaved around. ~800 bytes were PAID first, by removing the
      # where-to-file table and compressing every rule; the remainder buys the ten failure shapes,
      # which are the only content in this file that changes what an agent does before it starts.
      raised_for: the agent_failure_modes summary — ten shapes actually committed in this tree and
        what each one looks like from outside. A reader who has seen the shape recognises it one
        sighting earlier than a reader who has only seen the fix
    human:
      why: the landing page and the two indexes a person opens before anything else
      measure: sum
      files: [README.md, MODEL.md, docs/INDEX.md]
      raised_for: 'the measured-benefits table. It had only ever FALLEN before this — 38435 ->
        36679 -> 32106 — and ~1,370 bytes were paid structurally FIRST: the language roster moved
        to languages/ATLAS.md and the topics roster to ABOUT.md, both being rosters that grow by a
        row, and two sections were compressed. The remainder buys the one thing a reader deciding
        whether to use this actually needs — what it measurably buys them, each figure naming the
        instrument that produced it and the contract version it was measured at, so the line can
        be re-run rather than believed'
      budget_bytes: 32768
      slack_bytes: 2048

verification_policy:
  severity:
    blocker: merge_blocking
    error: merge_blocking
    warning: non_blocking_but_actionable
    info: report_only
    baseline: tracked_only_existing_findings
  baseline_rule: new_findings_must_not_be_absorbed_into_baseline
  independent_verifier: native_toolchain_or_github_security
  profiles:
    source_change:
      required: [formatter, compiler_or_typechecker, unit_tests]
    api_change:
      required: [schema_validation, contract_tests, endpoint_tests, compatibility_check]
    dependency_change:
      required: [dependency_graph, dependency_review, vulnerability_scan, tests]
    security_sensitive:
      required: [codeql, secret_scan, static_analysis, tests]
    concurrency_change:
      required: [race_detection, cancellation_tests, timeout_tests, stress_test]
    performance_change:
      required: [benchmark, profiler, representative_workload, regression_threshold]
    retrieval_change:
      required: [chunk_boundary_test, freshness_stamp, hybrid_recall_check, citation_check]
    quantum_change:
      required: [simulator_run, shot_count_declared, noise_model_declared, resource_estimate,
                 classical_baseline_comparison]
  tiers:
    fast: [formatter, compiler_or_typechecker, focused_tests]
    standard: [fast, static_analysis, applicable_security_and_dependency_checks]
    deep: [standard, property_or_fuzz, mutation_if_mature, performance_if_relevant]
    release: [deep, integration_tests, artifact_verification, supply_chain_verification]

# FUNCTIONALITY FIRST — THE ORDER A FEATURE IS BUILT IN, DECLARED SO IT CAN BE ARGUED WITH.
# The failure it prevents: a presentation layer built against an interface that does not exist yet,
# which then dictates the schema underneath it. Each step names the gate class that judges it, so
# the order is not advice — it is the sequence in which this repository's own gates apply.
build_order:
  - step: schema_and_types          # migrations, DDL, typed attributes, indexes, units
    gate: api_change
  - step: state_machine             # the transitions, as pure functions with no I/O
    gate: source_change
  - step: integration_tests         # the transitions against a real store, including the edges
    gate: source_change
  - step: api_contract              # the schema exposed, with limits, timeouts and idempotency
    gate: api_change
  - step: presentation              # last, and a plain CLI must already do everything it can do
    gate: source_change
build_order_rule: a step may not begin until the step above it has passed its gate

task_profiles:
  default: [native, focused_context, focused_verify]
  implementation: [native, semantic_context, tests, diff_review]
  debugging: [native_debugger, focused_repro, regression_test, diff_review]
  endpoint: [native_http, schema_contract, integration_test, browser_if_needed]
  database: [native_db, read_only_dbhub, migration_test, plan_review]
  security: [native_security, codeql, semgrep, secret_scan, dependency_review]
  reliability: [timeouts, cancellation, health_readiness, telemetry, smoke_test]
  mutation: [existing_tests, mutation_tool_if_mature, bounded_mutants, regression_gate]
  performance: [profiler, benchmark, representative_workload, regression_threshold]
  polyglot: [schema_or_abi, native_tools_both_sides, boundary_test, e2e_if_needed]
  research: [primary_sources, isolated_context, prototype, measurement]
  # RETRIEVAL IS A TASK WITH ITS OWN FAILURES AND NO SOURCE-CHANGE GATE NOTICES ONE. A chunk that
  # ends mid-function, an index invalidated by mtime and an answer with no citation all pass a
  # formatter, a typechecker and a unit suite.
  retrieval: [ast_chunking, hybrid_search, checksum_invalidation, sidecar_metadata, citations]
  autonomous_agent: [narrow_tools, sandbox, budget, approval, audit]
  # QUANTUM IS A DOMAIN WITH ITS OWN DECLARATIONS, NOT ANOTHER LANGUAGE CONVENTION. A quantum
  # result with no shot count, no noise model and no classical baseline is not a measurement, and
  # nothing in a normal source-change gate would notice that. The profile names what must be
  # DECLARED before the run; quantum_change below is what must be produced by it.
  quantum: [native_simulator, shots_declared, noise_model_declared, qubit_budget_declared,
            resource_estimate, classical_baseline]

# THREE CLASSES OF DATA, AND THE FAILURE EACH ONE HAS THAT THE OTHERS DO NOT.
#
# A system that treats all three the same reaches for the mechanism it knows: everything becomes
# a document, gets embedded, and a question with an exact answer is served by similarity. The
# measured cost of that is not a wrong answer, it is a PLAUSIBLE one — a row that exists is
# paraphrased, a row that does not is invented, and neither is distinguishable from the other in
# the output. Each class below names how it is retrieved, what must be recorded beside it, and the
# way it fails, so the choice is made once here rather than re-guessed per question.
data_classes:
  structured:
    examples: [relational tables, key-value stores, columnar files, time series]
    retrieval: a deterministic query the agent WRITES and the system RUNS — never a fact recalled
    chunking: none; a row is already a unit and splitting one destroys its identity
    required_metadata: [schema_version, primary_key, units]
    gate: schema_validation
    fails_by: a query that returns zero rows and reads exactly like an empty result — ABSENT IS
      NOT ZERO, and the two are the same output unless the query prints its own row count
  semi_structured:
    examples: [json documents, yaml declarations, front matter, log lines, api payloads]
    retrieval: a path expression or a schema-validated extractor, with the schema named
    chunking: by declared node, never by length — a split object is not a smaller object
    required_metadata: [schema_id, source, extracted_at_contract]
    fails_by: a field that moved rather than vanished, so the extractor reads a default and every
      downstream number is confidently wrong
  unstructured:
    examples: [prose, raw source files, pdf and office documents, transcripts, issue threads]
    retrieval: hybrid — dense similarity for meaning AND sparse keyword for exact symbols
    chunking: ast_boundaries
    required_metadata: [path, checksum, symbols, route, last_verified_contract]
    fails_by: a chunk that ends mid-function, which retrieves as a confident fragment of something
      that was never true on its own

# WHERE A FACT LIVES, AND WHY IT MAY NOT LIVE ANYWHERE ELSE.
#
# The three layers are not a ranking, they are a decision about VOLATILITY. Putting a volatile fact
# in the layer that cannot be updated is the defect, and its signature is that nothing in the
# output looks wrong: a stale weight and a fresh one produce the same confident sentence. Each
# layer therefore declares what it must NEVER hold, and who closes the gap when it does.
knowledge_layers:
  parametric:
    holds: [behaviour, output shape, domain vocabulary, refusal style, formatting conventions]
    never_holds: anything that changes without a release — a version, a price, a file, a roster,
      a schedule, a threshold
    staleness: silent, and undetectable from the output alone
    closed_by: the retrieved layer, which carries a freshness stamp the parametric layer cannot
  retrieved:
    holds: [source files, live declarations, records, documentation, measurements]
    never_holds: the rules for HOW to answer — a retrieved instruction is an injection surface
    staleness: visible, because every record carries its checksum and the contract it was read at
    closed_by: the invalidation rule below, and a citation the reader can open
  in_context:
    holds: [the task, the plan, the diff, the last few tool results]
    never_holds: durable knowledge; a fact that mattered twice belongs in a file, not in a window
    staleness: bounded by the session, which is why it is the wrong place for anything reusable
    closed_by: the entry paths and the budgets in context_policy

# HOW SOMETHING IS INDEXED, STATED ONCE SO IT IS NOT RE-DECIDED PER INGESTION.
retrieval_policy:
  chunking: ast_boundaries
  # A FIXED CHARACTER COUNT IS THE DEFAULT AND IT IS THE DEFECT. It splits a function in half and
  # both halves retrieve well, because similarity does not know the unit was broken.
  never_chunk_by: [fixed_character_count, fixed_token_count, page_boundary]
  search: [dense_similarity, sparse_keyword]
  search_rule: hybrid, because a dense-only index cannot find an exact symbol and a keyword-only
    index cannot find a paraphrase — and the question that needs each one looks the same
  invalidation: content_checksum
  # NEVER A MODIFICATION TIME. A checkout, a clone and a format-on-save all move mtime without
  # changing a byte, and a restored file changes bytes without moving it far enough to notice.
  never_invalidate_by: [modification_time, file_size, cache_ttl_alone]
  sidecar_fields: [path, checksum, symbols, route, class, last_verified_contract]
  citation_rule: every retrieved claim carries the path and the checksum it was read at, or it is
    reported as unsourced rather than blended into the answer
  # THE NAMED CLOSER FOR THE GAP `atlasindex` DECLARES ABOUT ITSELF. Its dense arm is TF-IDF and
  # says so: it matches VOCABULARY OVERLAP, so a paraphrase sharing no terms is missed. The closer
  # is not "a bigger model" — it is a representation that carries STRUCTURE, because two functions
  # can share no tokens and be the same control flow, which is the same insight `astshape.py`
  # already enforces by canonical AST. A scorer swapped in here inherits the boundary, citation
  # and invalidation rules unchanged; only the similarity changes.
  semantic_closer: a structural code representation — syntax tree and control flow, not token
    overlap — supplied by the consumer and swapped in for the cosine arm
  # AND IT IS EVALUATED RATHER THAN ADOPTED. A retrieval change is scored on a held-out set with
  # its recall reported, exactly as the retrieval_change gate requires; a scorer that is believed
  # because it is newer is the thing `overfitting` warns about, arriving as an upgrade.
  evaluation: recall at a declared k over a held-out query set, reported beside the arm it replaced
    — never adopted on the strength of being newer

# TWO WORDS THAT BELONG TOGETHER, AND THE REASON THE PAIR IS UNEQUAL.
#
# Almost every rule in this repository is one of these underneath. Naming the pair makes the rule
# portable: the same asymmetry that decides where a guard goes also decides how a budget is set
# and what a refusal costs. `atlas.py why <id>` prints one; the roster is checked, so a pair
# cannot be added without saying where it is applied.
asymmetries:
  prevention_detection:
    pair: [cheap_to_prevent, expensive_to_detect]
    why: a defect made unrepresentable costs one design decision; the same defect detected costs a
      guard, its tests, its exemptions and every future reader who has to understand it
    applied_at: the duplicate-key loader, the parse-first check, and never_writable
  silence_noise:
    pair: [silent_failure, noisy_failure]
    why: a noisy failure is bounded by the time it takes to read; a silent one is unbounded,
      because nothing marks when it began
    applied_at: every roster that prints its count, and every gate that prints its coverage
  write_read:
    pair: [written_once, read_forever]
    why: the cost of a declaration is paid by one author; the cost of prose that restates it is
      paid by every reader, on every session, forever
    applied_at: the generated blocks, the entry-path ratchet, and the instrument roster
  loss_upside:
    pair: [bounded_loss, unbounded_upside]
    why: a search that can only lose what it declared in advance may run as long as it likes; one
      that cannot is a position, not an experiment
    applied_at: the task-contract budgets, the audit byte cap, and the refusal to auto-execute
  sensitivity_specificity:
    pair: [proves_it_bites, proves_it_bites_nothing_else]
    why: a mutation test answers the first and says nothing about the second, and only the second
      decides whether a guard survives contact with a real tree
    applied_at: the clean-sweep requirement beside every planted defect
  declaration_rendering:
    pair: [declared_identity, rendered_form]
    why: a rendering changes without notice and the break is silent; an identity is what a
      consumer may branch on
    applied_at: the route record, the gate ids, and the frozen output schema

# HOW A PARSER FAILS QUIETLY — EACH SHAPE, THE DEFECT IT PRODUCES, AND WHAT REFUSES IT HERE.
#
# Every rule below was earned by a break in this tree, not collected from advice. They share one
# property: the failure is INVISIBLE at the point it happens. A file that does not parse produces
# no output; a file that parses WRONG produces confident output. The second is worse, and most of
# these are the second.
#
# `atlas.py check` refuses a rule with no enforcer, so this table cannot become a reading list.
parser_discipline:
  comments_are_not_a_regex:
    defect: stripping `//` with a regex deletes the rest of any line containing the delimiter,
      including the one inside a URL. The friendly outcome is a parse error; the unfriendly one is
      a file that still parses after a value was silently truncated
    measured: a task configuration in this repository, on the first attempt to read it
    enforced_by: atlascore.read_jsonc, which tracks string state and consumes escapes whole
  every_tracked_artifact_parses:
    defect: a configuration file that does not parse is a capability that silently does nothing —
      it still looks present to whoever wrote it, and every document check passes over it
    measured: TWO host configs carried `\$` — not a valid JSON escape — so neither file loaded at
      all, and the tasks they declared had never run
    enforced_by: atlas.check, which parses every tracked Python and every tracked JSON, first,
      because nothing below that check means anything otherwise
  a_duplicate_key_is_a_collision:
    defect: a mapping loader keeps the LAST duplicate and reports nothing, so a route, an
      instrument or a role answers with something nobody chose and the diff reads as an addition
    measured: a second `.fs` key moved every F# file to another pack
    enforced_by: atlascore.StrictLoader, which refuses a duplicate rather than resolving it
  refuse_rather_than_pick_a_winner:
    defect: a parser that resolves an ambiguous input is worse than one that errors, because the
      ambiguity leaves no trace and the wrong answer is indistinguishable from the right one
    enforced_by: packmanifest._check, which REFUSES a schema keyword it does not implement instead
      of skipping it — the validator is wrong loudly or not at all
  a_lenient_dialect_is_still_a_dialect:
    defect: JSONC permits comments and trailing commas that JSON does not, so a file an editor
      accepts fails every other reader, and the disagreement surfaces far from the edit
    enforced_by: atlascore.read_jsonc for reading, and the parse check for refusing what no reader
      would accept
  a_checker_never_crashes_on_what_another_checker_owns:
    defect: a guard that RAISES on malformed input takes the whole contract down and hides every
      other finding, including the one that would have named the malformed file. The crash reads
      as a broken harness rather than as a broken input
    measured: THREE sightings in one session — the import guard, the host guard, and the audit
      reader, each meeting the planted defect another rule was written to report
    enforced_by: 'each guard catching the parse error and continuing; `atlas.check` parses every
      tracked source and every tracked JSON FIRST, so the owner of that finding always reports it'
  a_mutation_that_did_not_mutate:
    defect: a string replace with no match returns the input unchanged and says nothing, so a test
      that plants a defect plants nothing and passes against a pristine file
    measured: three fixtures in this repository, each naming a literal that had since moved
    enforced_by: atlas_test.mutated, which refuses when the planted text is identical to the
      original, and fixtures derive their anchors instead of typing them

# STRICT ON THE OUTSIDE, REASONED ON THE INSIDE — AND WHICH IS WHICH IS DECLARED, NOT FELT.
#
# This repository was built almost entirely out of hard bounds, and hard bounds alone have one
# predictable failure: the wall that cannot move gets worked AROUND. It was worked around twice in
# the session that produced this block — a ratchet refused a genuine capability, and the cost was
# paid by deleting something real rather than by admitting the wall should move. The third time
# the honest answer was different, and it needed a name.
#
# The name is BOUNDED AUTONOMY: hard invariants on the perimeter, declared reasoning room inside
# it. The middle tier is the whole point. A system with only hard rules is brittle and gets
# bypassed; a system with none is a wild agent; a system that never says WHICH IS WHICH leaves
# every reader to guess, and they guess generously about their own change.
#
# THE TEST FOR WHICH TIER SOMETHING BELONGS IN: what does being wrong cost, and is it reversible?
# Irreversible or externally observable -> hard. Costly but recoverable, and visible in a diff ->
# bounded. Judged by its output rather than its path -> dynamic.
governance_tiers:
  hard:
    means: fails closed, no reasoning, no escape. There is no argument to have at the boundary
    test: being wrong is irreversible, or is observable by somebody outside this repository
    here: [the agent controls, never_writable, approval binding, the parse-first check, the
           duplicate-key loader, secret handling, the required status checks]
    on_breach: refuse, and say which control refused
  bounded:
    means: a declared envelope. Free to reason INSIDE it; moving the wall is allowed and must NAME
      what earned the move, in the declaration, where a reviewer meets it in the diff
    test: being wrong is costly and recoverable, and the move is visible to a reader
    here: [every ratchet — entry_paths, install_footprint, code_shape, example_coverage — the tool
           budget, the unpushed bound, and the gates a risk modifier adds]
    adds_rule: PROPORTIONALITY and REVERSIBILITY — an addition must resolve a case that was
      actually met, not one that was imagined, and must be removable without touching anything
      else. `raised_for` is where it says which
    cuts_rule: ZERO LOSS — a removal must preserve the declared output. What is cut is overhead;
      a contract is never cut to fit a budget, it is renegotiated in the open
    on_breach: allowed, named, and reviewed — an unnamed move is the breach, not the move itself
  dynamic:
    means: free, because what is checked is the OUTPUT contract rather than the path taken to it
    test: the result is judged by a gate, so the route to it carries no risk of its own
    here: [wording, the order of sections in a document, which instrument to run first, how a
           report is laid out, which of two equivalent implementations is chosen]
    on_breach: nothing to breach; the gates judge the result and the path is not a claim

# THE MISTAKES A CODING AGENT ACTUALLY MAKES HERE — EVERY ONE COMMITTED IN THIS REPOSITORY.
#
# Not a list of things that could go wrong. Each row below was done, by an agent, in this tree,
# and caught by something. They are collected because they REPEAT: the same shape arrives wearing
# a different file every time, and an agent that has read the shape recognises it one sighting
# earlier than one that has only read the fix.
#
# Every row names what REFUSES it now. A failure mode with no refusal is a warning, and a warning
# is a thing you read once — `atlas.py check` refuses a row that names none.
#
# The sightings count is the point. One is a bug; two is a missing rule and writing that rule is
# part of the fix; three means the evidence was there twice and nothing was done.
agent_failure_modes:
  a_count_typed_into_prose:
    shape: writing a number into a document instead of generating it or naming the instrument
    looks_like: an accurate sentence, on the day it is written
    sightings: 2
    prevented_by: the generated blocks, and a reviewer who asks where a number came from
  a_fixture_that_names_what_it_could_read:
    shape: a test anchoring on a literal — a version, a budget, a file list — that later moves
    looks_like: a passing test that planted nothing
    sightings: 3
    prevented_by: atlas_test.mutated, which refuses when the planted text equals the original
  a_guard_that_crashes_on_another_guards_input:
    shape: a checker raising on malformed input that a different checker exists to report
    looks_like: a broken harness, so the real finding is never reached
    sightings: 3
    prevented_by: parse-first in atlas.check, and each guard catching and continuing
  an_instrument_wrong_in_its_scope:
    shape: correct arithmetic over the wrong set — summing three conventions no runtime loads
      together, counting instruments no consumer installs
    looks_like: a precise number, which is why it is believed
    sightings: 2
    prevented_by: every instrument declaring what it does NOT measure, and a closer that disagrees
  a_blanket_rule_over_unlike_things:
    shape: one directive applied to a suffix or a directory whose members are not the same kind
    looks_like: a tidy one-line fix that over-corrects the other way
    sightings: 2
    prevented_by: classification per kind, and a measurement taken after the rule rather than before
  a_second_declaration_of_one_value:
    shape: the same fact written in two places, which agree until one is edited
    looks_like: nothing, until the stale copy is the one being read
    sightings: 2
    prevented_by: the version-site roster, the generated-file roster, and check refusing a
      declaration that exists twice
  a_local_green_read_as_a_verdict:
    shape: passing on this machine and reporting it as passing
    looks_like: a green ladder; the absent thing is absent HERE only
    sightings: 1
    prevented_by: continuous integration as the authority, packprobe for per-machine facts, and
      tool_claims, where every rung above `declared` must name the machine it was measured on
  a_cached_reading_read_as_a_measurement:
    shape: acting on a page or a status that is served from a cache rather than computed now
    looks_like: a failed change, so a working fix is re-done and distrusted
    sightings: 2
    prevented_by: staleness_discipline, which names the cache and the authority for each reading
  a_shape_written_twice:
    shape: two functions with different names and identical structure, each checking one roster
    looks_like: thorough coverage that disagrees once one copy is fixed
    sightings: 1
    prevented_by: astshape, which compares canonical ASTs with names and literals erased
  a_claim_made_before_it_was_verified:
    shape: reporting an outward-facing action — pushed, merged, landed — without reading it back
    looks_like: a finished task, to everyone but the person looking
    sightings: 1
    prevented_by: branch_policy/landed_states, which separates committed, pushed, merged and
      published, and branchstate.py, which reads them back rather than assuming them

# A READING SERVED FROM A CACHE IS NOT A MEASUREMENT OF NOW.
#
# Two of these bit in a single session, and both LOOKED like a failed change rather than a stale
# read: a merge state that reported CLEAN while the required checks were still running, and a
# language bar that showed the old number for minutes after the fix had already merged. In both
# cases the authoritative source was one call away and disagreed with the page.
#
# The rule is not "distrust caches" — it is that every external reading names WHICH cache serves
# it and WHAT defeats that cache, so a stale number is diagnosable instead of being re-fixed.
# `atlas.py check` refuses an entry that names no authority.
staleness_discipline:
  platform_language_bar:
    reading: what the forge reports a repository is written in
    cached_by: the repository page, recomputed asynchronously after a push to the default branch
    authority: the forge's languages API, which is computed on request rather than served from the
      page cache
    measured: the page read 61% Markdown for several minutes after the correction had merged and
      the API already reported 0.5%
  merge_state:
    reading: whether a pull request can be merged
    cached_by: the application's own status cache, which can report CLEAN before the required
      checks on the newest commit have started
    authority: the check-runs for the HEAD COMMIT, by SHA — a status without a SHA beside it is
      about some commit, not about this one
    measured: a CLEAN reading on a commit whose required checks were all in_progress
  parsed_declaration:
    reading: the contract's own view of atlas.yaml and the manifests
    cached_by: an in-process memo, which makes a planted defect on disk invisible to the harness
      that is supposed to detect it
    authority: the cache-clearing call every mutation makes before re-running the check
    measured: a mutation test that edited a schema and passed against the bytes already held
  toolchain_presence:
    reading: whether a declared tool exists
    cached_by: nothing — and that is the point; absence is re-measured per machine rather than
      recorded, because a tool present on one host is a fact about that host
    authority: the pack probe, run where the question is being asked

# WHAT A PERSON OR AN AGENT SHOULD HAVE BEFORE THEY START — AND WHAT THEY SHOULD NOT INSTALL.
#
# The 35 packs answer "what does THIS file need". Nothing answered "what do I need at all", so the
# answer defaulted to whatever the last tutorial installed, and an environment accretes: every
# addition is obviously worth it on the day it is made, and nothing ever measures the sum.
#
# THE `never_by_default` LIST IS THE HALF THAT DOES THE WORK. A baseline that only says what to add
# is a shopping list, and a shopping list is how a workstation ends up with four linters that
# disagree and six servers holding credentials for a task nobody is doing.
#
# `atlas.py doctor` answers which of the required rows THIS machine has; `packprobe.py --mode
# smoke` answers the per-language ones. Nothing here is installed by anything in this repository.
developer_baseline:
  required:
    # Without these the atlas itself does not run, and `doctor` says so per row with what breaks.
    interpreter: {why: the harness is Python and declares its floor in pyproject}
    version_control: {why: the router reads the tracked tree, and every roster is derived from it}
  recommended:
    one_formatter_per_language:
      why: a second formatter is not more rigour, it is a diff that alternates between two authors
    a_language_server:
      why: it answers "where is this defined" without a grep that matches a comment
    a_debugger_you_have_actually_attached:
      why: a debugger nobody has attached is not in the environment, it is in the manifest
    a_terminal_multiplexer_or_worktrees:
      why: one mutable writer per worktree is the isolation rule; without it parallel work shares
        a tree and the loser is whoever pulled last
  never_by_default:
    a_second_linter: refuses nothing the first one allowed, and disagrees with it on style
    a_formatter_on_save_in_a_shared_repository: rewrites files nobody reviewed into every diff
    a_credential_helper_that_caches_without_expiry: a cache miss is not a revocation
    an_always_on_agent_with_write_access: the budget and approval controls exist because
      unattended write access has no natural stopping point
  mcp:
    # AN MCP SERVER IS TASK-SCOPED OR IT IS AMBIENT ACCESS. The profiles in
    # integrations/MCP-PROFILES.md name which servers a TASK justifies; this says what to enable
    # at all, and the rule that decides. A server enabled for a task that ended is a standing
    # capability nobody chose.
    rule: enable the profile the task names, and nothing else; disable it when the task ends
    cost_nobody_counts: every enabled server's tool descriptions are paid on EVERY request, not on
      the request that uses them — an unused server is a subscription, not an option
    review_trigger: before adding one, ask what already answers the question and what the server
      can reach that the task does not need
# SIX CLAIMS, NOT ONE — AND A MANIFEST ENTRY MAKES ONLY THE FIRST.
#
# A tool name written in a manifest is read as saying the tool exists, runs here, is new enough,
# was actually used, passed, and decides the role. Those are six claims with six different owners,
# and collapsing them is exactly how a pack reads as exercised when nothing has ever run it. The
# ladder is declared once; a pack may CLAIM a rung in its own `verification` block, and the rungs
# above `declared` each name the environment they were measured in — because "it ran" is a fact
# about a machine, not about a pack.
#
# THE RUNGS ARE ORDERED. Claiming a rung asserts every rung below it, so a pack cannot claim it
# passed without claiming it was available.
tool_claims:
  declared:
    means: a name is written in a manifest and conforms to the entry grammar
    owner: the pack author
    proven_by: atlas.py check
  available:
    means: PATH resolves it on the machine asking the question
    owner: the machine, never the pack — absence here is a fact about the host
    proven_by: packprobe.py --mode smoke
  version_compatible:
    means: it reports a version at or above the floor the pack declares
    owner: the machine
    proven_by: packprobe.py --mode version
  executed:
    means: it was run against real code in this repository, not merely resolved
    owner: continuous integration, or a codespace carrying that one toolchain
    proven_by: exrun.py for a route that ships an example
  passed:
    means: that run exited zero
    owner: continuous integration
    proven_by: the workflow's exit code, never a line of its output
  authoritative:
    means: its verdict DECIDES the role for this pack, so a gate resolves to it
    owner: the pack's own declaration
    proven_by: gate_tools resolving the role to this entry

# WHEN TO REACH FOR WHICH PACK — BECAUSE 35 PACKS IS A CATALOGUE UNTIL SOMETHING NARROWS IT.
#
# A roster of languages answers "what is supported" and never "what should I use", so the default
# wins: whichever language the author already knows, for every problem. Each axis below is a NEED,
# the packs that answer it, and — the half that does the work — when NOT to reach for that axis at
# all, because most of these are the wrong answer most of the time.
#
# `atlas.py pick` prints them. EVERY route must appear in at least one axis: a pack reachable only
# by already knowing its name is a pack nobody selects, and `check` refuses one.
#
# MATURITY IS STATED, NOT IMPLIED BY PRESENCE. A pack exists here because its toolchain is
# declarable, never because it is recommended for production — and a reader who cannot tell those
# apart will read a roster as an endorsement.
language_selection:
  default_workhorse:
    need: the ordinary case — a service, a script, a tool, a test suite
    packs: [python, typescript, go, rust]
    when_not: never reach past this row without a reason you can state in one sentence
    maturity: production
  manual_memory:
    need: no garbage collector, explicit lifetime, predictable latency
    packs: [rust, c, cpp, zig, nim, odin, hare, v]
    when_not: a managed runtime already meets the latency budget — measure before paying for this
    maturity: rust/c/cpp production; zig, nim, odin, hare and v are declarable, not recommended
  fearless_concurrency:
    need: many things in flight, and a failure model that is not "hope"
    packs: [go, rust, elixir, gleam, chapel]
    when_not: the work is IO-bound and a single process with async already saturates the link
    maturity: go, rust and elixir production; gleam and chapel declarable
  data_parallel_gpu:
    need: an array-shaped problem large enough that the transfer cost is worth paying
    packs: [cuda, mojo, futhark, chapel, julia]
    when_not: the array fits in cache, or the kernel would spend its life waiting on memory
    maturity: cuda and julia production; mojo, futhark and chapel declarable
  array_notation:
    need: whole-array thinking, where a loop is the wrong unit of expression
    packs: [bqn, uiua, julia, r]
    when_not: the reader is not already fluent — density is a cost paid by everyone after you
    maturity: julia and r production; bqn and uiua declarable
  typed_functional:
    need: making an illegal state unrepresentable, rather than validating it later
    packs: [haskell, ocaml, fsharp, scala, elixir, gleam, roc]
    when_not: the domain has no invariants worth encoding; a type system is not free
    maturity: haskell, ocaml, fsharp and scala production; roc declarable
  proof_and_verification:
    need: a property PROVED, not tested — where being wrong is not recoverable
    packs: [lean4, quantum/silq]
    when_not: a property test over a few thousand cases would settle it; proof is the expensive tool
    maturity: declarable; reach for it when the cost of being wrong exceeds the cost of proving
  quantum:
    need: a circuit, a simulator, a shot count and a classical baseline to beat
    packs: [quantum/qsharp, quantum/silq]
    when_not: almost always — a quantum result with no classical baseline is not a result
    maturity: research
  portable_sandboxed:
    need: untrusted or portable execution with a declared import surface
    packs: [webassembly, rust, typescript]
    when_not: the code is trusted and local; a sandbox you do not need is a boundary to maintain
    maturity: production
  apple_platform:
    need: a first-class application on Apple's platforms
    packs: [swift]
    when_not: the surface is a web view; then it is a typescript problem wearing a native shell
    maturity: production
  data_and_query:
    need: the data is relational and the question has an exact answer
    packs: [sql, python, r]
    when_not: the question is about meaning rather than rows — see data_classes/unstructured
    maturity: production
  shell_and_glue:
    need: joining programs that already exist, on one machine, with exit codes
    packs: [bash]
    when_not: control flow exceeds a screen, or a value needs a type — reach for the workhorse row
    maturity: production
  stack_and_embedded:
    need: a tiny interpreter, a bootloader, or a machine with no room for a runtime
    packs: [forth, c, zig]
    when_not: the target has megabytes; the constraint has to be real to be worth the cost
    maturity: c production; forth and zig declarable
  systems_successors:
    need: evaluating a language positioned to replace one already in use here
    packs: [carbon, mojo, roc, v, hare, odin, gleam, nim]
    when_not: shipping. This axis is for EVALUATION — a successor language in production is a bet
      on its toolchain surviving, and that is a separate decision from liking the language
    maturity: evaluation only

# ONE IMPLEMENTATION, EVERY LANGUAGE. `atlas do <file> <action>` resolves an action through the
# pack the file routes to, so `format` runs that pack's declared formatter and nothing here knows
# which one that is. Change a pack's test runner and the action follows it; add a pack and it
# inherits all of these for free. This is what makes 35 manifests usable rather than descriptive —
# before it they were read BY the contract and by nobody else.
#
# `takes_file` is the whole subtlety: a formatter acts on one file, a test runner acts on a project,
# and appending a path to the second is how a green suite becomes a run of nothing.
pack_actions:
  format:  {role: formatter,           takes_file: true}
  check:   {role: compiler_or_runtime, takes_file: true}
  lsp:     {role: lsp,                 takes_file: false}
  test:    {role: test,                takes_file: false}
  scan:    {role: security,            takes_file: true}
  debug:   {role: debugger,            takes_file: true}
  profile: {role: profiler,            takes_file: true}
  bench:   {role: benchmark,           takes_file: false}
  fuzz:    {role: fuzz,                takes_file: false}
  mutate:  {role: mutation,            takes_file: false}
  deps:    {role: package_manager,     takes_file: false}

# THE STEPS A PROCESS MAY BE MADE OF. A free-text sequence is a sentence with bullet points: two
# processes would spell the same step differently and no instrument could tell they matched.
process_steps:
  route: resolve the artifact to a pack, a card and a manifest before reading anything else
  scope: declare the paths and commands this task may touch, and refuse the rest
  retrieve: load what the route named, plus the callers and tests of the symbol being changed
  plan: pick the task profile and change class, and resolve the gates they require
  edit: the smallest change that satisfies the objective, and no refactor beside it
  fast_verify: the cheapest gate that can fail, before the expensive one — localise, then prove
  full_verify: every gate the change class requires, judged on the exit code
  diff_audit: compare the diff against the paths the plan declared, before claiming anything
  accept: the acceptance record, INCLUDING the gates that did not run and why
  record: the outcome and the audit stream that can be recomputed
  escalate: stop, name the missing dependency or the approval needed, and do not proceed

# A PROCESS IS THE ONE THING A CONSUMER WANTS AND THE ONE THING THIS TREE ONLY EVER IMPLIED.
# `task_profiles` says which tools, `verification_policy` says which gates, `build_order` says in
# what order a feature is built, `tool_profiles` says what may be activated — four rosters a
# reader had to join by hand, from prose, every single time. A consuming repository therefore
# depended on a PARAGRAPH, which is re-worded without notice, instead of on an identifier.
#
# Each process below joins them once under an id. `atlas process <id> --json` is the external
# reference; the generated documents are views of this, never a second definition.
#
# STOPPING CONDITIONS ARE PART OF THE PROCESS, NOT ADVICE BESIDE IT. A process with no declared
# stop is one that expands until something else notices, which is the failure the agent controls
# were built for — so `atlas.py check` refuses a process that declares none.
processes:
  implementation:
    task_profile: implementation
    change_class: source_change
    sequence: [route, scope, retrieve, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [diff, gate_results, audit_stream]
    stop_when: [gate_refused, scope_expanded, budget_exhausted]
    escalate_when: [plan_drift, approval_required]
  debugging:
    task_profile: debugging
    change_class: source_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, diff_audit, record]
    artifacts: [reproduction, regression_test, diff, gate_results]
    stop_when: [reproduction_not_obtained, gate_refused, budget_exhausted]
    escalate_when: [root_cause_outside_scope]
  endpoint:
    task_profile: endpoint
    change_class: api_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [schema, contract_test, integration_test, gate_results]
    stop_when: [schema_unversioned, gate_refused, scope_expanded]
    escalate_when: [breaking_change_detected, approval_required]
  security:
    task_profile: security
    change_class: security_sensitive
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [finding_list, gate_results, dependency_delta]
    stop_when: [secret_detected, gate_refused]
    escalate_when: [approval_required, production_access_needed]
  dependency_change:
    task_profile: default
    change_class: dependency_change
    sequence: [route, scope, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [lockfile_delta, dependency_graph, gate_results]
    stop_when: [lock_outside_declared_range, gate_refused]
    escalate_when: [approval_required]
  performance:
    task_profile: performance
    change_class: performance_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, accept, record]
    artifacts: [baseline, benchmark_result, profile, gate_results]
    stop_when: [workload_not_representative, regression_threshold_crossed]
    escalate_when: [measurement_not_reproducible]
  polyglot:
    task_profile: polyglot
    change_class: api_change
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [schema_or_abi, boundary_test, gate_results]
    stop_when: [boundary_untested, gate_refused]
    escalate_when: [both_sides_need_changing]
  autonomous_agent:
    task_profile: autonomous_agent
    change_class: source_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record, escalate]
    artifacts: [task_contract, audit_stream, gate_results, environment_fingerprint]
    stop_when: [budget_exhausted, scope_expanded, policy_denied, audit_chain_broken]
    escalate_when: [approval_required, plan_drift]

tool_profiles:
  core-code: [native, github, serena_when_supported]
  docs: [native_docs, context7_when_needed]
  browser: [native_http, playwright]
  database: [native_db, dbhub_read_only]
  security: [native_security, codeql, semgrep, github_secret_controls, dependency_review]
  polyglot: [core-code, schema_abi, boundary_tests]

# THE AUTONOMOUS PROFILE, AS CONTROLS SOMETHING ENFORCES RATHER THAN WORDS AN AGENT READS.
#
# `task_profiles/autonomous_agent` has named five controls since 2.0.0 — narrow_tools, sandbox,
# budget, approval, audit — and until 2.25.0 not one of them was enforced by anything in this tree.
# An agent that simply did not read CLAUDE.md was subject to none of them. That is the gap this
# block closes, and it is the same gap three other rosters here already close: a DECLARED control
# and an ENFORCED control look identical from outside, and only the second survives being ignored.
#
# Every entry below names the FUNCTION that decides it. `atlas.py check` refuses a control whose
# enforcer does not resolve to a callable, exactly as it refuses an invariant with no owner and an
# instrument with no closer — so a control cannot be added here and left unwired.
#
# WHAT THIS IS NOT. A Python runner is not a security boundary, and saying so is not a disclaimer:
# it is the reason `sandbox_requirements` is addressed to the HOST and says so per row. The runner
# refuses what it can see. A sandbox refuses what it cannot.
agent_policy:
  schema: tools/agent-task.schema.json
  reference_contract: tools/agent-task.example.json
  controls:
    narrow_tools:
      enforced_by: agentpolicy.command_verdict
      refuses: a command outside the contract's allowed_commands, or matching a denied_commands
        pattern whatever the contract allows
    sandbox:
      enforced_by: agentpolicy.path_verdict
      refuses: a read or write outside allowed_paths, inside forbidden_paths, or escaping the
        repository root by traversal or symlink
    budget:
      enforced_by: agentpolicy.budget_verdict
      refuses: the call that would cross a declared budget, BEFORE it runs — a budget checked
        afterwards is a report, not a control
    approval:
      enforced_by: agentpolicy.approval_verdict
      refuses: a high-impact action whose token is absent, expired, or bound to a different
        contract, base commit, action or diff
    audit:
      enforced_by: agentaudit.append
      refuses: nothing at write time, because it RECORDS; the chain it writes is what
        `agentaudit.py verify` refuses when the hashes no longer recompute

  # WHAT A CONTRACT MAY NOT RAISE. A contract is written by the same agent these controls bound,
  # so a budget it declares for itself is a preference. These are the ceilings; a contract may
  # declare less and never more, and `agentpolicy.budget_verdict` reads the lower of the two.
  default_budgets:
    tool_calls: 40
    wall_clock_seconds: 900
    files_changed: 20
    lines_changed: 600
    retries: 3
    output_bytes: 1000000

  # REFUSED WHATEVER THE CONTRACT ALLOWS. Each pattern is searched against the quoted argv, and
  # each names WHY, because a deny list whose rows carry no reason is edited by whoever is blocked.
  # This is not the boundary — `allowed_commands` is. This is the floor under it.
  denied_commands:
    privilege_escalation:
      pattern: '^(sudo|doas|su)\b'
      why: a runner that can elevate has no budget, because everything below it can be rewritten
    piped_remote_code:
      pattern: '\b(curl|wget)\b[^|]*\|\s*(sh|bash|zsh|python3?)\b'
      why: fetching and executing in one step leaves nothing for a reviewer or an audit to name
    history_rewrite:
      pattern: '^git\s+(push\s+(-f|--force)|reset\s+--hard|clean\s+-[a-zA-Z]*f|filter-branch|update-ref\s+-d)\b'
      why: the repository is the evidence; an agent that can rewrite it can hide the change it made
    credential_read:
      pattern: '(\.ssh/|\.aws/|\.netrc|id_rsa|id_ed25519|\.claude-keys|/credentials\b)'
      why: a task that needs a credential asks for approval; a task that reads one is exfiltration
    recursive_delete:
      pattern: '\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r'
      why: the one command whose mistake cannot be reviewed afterwards
    audit_tampering:
      pattern: '\.agent/audit'
      why: an audit stream the subject can edit records what the subject chose to record

  # PATHS NO CONTRACT MAY ALLOW, WHATEVER IT DECLARES. Two shapes, both of which a contract
  # written by the agent it bounds would otherwise permit itself:
  #   - the policy that bounds the task, the runner that applies it, and the audit stream that
  #     records it. A task that can edit any of those is not bounded by them.
  #   - a GENERATED file. Editing one is a write to the output instead of the declaration, and the
  #     next `index --write` silently reverts it — which reads as sabotage and is a wrong-file
  #     write. The generated roster is NOT restated here; it is read from the generator, because a
  #     second copy of it would narrow the first time a generated file was added beside it.
  never_writable:
    - .agent/audit
    - tools/agent-task.schema.json
    - scripts/agentpolicy.py
    - scripts/agentaudit.py
    - scripts/agentrun.py

  # ADDRESSED TO THE HOST, NOT TO THE RUNNER, AND EACH ROW SAYS WHICH. `observed_by: host` means
  # this repository cannot prove it and does not claim to; the runner prints those rows as
  # UNOBSERVED rather than passing over them, so a task that ran outside a sandbox never reads as
  # one that ran inside it. `atlas.py check` refuses a row whose observer does not resolve.
  sandbox_requirements:
    filesystem:
      requirement: the repository writable, everything else read-only or absent
      observed_by: agentpolicy.path_verdict
    workspace_lifetime:
      requirement: an isolated temporary directory, removed when the task ends
      observed_by: agentrun.workspace_report
    home_directory:
      requirement: no access to the invoking user's home, ssh keys, or cloud configuration
      observed_by: host
      reference: config/agent-sandbox.json
    network:
      requirement: default deny, with an explicit per-task allowlist
      observed_by: host
      reference: config/agent-sandbox.json
    identity:
      requirement: a non-root user holding no ambient cloud or registry credentials
      observed_by: host
      reference: config/agent-sandbox.json
    resources:
      requirement: bounded cpu, memory and process count, killed by the host rather than asked
      observed_by: host
      reference: config/agent-sandbox.json

  # AN APPROVAL IS BOUND TO WHAT WAS APPROVED, OR IT IS A HABIT. A generic "yes, proceed" survives
  # the diff growing, the base commit moving and the action changing underneath it — which is the
  # failure, not an edge case. Each binding below is a field of the token; each invalidation is a
  # comparison `agentpolicy.approval_verdict` makes before the action runs.
  approval:
    required_for: [network_enablement, dependency_change, workflow_change, security_change,
                   production_access, push, merge, release]
    approver_roles: [owner, security]
    expires_after_seconds: 900
    binds_to: [contract_hash, repository, base_commit, action, diff_hash]
    invalidated_by: [expiry, base_commit_changed, diff_hash_changed, action_changed,
                     allowed_paths_changed]

  # AN AUDIT IS A CHAIN OR IT IS A LOG. A log the subject can append to can also be rewritten, and
  # a rewritten log is indistinguishable from an honest one. Each event carries the hash of the one
  # before it, so a removed or edited event breaks every hash after it and `agentaudit.py verify`
  # names the first break.
  audit:
    stream: .agent/audit
    # EVERY STORE CYCLES, AND THE BOUND IS IN BYTES. A count of events says nothing about a
    # stream whose events grow; the cap is refused at append time and the refusal is itself the
    # last event, so a truncated stream and a finished one are never the same file.
    max_stream_bytes: 4000000
    chain: sha256 over the previous event hash and this event's canonical body
    redaction: arguments and output are recorded as hashes and byte counts, never echoed — but the
      event kind, the exit code and the paths are recorded in full, because a log redacted past the
      point of establishing what happened is not an audit
    events: [task_created, plan_resolved, policy_denied, command_started, command_finished,
             file_changed, approval_presented, approval_refused, budget_exhausted, gate_result,
             scope_expanded, task_finished]

# A GATE IS A WORD UNTIL SOMETHING CAN RESOLVE IT TO A COMMAND.
#
# `verification_policy` names the gates a change class requires and the packs declare the tools,
# and nothing joined the two: a runner reading "unit_tests" had no way to learn what runs them
# here, so the gate was satisfied by an agent saying it was. Each gate below names the MANIFEST
# AUTHORITY ROLE that answers it, which makes the 35 tool manifests load-bearing rather than
# descriptive — change a pack's test runner and the gate resolves to the new one.
#
# `role: none` is a real answer and the more useful half of this table: a gate that no pack tool
# can run is a DECLARATION or a platform control, and saying which beats resolving it to the
# nearest command that would have printed a zero. Every `none` names what closes it, and
# `atlas.py check` refuses a gate with no entry and a `none` with no closer.
gate_tools:
  formatter: {role: formatter}
  compiler_or_typechecker: {role: compiler_or_runtime}
  unit_tests: {role: test}
  tests: {role: test}
  focused_tests: {role: test}
  schema_validation: {role: test}
  contract_tests: {role: test}
  endpoint_tests: {role: test}
  race_detection: {role: test}
  cancellation_tests: {role: test}
  timeout_tests: {role: test}
  stress_test: {role: test}
  static_analysis: {role: security}
  dependency_graph: {role: package_manager}
  vulnerability_scan: {role: package_manager}
  benchmark: {role: benchmark}
  profiler: {role: profiler}
  property_or_fuzz: {role: fuzz}
  mutation_if_mature: {role: mutation}
  simulator_run: {role: compiler_or_runtime}
  compatibility_check:
    role: none
    closed_by: no tool in one pack answers whether two versions of an API agree; the breaking and
      public_schema risk modifiers add consumer_impact_review, which is a person
  dependency_review:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  codeql:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  secret_scan:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  representative_workload:
    role: none
    closed_by: a DECLARATION about what the benchmark ran, not a command; the performance task
      profile requires it be named and a reviewer judges whether it is representative
  regression_threshold:
    role: none
    closed_by: a declared number the benchmark's own output is compared against
  shot_count_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  noise_model_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  resource_estimate:
    role: none
    closed_by: the simulator's own estimator, reported beside the run rather than gated on
  classical_baseline_comparison:
    role: none
    closed_by: a second run of the classical implementation, named in the quantum task profile
  artifact_verification:
    role: none
    closed_by: the release workflow's provenance step, which signs what it built
  supply_chain_verification:
    role: none
    closed_by: the platform's dependency and provenance controls, audited live
  integration_tests: {role: test}
  chunk_boundary_test: {role: test}
  hybrid_recall_check: {role: test}
  citation_check: {role: test}
  freshness_stamp:
    role: none
    closed_by: a declaration recorded beside the index — the checksum and the contract version each
      record was read at; a stamp produced at query time restates when the question was asked
  authorization_tests: {role: test}
  session_invalidation_test: {role: test}
  signature_verification_test: {role: test}
  replay_protection_test: {role: test}
  delivery_retry_test: {role: test}
  quota_accounting_test: {role: test}
  rotation_test: {role: test}
  revocation_path_test: {role: test}
  known_answer_tests: {role: test}
  forward_compatibility_test: {role: test}
  invariant_property_test: {role: fuzz}
  no_plaintext_at_rest_check: {role: security}
  allocation_profile: {role: profiler}
  load_test: {role: benchmark}
  performance_if_relevant:
    role: none
    closed_by: the performance_change gate, which is the class to pick when it IS relevant; a tier
      entry that is optional by name cannot be resolved to a command without deciding that question
  consumer_impact_review:
    role: none
    closed_by: a person who knows who calls this; no tool in the producing repository can see the
      consumers, which is the whole reason a breaking change needs one
  parameter_review:
    role: none
    closed_by: a reviewer against the primary specification for the algorithm in question
  lock_order_review:
    role: none
    closed_by: a reviewer; a deadlock a test did not reach is not a deadlock a linter finds
  side_channel_note:
    role: none
    closed_by: a written statement of what was and was not considered, read at review
  cache_behaviour_note:
    role: none
    closed_by: a written statement beside the benchmark, because the number alone hides the cause
  migration_path:
    role: none
    closed_by: a document the reviewer reads, naming the steps and the point of no return
  rollback_rehearsal:
    role: none
    closed_by: the rehearsal itself, against a real store, in the release tier — a rollback never
      exercised is a plan, not a control
  version_bump:
    role: none
    closed_by: the contract's own version-site check, which refuses a tree whose declared sites disagree
  deprecation_window:
    role: none
    closed_by: a declared period, stated at the point of deprecation rather than at removal
  deprecation_policy_check:
    role: none
    closed_by: the repository's declared policy for how long a surface survives after it is replaced
  generated_client_regeneration:
    role: none
    closed_by: the consuming repository's own build, which is where a stale generated client fails
  applicable_security_and_dependency_checks: {role: security}

# A CHANGE CLASS IS THE FLOOR, AND ON ITS OWN IT IS TOO COARSE. `api_change` gates an added
# optional field and a removed endpoint identically, so the gates that matter for the second are
# absent from the first and nobody notices — the class passed. A MODIFIER only ever ADDS gates, so
# the class remains the floor and a modifier cannot be used to get a cheaper run. `atlas.py check`
# refuses a modifier whose `applies_to` is not a declared change class.
risk_modifiers:
  additive_endpoint:
    applies_to: api_change
    adds: [deprecation_policy_check]
  breaking_endpoint:
    applies_to: api_change
    adds: [consumer_impact_review, migration_path, version_bump, deprecation_window]
  auth_boundary:
    applies_to: api_change
    adds: [authorization_tests, session_invalidation_test, codeql, secret_scan]
  webhook:
    applies_to: api_change
    adds: [signature_verification_test, replay_protection_test, delivery_retry_test]
  public_schema:
    applies_to: api_change
    adds: [consumer_impact_review, version_bump, generated_client_regeneration]
  rate_limit:
    applies_to: api_change
    adds: [load_test, quota_accounting_test]
  credential_handling:
    applies_to: security_sensitive
    adds: [rotation_test, no_plaintext_at_rest_check, revocation_path_test]
  cryptography:
    applies_to: security_sensitive
    adds: [known_answer_tests, parameter_review, side_channel_note]
  shared_mutable_state:
    applies_to: concurrency_change
    adds: [invariant_property_test, lock_order_review]
  hot_path:
    applies_to: performance_change
    adds: [allocation_profile, cache_behaviour_note]
  schema_migration:
    applies_to: dependency_change
    adds: [forward_compatibility_test, rollback_rehearsal]

# WHAT A NATIVE TOOL IS AUTHORITATIVE FOR — AND WHAT NO ENTRY IN A MANIFEST ANSWERS AT ALL.
# `native_language_tools_are_authoritative` is true, and it was read as more than it says: a
# compiler accepting a program proves the program is well formed, never that it is correct, and a
# green unit suite proves nothing about how the thing behaves in production. Collapsing those into
# one word per pack is how a passing gate becomes a claim nobody made. Every manifest role belongs
# to EXACTLY ONE class below, and the two classes with no role are the point of the table: they
# are declared empty, with a closer, rather than silently answered by the nearest tool.
authority_classes:
  syntax:
    roles: [formatter]
    closed_by: the formatter is the authority and there is nothing above it
  type:
    roles: [compiler_or_runtime, lsp]
    closed_by: a type that holds says nothing about the value flowing through it — behavior below
  behavior:
    roles: [test, fuzz, mutation, debugger]
    closed_by: tests answer for the cases written; property and mutation runs widen that, and the
      gap that remains is named per change class in verification_policy
  security:
    roles: [security]
    closed_by: a pack's scanner plus the repository-level gates in the security_sensitive profile
  performance:
    roles: [benchmark, profiler]
    closed_by: a benchmark answers for the workload it ran; the representative workload is named
      by the performance_change gate
  supply_chain:
    roles: [package_manager]
    closed_by: dependency review and vulnerability scanning in the dependency_change gate
  reference:
    roles: [docs, research]
    closed_by: primary documentation is the source; a summary of it is not
  boundary:
    roles: []
    closed_by: NOTHING IN ONE PACK — a boundary is a contract between two, so it is answered by the
      polyglot task profile's boundary test and by the schema or ABI both sides read
  operational:
    roles: []
    closed_by: NOTHING IN A MANIFEST — no declared tool proves production readiness; the running
      service's own telemetry, the reliability task profile and the release tier answer for it

branch_policy:
  # HOW MUCH UNPUSHED WORK IS TOO MUCH — BOUNDED BY WHAT GROWS, NOT BY HOW MANY BRANCHES HOLD IT.
  #
  # The question that produced this was "cap at four branches, or five, or six?" Measured at
  # 2.25.0 this tree had THREE branches and TWO worktrees, so every one of those caps was already
  # satisfied and none would ever have fired — while eight commits sat unpushed on one branch for
  # roughly three hours. A container count is not the quantity; commits and time are what is lost
  # when a worktree is destroyed, so those are what is bounded.
  #
  # THE NUMBERS COME FROM THAT SESSION. Eight commits means a cap of five fires ONCE, in the
  # middle, while acting on it is still cheap; a cap of three would have fired three times in the
  # same session, and a guard that fires three times an hour gets silenced. `branchstate.py`
  # reports it and never pushes — pushing is an outward-facing act, not a tidy-up.
  # "PUSHED" IS NOT ONE STATE, AND CONFLATING THEM COST REAL TIME IN ONE SESSION. A branch was
  # pushed and the change was reported as landed; the forge's landing page shows the DEFAULT
  # branch, so it showed the old content and the work read as lost. Then the merge happened and
  # the page still showed the old content, because the page is cached. Four distinct states, three
  # of which look identical from a terminal:
  landed_states:
    committed: the work is in local history and survives nothing but this disk
    pushed: a remote holds the branch — recoverable if the machine dies, and invisible on the
      landing page, which renders the default branch and not yours
    merged: the default branch contains it, which is the first state a reader can stumble onto
    published: the rendered page shows it, which lags the merge by a cache and is the ONLY state
      anybody outside actually observes
  # A PUSH REJECTED FOR A STALE REF IS A RACE, NEVER A REASON TO FORCE. Seen this session on a
  # backup remote: `cannot lock ref 'refs/heads/main': is at <a> but expected <b>` means another
  # writer advanced the remote between the fetch and the push. The commits a force would remove
  # are that writer's, and they are usually the ones nobody has a second copy of.
  push_conflict_rule:
    symptom: cannot lock ref, non-fast-forward, or a rejection naming two differing hashes
    cause: another writer advanced the remote after this one read it
    do: fetch, rebase onto the new remote head, re-run the gates, push once more
    never: force, or a lease on a branch whose other writer is an automation that will not notice
    escalate_after: one failed retry — a second race is two writers, which is a scheduling problem
      and not a git problem
  unpushed_bound:
    max_commits: 5
    max_age_hours: 2
    max_branches_with_unpushed: 3
    why: measured on a session that reached eight unpushed commits over three hours on one branch;
      a branch-count cap of four, five or six would have printed a clean pass over all of it
  default_base: main
  permanent_language_branches: false
  language_lane_pattern: 'lang/<language>/<topic>'
  topic_patterns:
    feature: 'feat/<topic>'
    fix: 'fix/<topic>'
    research: 'research/<topic>'
    security: 'security/<topic>'
  worktree_pattern: '../Code-Development-wt/<language>-<topic>'
  isolation_rule: one_mutable_writer_per_worktree

issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  debugging: [vscode, language_debugger, runtime_debugger, profiler]
  gpu: [cuda, mojo, futhark, chapel, julia]
  # ZERO-COPY AND KERNEL BYPASS are a real domain with real packs behind them, and they are a
  # ROUTING concern rather than anything this harness does: the harness is a Python contract and
  # will never move a packet. An issue about a data path that must not allocate belongs to the
  # manual-memory packs, whose own tools answer for it.
  zero_copy: [rust, c, cpp, zig, go]
  # ON-DEVICE INFERENCE is where quantisation lives — a model small enough for static memory is a
  # constraint on the language and the allocator, not on the model alone.
  on_device_inference: [c, cpp, rust, zig, mojo]
  security: [static_analysis, dependency_scan, secret_scan, codeql]
  polyglot: [schema, ownership, compatibility, integration_test]
  drift: [links, routes, versions, orphans, dependencies, environment]
  mcp: [github, serena, playwright, context7, dbhub, semgrep]
  routing: [atlas, extension, manifest, issue_labels, task_profile]
  branch: [worktree, language_lane, topic_branch, merge]
  endpoint: [schema, http, webhook, integration_test]
  database: [schema, migration, transaction, query_plan]
  mutation: [property_test, fuzz, mutation_test, regression]
  blob: [module_size, generated_artifact, binary_artifact, payload_size]

runtime_roles:
  # A HOST IS NOT A MODEL, and the difference decides where a runtime belongs. `model_routes` says
  # which MODEL answers a kind of work; these say what a RUNTIME is for. Zed is the second kind
  # and only the second kind: it is one panel in which several agents are reachable at once, each
  # over its own adapter, so it appears here and in no model route.
  zed: multi_agent_host
  vscode: interactive_ide_agent_host
  opencode: terminal_agent_workspace
  github_actions: authoritative_repository_verification
  cli: deterministic_local_harness
