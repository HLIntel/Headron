    closed_by: 'a host guard that reads every harness''s live configuration against the declared allowlist, mutation-tested with a planted undeclared surface and a planted MCP duplicate of a declared CLI, and clean on the real configuration'
  # HOST SHAPES (3.47.0), each decided by a function in scripts/hostshape.py (or the named harness function)
  # and run on the host (enforced locally). Grounding, read at intake: context cost and tool bloat —
  # arXiv:2307.03172, arXiv:2510.05381, arXiv:2505.03275; interrupted and concurrent agents — arXiv:2503.13657,
  # arXiv:2608.23740, arXiv:2608.13867; change without eval — arXiv:2005.04118, arXiv:2202.02976,
  # arXiv:2406.12928, arXiv:2607.28699; source versus derived — arXiv:1406.0905; blocking pop-ups and scoped
  # tools — arXiv:2411.02391, arXiv:2503.18666.
  a_fixed_context_that_grows_unmeasured:
    shape: 'the fixed context a harness loads before the first prompt — connectors, plugins, skill and tool descriptions — grows with every addition and nothing measures it, so a session starts most of the way to its window and every turn pays for it'
    looks_like: 'sessions that feel slower and compact sooner, with no change anyone can point at'
    tell: 'the first-turn input token count, read from a fresh headless session, is a large fraction of the window; no record says what it was last week or what it may be'
    sightings: 1
    prevented_by: 'a declared per-harness first-turn budget that only ratchets down, measured by a scheduled headless probe; `hostshape.py baseline <record>` fails over budget, on a stale or missing reading, and on a budget raised without a reason (enforced locally)'
    enforced_by: [hostshape.baseline_errors, schedtargets_test.host_shape_cases]
  a_blocking_native_dialog_hangs_the_automation:
    shape: 'an automated click opens a native confirm or alert; the page''s script thread blocks on it, the automation call times out, and a blind retry queues a second hang behind the first while the tab stays frozen'
