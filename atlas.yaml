# A READING SERVED FROM A CACHE IS NOT A MEASUREMENT OF NOW.
#
# Two of these bit in a single session, and both LOOKED like a failed change rather than a stale
# read: a merge state that reported CLEAN while the required checks were still running, and a
# language bar that showed the old number for minutes after the fix had already merged. In both
# cases the authoritative source was one call away and disagreed with the page.
#
# The rule is not "distrust caches" — it is that every external reading names WHICH cache serves
# it and WHAT defeats that cache, so a stale number is diagnosable instead of being re-fixed.
# `atlas.py check` refuses an entry that names no authority.
staleness_discipline:
  platform_language_bar:
    reading: what the forge reports a repository is written in
    cached_by: the repository page, recomputed asynchronously after a push to the default branch
    authority: the forge's languages API, which is computed on request rather than served from the
      page cache
    measured: the page read 61% Markdown for several minutes after the correction had merged and
      the API already reported 0.5%
  merge_state:
    reading: whether a pull request can be merged
    cached_by: the application's own status cache, which can report CLEAN before the required
      checks on the newest commit have started
    authority: the check-runs for the HEAD COMMIT, by SHA — a status without a SHA beside it is
      about some commit, not about this one
    measured: a CLEAN reading on a commit whose required checks were all in_progress
  parsed_declaration:
    reading: the contract's own view of atlas.yaml and the manifests
    cached_by: an in-process memo, which makes a planted defect on disk invisible to the harness
      that is supposed to detect it
    authority: the cache-clearing call every mutation makes before re-running the check
    measured: a mutation test that edited a schema and passed against the bytes already held
  toolchain_presence:
    reading: whether a declared tool exists
    cached_by: nothing — and that is the point; absence is re-measured per machine rather than
      recorded, because a tool present on one host is a fact about that host
    authority: the pack probe, run where the question is being asked

# WHAT A PERSON OR AN AGENT SHOULD HAVE BEFORE THEY START — AND WHAT THEY SHOULD NOT INSTALL.
#
# The 35 packs answer "what does THIS file need". Nothing answered "what do I need at all", so the
# answer defaulted to whatever the last tutorial installed, and an environment accretes: every
# addition is obviously worth it on the day it is made, and nothing ever measures the sum.
#
# THE `never_by_default` LIST IS THE HALF THAT DOES THE WORK. A baseline that only says what to add
# is a shopping list, and a shopping list is how a workstation ends up with four linters that
# disagree and six servers holding credentials for a task nobody is doing.
#
# `atlas.py doctor` answers which of the required rows THIS machine has; `packprobe.py --mode
# smoke` answers the per-language ones. Nothing here is installed by anything in this repository.
developer_baseline:
  required:
    # Without these the atlas itself does not run, and `doctor` says so per row with what breaks.
    interpreter: {why: the harness is Python and declares its floor in pyproject}
    version_control: {why: 'the router reads the tracked tree, and every roster is derived from it'}
  recommended:
    one_formatter_per_language:
      why: a second formatter is not more rigour, it is a diff that alternates between two authors
    a_language_server:
      why: it answers "where is this defined" without a grep that matches a comment
    a_debugger_you_have_actually_attached:
      why: a debugger nobody has attached is not in the environment, it is in the manifest
    a_terminal_multiplexer_or_worktrees:
      why: one mutable writer per worktree is the isolation rule; without it parallel work shares
        a tree and the loser is whoever pulled last
  never_by_default:
    a_second_linter: refuses nothing the first one allowed, and disagrees with it on style
    a_formatter_on_save_in_a_shared_repository: rewrites files nobody reviewed into every diff
    a_credential_helper_that_caches_without_expiry: a cache miss is not a revocation
    an_always_on_agent_with_write_access: the budget and approval controls exist because
      unattended write access has no natural stopping point
  mcp:
    # AN MCP SERVER IS TASK-SCOPED OR IT IS AMBIENT ACCESS. The profiles in
    # integrations/MCP-PROFILES.md name which servers a TASK justifies; this says what to enable
    # at all, and the rule that decides. A server enabled for a task that ended is a standing
    # capability nobody chose.
    rule: enable the profile the task names, and nothing else; disable it when the task ends
    cost_nobody_counts: every enabled server's tool descriptions are paid on EVERY request, not on
      the request that uses them — an unused server is a subscription, not an option
    review_trigger: before adding one, ask what already answers the question and what the server
      can reach that the task does not need
# SIX CLAIMS, NOT ONE — AND A MANIFEST ENTRY MAKES ONLY THE FIRST.
#
# A tool name written in a manifest is read as saying the tool exists, runs here, is new enough,
# was actually used, passed, and decides the role. Those are six claims with six different owners,
# and collapsing them is exactly how a pack reads as exercised when nothing has ever run it. The
# ladder is declared once; a pack may CLAIM a rung in its own `verification` block, and the rungs
# above `declared` each name the environment they were measured in — because "it ran" is a fact
# about a machine, not about a pack.
#
# THE RUNGS ARE ORDERED. Claiming a rung asserts every rung below it, so a pack cannot claim it
# passed without claiming it was available.
tool_claims:
  declared:
    means: a name is written in a manifest and conforms to the entry grammar
    owner: the pack author
    proven_by: atlas.py check
  available:
    means: PATH resolves it on the machine asking the question
    owner: the machine, never the pack — absence here is a fact about the host
    proven_by: packprobe.py --mode smoke
  version_compatible:
    means: it reports a version at or above the floor the pack declares
    owner: the machine
    proven_by: packprobe.py --mode version
  executed:
    means: it was run against real code in this repository, not merely resolved
    owner: continuous integration, or a codespace carrying that one toolchain
    proven_by: exrun.py for a route that ships an example
  passed:
    means: that run exited zero
    owner: continuous integration
    proven_by: the workflow's exit code, never a line of its output
  authoritative:
    means: its verdict DECIDES the role for this pack, so a gate resolves to it
    owner: the pack's own declaration
    proven_by: gate_tools resolving the role to this entry

# WHEN TO REACH FOR WHICH PACK — BECAUSE 35 PACKS IS A CATALOGUE UNTIL SOMETHING NARROWS IT.
#
# A roster of languages answers "what is supported" and never "what should I use", so the default
# wins: whichever language the author already knows, for every problem. Each axis below is a NEED,
# the packs that answer it, and — the half that does the work — when NOT to reach for that axis at
# all, because most of these are the wrong answer most of the time.
#
# `atlas.py pick` prints them. EVERY route must appear in at least one axis: a pack reachable only
# by already knowing its name is a pack nobody selects, and `check` refuses one.
#
# MATURITY IS STATED, NOT IMPLIED BY PRESENCE. A pack exists here because its toolchain is
# declarable, never because it is recommended for production — and a reader who cannot tell those
# apart will read a roster as an endorsement.
# WHAT GITHUB'S LINGUIST CALLS EACH PACK, or `null` where it classifies the language at all.
# MEASURED at 2.27.0: langbar.py carried an enumerated suffix table of 13 entries and argued in its
# own comment that a fuller table "would be a second roster that narrows". It had already narrowed
# — the tree holds 53 routed suffixes and the live API reported F#, Haskell, Dockerfile and
# Markdown that the projection did not know existed. The map is now COMPLETE over routes and
# `check` refuses a route missing from it, so a new pack cannot enter the tree and leave the bar
# behind. `null` is a real answer: Linguist has no entry for these languages, so counting them
# would invent a bar GitHub will never render.
linguist_names:
  bash: Shell
  bqn: BQN
  cloudflare: null
  c: C
  carbon: null
  chapel: Chapel
  cpp: C++
  cuda: Cuda
  elixir: Elixir
  forth: Forth
  fsharp: F#
  futhark: Futhark
  gleam: Gleam
  go: Go
  hare: Hare
  haskell: Haskell
  julia: Julia
  lean4: Lean
  mojo: Mojo
  nim: Nim
  ocaml: OCaml
  odin: Odin
  python: Python
  quantum/qsharp: "Q#"
  quantum/silq: null
  r: R
  roc: Roc
  rust: Rust
  scala: Scala
  sql: SQL
  swift: Swift
  typescript: TypeScript
  uiua: Uiua
  v: V
  webassembly: WebAssembly
  zig: Zig

# WHO DECIDES EACH STOP AND ESCALATE CONDITION — a function, or a named closer. Declared at 2.27.0
# after an audit found `reproduction_not_obtained` listed as a stop condition that NOTHING decided:
# the same shape as a gate that resolves to silence, recurring in a second roster. Nine of these
# are decided by code; the rest are closed by a person or a platform control and SAY so, because
# a condition nobody owns is a stop that never fires. process_condition_errors refuses the third
# state — a condition some process names and this map does not.
process_conditions:
  approval_required: {decided_by: agentpolicy.approval_verdict}
  production_access_needed: {decided_by: agentpolicy.approval_verdict}
  budget_exhausted: {decided_by: agentpolicy.budget_verdict}
  scope_expanded: {decided_by: agentpolicy.scope_verdict}
  policy_denied: {decided_by: agentpolicy.command_verdict}
  plan_drift: {decided_by: agentrun.plan_drift}
  gate_refused: {decided_by: agentrun.run_gates}
  audit_chain_broken: {decided_by: agentaudit.verify}
  lock_outside_declared_range: {decided_by: atlas.declaration_errors}
  secret_detected: {closed_by: 'the platform secret scan and push protection, declared in
      config/github-controls.json and audited live by ghaudit.py'}
  reproduction_not_obtained: {closed_by: 'a person reading the reproduction record — no function
      decides whether a reproduction is real, and saying so is the point'}
  root_cause_outside_scope: {closed_by: 'the task owner, who widens the contract or files it'}
  both_sides_need_changing: {closed_by: the owners of both sides of the boundary}
  boundary_untested: {closed_by: a reviewer checking the boundary has a contract test}
  breaking_change_detected: {closed_by: 'the API owner, per the deprecation window'}
  schema_unversioned: {closed_by: 'the API owner, who versions the schema before it ships'}
  regression_threshold_crossed: {closed_by: a reviewer reading the benchmark against its declared
      threshold}
  measurement_not_reproducible: {closed_by: whoever re-runs the measurement on a quiet machine}
  workload_not_representative: {closed_by: the owner of the production workload being modelled}

# ROUTING BY FILENAME — routing_policy.precedence declared `project_manifest` and nothing implemented
# it until 2.28.0. A Worker's config is `.toml` or `.json`, extensions every other tool shares, so an
# extension route would capture tsconfig.json with it; the filename is the identity.
project_manifests:
  wrangler.toml: cloudflare
  wrangler.json: cloudflare
  wrangler.jsonc: cloudflare

# WHAT EACH RUNTIME LOADS BY ITSELF, Claude first — declared once, measured on every build into the
# README by contextcost.tokens, and checked against each adapter's own "How it loads" section.
runtime_entry:
- {runtime: Claude Code, id: claude, loads: CLAUDE.md, adapter: models/claude/README.md}
- {runtime: Codex, id: openai_codex, loads: AGENTS.md, adapter: models/openai/README.md}
- {runtime: Cursor, id: cursor, loads: AGENTS.md, adapter: models/cursor/README.md}
- {runtime: opencode, id: opencode, loads: AGENTS.md, adapter: models/opencode/README.md}
- {runtime: Zed, id: zed, loads: AGENTS.md, adapter: models/zed/README.md}
- {runtime: Hermes, id: hermes, loads: .agent/bootstrap.json, adapter: models/hermes/README.md}
- {runtime: any model given a link, id: generic_llm, loads: llms.txt, adapter: models/llm/README.md}
- {runtime: any chat assistant, id: chat, loads: CHAT.md, adapter: models/chat/README.md}

# A RUNTIME KEEPS ITS OWN TOOLS (3.8.0). Thea is ADDED to an agent's layer, never swapped in for it:
# Claude Code, Codex, Cursor, opencode, Zed and Hermes each keep the file, shell, search, edit and
# subagent tools they ship with, configured where that runtime configures them, and each may add,
# replace or drop its own tools without asking Thea. Thea reaches every one of them through the
# mechanisms they ALREADY have — a shell runs the CLI, git runs the pre-commit hook, an MCP client
# may mount the read-only route — so nothing an install writes needs to touch a runtime's tool
# configuration, and nothing here may. `agent_policy` narrows commands only inside a run that a
# declared task contract opted into; it is never written by an install and never edits a runtime.
# Checked by atlasinv.native_agent_tool_errors: every runtime_entry id is declared below, an install
# writes no runtime's tool configuration, a tracked tool configuration disables no native tool, and
# each adapter says under "Native tools stay" how that runtime keeps them.
native_agent_tools:
  rule: thea_adds_never_subtracts
  reaches_through: [cli, git_hook, mcp_read_only]
  # RESOLVED, never typed: `git rev-parse --git-path hooks` honours core.hooksPath, so the path an install
  # writes is read from git at check time and compared against every runtime's configuration.
  install_writes: [git_hooks/pre-commit, git_hooks/pre-commit.legacy]
  denying_values: [deny, disabled, "off"]
  disabling_keys: [deny, disabled_tools, disabledTools, excludeTools, exclude_tools, blocked_tools]
  runtimes:
    claude: {tool_config: [.claude/settings.json, .claude/settings.local.json, .mcp.json], thea_via: [cli, git_hook, mcp_read_only]}
    openai_codex: {tool_config: [.codex/config.toml], thea_via: [cli, git_hook, mcp_read_only]}
    cursor: {tool_config: [.cursor/mcp.json, .cursor/cli.json], thea_via: [cli, git_hook, mcp_read_only]}
    opencode: {tool_config: [opencode.json, opencode.jsonc, .opencode/opencode.json], thea_via: [cli, git_hook, mcp_read_only]}
    zed: {tool_config: [.zed/settings.json], thea_via: [cli, git_hook]}
    hermes: {tool_config: [], thea_via: [cli, git_hook], none_because: Hermes configures its tools in its own home outside any repository and .agent/bootstrap.json is the file of Thea that it reads rather than its tool configuration}
    generic_llm: {tool_config: [], thea_via: [], none_because: a model given a link has no tools of its own to keep; it reads llms.txt}
    chat: {tool_config: [], thea_via: [], none_because: a chat window runs nothing; it reads CHAT.md}

# A CHAT CANNOT RUN THE HARNESS, AND IT IS STILL WORTH ROUTING. ChatGPT, Claude.ai, Gemini, Grok or
# a local model in a chat window is where research, ideas and second opinions happen, often FOR an
# agent. Nothing here needs a command: CHAT.md is generated from this block and carries the install
# text, the processes and a route table, so a chat routes a file by reading one page it fetched.
# Checked by atlasinv.chat_errors: every process names steps, a return and a stop, and the install
# text stays under its byte cap — a ratchet, because it is pasted into every session.
# THE FIRST REPLY TO SOMEONE WHO SHARED THE LINK (3.3.0). Observed: a chat given only the link returned
# an accurate summary and offered to do nothing — the user learned what Thea is and got none of it.
# Every entry file now tells the reader to say what it can do NOW, by setting, then ask for the work.
first_sweep:
  # OBSERVED AT 3.11.0: a chat given the link returned an accurate inventory of the repository and offered
  # a file-by-file review — and did nothing under Thea, filed nothing, and said nothing about working from
  # it. Describing the rulebook is not using it; the reply now has to do all three.
  instruction: 'In your first reply to someone who shared this link: say you are working under Thea for the
    rest of this session; do one thing from it now in your setting (below) — route their file, list the
    gates their change needs, or check a pasted diff; and if you see a gap or a mistake in Thea itself, file
    it with the report verb rather than describing it. Then ask for their file or task. Never stop at a summary.'
  settings:
    a chat with no tools: name the format, typecheck and test commands for any file they name (the route
      table below, then that pack's tools.yaml), review a pasted diff against the gates, and turn a goal
      into the checklist of gates its change class requires
    a chat that keeps instructions: paste the Install block once, and every later chat starts routed,
      labels its claims and files breaks with the report verb
    an agent with a shell: clone a release tag and run `python scripts/atlas.py gate <file>` — the
      numbered commands that prove a change to that file — then `python scripts/enforce.py install` in
      the repository being changed, so a commit that fails its own toolchain's check is refused
    a repository's CI: call the reusable workflow, and drift fails the pull request
    a retrieval or RAG pipeline: run the retrieval_change gates — chunk boundaries, a freshness stamp,
      hybrid recall and citation checks — so an answer is grounded in what was actually retrieved
    an autonomous agent run: write a task contract, and `python scripts/sandboxgen.py docker <contract>`
      prints the host sandbox it needs — no network, read-only root, only the worktree writable
    a chat or agent with memory: 'save verdicts by id (a gate, a change class, a ledger entry) with their
      contract version, never a paraphrase: an id re-checks against the tree, a summary drifts'

# WHO HANDS WHAT TO WHOM (3.3.0). Work crosses kinds of AI: a person asks a chat, a chat hands the work
# to an agent, an agent asks a model, several agents share one task, an agent reports back through a chat.
# Each pairing names the mechanism that serves it and the ARTIFACT that crosses — a file or a record a
# machine can check, never a paraphrase that drifts on the way across.
topologies:
  person and chat:
    how: 'the Install block in CHAT.md, pasted once'
    hands: 'an answer with its claims labelled and the gate that proves it'
  chat to agent:
    how: 'the handoff process in CHAT.md'
    hands: 'a task contract that validates against tools/agent-task.schema.json'
  agent to model:
    how: 'the one line `atlas.py gate` returns, as the whole context'
    hands: 'a single command, measured as the most accurate and cheapest context'
  agent to agent:
    how: 'one lane each (a worktree and branch), landed with `branchstate.py --land`'
    hands: 'a pull request plus the ledger entries it added'
  agent to person or chat:
    how: '`atlas.py gate <file> --json` and the outcome agentrun.py writes into the contract'
    hands: 'machine-checkable records, never a summary of them'
  chat and chat:
    how: 'the same Install block in each'
    hands: 'ledger entries filed with the report verb, so one chat''s mistake teaches the next'
  anyone to Thea:
    how: 'the report verb, or skills/thea/SKILL.md'
    hands: 'a ledger entry that becomes a guard or an intake that must graduate'

# DRIFT REVIEW, TRIGGERED BY A STRUCTURAL CHANGE — NOT BY A CLOCK (3.6.0). A file left untouched while the
# code around it moves keeps the assumptions it was written with: names, imports, gates, counts. When a
# change touches policy, the harness, a schema, a manifest or an entry file, every file older than the
# horizon that REFERENCES something the change touched is surfaced for review in the same session.
# The tier shares are declared defaults (a locality heuristic), not a measurement of this tree.
drift_review:
  horizon_hours: 24
  structural: [atlas.yaml, scripts/, tools/, languages/, .github/, CLAUDE.md, AGENTS.md, llms.txt, CHAT.md, skills/]
  tiers: {hot: 0.15, cold: 0.15}

# WHAT A REQUEST MEANS, PER VERB. Added at 2.29.0: no entry file mapped "use", "install", "open",
# "run" or "pull" to an action, so a chat, an agent and a bare model each guessed — and guessed
# differently. Declared once here; CHAT.md and llms.txt render it whole, and CLAUDE.md, AGENTS.md and
# .agent/bootstrap.json point at it, because their entry budget has no room for a second copy.
intents:
  use:
    means: work under Thea's rules on your own code
    agent: run `python scripts/atlas.py gate <file>` and the commands it prints (exit code is the verdict); `python scripts/enforce.py install` makes every commit prove itself
    chat: paste the Install block from CHAT.md once, then route each file from CHAT.md and fetch only that pack's tools.yaml
  install:
    means: put the harness on a machine
    agent: '`git clone --depth 1 --branch <tag> https://github.com/HeartlandIntel/thea-software`, then in it `python -m pip install --require-hashes -r scripts/requirements.lock.txt` and `python scripts/atlas.py doctor`'
    chat: a chat cannot install anything; give the user those commands with the latest tag from the releases page
  open:
    means: start reading it
    agent: load only your runtime's entry file, then ask `python scripts/atlas.py route <path>`; never read the tree breadth-first
    chat: fetch llms.txt or CHAT.md from the raw base and nothing else until a route names it
  run:
    means: execute its checks
    agent: '`python scripts/atlas.py check` for the whole contract; judge the exit code, never the output'
    chat: a chat cannot run it; hand the user the command and name the gate it proves
  pull:
    means: fetch or update a copy
    agent: pin a release tag, never main; to update a clone, `git pull --ff-only` then `python scripts/atlas.py check`
    chat: fetch raw files at a release tag, never main
  report:
    means: record a break, mistake or bad result so Thea learns to prevent it
    agent: follow `skills/thea/SKILL.md` and file it in atlas.yaml/agent_failure_modes
    chat: answer with a ready-to-paste ledger entry (id, shape, looks_like, tell, prevented_by)

chat:
  install_max_bytes: 1200
  install: |-
    You are working with Thea, the Heartland Engineering Atlas (github.com/HeartlandIntel/thea-software).
    1. Route first. Find the file's pack in CHAT.md, fetch only that pack's tools.yaml. Never read the whole repository.
    2. Fetch, never recall. A tool, command or version from memory is a hypothesis; the fetched file is the answer. Name the file.
    3. Label claims CONFIRMED (file or measurement named), INFERRED or UNCERTAIN. A number nobody measured is "unmeasured".
    4. Refuse rather than invent. "none", "unsupported" and "not verifiable here" are real answers.
    5. Pick a process from CHAT.md and stop where it says. End code advice with the gate that proves it, never "should work".
  processes:
    research:
      when: a factual or technical question
      steps: [restate the question, fetch primary sources, label every claim, name what would refute the answer]
      returns: the answer, its sources, and what stays unverified
      stop_when: no primary source exists — say so instead of answering from memory
    ideas:
      when: a goal with constraints and no plan yet
      steps: [state goal and hard constraints, list at least five options including one unconventional,
              break each one (how it fails), rank by cost and reversibility]
      returns: the ranked options and ONE next step
      stop_when: an option needs a fact nobody has — mark it and move on
    perspectives:
      when: a design, plan or claim that needs a second opinion
      steps: ['answer as builder, attacker, operator and end user', name where they disagree, resolve or state the trade]
      returns: the disagreements and a synthesis
      stop_when: the roles agree — say so, do not invent conflict
    review:
      when: a pasted diff, file or document
      steps: [route it, check it against the pack's gates and this repository's failure modes, rank findings]
      returns: findings, each with the gate or evidence that proves it
      stop_when: a finding needs a run a chat cannot do — hand it to an agent with the gate named
    decide:
      when: a choice between approaches
      steps: [list options, trade-offs, what is measured versus assumed, the cost of reversing]
      returns: a decision record in the shape of systems/decisions.yaml
      stop_when: the deciding fact is unmeasured — name the measurement instead of choosing
    explain:
      when: someone asks what a system or repository does
      steps: [entry points, authoritative versus generated files, what is enforced versus only declared, external surfaces]
      returns: a map a newcomer can act on, with every claim labelled
      stop_when: the source is not available — explain only what was fetched
    handoff:
      when: the work needs code to run
      steps: [objective, allowed paths, the gate that proves it, the stop condition]
      returns: a task an agent can take, in the shape of the task contract
      stop_when: never guess the gate — name the pack and leave the gate for the agent to resolve

language_selection:

  default_workhorse:
    need: the ordinary case — a service, a script, a tool, a test suite
    packs: [python, typescript, go, rust]
    when_not: never reach past this row without a reason you can state in one sentence
    maturity: production
  manual_memory:
    need: no garbage collector, explicit lifetime, predictable latency
    packs: [rust, c, cpp, zig, nim, odin, hare, v]
    when_not: a managed runtime already meets the latency budget — measure before paying for this
    maturity: rust/c/cpp production; zig, nim, odin, hare and v are declarable, not recommended
  fearless_concurrency:
    need: many things in flight, and a failure model that is not "hope"
    packs: [go, rust, elixir, gleam, chapel]
    when_not: the work is IO-bound and a single process with async already saturates the link
    maturity: go, rust and elixir production; gleam and chapel declarable
  data_parallel_gpu:
    need: an array-shaped problem large enough that the transfer cost is worth paying
    packs: [cuda, mojo, futhark, chapel, julia]
    when_not: the array fits in cache, or the kernel would spend its life waiting on memory
    maturity: cuda and julia production; mojo, futhark and chapel declarable
  array_notation:
    need: whole-array thinking, where a loop is the wrong unit of expression
    packs: [bqn, uiua, julia, r]
    when_not: the reader is not already fluent — density is a cost paid by everyone after you
    maturity: julia and r production; bqn and uiua declarable
  typed_functional:
    need: making an illegal state unrepresentable, rather than validating it later
    packs: [haskell, ocaml, fsharp, scala, elixir, gleam, roc]
    when_not: the domain has no invariants worth encoding; a type system is not free
    maturity: haskell, ocaml, fsharp and scala production; roc declarable
  proof_and_verification:
    need: a property PROVED, not tested — where being wrong is not recoverable
    packs: [lean4, quantum/silq]
    when_not: a property test over a few thousand cases would settle it; proof is the expensive tool
    maturity: declarable; reach for it when the cost of being wrong exceeds the cost of proving
  quantum:
    need: a circuit, a simulator, a shot count and a classical baseline to beat
    packs: [quantum/qsharp, quantum/silq]
    when_not: almost always — a quantum result with no classical baseline is not a result
    maturity: research
  portable_sandboxed:
    need: untrusted or portable execution with a declared import surface
    packs: [webassembly, rust, typescript, cloudflare]
    when_not: the code is trusted and local; a sandbox you do not need is a boundary to maintain
    maturity: production
  apple_platform:
    need: a first-class application on Apple's platforms
    packs: [swift]
    when_not: the surface is a web view; then it is a typescript problem wearing a native shell
    maturity: production
  data_and_query:
    need: the data is relational and the question has an exact answer
    packs: [sql, python, r]
    when_not: the question is about meaning rather than rows — see data_classes/unstructured
    maturity: production
  shell_and_glue:
    need: joining programs that already exist, on one machine, with exit codes
    packs: [bash]
    when_not: control flow exceeds a screen, or a value needs a type — reach for the workhorse row
    maturity: production
  stack_and_embedded:
    need: a tiny interpreter, a bootloader, or a machine with no room for a runtime
    packs: [forth, c, zig]
    when_not: the target has megabytes; the constraint has to be real to be worth the cost
    maturity: c production; forth and zig declarable
  systems_successors:
    need: evaluating a language positioned to replace one already in use here
    packs: [carbon, mojo, roc, v, hare, odin, gleam, nim]
    when_not: shipping. This axis is for EVALUATION — a successor language in production is a bet
      on its toolchain surviving, and that is a separate decision from liking the language
    maturity: evaluation only

# ONE IMPLEMENTATION, EVERY LANGUAGE. `atlas do <file> <action>` resolves an action through the
# pack the file routes to, so `format` runs that pack's declared formatter and nothing here knows
# which one that is. Change a pack's test runner and the action follows it; add a pack and it
# inherits all of these for free. This is what makes 35 manifests usable rather than descriptive —
# before it they were read BY the contract and by nobody else.
#
# `takes_file` is the whole subtlety: a formatter acts on one file, a test runner acts on a project,
# and appending a path to the second is how a green suite becomes a run of nothing.
pack_actions:
  format:  {role: formatter,           takes_file: true}
  check:   {role: compiler_or_runtime, takes_file: true}
  lsp:     {role: lsp,                 takes_file: false}
  test:    {role: test,                takes_file: false}
  scan:    {role: security,            takes_file: true}
  debug:   {role: debugger,            takes_file: true}
  profile: {role: profiler,            takes_file: true}
  bench:   {role: benchmark,           takes_file: false}
  fuzz:    {role: fuzz,                takes_file: false}
  mutate:  {role: mutation,            takes_file: false}
  deps:    {role: package_manager,     takes_file: false}

# THE STEPS A PROCESS MAY BE MADE OF. A free-text sequence is a sentence with bullet points: two
# processes would spell the same step differently and no instrument could tell they matched.
process_steps:
  route: resolve the artifact to a pack, a card and a manifest before reading anything else
  scope: declare the paths and commands this task may touch, and refuse the rest
  retrieve: load what the route named, plus the callers and tests of the symbol being changed
  plan: pick the task profile and change class, and resolve the gates they require
  edit: the smallest change that satisfies the objective, and no refactor beside it
  fast_verify: the cheapest gate that can fail, before the expensive one — localise, then prove
  full_verify: every gate the change class requires, judged on the exit code
  diff_audit: compare the diff against the paths the plan declared, before claiming anything
  accept: the acceptance record, INCLUDING the gates that did not run and why
  record: the outcome and the audit stream that can be recomputed
  escalate: stop, name the missing dependency or the approval needed, and do not proceed

# A PROCESS IS THE ONE THING A CONSUMER WANTS AND THE ONE THING THIS TREE ONLY EVER IMPLIED.
# `task_profiles` says which tools, `verification_policy` says which gates, `build_order` says in
# what order a feature is built, `tool_profiles` says what may be activated — four rosters a
# reader had to join by hand, from prose, every single time. A consuming repository therefore
# depended on a PARAGRAPH, which is re-worded without notice, instead of on an identifier.
#
# Each process below joins them once under an id. `atlas process <id> --json` is the external
# reference; the generated documents are views of this, never a second definition.
#
# STOPPING CONDITIONS ARE PART OF THE PROCESS, NOT ADVICE BESIDE IT. A process with no declared
# stop is one that expands until something else notices, which is the failure the agent controls
# were built for — so `atlas.py check` refuses a process that declares none.
processes:
  implementation:
    returns: the diff, every gate result including those NOT RUN, and the audit stream — as a pull request
    task_profile: implementation
    change_class: source_change
    sequence: [route, scope, retrieve, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [diff, gate_results, audit_stream]
    stop_when: [gate_refused, scope_expanded, budget_exhausted]
    escalate_when: [plan_drift, approval_required]
  debugging:
    returns: the failing test that reproduces it, the fix, and the regression test — as a pull request
    task_profile: debugging
    change_class: source_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, diff_audit, record]
    artifacts: [reproduction, regression_test, diff, gate_results]
    stop_when: [reproduction_not_obtained, gate_refused, budget_exhausted]
    escalate_when: [root_cause_outside_scope]
  endpoint:
    returns: the schema diff, the contract and endpoint test results — as a pull request
    task_profile: endpoint
    change_class: api_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [schema, contract_test, integration_test, gate_results]
    stop_when: [schema_unversioned, gate_refused, scope_expanded]
    escalate_when: [breaking_change_detected, approval_required]
  security:
    returns: the finding, the fix, the scan results and the regression test — never a public issue before the fix
    task_profile: security
    change_class: security_sensitive
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [finding_list, gate_results, dependency_delta]
    stop_when: [secret_detected, gate_refused]
    escalate_when: [approval_required, production_access_needed]
  dependency_change:
    returns: the lockfile delta, the dependency review verdict and the gate results — as a pull request
    task_profile: default
    change_class: dependency_change
    sequence: [route, scope, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [lockfile_delta, dependency_graph, gate_results]
    stop_when: [lock_outside_declared_range, gate_refused]
    escalate_when: [approval_required]
  performance:
    returns: the baseline and the new measurement from the same workload, with the regression threshold verdict
    task_profile: performance
    change_class: performance_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, accept, record]
    artifacts: [baseline, benchmark_result, profile, gate_results]
    stop_when: [workload_not_representative, regression_threshold_crossed]
    escalate_when: [measurement_not_reproducible]
  polyglot:
    returns: the boundary contract, both sides' gate results and the boundary test — as a pull request
    task_profile: polyglot
    change_class: api_change
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [schema_or_abi, boundary_test, gate_results]
    stop_when: [boundary_untested, gate_refused]
    escalate_when: [both_sides_need_changing]
  autonomous_agent:
    returns: the task contract with its outcome written back, the audit stream, and a pull request landed with branchstate --land
    task_profile: autonomous_agent
    change_class: source_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record, escalate]
    artifacts: [task_contract, audit_stream, gate_results, environment_fingerprint]
    stop_when: [budget_exhausted, scope_expanded, policy_denied, audit_chain_broken]
    escalate_when: [approval_required, plan_drift]

tool_profiles:
  core-code: [native, github, serena_when_supported]
  docs: [native_docs, context7_when_needed]
  browser: [native_http, playwright]
  database: [native_db, dbhub_read_only]
  security: [native_security, codeql, semgrep, github_secret_controls, dependency_review]
  polyglot: [core-code, schema_abi, boundary_tests]

# THE AUTONOMOUS PROFILE, AS CONTROLS SOMETHING ENFORCES RATHER THAN WORDS AN AGENT READS.
#
# `task_profiles/autonomous_agent` has named five controls since 2.0.0 — narrow_tools, sandbox,
# budget, approval, audit — and until 2.26.0 not one of them was enforced by anything in this tree.
# An agent that simply did not read CLAUDE.md was subject to none of them. That is the gap this
# block closes, and it is the same gap three other rosters here already close: a DECLARED control
# and an ENFORCED control look identical from outside, and only the second survives being ignored.
#
# Every entry below names the FUNCTION that decides it. `atlas.py check` refuses a control whose
# enforcer does not resolve to a callable, exactly as it refuses an invariant with no owner and an
# instrument with no closer — so a control cannot be added here and left unwired.
#
# WHAT THIS IS NOT. A Python runner is not a security boundary, and saying so is not a disclaimer:
# it is the reason `sandbox_requirements` is addressed to the HOST and says so per row. The runner
# refuses what it can see. A sandbox refuses what it cannot.
agent_policy:
  schema: tools/agent-task.schema.json
  reference_contract: tools/agent-task.example.json
  controls:
    narrow_tools:
      enforced_by: agentpolicy.command_verdict
      refuses: a command outside the contract's allowed_commands, or matching a denied_commands
        pattern whatever the contract allows
    sandbox:
      enforced_by: agentpolicy.path_verdict
      refuses: a read or write outside allowed_paths, inside forbidden_paths, or escaping the
        repository root by traversal or symlink
    budget:
      enforced_by: agentpolicy.budget_verdict
      refuses: the call that would cross a declared budget, BEFORE it runs — a budget checked
        afterwards is a report, not a control
    approval:
      enforced_by: agentpolicy.approval_verdict
      refuses: a high-impact action whose token is absent, expired, or bound to a different
        contract, base commit, action or diff
    audit:
      enforced_by: agentaudit.append
      refuses: nothing at write time, because it RECORDS; the chain it writes is what
        `agentaudit.py verify` refuses when the hashes no longer recompute

  # WHAT A CONTRACT MAY NOT RAISE. A contract is written by the same agent these controls bound,
  # so a budget it declares for itself is a preference. These are the ceilings; a contract may
  # declare less and never more, and `agentpolicy.budget_verdict` reads the lower of the two.
  default_budgets:
    tool_calls: 40
    wall_clock_seconds: 900
    files_changed: 20
    lines_changed: 600
    retries: 3
    output_bytes: 1000000

  # REFUSED WHATEVER THE CONTRACT ALLOWS. Each pattern is searched against the quoted argv, and
  # each names WHY, because a deny list whose rows carry no reason is edited by whoever is blocked.
  # This is not the boundary — `allowed_commands` is. This is the floor under it.
  denied_commands:
    privilege_escalation:
      pattern: '^(sudo|doas|su)\b'
      why: a runner that can elevate has no budget, because everything below it can be rewritten
    piped_remote_code:
      pattern: '\b(curl|wget)\b[^|]*\|\s*(sh|bash|zsh|python3?)\b'
      why: fetching and executing in one step leaves nothing for a reviewer or an audit to name
    history_rewrite:
      pattern: '^git\s+(push\s+(-f|--force)|reset\s+--hard|clean\s+-[a-zA-Z]*f|filter-branch|update-ref\s+-d)\b'
      why: the repository is the evidence; an agent that can rewrite it can hide the change it made
    credential_read:
      pattern: '(\.ssh/|\.aws/|\.netrc|id_rsa|id_ed25519|\.claude-keys|/credentials\b)'
      why: a task that needs a credential asks for approval; a task that reads one is exfiltration
    recursive_delete:
      pattern: '\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r'
      why: the one command whose mistake cannot be reviewed afterwards
    audit_tampering:
      pattern: '\.agent/audit'
      why: an audit stream the subject can edit records what the subject chose to record

  # PATHS NO CONTRACT MAY ALLOW, WHATEVER IT DECLARES. Two shapes, both of which a contract
  # written by the agent it bounds would otherwise permit itself:
  #   - the policy that bounds the task, the runner that applies it, and the audit stream that
  #     records it. A task that can edit any of those is not bounded by them.
  #   - a GENERATED file. Editing one is a write to the output instead of the declaration, and the
  #     next `index --write` silently reverts it — which reads as sabotage and is a wrong-file
  #     write. The generated roster is NOT restated here; it is read from the generator, because a
  #     second copy of it would narrow the first time a generated file was added beside it.
  never_writable:
    - .agent/audit
    - tools/agent-task.schema.json
    - scripts/agentpolicy.py
    - scripts/agentaudit.py
    - scripts/agentrun.py

  # ADDRESSED TO THE HOST, NOT TO THE RUNNER, AND EACH ROW SAYS WHICH. `observed_by: host` means
  # this repository cannot prove it and does not claim to; the runner prints those rows as
  # UNOBSERVED rather than passing over them, so a task that ran outside a sandbox never reads as
  # one that ran inside it. `atlas.py check` refuses a row whose observer does not resolve.
  sandbox_requirements:
    filesystem:
      requirement: the repository writable, everything else read-only or absent
      observed_by: agentpolicy.path_verdict
    workspace_lifetime:
      requirement: an isolated temporary directory, removed when the task ends
      observed_by: agentrun.workspace_report
    home_directory:
      requirement: no access to the invoking user's home, ssh keys, or cloud configuration
      observed_by: host
      reference: config/agent-sandbox.json
    network:
      requirement: default deny, with an explicit per-task allowlist
      observed_by: host
      reference: config/agent-sandbox.json
    identity:
      requirement: a non-root user holding no ambient cloud or registry credentials
      observed_by: host
      reference: config/agent-sandbox.json
    resources:
      requirement: bounded cpu, memory and process count, killed by the host rather than asked
      observed_by: host
      reference: config/agent-sandbox.json

  # AN APPROVAL IS BOUND TO WHAT WAS APPROVED, OR IT IS A HABIT. A generic "yes, proceed" survives
  # the diff growing, the base commit moving and the action changing underneath it — which is the
  # failure, not an edge case. Each binding below is a field of the token; each invalidation is a
  # comparison `agentpolicy.approval_verdict` makes before the action runs.
  approval:
    required_for: [network_enablement, dependency_change, workflow_change, security_change,
                   production_access, push, merge, release]
    approver_roles: [owner, security]
    expires_after_seconds: 900
    binds_to: [contract_hash, repository, base_commit, action, diff_hash]
    invalidated_by: [expiry, base_commit_changed, diff_hash_changed, action_changed,
                     allowed_paths_changed]

  # AN AUDIT IS A CHAIN OR IT IS A LOG. A log the subject can append to can also be rewritten, and
  # a rewritten log is indistinguishable from an honest one. Each event carries the hash of the one
  # before it, so a removed or edited event breaks every hash after it and `agentaudit.py verify`
  # names the first break.
  audit:
    stream: .agent/audit
    # EVERY STORE CYCLES, AND THE BOUND IS IN BYTES. A count of events says nothing about a
    # stream whose events grow; the cap is refused at append time and the refusal is itself the
    # last event, so a truncated stream and a finished one are never the same file.
    max_stream_bytes: 4000000
    chain: sha256 over the previous event hash and this event's canonical body
    redaction: arguments and output are recorded as hashes and byte counts, never echoed — but the
      event kind, the exit code and the paths are recorded in full, because a log redacted past the
      point of establishing what happened is not an audit
    events: [task_created, plan_resolved, policy_denied, command_started, command_finished,
             file_changed, approval_presented, approval_refused, budget_exhausted, gate_result,
             scope_expanded, task_finished]

# A GATE IS A WORD UNTIL SOMETHING CAN RESOLVE IT TO A COMMAND.
#
# `verification_policy` names the gates a change class requires and the packs declare the tools,
# and nothing joined the two: a runner reading "unit_tests" had no way to learn what runs them
# here, so the gate was satisfied by an agent saying it was. Each gate below names the MANIFEST
# AUTHORITY ROLE that answers it, which makes the 35 tool manifests load-bearing rather than
# descriptive — change a pack's test runner and the gate resolves to the new one.
#
# `role: none` is a real answer and the more useful half of this table: a gate that no pack tool
# can run is a DECLARATION or a platform control, and saying which beats resolving it to the
# nearest command that would have printed a zero. Every `none` names what closes it, and
# `atlas.py check` refuses a gate with no entry and a `none` with no closer.
# GATES THAT MAY SHARE ONE COMMAND, BY DESIGN: the same tool gathering different evidence. Every other
# pair of gates resolving to one command in one pack FAILS the invariant gates_resolve_distinctly —
# found at 2.30.0, when 21 gates resolved to the plain test runner and read as 21 different checks.
gate_alias_groups:
  - [unit_tests, tests, focused_tests]
  - [profiler, allocation_profile]
  - [static_analysis, applicable_security_and_dependency_checks]
  - [benchmark, load_test]
  - [property_or_fuzz, invariant_property_test]

gate_tools:
  # A FORMATTER'S NAME REWRITES; THE GATE CHECKS (3.9.0). `gate` handed back bare `ruff format`, which
  # reformats every file under the working directory, and a gate is a question, not an edit. Each verb is
  # the tool's own check-only mode, which exits non-zero on an unformatted file; a formatter with none
  # (gofmt -l exits 0 either way) is ABSENT and names its closer rather than passing on a listing.
  formatter:
    role: formatter
    takes_path: true
    closed_by: the pack's formatter run by hand, then a diff review — no check-only mode that fails is declared for it
    verbs:
      ruff format: [ruff, format, --check]
      clang-format: [clang-format, --dry-run, --Werror]
      fantomas: [fantomas, --check]
      gleam format: [gleam, format, --check]
      mix format: [mix, format, --check-formatted]
      ocamlformat: [ocamlformat, --check]
      ormolu: [ormolu, --mode, check]
      prettier: [prettier, --check]
      roc format: [roc, format, --check]
      rustfmt: [rustfmt, --check]
      scalafmt: [scalafmt, --test]
      shfmt: [shfmt, -d]
      swift-format: [swift-format, lint, --strict]
      zig fmt: [zig, fmt, --check]
  # A RUNTIME'S NAME IS NOT A TYPE CHECK (2.30.0): the gate handed back bare `bash`, `python3`, `node` —
  # which EXECUTE the file. Each toolchain names its check-only command; a runtime without one is absent.
  # Verified on a machine with each installed: bash -n, py_compile, node --check, nim check, gleam check,
  # zig ast-check, go vet, ocamlopt. The compilers named as themselves compile the file they are given.
  # MEASURED AT 3.4.0 by enforce.py, on correct example files: bare -fsyntax-only and -typecheck refused
  # valid C++20 and async Swift; ocamlopt wrote .cmi/.cmx/.o beside the source; node --check cannot parse
  # TypeScript. Each verb below now passes its example and refuses a planted break. A tool that checks a
  # whole package or project runs from the directory holding its marker file, with no file argument.
  # A CHECK WITH NO OPERAND CHECKS NOTHING (3.9.0): the python verb reads sys.argv[1:], so the command
  # printed without the file exited 0 having parsed zero files. `takes_path` appends the file unless the
  # verb runs per project (per_directory), which is exactly what enforce.check_file already did.
  compiler_or_typechecker:
    role: compiler_or_runtime
    takes_path: true
    per_directory: {go vet ./...: go.mod, gleam check: gleam.toml, tsc --noEmit: tsconfig.json}
    closed_by: the pack's unit_tests gate, which compiles or loads every file it tests
    verbs:
      bash: [bash, -n]
      python3: [python3, -c, 'import ast,sys; [ast.parse(open(f, encoding="utf-8").read(), f) for f in sys.argv[1:]]']
      node: [node, --check]
      nim: [nim, check]
      gleam: [gleam, check]
      zig: [zig, ast-check]
      go: [go, vet, ./...]
      ocamlopt: [ocamlc, -i]
      tsc: [tsc, --noEmit]
      rustc: [rustc]
      clang: [clang, -std=c17, -fsyntax-only]
      clang++: [clang++, -std=c++20, -fsyntax-only]
      nvcc: [nvcc]
      ghc: [ghc, -fno-code]
      swiftc: [swiftc, -parse-as-library, -typecheck]
      scalac: [scalac]
      dotnet: [dotnet, build]
      lean: [lean]
      chpl: [chpl]
      qsc: [qsc]
      futhark: [futhark, check]
      odin: [odin, check]
      roc: [roc, check]
      wrangler deploy --dry-run --config: [wrangler, deploy, --dry-run, --config]
  # BEHAVIOUR AT COMMIT, BOUNDED (3.16.0): a staged file that IS a test runs under its own runner, when that
  # runner takes one file. The hook proved parsing only; a test file is the one place behaviour is cheap to prove.
  unit_tests: {role: test, per_file_runners: [pytest, vitest, jest, bats]}
  tests: {role: test}
  focused_tests: {role: test}
  schema_validation: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  contract_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  endpoint_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  race_detection: {role: test, verbs: {go test: [go, test, -race, ./...]}, closed_by: "tests written for races and run under a race detector the toolchain provides — a thread sanitizer build where one exists"}
  cancellation_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  timeout_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  stress_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  static_analysis: {role: security}
  # A PACKAGE MANAGER'S NAME IS NOT A GATE. Found at 2.28.0: both gates resolved to the bare tool
  # (`cargo`, `go mod`, `uv`), which prints help and proves nothing — a gate that reads as covered
  # and runs no check. `verbs` names the built-in command that does the gate's job, keyed by what the
  # pack's role resolves to; a manager with no built-in verb is ABSENT and names its closer.
  dependency_graph:
    role: package_manager
    closed_by: Dependency Review on the pull request, which diffs the resolved graph
    verbs:
      uv: [uv, tree]
      pnpm: [pnpm, list, --depth, Infinity]
      npm: [npm, ls, --all]
      cargo: [cargo, tree]
      go mod: [go, mod, graph]
      swift package: [swift, package, show-dependencies]
      dotnet add package: [dotnet, list, package, --include-transitive]
      mix: [mix, deps.tree]
      opam: [opam, tree]
      gleam add: [gleam, deps, list]
  vulnerability_scan:
    role: package_manager
    closed_by: Dependency Review and Dependabot security updates on the pull request
    verbs:
      npm: [npm, audit]
      pnpm: [pnpm, audit]
      dotnet add package: [dotnet, list, package, --vulnerable, --include-transitive]
  benchmark: {role: benchmark}
  profiler: {role: profiler}
  property_or_fuzz: {role: fuzz}
  mutation_if_mature: {role: mutation}
  simulator_run: {role: compiler_or_runtime, verbs: {silq: [silq]}, closed_by: "a quantum pack's simulator, driven from its tests; meaningless outside quantum packs"}
  compatibility_check:
    role: none
    closed_by: no tool in one pack answers whether two versions of an API agree; the breaking and
      public_schema risk modifiers add consumer_impact_review, which is a person
  dependency_review:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  codeql:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  secret_scan:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  representative_workload:
    role: none
    closed_by: a DECLARATION about what the benchmark ran, not a command; the performance task
      profile requires it be named and a reviewer judges whether it is representative
  regression_threshold:
    role: none
    closed_by: a declared number the benchmark's own output is compared against
  shot_count_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  noise_model_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  resource_estimate:
    role: none
    closed_by: the simulator's own estimator, reported beside the run rather than gated on
  classical_baseline_comparison:
    role: none
    closed_by: a second run of the classical implementation, named in the quantum task profile
  artifact_verification:
    role: none
    closed_by: the release workflow's provenance step, which signs what it built
  supply_chain_verification:
    role: none
    closed_by: the platform's dependency and provenance controls, audited live
  integration_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  chunk_boundary_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  hybrid_recall_check: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  citation_check: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  freshness_stamp:
    role: none
    closed_by: a declaration recorded beside the index — the checksum and the contract version each
      record was read at; a stamp produced at query time restates when the question was asked
  authorization_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  session_invalidation_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  signature_verification_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  replay_protection_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  delivery_retry_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  quota_accounting_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  rotation_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  revocation_path_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  known_answer_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  forward_compatibility_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  invariant_property_test: {role: fuzz}
  no_plaintext_at_rest_check: {role: security, verbs: {}, closed_by: "a test that reads the stored bytes back and fails on plaintext; no linter answers it"}
  allocation_profile: {role: profiler}
  load_test: {role: benchmark}
  performance_if_relevant:
    role: none
    closed_by: the performance_change gate, which is the class to pick when it IS relevant; a tier
      entry that is optional by name cannot be resolved to a command without deciding that question
  consumer_impact_review:
    role: none
    closed_by: a person who knows who calls this; no tool in the producing repository can see the
      consumers, which is the whole reason a breaking change needs one
  parameter_review:
    role: none
    closed_by: a reviewer against the primary specification for the algorithm in question
  lock_order_review:
    role: none
    closed_by: a reviewer; a deadlock a test did not reach is not a deadlock a linter finds
  side_channel_note:
    role: none
    closed_by: a written statement of what was and was not considered, read at review
  cache_behaviour_note:
    role: none
    closed_by: a written statement beside the benchmark, because the number alone hides the cause
  migration_path:
    role: none
    closed_by: a document the reviewer reads, naming the steps and the point of no return
  rollback_rehearsal:
    role: none
    closed_by: the rehearsal itself, against a real store, in the release tier — a rollback never
      exercised is a plan, not a control
  version_bump:
    role: none
    closed_by: the contract's own version-site check, which refuses a tree whose declared sites disagree
  deprecation_window:
    role: none
    closed_by: a declared period, stated at the point of deprecation rather than at removal
  deprecation_policy_check:
    role: none
    closed_by: the repository's declared policy for how long a surface survives after it is replaced
  generated_client_regeneration:
    role: none
    closed_by: the consuming repository's own build, which is where a stale generated client fails
  applicable_security_and_dependency_checks: {role: security}

# A CHANGE CLASS IS THE FLOOR, AND ON ITS OWN IT IS TOO COARSE. `api_change` gates an added
# optional field and a removed endpoint identically, so the gates that matter for the second are
# absent from the first and nobody notices — the class passed. A MODIFIER only ever ADDS gates, so
# the class remains the floor and a modifier cannot be used to get a cheaper run. `atlas.py check`
# refuses a modifier whose `applies_to` is not a declared change class.
risk_modifiers:
  additive_endpoint:
    applies_to: api_change
    adds: [deprecation_policy_check]
  breaking_endpoint:
    applies_to: api_change
    adds: [consumer_impact_review, migration_path, version_bump, deprecation_window]
  auth_boundary:
    applies_to: api_change
    adds: [authorization_tests, session_invalidation_test, codeql, secret_scan]
  webhook:
    applies_to: api_change
    adds: [signature_verification_test, replay_protection_test, delivery_retry_test]
  public_schema:
    applies_to: api_change
    adds: [consumer_impact_review, version_bump, generated_client_regeneration]
  rate_limit:
    applies_to: api_change
    adds: [load_test, quota_accounting_test]
  credential_handling:
    applies_to: security_sensitive
    adds: [rotation_test, no_plaintext_at_rest_check, revocation_path_test]
  cryptography:
    applies_to: security_sensitive
    adds: [known_answer_tests, parameter_review, side_channel_note]
  shared_mutable_state:
    applies_to: concurrency_change
    adds: [invariant_property_test, lock_order_review]
  hot_path:
    applies_to: performance_change
    adds: [allocation_profile, cache_behaviour_note]
  schema_migration:
    applies_to: dependency_change
    adds: [forward_compatibility_test, rollback_rehearsal]

# WHAT A NATIVE TOOL IS AUTHORITATIVE FOR — AND WHAT NO ENTRY IN A MANIFEST ANSWERS AT ALL.
# `native_language_tools_are_authoritative` is true, and it was read as more than it says: a
# compiler accepting a program proves the program is well formed, never that it is correct, and a
# green unit suite proves nothing about how the thing behaves in production. Collapsing those into
# one word per pack is how a passing gate becomes a claim nobody made. Every manifest role belongs
# to EXACTLY ONE class below, and the two classes with no role are the point of the table: they
# are declared empty, with a closer, rather than silently answered by the nearest tool.
authority_classes:
  syntax:
    roles: [formatter]
    closed_by: the formatter is the authority and there is nothing above it
  type:
    roles: [compiler_or_runtime, lsp]
    closed_by: a type that holds says nothing about the value flowing through it — behavior below
  behavior:
    roles: [test, fuzz, mutation, debugger]
    closed_by: tests answer for the cases written; property and mutation runs widen that, and the
      gap that remains is named per change class in verification_policy
  security:
    roles: [security]
    closed_by: a pack's scanner plus the repository-level gates in the security_sensitive profile
  performance:
    roles: [benchmark, profiler]
    closed_by: a benchmark answers for the workload it ran; the representative workload is named
      by the performance_change gate
  supply_chain:
    roles: [package_manager]
    closed_by: dependency review and vulnerability scanning in the dependency_change gate
  reference:
    roles: [docs, research]
    closed_by: primary documentation is the source; a summary of it is not
  boundary:
    roles: []
    closed_by: NOTHING IN ONE PACK — a boundary is a contract between two, so it is answered by the
      polyglot task profile's boundary test and by the schema or ABI both sides read
  operational:
    roles: []
    closed_by: NOTHING IN A MANIFEST — no declared tool proves production readiness; the running
      service's own telemetry, the reliability task profile and the release tier answer for it

branch_policy:
  # HOW MUCH UNPUSHED WORK IS TOO MUCH — BOUNDED BY WHAT GROWS, NOT BY HOW MANY BRANCHES HOLD IT.
  #
  # The question that produced this was "cap at four branches, or five, or six?" Measured at
  # 2.26.0 this tree had THREE branches and TWO worktrees, so every one of those caps was already
  # satisfied and none would ever have fired — while eight commits sat unpushed on one branch for
  # roughly three hours. A container count is not the quantity; commits and time are what is lost
  # when a worktree is destroyed, so those are what is bounded.
  #
  # THE NUMBERS COME FROM THAT SESSION. Eight commits means a cap of five fires ONCE, in the
  # middle, while acting on it is still cheap; a cap of three would have fired three times in the
  # same session, and a guard that fires three times an hour gets silenced. `branchstate.py`
  # reports it and never pushes — pushing is an outward-facing act, not a tidy-up.
  # "PUSHED" IS NOT ONE STATE, AND CONFLATING THEM COST REAL TIME IN ONE SESSION. A branch was
  # pushed and the change was reported as landed; the forge's landing page shows the DEFAULT
  # branch, so it showed the old content and the work read as lost. Then the merge happened and
  # the page still showed the old content, because the page is cached. Four distinct states, three
  # of which look identical from a terminal:
  landed_states:
    committed: the work is in local history and survives nothing but this disk
    pushed: a remote holds the branch — recoverable if the machine dies, and invisible on the
      landing page, which renders the default branch and not yours
    merged: the default branch contains it, which is the first state a reader can stumble onto
    published: the rendered page shows it, which lags the merge by a cache and is the ONLY state
      anybody outside actually observes
  # A PUSH REJECTED FOR A STALE REF IS A RACE, NEVER A REASON TO FORCE. Seen this session on a
  # backup remote: `cannot lock ref 'refs/heads/main': is at <a> but expected <b>` means another
  # writer advanced the remote between the fetch and the push. The commits a force would remove
  # are that writer's, and they are usually the ones nobody has a second copy of.
  push_conflict_rule:
    symptom: cannot lock ref, non-fast-forward, or a rejection naming two differing hashes
    cause: another writer advanced the remote after this one read it
    do: fetch, rebase onto the new remote head, re-run the gates, push once more
    never: force, or a lease on a branch whose other writer is an automation that will not notice
    escalate_after: one failed retry — a second race is two writers, which is a scheduling problem
      and not a git problem
  landing_rule:
    rule: pull, rebase, push, pull request and armed auto-merge are ONE step — branchstate.py
      --land; after a merge, branchstate.py --sync fast-forwards the default branch and
      deletes finished lanes with `git branch -d`, whose refusal is the guard
    why: a pushed lane with nothing armed to merge it looks finished from the terminal and is
      invisible on the landing page; it was reported done while stranded, and found by the owner
    gate: the required status checks — auto-merge waits on them, so nothing lands on red
    enforced_by: branchstate.landing_verdict, which fails a pushed, unmerged branch that nothing
      will merge
  unpushed_bound:
    max_commits: 5
    max_age_hours: 2
    max_branches_with_unpushed: 3
    why: measured on a session that reached eight unpushed commits over three hours on one branch;
      a branch-count cap of four, five or six would have printed a clean pass over all of it
  default_base: main
  permanent_language_branches: false
  language_lane_pattern: 'lang/<language>/<topic>'
  topic_patterns:
    feature: 'feat/<topic>'
    fix: 'fix/<topic>'
    research: 'research/<topic>'
    security: 'security/<topic>'
  worktree_pattern: '../thea-software-wt/<language>-<topic>'
  isolation_rule: one_mutable_writer_per_worktree

# THE WORDS AN ISSUE ROUTE MAY USE THAT ARE NOT A ROUTE, GATE, PROFILE, RUNTIME OR MCP SERVER (3.11.0).
# A closed list, so a typo in issue_routes is refused by declcheck.issue_route_errors instead of read as a topic.

# THE MEASURED BENEFITS, HELD (3.14.0). Each row reads a recorded benchmark and takes the WORST model's
# ratio; below its floor the build fails (the benefit regressed), and above it by more than slack it fails
# too, naming the new floor — so a gain is locked in by the run that earned it. `scoreboard.py` prints them.
benchmark_floors:
- {id: routing_accuracy_routed, file: benchmarks/ab-latest.json, path: models.*.routed, num: correct, den: asked, floor: 0.94, measured_by: abtest.py, evidence: 'self-authored questions, held-out split'}
- {id: routing_accuracy_scoped, file: benchmarks/ab-latest.json, path: models.*.scoped, num: correct, den: asked, floor: 0.94, measured_by: abtest.py, evidence: 'self-authored questions, held-out split'}
- {id: diagnose_with_thea, file: benchmarks/tasks-latest.json, path: models.*.diagnose.thea, num: correct, den: asked, floor: 0.96, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: plan_with_thea, file: benchmarks/tasks-latest.json, path: models.*.plan.thea, num: correct, den: asked, floor: 1.0, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: hygiene_with_thea, file: benchmarks/tasks-latest.json, path: models.*.hygiene.thea, num: correct, den: asked, floor: 1.0, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: handoff_gates_right, file: benchmarks/workflow-latest.json, path: handoff.*.thea, num: gates_right, den: asked, floor: 1.0, measured_by: workflowbench.py, evidence: 'self-authored handoffs'}
- {id: tokens_per_routed_question, file: benchmarks/ab-latest.json, path: models.*.routed, field: tokens_per_question, ceiling: 220, slack: 10, measured_by: abtest.py, evidence: 'the most expensive model per question, lower is better'}
- {id: tokens_per_scoped_question, file: benchmarks/ab-latest.json, path: models.*.scoped, field: tokens_per_question, ceiling: 130, slack: 10, measured_by: abtest.py, evidence: 'the most expensive model per question, lower is better'}
- {id: agent_tasks_solved_with_thea, file: benchmarks/agent-latest.json, path: arms.thea, num: solved, den: attempted, floor: 1.0, measured_by: agentbench.py, evidence: 'three self-authored single-file bug fixes, one run each; the blind arm also solved all three, a ceiling effect'}
- {id: agent_gates_clean_with_thea, file: benchmarks/agent-latest.json, path: arms.thea, num: gates_clean, den: attempted, floor: 1.0, measured_by: agentbench.py, evidence: 'four self-authored tasks, one run; blind 3/4, the fourth left unformatted — a sample, not an edge'}
- {id: commit_breaks_refused, file: benchmarks/enforce-latest.json, path: '', num: refused, den: planted, floor: 1.0, measured_by: enforce.py measure, evidence: 'planted breaks in the repos own examples'}

# ROLES AN AGENT TAKES ON, BY THE USER'S DIRECTIVE (3.19.0). One agent is often several in a session:
# it implements, then reviews, then verifies — and a role switch that is not declared is scope drift.
# Each role names the task profile it runs under, what it may and may not do, what it hands back, and
# when it ends; `thea role <name>` prints it and `thea resume` says where interrupted work stands.
agent_roles:
  implementer: {task_profile: implementation, process: implementation, may: 'edit the paths the plan declared and run their gates', may_not: 'refactor beside the change or widen scope', hands_back: 'the diff and every gate result, NOT RUN included', ends_when: 'thea verify exits 0'}
  debugger: {task_profile: debugging, process: debugging, may: 'reproduce, bisect and add the failing test first', may_not: 'fix before the failure is reproduced', hands_back: 'the reproducing test and the fix', ends_when: 'the reproducing test passes and verify exits 0'}
  reviewer: {task_profile: default, may: 'read the diff, run gates and name findings', may_not: 'edit the code under review', hands_back: 'findings as path:line — what — fix, ranked', ends_when: 'every changed file has been read against its gates'}
  verifier: {task_profile: default, may: 'run thea verify and read its record', may_not: 'change code to make a gate pass', hands_back: 'the verify record, PASS FAIL and NOT RUN per gate', ends_when: 'verify has run once on the final tree'}
  researcher: {task_profile: research, may: 'read, search and fetch sources', may_not: 'edit the tree or state an unsourced number', hands_back: 'claims labelled CONFIRMED REPORTED INFERRED or UNCERTAIN, each sourced', ends_when: 'the question is answered or declared unanswerable here'}
  orchestrator: {task_profile: autonomous_agent, process: autonomous_agent, may: 'split work into lanes with task contracts and land them', may_not: 'edit inside a lane it handed off', hands_back: 'landed pull requests and each lane outcome', ends_when: 'every lane is landed or escalated'}

# A DECISION RESTS ON EVIDENCE (3.21.0): data with its source, the trend, and the human side — who pays for
# the wrong choice. A new record in systems/decisions.yaml without all three is refused; these predate the
# rule, and the list may only SHRINK — a record leaves it the moment its evidence is added.
decision_evidence_backlog: []

# THE TIME-BOXED SESSION (3.22.0), read by cadence.py and refused by declcheck.cadence_errors when it stops
# adding up. Weights are minutes of the declared box and must sum to it; exactly one phase is the RESERVE,
# which is entered on the clock whatever the state — a verification budget taken from the end is the budget
# that gets dropped. The expiry rule lowers the SCOPE and never the BAR: the clock running out is not
# authority to weaken a test. Provenance for every choice is in scripts/cadence.py.
cadence:
  box_minutes: 30
  wip: 1
  phases:
  - {id: localize, weight: 3, does: 'read only what the diagnosis needs; declare ONE change and the one test that will prove it', exits: 'one named change, one named test, one file family in scope'}
  - {id: baseline, weight: 2, does: 'run the suite BEFORE editing', exits: 'a known exit code; if it is already red, the goal becomes explaining the red'}
  - {id: repair, weight: 15, does: 'the single declared change, and nothing beside it', exits: 'the edits are complete'}
  - {id: verify, weight: 7, reserve: true, does: 'index --write, then the full done set; fix causes, never floors or caps', exits: 'verify exits 0 and the pull request is opened'}
  - {id: close, weight: 3, does: 'capture the learning, hand off, name the next action', exits: 'a verdict written: DONE, BLOCKED or DEFERRED'}
  checkpoints: [0.33, 0.67]
  definition_of_done: ['python scripts/verify.py exits 0', 'a pull request is opened']
  on_expiry:
  - 'green and openable: finish, open the pull request, DONE'
  - 'not green: stop editing, commit the work in progress on its branch, do NOT open a pull request, record the last failing assertion verbatim and the one next action, DEFERRED'
  - 'entangled or no baseline was taken: revert to the green baseline and hand back the diagnosis — a clean revert with a correct diagnosis beats a half-landed change'
  never_under_pressure:
  - 'weaken, skip or xfail a test, or narrow the suite it runs'
  - 'relax the definition of done, or open a pull request for a reviewer to finish'
  - 'start a second change because the first one stalled'
  measure: [definition_of_done_met, verification_ran_and_its_exit_code, reserve_held, minutes_over_box, wip_breaches, rework_rate, cost_per_done_session]

# WHAT A HANDOFF MUST CARRY (3.23.0), printed by delegate.py and refused by declcheck.delegation_errors.
# Measured across 200 traces of 7 multi-agent frameworks (MAST, arXiv:2503.13657): specification issues and
# inter-agent misalignment are the two largest failure categories. Both are brief quality, not model quality.
delegation_contract:
  required:
    goal: {ask: 'one sentence: the outcome, not the method', why: 'a delegate given a method solves the method; given an outcome it can find a better route'}
    scope: {ask: 'the files or directories it may read and change; everything else is out', why: 'an unscoped delegate reads the tree and returns an essay — the failure the atlas exists to prevent, one level down'}
    acceptance: {ask: 'the command or observable that judges ITS work', why: 'without one it judges itself, and a self-judged result is the premature-commitment shape'}
    returns: {ask: 'the shape of the answer — path:line, a verdict, a record', why: 'a narrative costs more to read than the sweep cost to run'}
    forbidden: {ask: 'what it must not do, including what looks helpful: widening scope, fixing while there, editing what it was asked to review', why: 'the helpful-looking action is the one that silently expands the diff'}
    read_only: {ask: 'THEA_READ_ONLY=1 unless this delegate IS the editing agent', why: 'an audit that can write races the editor; measured here when a read-only audit ran the planting suite beside live edits'}
  on_return:
  - 'what comes back is a HYPOTHESIS until an instrument in this repository confirms it — never land a delegate result on its own authority'
  - 'a result that names no file and no command is not a finding; ask again with the brief, or drop it'
  - 'if two delegates disagree, the instrument decides — never the more confident answer'

# THE PUBLIC-REPOSITORY RULE AS DATA (3.18.0), enforced by leaks.py: placeholders a pattern may match on
# purpose, and the runtime stores that must stay gitignored because they record paths and hosts.
public_surface:
  placeholders: [/home/u/, noreply@anthropic.com, noreply@github.com, '@example.', user@host, t@t]
  never_tracked: [.agent/audit/probe.jsonl, run.log, .bash_history, .zsh_history, trace.trace, .thea/state]

# A symbol named only by its own definition is deleted or declared here WITH its reason (orphans.py).
orphan_exemptions: {}

issue_route_terms: [atlas, binary_artifact, compatibility, dependencies, dependency_scan, environment, extension, fuzz, generated_artifact, http, integration_test, issue_labels, language_debugger, language_lane, links, manifest, merge, migration, module_size, mutation_test, orphans, ownership, payload_size, property_test, query_plan, regression, routes, runtime_debugger, schema, task_profile, topic_branch, transaction, versions, webhook, worktree]

issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  debugging: [vscode, language_debugger, runtime_debugger, profiler]
  gpu: [cuda, mojo, futhark, chapel, julia]
  # ZERO-COPY AND KERNEL BYPASS are a real domain with real packs behind them, and they are a
  # ROUTING concern rather than anything this harness does: the harness is a Python contract and
  # will never move a packet. An issue about a data path that must not allocate belongs to the
  # manual-memory packs, whose own tools answer for it.
  zero_copy: [rust, c, cpp, zig, go]
  # ON-DEVICE INFERENCE is where quantisation lives — a model small enough for static memory is a
  # constraint on the language and the allocator, not on the model alone.
  on_device_inference: [c, cpp, rust, zig, mojo]
  security: [static_analysis, dependency_scan, secret_scan, codeql]
  polyglot: [schema, ownership, compatibility, integration_test]
  drift: [links, routes, versions, orphans, dependencies, environment]
  mcp: [github, serena, playwright, context7, dbhub, semgrep]
  routing: [atlas, extension, manifest, issue_labels, task_profile]
  branch: [worktree, language_lane, topic_branch, merge]
  endpoint: [schema, http, webhook, integration_test]
  database: [schema, migration, transaction, query_plan]
  mutation: [property_test, fuzz, mutation_test, regression]
  blob: [module_size, generated_artifact, binary_artifact, payload_size]

runtime_roles:
  # A HOST IS NOT A MODEL, and the difference decides where a runtime belongs. `model_routes` says
  # which MODEL answers a kind of work; these say what a RUNTIME is for. Zed is the second kind
  # and only the second kind: it is one panel in which several agents are reachable at once, each
  # over its own adapter, so it appears here and in no model route.
  zed: multi_agent_host
  vscode: interactive_ide_agent_host
  opencode: terminal_agent_workspace
  github_actions: authoritative_repository_verification
  cli: deterministic_local_harness
  native_toolchain: authoritative_language_verification
