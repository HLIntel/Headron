    pairs: [a_roster_that_resolved_to_nothing, a_gate_that_resolves_to_silence]
    proven_by: [contextcost.example_coverage_errors, atlasinv.role_coverage_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  parse_first_then_judge:
