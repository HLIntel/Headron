  a_value_quoted_by_hand:
    shape: 'text is placed inside a quoting context — a YAML scalar, a shell string, a pattern — by typing the quotes, and a character that context reads as syntax (an apostrophe, a colon, a comma, a backtick) ends the value early'
    looks_like: 'a one-line ledger or config edit after which the whole file stops parsing, or parses short'
    tell: 'the value was typed between quotes rather than printed by the format''s own emitter, and the breaking character sits inside prose'
    sightings: 2
    prevented_by: 'every value is generated: `safeedit.py quote` for one scalar, `safeedit.py entry` for a ledger entry, a quoted heredoc for a shell message'
    enforced_by: [atlas.parse_errors, atlascore.StrictLoader, safeedit.add_entry]
  an_artifact_written_that_nothing_reads:
    enforced_by: [agreement.lock_drift]
    shape: 'a generated file is rewritten on every change and no code reads it, so it costs churn and proves nothing; agreement.lock hashed atlas.yaml bytes, moved on every comment, and its only consumer was the drift check that regenerated it'
    looks_like: a lockfile kept current by the generator
    tell: grep finds the file in the generator and in no reader; it changes in every commit
    sightings: 1
    prevented_by: the lock is one digest per parsed section and doctor and the land refresh diff the installed CLI against it
  a_passed_verdict_recomputed_on_identical_content:
    shape: 'a gate verdict is recomputed for content it already judged — the same tree, the same gates — because the verdict was keyed to the attempt, not the content'
    looks_like: a land that waits behind every other lane's suite again after a push or forge refusal
    tell: the refused land's tree hash equals the tree whose suite passed minutes ago
    sightings: 1
    prevented_by: clean_checkout_errors remembers a PASS by sha256 of the tree and gate argv in the git common dir; a failure or NOT RUN is never remembered
    enforced_by: [branchstate.clean_checkout_errors, handoff_test.pass_cache_case]
  a_negative_control_built_from_matchable_words:
    shape: 'a negative control is written in words the matcher can match, so a later real row shares two of them and the control fails for the wrong reason'
    looks_like: a suite that dies minutes in on a probe that was never about the change
    tell: 'the noise probe returns a real row, and that row was added in the same change'
    sightings: 1
    prevented_by: 'a noise probe is tokens no ledger can hold, never words; lesson_flow_cases asserts it returns nothing'
    enforced_by: [atlas_rules_test.lesson_flow_cases]
  a_shared_lock_retried_once_against_siblings:
    shape: 'a waiter retries a shared lock once after it frees, and a sibling waiter takes it first, so the waiter gives up having done nothing'
    looks_like: 'land NOT RUN twice in a row, nothing pushed, while every other session''s suite kept running'
    tell: the land output prints 'landing again' once and then NOT RUN on the second attempt
    sightings: 2
    prevented_by: 'land loops on NOT RUN each time the suite lock frees, under one LAND_WAIT deadline across every retry'
    enforced_by: [branchstate.land, handoff_test.land_wait_case]
  a_worktree_inside_the_tree_it_copies:
    enforced_by: [atlascore.files_under]
    shape: 'a worktree is created inside the repository it copies (a desktop default puts it under .claude/worktrees), and every walk rooted at the repository reads the copy as this tree''s source'
    looks_like: 'a planted-suite case fails on modules no branch holds, and a privacy scan lists the same file twice'
    tell: a failing path begins with .claude/worktrees/ or another directory that holds its own .git
    sightings: 2
    prevented_by: files_under reads git's own file set and prunes every directory holding a .git; the agent hook lane-guard refuses a git worktree add into a work tree; worktrees live beside the repo in <repo>-wt/
  an_interpreter_below_the_declared_floor:
    shape: 'a script is run by a bare `python3` that resolves to an interpreter older than pyproject''s requires-python, so a stdlib module the floor guarantees (tomllib, 3.11) is missing and the run dies on import'
    looks_like: 'ModuleNotFoundError: No module named ''tomllib'' from atlascore.py or safeedit.py, read as a broken contract or a missing dependency'
    tell: the traceback's interpreter path is a system Python (3.9) while pyproject.toml says >=3.11; the same command under uv run passes
    sightings: 5
    prevented_by: atlascore refuses below the floor as NOT RUN (exit 2) naming the floor and the uv run command; run repository scripts as `uv run python scripts/<x>.py` or the installed launcher
    enforced_by: [atlascore.refuse_below_floor, floor_test.below_floor_case]
  a_screenshot_for_layout_check:
    looks_like: Agent takes screenshots to check UI layout; each image stays in context and burns tokens
    sightings: 1
    intake: 3.52.0
    shape: 'an agent answers a layout question (does it overflow, is it aligned, did the element render) by taking a screenshot and judging it by eye, when the DOM states the same fact as a number. The image is not a check: it renders the page into context, stays there for the rest of the session, and is retaken after every edit, so the cost compounds per iteration while the verdict stays a judgement. Distinct from a_check_satisfied_by_a_rendering, where a passing check is wrong; here the check is right and paid for in the wrong unit'
    tell: 'a session transcript with several full-scale screenshots of one page between edits, and no read_page, get_page_text or javascript_tool call measuring scrollWidth, a bounding rect or a computed style'
    prevented_by: 'measure before looking: read the accessibility tree or page text, and settle layout with JavaScript (scrollWidth against clientWidth, getBoundingClientRect, getComputedStyle). An image only for a visual judgement no number can make, at most two per task, scale 0.4 or below, at the end. Enforced by a host PreToolUse hook on both browser computer tools and both browser_batch tools, matching the screenshot and zoom actions (the act, not the tool name): silent for two images per session, a warning to the agent at three and four, refused past four unless every image in the call is scale 0.4 or below; its suite plants 14 cases and kills 12 of 12 mutants'
    unenforceable: 'the images are taken through the agent host''s browser tools, outside this tree; no check here can see a session''s tool calls or its context'
    closed_by: 'the host hook and its mutation suite, which live with the agent configuration rather than this repository, and the operator''s per-session image count read against the budget'
  a_contract_generalized_from_one_instance:
    shape: 'a document states a contract for every member of a family (every lane repo has a status script with exit codes 0/1/2) after reading one member, and the other members were never opened'
    looks_like: 'a tidy table whose header reads as fact, written from one README'
    tell: running the claimed contract in each member finds it in one; the others have no such script
    sightings: 1
    prevented_by: 'before a claim covers a family, run or list the claimed thing in every member and write the count (1 of 4), never the family'
    unenforceable: a prose claim about a family has no schema to check it against
    closed_by: 'state the contract on the member that has it, and name how many members were measured'
    intake: 3.52.0
# WHAT COUNTS AS A SUCCESS (3.45.0). A success is a MOVE worth repeating, never a record that something was
# built: "shipped X", "fixed Y" and "merged Z" are accomplishments and are refused. Each success declares
# which kinds of benefit it carries, and each kind is checked, not claimed (knowledge.success_kind_errors).
success_kinds:
  reusable: an agent repeats the move on other work — its `when` names a kind of situation, never one file
  frameworkable: a guard in this tree makes the move structural — a `proven_by` function is also the enforcer of a failure it pairs
  ai_beneficial: it changes what a model does next — it answers a recorded failure's tell, so lessons_for hands it over at the point of action
not_a_success: [added, built, created, fixed, implemented, merged, landed, shipped, released, deployed, completed, finished, wrote, made]

# THE SUCCESS SIDE OF THE LEDGER (3.43.0). A failure says what went wrong; its paired success says what to
# do INSTEAD, when, and how to prove it was done — the ATS fields (move, when, verification) an agent can
# reuse as a step. `pairs` wires each move to the failures it answers and `proven_by` to the functions
# that prove it, so failure -> move -> guard is one graph: `thea failures --for` prints the move beside the
# shape, and `successes_answer_recurring_failures` refuses a failure seen twice with no move.
agent_success_patterns:
  ship_user_actions_as_user_only_skills:
    move: 'ship an action a person triggers by name as a skill marked disable-model-invocation, never as a file in a directory the runtime loads whole'
    when: 'a plugin gains a slash command, agent or output style, or a directory a runtime scans gains a scope'
    verification: 'plant a commands scope: the plugin probe refuses it; run the lane skill: its script flag still answers'
    evidence: 'a commands directory beside a generated guide would have loaded a /thea:THEA command; the lane skills shipped instead (3.50.0)'
    pairs: [a_generated_page_loaded_as_a_component]
    proven_by: [shell_test._loader_collisions]
    kinds: [reusable, ai_beneficial]
    reused: 1
  gate_on_the_unpiped_exit_code:
    move: 'run the gate unpiped, or under `set -o pipefail`, and branch on its own exit code; read long output from the log'
    when: 'any check, test or build whose result decides a commit, push, merge or close'
    verification: '`thea shell "<cmd>"` exits 0, and the step after the gate names the code it read'
    evidence: '`atlas.py check | tail` exited 0 over a public-tree leak that was pushed (3.42.0)'
    pairs: [a_verdict_printed_and_not_gated]
    proven_by: [agentpolicy.shell_verdict, branchstate.clean_checkout_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 2
  route_every_read_through_its_owner:
    move: 'give one input one owning reader, route every caller through it, then declare the call as that row''s sole_reader so a new private copy fails the contract'
    when: 'a second caller starts reading an input another module already reads — a listing, a source tree, a config dialect'
    verification: 'plant the raw call back into one caller: `atlas.py check` fails naming the file and the owning function'
    evidence: 'path listings and Python parses each had private readers that failed differently; both now pass through atlascore and the plants are killed (3.50.0)'
    pairs: [a_reader_written_once_per_caller]
    proven_by: [atlasinv._inv_parsers_refuse_rather_than_guess, atlascore.parsed_python, atlascore.ls_files]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 2
  resolve_every_scheduled_target_on_its_host:
    move: 'sweep every scheduler on the host that runs it — hooks, timers, cron, agent job lists — resolve each script, program, working directory and changed-into path, and fail on a missing one, a path from another platform, or a wrapper that exits zero on a missing target; a paused job warns, an empty roster fails'
    when: 'deleting or moving a script or repository, copying jobs to another host, and on every scheduled health run'
    verification: 'the sweep prints its job and target counts, goes red on a planted missing target, and is clean on the real hosts'
    evidence: 'a job ran for a repository deleted long before, on two hosts, reporting success every run (3.48.0)'
    pairs: [a_hook_that_runs_a_deleted_script]
    proven_by: [schedtargets.sweep, schedtargets_test.run]
    kinds: [reusable, ai_beneficial]
    reused: 1
  judge_the_payload_not_the_status:
    move: 'judge an answer by the fields it must carry; a 200 or an exit 0 with an empty payload is unanswered, and a zero or false stays a value'
    when: 'reading any API, model or tool result that will be scored or acted on'
    verification: 'the answer path runs through one predicate naming its required fields'
    evidence: 'empty model answers were scored as wrong ones until resilience judged the payload'
    pairs: [a_success_rendering_read_as_an_answer, a_non_answer_scored_as_wrong]
    proven_by: [resilience.answer_or_refuse, resilience.missing, taskbench.score]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  drive_it_before_calling_it_working:
    move: 'report a capability as working only after one real request went through it end to end; a roster entry, a health 200 or a registered bridge is reported as PREREQUISITE SATISFIED'
    when: 'wiring a model, a lane, a bridge or a tool, and reporting whether it now works'
    verification: 'the report names the request that was driven through and the answer it returned; every unchecked condition is listed as unproven'
    evidence: 'a provider roster and a 200 were read as a model able to serve, and the first real task through it failed'
    pairs: [a_prerequisite_reported_as_the_capability]
    proven_by: [agentpolicy.claim_errors, resilience.answer_or_refuse]
    kinds: [reusable, ai_beneficial]
    reused: 1
  probe_the_capability_after_every_change:
    move: 'after any update, rebuild or configuration change to a tool or a model, drive one real task through it and check the output before the change counts as landed'
    when: 'a self-update, a package upgrade, a model rebuild or a serving-configuration change'
    verification: 'the change log holds a passing capability probe of the same subject, newer than the change; a presence or version probe is named as not counting'
    evidence: 'a self-update left a stub binary, and a model rebuild and a serving change regressed a task the same day — a version check passed on all three (grounded in arXiv:2202.02976 and arXiv:2406.12928)'
    pairs: [a_self_update_that_leaves_a_placeholder_binary, a_model_config_change_without_an_eval, a_model_rebuild_that_drops_the_chat_template]
    proven_by: [hostshape.change_probe_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  count_the_claimants_before_trusting_the_queue:
    move: 'count running instances of each declared singleton by command line before trusting its queue, and stop the second claimant rather than restarting the first'
    when: 'a control plane, a scheduler or any daemon that claims work, whenever it can be started from more than one surface'
    verification: 'the singleton check reports one instance per declared singleton, and a second copy started by hand is refused or attached'
    evidence: 'a daemon started by hand ran beside the app-owned one, both claiming one workspace (grounded in arXiv:2503.13657)'
    pairs: [a_second_claimant_of_a_singleton]
    proven_by: [hostshape.singleton_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  generate_then_stage_again:
    move: 'generate every count, list and link from its declaration and never type one; stage, `thea check --fix`, stage again'
    when: 'a change that touches a declaration, a tracked file set or a document carrying a generated block'
    verification: '`thea check` exits 0 on the staged tree, and `thea index` shows no drift'
    evidence: 'three typed counts and a relative link in a shared block each drifted from the tree they described'
    pairs: [a_count_typed_into_prose, a_generated_block_whose_input_is_the_index, a_generated_block_carrying_a_relative_link, a_second_declaration_of_one_value, a_derived_roster_written_out_by_hand]
    proven_by: [atlas.generated_errors, atlasgen.typed_size_errors, atlasgen.relative_link_errors, atlasinv.duplicate_prose_errors, langbar.linguist_name_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  read_the_tree_you_act_on:
    move: 'list files with git (the tracked set), never the directory on disk, and resolve the repository a command acts on from the caller, never from the tool'
    when: 'a generator, a sweep, a landing or a check run from another repository'
    verification: 'the command run from a scratch repository names only that repository''s files'
    evidence: 'a landing and an enforcement sweep both acted on Thea''s own tree when run from a consumer (3.41.0, 3.43.0)'
