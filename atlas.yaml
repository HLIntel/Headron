      fact about this repository rather than about a consumer''s contract, and it measures
      COMMITTED state, so a correct edit could not satisfy it until it landed'
  'identity.py':
    script: scripts/identity.py
    proves: where the owner's name appears in this tree, that the declaration and the tree agree,
      and exactly which lines a staged rename would move — before it moves them
    does_not_prove: that the successor account exists on the platform, or that the repository has
      been moved to it; a rewritten URL resolves to nothing until both are true
    closed_by: 'the platform itself, and `ghaudit.py`, which refuses rather than reporting when it
      cannot reach the repository it was pointed at'
  'langbar.py':
    script: scripts/langbar.py
    proves: what this repository's own .gitattributes makes detectable, per language and in bytes,
      and that every file declared generated is marked generated
    does_not_prove: what GitHub will publish; Linguist has heuristics this does not implement
    closed_by: '`gh api repos/OWNER/REPO/languages`, which is authoritative — a disagreement
      between the two is a finding rather than a rounding'
  'branchstate.py':
    script: scripts/branchstate.py
    proves: how much work exists on a local branch that no remote holds, per branch, in commits and
      in hours, against a declared bound
    does_not_prove: that pushed work is safe, or that the remote is reachable; it reads local refs
    closed_by: 'the remote itself, and `ghaudit.py` for whether the branch that received it is
      protected — this instrument never pushes, because pushing is not a tidy-up'
  'abtest.py':
    script: scripts/abtest.py
    proves: whether a language model answers a declared question better WITH this repository's
      routed context than without it, and what that costs in prompt tokens, scored mechanically
      against the tree's own declarations with no judge and no rubric
    does_not_prove: anything about a different model, a different phrasing or a different question
      — the prompt is part of the experiment, so a result is a SAMPLE and never an edge
    closed_by: 're-running it per model and per phrasing, and `bench.py` for the part that needs
      no model at all'
  'enforce.py':
    script: scripts/enforce.py
    proves: a file an agent is about to commit parses and type-checks under its own toolchain's check-only
      command, in any repository, under any agent that commits through git; measure prints how many
      planted breaks it refuses, with the number of files it could and could not trial
    does_not_prove: that the code is correct — tests stay with CI — nor anything about a file whose pack
      has no check-only command or whose toolchain is not installed, which it counts as SKIP, never PASS
    closed_by: the reusable CI workflow and the required check under branch protection, the rungs above it
  'workflowbench.py':
    script: scripts/workflowbench.py
    proves: what agents DO with and without Thea — solo, whether a broken change lands in git with and
      without the enforce hook; handoff, whether a planner's task contract validates and carries the
      gates its change class requires, scored by Thea's own validator
    does_not_prove: anything beyond the models, tasks and phrasings run; a sample, never an edge
    closed_by: re-running per model and adding scenarios only when their outcome is mechanically scored
  'staleness.py':
    script: scripts/staleness.py
    proves: which tracked files and which areas of the tree were edited longest ago, and which worktrees are
      finished, stale, locked or prunable — computed from git on every run, never stored
    does_not_prove: that an old file is wrong or a stale worktree abandoned; it names what nobody has
      touched, and a reader decides whether it is settled or forgotten
    closed_by: 'branchstate --sync, which removes finished lanes, and a review of the oldest area each release'
  'taskbench.py':
    script: scripts/taskbench.py
    proves: whether a model does reasoning (diagnose a failure from its symptom), process (the gates a
      described change needs) and rule-following (would the build refuse a line) better WITH Thea's
      declarations than blind, scored against answers the tree itself declares, with no judge
    does_not_prove: anything about design, open-ended strategy or arithmetic, which have no declared
      answer here; the plan and hygiene fixtures are authored, so a result is a SAMPLE per phrasing
    closed_by: 're-running it per model, and adding a kind only when its ground truth is a declaration'
  'bench.py':
    script: scripts/bench.py
    proves: the router resolves every declared task — fixed AND held out — against a printed chance
      baseline, and how much less context the routed arm hands over than a stated unassisted model
    does_not_prove: that an agent using this atlas completes more tasks; routing and context are
      what this repository controls, and task success belongs to whoever runs the agent
    closed_by: 'the consuming repository''s own outcome measurement; two of the four arms are
      reported NOT RUN with the reason rather than simulated'
  'knowledge.py':
    script: scripts/knowledge.py
    proves: the knowledge declaration is complete and self-consistent — every data class names how
      it fails, every layer names what it must never hold, every retrieval default that would
      otherwise win is named as forbidden, and every asymmetry names where it is applied
    does_not_prove: that any index was actually BUILT this way; a declaration is not an ingestion
    closed_by: 'the retrieval_change gate, which requires a chunk-boundary test, a freshness stamp
      and a citation check — and a citation a reader can open'
  'contextcost.py':
    script: scripts/contextcost.py
    proves: what this repository hands over BEFORE a route is resolved, in bytes, against a
      declared band per entry path — and how much larger the lazily-reached tree is, so the
      entry cost is read against something rather than on its own
    does_not_prove: that the bytes on the entry path are the RIGHT bytes; a short document that
      misroutes every reader costs more than a long one that routes correctly
    closed_by: 'the router''s own evidence line, which says WHICH rule resolved a route, and a
      human reviewer for whether the entry document earns its place'
  # KEYED BY WHAT RUNS (3.7.0). This row was keyed 'ruff check' while naming this script, so the
  # manifest validator was described as a linter — invisible until `thea commands` printed it.
  'commands.py':
    script: scripts/commands.py
    proves: every command `thea` answers carries a help line, and the roster a CLI, an MCP server or a
      front end reads is one parser plus atlas.yaml/instruments — no reader keeps its own list
    does_not_prove: that a listed command succeeds; each command's own gate and planted case do that
    closed_by: atlas_test.py install_cases, which runs the roster and a dispatched instrument from an install
  'thea_mcp.py':
    script: scripts/thea_mcp.py
    proves: an MCP client lists and calls the same commands `thea` answers, with schemas (enums, defaults)
      read off the one parser, each call in its own process with a timeout, its exit code returned as
      structuredContent, no flag that writes reachable on this route, and a malformed message answered
      as an error rather than ending the session; resources and prompts read atlas.yaml on demand
    does_not_prove: that a client renders the result well, or that a client other than the probe's own
      stdio speaker connects — `thea-mcp --check` proves the handler in process, not the transport
    closed_by: cli_test.py cli_and_mcp_cases, which speaks the protocol to it, plants a write flag, an
      unguarded loop, a dropped verdict and a dropped enum back in, and runs `--check`
  'cli_test.py':
    script: scripts/cli_test.py
    proves: an install shipping only the launcher runs check, doctor, the roster and an instrument from
      outside the atlas; the roster satisfies its schema; thea-mcp matches the CLI and refuses writes;
      with --install, each atlas.yaml/install_commands row, run in a clean home against a clone of HEAD
      tagged as the release, installs Thea and leaves `thea doctor` at exit 0
    does_not_prove: a real install on another platform — CI runs it on one OS; nor the package index
      route, which no install_commands row names; nor uncommitted edits, since --install clones HEAD
    closed_by: atlas_test.py, which runs it inside its own counted main; the Documented install job in
      atlas-ci.yml, which runs --install on every pull request
  'packmanifest.py':
    script: scripts/packmanifest.py
    proves: every languages/*/tools.yaml conforms to tools/tools.schema.json, through ONE reader,
      and a schema keyword the reader does not implement is refused rather than skipped
    does_not_prove: that a declared tool is installed or that its command works — packprobe and
      doctor ask PATH that
    closed_by: packprobe.py for what PATH can answer, and the jsonschema cross-check in atlas_test.py

# DATE-SHAPED IDENTIFIERS THAT BELONG TO SOMEBODY ELSE.
# This repository stamps its own claims with the CONTRACT VERSION they were measured at, never
# with a calendar date: a date says when someone typed, a version says which tree it was true of,
# and only the second can be re-checked. The exception is a version an external project publishes
# in date form — MCP versions its specification that way. Those are declared here, once, and
# `atlas.py check` refuses any other date in a tracked text file. An external version is an
# identity; a measurement date is a rendering of one.
# HOW AN EXAMPLE IS RUN, PER ROUTE. Declared here so the runner holds no second roster: it routes
# each file under examples/ with this repository's own router and looks the recipe up by route.
# A route with no entry is reported as unexercised rather than skipped silently — an example
# nobody can run is a skeleton, and the repository refuses those everywhere else.
# THE SHAPE OF THE CODE, MEASURED BY AST RATHER THAN BY TEXT.
# Two functions can share no characters and be structurally identical — rename the variables,
# reflow the lines, swap the docstring, and a text scanner sees nothing. A generator repeats a
# SHAPE far more often than a string, because the shape is what it learned. scripts/astshape.py
# erases every name, literal and docstring, hashes what is left, and refuses a second copy.
# Each cap is a RATCHET: it may only fall, and lowering one must name what was removed.
code_shape:
  # THESE ARE A MEASUREMENT, NOT AN ENDORSEMENT. Set to the worst function in the tree so the
  # gate is live and cannot regress, with the target stated beside it. The ratchet only falls, and
  # lowering a cap must name what was removed to earn it.
  max_function_lines: 202          # atlas_test.py main(); TARGET 60. 278 -> 262 -> 259 -> 239 ->
                                   # 232 -> 221 -> 210 -> 202, every step a function the gate
                                   # refused and a split that earned it. The last fall was
                                   # check() for the sixth time, and the two parse loops moved to
                                   # parse_errors() — one concern: every tracked artifact parses.
                                   # The SAME run refused a duplicate structure, two invariants
                                   # written separately that compiled to identical ASTs; they are
                                   # now one helper with two callers, which is better code and
                                   # not merely a smaller number. That instruction is now in the generated
                                   # entry point, because writing it here did not stop it.
  max_nesting_depth: 6             # astshape.py canonical(); TARGET 4
  min_structural_nodes: 25         # below this, two three-line guards are not a finding
  allowed_duplicate_structures: 0  # NOT a ratchet — zero, and it has held every run: import it,
                                   # write the same shape twice

example_runners:
  python:     {steps: [[python3, '{file}']]}
  bash:       {steps: [[bash, '{file}']]}
  typescript: {steps: [[node, '{file}']]}
  # Directory-scoped: the Go example is a real module, so it is vetted, TESTED (which runs
  # the fuzz target's seed corpus) and then run — once for the package, not once per file.
  go:         {per: directory, steps: [[go, vet, .], [go, test, -count=1, .], [go, run, .]]}
  sql:        {steps: [[sqlite3, ':memory:', '.read {file}']]}
  # RUN, NOT COMPILED: both toolchains are present on the standard CI runner, so these need no
  # setup step and cost the gate nothing. A pack whose toolchain needs installing belongs in the
  # scheduled polyglot workflow (.github/workflows/polyglot.yml), where the install is paid once.
  haskell:    {steps: [[runghc, '{file}']]}
  fsharp:     {steps: [[dotnet, fsi, '{file}']]}
  rust:       {steps: [[rustc, --edition, '2021', -D, warnings, '{file}', -o, '{out}'], ['{out}']]}
  c:          {steps: [[clang, -std=c17, -Wall, -Wextra, -Werror, '-fsanitize=address,undefined',
                        '{file}', -o, '{out}'], ['{out}']]}
  cpp:        {steps: [[clang++, -std=c++20, -Wall, -Wextra, -Werror, '-fsanitize=address,undefined',
                        '{file}', -o, '{out}'], ['{out}']]}
  swift:      {steps: [[swiftc, -parse-as-library, '{file}', -o, '{out}'], ['{out}']]}
  # ADDED AT 2.29.0 with their toolchains, installed by `brew bundle` from the generated Brewfile.
  # Each needs no package download, so an example proves the language and not a registry.
  nim:        {brew: nim, steps: [[nim, c, --hints:off, '--out:{out}', '{file}'], ['{out}']]}
  ocaml:      {brew: ocaml, steps: [[ocaml, '{file}']]}
  elixir:     {brew: elixir, steps: [[elixir, '{file}']]}
  gleam:      {brew: gleam, per: directory, steps: [[gleam, run]]}
  # ZIG FROM ITS OWN RELEASE, NOT HOMEBREW (2.30.0): the formula's shared LLVM installs 1.75 GB, the static
  # official build 418 MB. The workflow checks the SHA-256 PINNED here; one fetched beside the tarball proves nothing.
  zig:        {official: {index: 'https://ziglang.org/download/index.json', version: 0.16.0,
                          sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489},
               steps: [[zig, test, '{file}']]}

external_versions:
  mcp_specification: '2026-07-28'
  # Earlier MCP revisions the stdio route also answers: each keeps initialize, tools/list and tools/call
  # unchanged, the only methods thea_mcp uses. A client asking for any other revision is answered with
  # mcp_specification, never echoed (3.9.2).
  mcp_compatible_r3: '2025-06-18'
  mcp_compatible_r2: '2025-03-26'
  mcp_compatible_r1: '2024-11-05'
  # MEASURED FROM THE CLIENT, NOT READ FROM THE SPEC (3.10.1). Claude Code 2.1.281 asks for the revision
  # below, which no row named, so it was answered mcp_specification and refused the connection — while
  # every probe here passed, because each asked with a revision already listed. A row named for a client
  # records a handshake captured from that client; add one when a real client is refused.
  mcp_client_claude_code: '2025-11-25'

# EACH SITE NAMES THE ONE LINE THAT STATES THE VERSION: a pattern whose group 1 is that version.
# FOUND AT 2.28.0: the rule asked only whether VERSION appeared ANYWHERE in a file, and README passed
# on its generated A/B stamp while its navigation line said 2.26.0 — a rendering satisfied the check.
# atlas.yaml's own `version:` is checked apart; an empty roster here fails rather than passing.
version_sites:
  MODEL.md: '^\*\*Control plane version: (\S+)\*\*'
  README.md: '^- \*\*contract version:\*\* (\S+) —'
  ABOUT.md: '^\*\*Repository contract: v(\S+)\*\*'
  SECURITY.md: '^\*\*Repository contract: v(\S+)\*\*'
  docs/VERSIONING.md: '^Current version: (\S+)$'
  .atlas.yaml: '^\s*ref: v(\S+)$'
  .claude-plugin/plugin.json: '^  "version": "(\S+)",$'

# THE FILES THIS REPOSITORY WRITES WHOLE, DECLARED ONCE AND READ BY EVERYTHING THAT NEEDS THEM.
# The generator owned this roster and `agentpolicy` imported the generator to read it — which was
# fine until the generator became development-only, at which point a CONSUMER validating a task
# contract would have crashed on an import that is not in their wheel. The list moves here: the
# generator asserts its own map against it, and the policy reads it without importing anything.
generated_files:
  - agreement.lock
  - llms.txt
  - Brewfile
  - CHAT.md
  - chat/thea/SKILL.md
  - chat/thea/references/routes.md
  - chat/thea/references/failures.md
  - chat/thea/references/shapes.md
  - chat/thea/references/moves.md
  - CLAUDE.md
  - AGENTS.md
  - .agent/bootstrap.json

# EVERY MARKDOWN FILE HAS A CLASS, AND EACH CLASS A RULE (3.44.0) — scripts/mdshape.py. `living` (the
# default) is rewritten in place: capped, no narration, reachable. `record` is preserved: append-only, and
# rotated when it outgrows its cap. `generated` belongs to its generator (generated_files, above, is read
# as generated automatically). A consumer lays its own keys over these in its .atlas.yaml.
markdown_policy:
  living_max_bytes: 16384
  record_max_bytes: 131072
  record:
    - '(^|/)(archives?|ARCHIVE|_archive|DAILY NOTES|[Dd]aily)/'
    - '(^|/)[^/]*\d{4}-\d{2}[^/]*\.md$'
    - '(^|/)(DECISIONS|PROBLEMS|CHANGELOG|VERSIONING)\.md$'
  generated: ['^docs/INSTRUMENTS\.md$']
  entries: [README.md, AGENTS.md, MODEL.md, docs/INDEX.md]
  loaded_by_harness: [.github/]
  oversize: {}

# WHERE A FILE SITS IN A SYSTEM (3.46.0). An agent attacking a codebase needs the LAYER before the
# file: a change to a migration is not a change to a component, and the gates, reviewers and blast
# radius differ. Paths are tried before suffixes, tiers in this order, first match wins; anything
# unmatched is `none`. A consumer's own `.atlas.yaml/stack_tiers` REPLACES this block for its tree,
# because layers are a property of the codebase, not of Thea. Read by port.tier_of.
stack_tiers:
  frontend:
    paths: ['(^|/)(public|static|assets|components|pages|views|ui|web)/']
    suffixes: [.html, .css, .scss, .sass, .less, .vue, .svelte, .jsx, .tsx, .astro]
  middle-frontend:
    paths: ['(^|/)(hooks|stores?|state|composables|clients?)/']
  middle:
    paths: ['(^|/)(api|routes?|routers?|controllers?|handlers?|graphql|rpc|gateway|middleware)/']
    suffixes: [.proto, .graphql, .gql]
  middle-backend:
    paths: ['(^|/)(services?|workers?|jobs?|queues?|consumers?|pipelines?)/']
  backend:
    suffixes: [.py, .go, .rs, .java, .kt, .rb, .cs, .php, .ex, .exs, .c, .cc, .cpp, .h, .zig, .js, .mjs, .ts, .sh]
  database:
    paths: ['(^|/)(migrations?|db|schemas?|seeds?|sql)/']
    suffixes: [.sql, .prisma, .dbml]

# HOW PEOPLE WRITE PROMPTS (3.47.0), read by intake.py. An OPEN LIST ("a, b, etc") names examples of a
# class: the class a declared roster shares with them becomes the stated scope, never the examples alone.
# A word one edit from a declared name is echoed back as that name. A strategic marker with no file is a
# DECISION, routed to `thea brainstorm --new`, not an edit.
prompt_policy:
  open_list_markers: ['etc.', etc, 'and so on', 'and more', 'and others', 'and the like', 'or whatever', '...', '…']
  strategic_markers: ['should we', brainstorm, strategy, strategic, options, trade-off, tradeoff, 'which approach', 'whether to']

# A STRATEGIC BRAINSTORM IS A RECORD (3.47.0), checked by brainstorm.record_errors: diverge to min_options
# with a do_nothing baseline, score every axis, pre-mortem every option, converge on an undominated choice,
# escalate a one-way door, end in a step and its proof.
brainstorm:
  min_options: 3

# THE PORT (3.46.0): one socket an agent plugs into — `thea port <target>` — and the rail that keeps
# every command behind it. GLYPHS are the braille of the record: a tier's dots fill as the layer
# deepens, so the line reads front-to-back by touch. COLORS are ANSI names, painted only on a
# terminal and never under NO_COLOR. MENUS are the next steps per lens; port_menu_errors refuses a
# command no menu lists, so nothing Thea can do stays out of an agent's sight. HOOKS are the three
# moments any runtime calls back in, through mechanisms it already has — no download, no adapter —
# and every runtime_entry file names the port, or port_menu_errors refuses the runtime as unplugged.
port:
  glyphs:
    lens: {narrow: '◉', code: '◎', codebase: '○'}
    tier: {frontend: '⠁', middle-frontend: '⠃', middle: '⠇', middle-backend: '⠏', backend: '⠟', database: '⠿', none: '·'}
    place: '⌂'
    gate: '✓'
    lesson: '⚠'
    next: '→'
  colors: {frontend: magenta, middle-frontend: bright_magenta, middle: cyan, middle-backend: bright_blue,
    backend: blue, database: yellow, gate: green, lesson: red}
  menus:
    narrow: [gate, plan, route, steps, failures, successes, shell, do, learn, compile]
    code: [brainstorm, md, process, decide, judge, model, pick, why, role, delegate, handoff, cadence, schedtargets, index-search]
    codebase: [check, verify, resume, intake, landed, invariants, doctor, index, commands]
  hooks:
    shell: 'thea shell --json "<cmd>"'
    edit: 'thea port <file> --line'
    done: 'thea verify'

artifact_routes:
  '.py': python
  '.pyi': python
  '.rs': rust
  '.go': go
  '.ts': typescript
  '.tsx': typescript
  # The JavaScript family routes to the TypeScript pack deliberately: the toolchain it
  # declares (node, tsc, eslint, vitest) is the one that answers for these files, and a
  # separate pack would restate it. A route is a toolchain, not a syntax.
  '.js': typescript
  '.mjs': typescript
  '.cjs': typescript
  '.mts': typescript
  '.cts': typescript
  '.jsx': typescript
  '.c': c
  '.h': c
  '.cpp': cpp
  '.cc': cpp
  '.hpp': cpp
  '.zig': zig
  '.mojo': mojo
  '.jl': julia
  '.ex': elixir
  '.exs': elixir
  '.gleam': gleam
  '.nim': nim
  '.v': v
  '.odin': odin
  '.ha': hare
  '.fut': futhark
  '.hs': haskell
  '.lhs': haskell
  '.fs': fsharp
  '.fsx': fsharp
  '.chpl': chapel
  '.bqn': bqn
  # NOT '.fs': that is F#'s, and declaring it here silently took the route over —
  # PyYAML keeps the LAST duplicate key and says nothing. Forth keeps .fth and .4th.
  '.fth': forth
  '.4th': forth
  '.ua': uiua
  '.lean': lean4
  '.carbon': carbon
  '.roc': roc
  '.qs': quantum/qsharp
  '.slq': quantum/silq
  '.cu': cuda
  '.cuh': cuda
  '.sql': sql
  '.sh': bash
  '.bash': bash
  '.ml': ocaml
  '.mli': ocaml
  '.scala': scala
  '.sc': scala
  '.swift': swift
  '.r': r
  '.wat': webassembly
  '.wasm': webassembly

routing_policy:
  precedence:
    - explicit_path_or_task_override
    - shebang_interpreter
    - artifact_extension
    - project_manifest
    - language_directory
    - issue_labels
    - generic_fallback
  shebang_dialects:
    why: 'a suffix names a family and the first line names the interpreter. `.sh` routes to bash, and 19
      zsh scripts in a consumer were refused by `bash -n` for zsh syntax; the interpreter the file names
      is the one that runs it, so it chooses the route and, where its dialect differs, the gate. A row
      with no gates keeps the route''s own tools; an extensionless script routes by this table alone'
    bash: {route: bash}
    sh: {route: bash, gates: {compiler_or_typechecker: [sh, -n]}}
    dash: {route: bash}
    ksh: {route: bash}
    zsh: {route: bash, gates: {formatter: [shfmt, -ln, zsh, -d], compiler_or_typechecker: [zsh, -n]}}
  canonical_outputs:
    guide: languages/<route>/README.md
    operating_card: languages/<route>/OPERATING.md
    tool_manifest: languages/<route>/tools.yaml
    runtime: models/<runtime>/README.md
    mcp: integrations/MCP-LANGUAGE-MATRIX.md
    operations: wiki/LANGUAGE-OPERATIONS.md
    verification: docs/VERIFY.md
    finalization: docs/GITHUB-FINALIZATION.md
    github_backend: docs/GITHUB-BACKEND.md
  issue_labels:
    kind_prefix: 'kind/'
    language_prefix: 'lang/'
    area_prefix: 'area/'
    runtime_prefix: 'runtime/'
    mcp_prefix: 'mcp/'
    risk_prefix: 'risk/'
    status_prefix: 'status/'

# AN AGENT HOLDS MORE THAN ONE SEAT, and orchestrating is not a bigger version of working.
# `agent_roles/orchestrator` may split work into lanes and land them, and may NOT edit inside a lane it
# handed off; `implementer` may edit the declared paths and may not widen scope. Same agent, opposite
# permissions — so an agent that appears once in this map is routed by its strongest capability and
# then does the other job under the wrong contract.
# MEASURED 3.32.0: `tool_orchestration` named ONE agent whose daemon is retired on purpose, while the
# agent that carries subagent dispatch, a workflow runner and a task tool was absent from the route
# entirely and present twice as a worker. A route to a stopped daemon reads the same as a route to a
# capable one — the roster claimed a capability the running process does not have.
model_routes:
  architecture: [claude, openai_codex]
  interactive_edit: [cursor, vscode]
  deterministic_repo_edit: [openai_codex, opencode]
  terminal_parallelism: [opencode]
  tool_orchestration: [claude, hermes]   # claude FIRST: it dispatches subagents and returns typed results
  research: [chat, generic_llm, claude]
  ideation: [chat]
  verification: [native_toolchain, github_actions]

context_policy:
  # An MCP tool SCHEMA is a per-turn tax, like a skill description — handed over on every request by any
  # client without deferred tool loading. MEASURED at contract 3.34.0 across six servers: 30,853 tokens on one
  # agent, of which a machine-maintenance server was 11,569 and a web-scraper 10,670, on a CODING agent
  # that called neither. 5,000 passes the three a coding agent actually needs (an engineering contract
  # 2,784 · local version control 1,588 · a remote forge 4,242) and refuses the two that were pure
  # overhead. A RATCHET: it may fall and never rise, and raising it must name what was added and why it
  # must be handed over on every request rather than reached on demand.
  mcp_server_tokens: 5000
  default: [model, index, atlas, target_language, operating_card, tool_manifest, task_profile]
  boundary_addons: [api, db, cache, queue, abi, ffi, cloud]
  forbidden_default: [whole_repo_dump, unrelated_language_packs, duplicate_tool_queries]

  # WHAT IS HANDED OVER BEFORE A ROUTE IS RESOLVED, IN BYTES, AS A RATCHET.
  #
  # Measured at 2.26.0: this tree is 45% markdown by weight, and that number on its own says
  # nothing — 78 of those files are language packs no session reads until a route names one. The
  # number that decides whether a repository is a blob is not how much prose it CONTAINS, it is
  # how much it HANDS OVER before the reader has asked anything. Nothing measured that, so the
  # entry path could grow a page at a time and every count in this contract would stay green.
  #
  # Each budget is set to the MEASURED size of its path, so the gate is live and cannot regress,
  # and like every ratchet here it may only fall. Lowering one names what was removed to earn it;
  # RAISING one is refused by `atlas.py check` outright rather than argued about in review.
  # WHAT INSTALLING THE HARNESS COSTS, AS A RATCHET. A CLI that drags a dependency tree behind it
  # is a CLI nobody installs twice, and the weight arrives one convenient import at a time — each
  # one obviously worth it on the day it is added. So the count is declared and the bytes are
  # bounded: ONE runtime dependency, standard library otherwise, and the policy content is POINTED
  # AT rather than shipped, because a wheel carrying the atlas would be a vendored copy that ages.
  install_footprint:
    runtime_dependencies: 1
    # WHAT AN INSTALL ACTUALLY PULLS IN, not what requirements.txt names. "One dependency" counted
    # from direct lines is a FALSE MINIMUM the day that dependency gains its own: an average npm
    # package brings ~79 others (Zimmermann et al., USENIX Security 2019). The hash lock is the
    # closure, because --require-hashes refuses anything it does not pin; the invariant
    # dependency_count_is_the_closure holds this number to the lock AND to the installed metadata.
    resolved_closure: 1
    module_bytes: 9199
    slack_bytes: 2048
    # A RISE MUST NAME WHAT EARNED IT. Written as only-falls, this ratchet twice refused a genuine
    # capability and was twice paid for by removing something real — which is the ratchet working.
    # The third time the honest answer was different: an absolute that gets worked around is worse
    # than a rule with a declared escape, and this is the same escape the context budget already
    # carries. `check` refuses a raise that names nothing.
    raised_for: '3.53.0 RAISED to the measured launcher, for one capability: fetch the release atlas
      on first run (a pipx install has no checkout), sha256-checked, stdlib only. It must ship in the
      wheel, so it cannot be moved out. 3.7.0 had RESET this to the launcher alone (atlas_cli); the
      harness runs from the resolved atlas, bounded by code_shape.'
  # HOW MANY PACKS SHIP SOMETHING THAT RUNS — COUNTED, BECAUSE A CLEAN PASS OVER TEN EXAMPLES AND
  # A CLEAN PASS OVER THIRTY-FIVE PRINT THE SAME WORD. `exrun` reported "10 passed, 0 failed" and
  # said nothing about the routes it never looked at, which is a roster narrowing silently: the
  # exact shape this repository refuses everywhere else, living inside one of its own instruments.
  #
  # A pack with no example is DECLARED, never EXERCISED — rung two of tool_claims at best. The
  # number is a ratchet: it may only fall, so an added pack must arrive with something that runs
  # or lower this line on purpose, and it can never quietly get worse.
  example_coverage:
    routes_without_example: 19
    why_not_zero: writing an example in a language whose toolchain cannot be RUN here would ship a
      skeleton, and this repository refuses those everywhere else; each one lands when its
      toolchain can execute it and its assertions have actually held
  # BREADTH IS FROZEN (3.48.0): the value is a claim others can verify, not more coverage. Both
  # counts are held exactly, so adding a route or an instrument is refused until this line moves —
  # and a line that moves up names its reason in the same diff that reviewers read.
  surface:
    routes: 36
    instruments: 82
    raised_to_73: a host whose scheduled jobs fire at deleted targets reported green on two hosts —
      the sweep and its planted cases are depth on proof of change, not a new pack
    raised_to_75: shell_verdict refused one agent shell command in 32 over seven days, most of them
      correct; judging per statement pushed agentpolicy and its suite past the line cap, so the splitter
      and its cases moved out — depth on an existing control, no new pack or verb
    raised_to_77: a decision written as prose could not be scored afterwards, so nobody learned from it —
      typed judgments and their planted cases are contract language for deciding, not a new pack
    raised_to_79: plans price the dashboard by agents running at once and nothing recorded which were
      running; the registry reads the hooks and MCP calls agents already make, so linking an agent needs no
      key — the registry and its planted cases, not a new pack or verb
    raised_to_82: a typed judgment could only be answered by a caller holding a key; the student rung answers
      it in-process from a verified pack, keyless — its read-only loader, the command that reports which rung
      answers, and their planted cases are depth on typed judgments, not a new pack
    why_frozen: depth over breadth — new work strengthens a proof of change or the contract
      language, and is reached by declaring or deleting rather than by another pack or instrument

  # HOW FAR BEHIND A PATH MAY FALL BEFORE SOMEBODY LOOKS AT IT, in contract versions rather than
  # days. A date says when somebody typed; a version says which tree the path was last true of,
  # and only the second can be compared against what the contract now says. Noticed by reading a
  # directory listing and seeing several paths last touched many versions back while the rules
  # they encode had moved underneath them — "which section am I forgetting" was being answered by
  # scrolling, which finds the ones you happen to look at.
  review_horizon:
    max_minors_behind: 8
    # LOOKED AT IT, IT IS CORRECT — a third state, and without it this guard rewards a cosmetic
    # commit. A path can be stale, exempt-forever, or EXAMINED AND FINE, and only the third is
    # what most healthy paths actually are. Recording the contract version it was examined at
    # resets its clock without touching the file, so nobody has to fake an edit to clear a
    # warning. A reviewed entry ages exactly like a commit does: past the horizon it asks again.
    reviewed:
      .gitattributes: '3.50.0'
      CITATION.cff: '3.50.0'
      .editorconfig: '3.50.0'
      .githooks: '3.53.0'
      prompts: '3.53.0'
    exempt:
      LICENSE: a copyright record, not a document that tracks the contract
      examples: an example changes when its LANGUAGE does, which is not on this repository's clock
      CLAUDE.md: generated by index --write, and check refuses any drift from its source on every run
      Brewfile: generated from example_runners by index --write; it moves when a runner does
      languages: the packs move with their own toolchains; packprobe and provenance.verify are what
        answer for them, not a version distance

  # A SHIPPED SKILL'S DESCRIPTION IS THE ONLY PER-TURN TAX HERE (3.24.0): the body is lazy, the description is
  # in every request of every session that installs it. Measured at the value below and ratcheted like the rest;
  # it may fall and never rise. Found the hard way — in a consumer's per-turn budget, not in this repository's.
  skill_description_bytes: 155
  entry_paths:
    agent:
      why: what ONE runtime loads automatically with no route resolved and no question asked
      # AN INSTRUMENT IS WRONG IN ITS SCOPE LONG BEFORE IT IS WRONG IN ITS MATH. The first version
      # of this summed CLAUDE.md + AGENTS.md + llms.txt, and no session has ever loaded all three:
      # a runtime reads the ONE convention it knows. Summing them measured a reader that does not
      # exist and overstated the entry cost by roughly the number of conventions served — which
      # would then have been paid for by deleting a convention, the opposite of the right answer.
      # The cost is the WORST single alternative plus what every runtime reads regardless.
      measure: worst_alternative
      alternatives: [CLAUDE.md, AGENTS.md, llms.txt]
      files: [.agent/bootstrap.json]
      # A BAND, NOT A POINT. Three of these four files are GENERATED, so their size moves a little
      # whenever a declaration does; a ceiling set to the exact measurement would fire on correct
      # work every time, and the reaction to a noisy guard is never to fix it — it is to silence it.
      # The band refuses a RISE past the ceiling and equally refuses slack accumulating beneath it,
      # so the declaration cannot quietly become a ceiling nobody is near.
      budget_bytes: 6941
      slack_bytes: 512
      # A RISE NAMES WHAT EARNED IT — the same escape the install footprint carries, made
      # consistent here rather than shaved around. ~800 bytes were PAID first, by removing the
      # where-to-file table and compressing every rule; the remainder buys the ten failure shapes,
      # which are the only content in this file that changes what an agent does before it starts.
      raised_for: the agent_failure_modes summary — ten shapes actually committed in this tree and
        what each one looks like from outside. A reader who has seen the shape recognises it one
        sighting earlier than a reader who has only seen the fix
    human:
      why: the landing page and the two indexes a person opens before anything else
      measure: sum
      files: [README.md, MODEL.md, docs/INDEX.md]
      raised_for: 'the measured-benefits table. It had only ever FALLEN before this — 38435 ->
        36679 -> 32106 — and ~1,370 bytes were paid structurally FIRST: the language roster moved
        to languages/ATLAS.md and the topics roster to ABOUT.md, both being rosters that grow by a
        row, and two sections were compressed. The remainder buys the one thing a reader deciding
        whether to use this actually needs — what it measurably buys them, each figure naming the
        instrument that produced it and the contract version it was measured at, so the line can
        be re-run rather than believed. Then FELL to 19200 (3.50.0): the landing page read sideways,
        so the settings table moved to models/README.md, the glance line to docs/INDEX.md, the
        find-your-way and how-it-works tables became five links, and the badge and nav rows shrank'
      budget_bytes: 19200
      slack_bytes: 2048

verification_policy:
  # THE DONE SET, DECLARED ONCE (3.9.0). It was typed into the generator as a bash block, so "done" was a
  # habit nobody could count. `verify.py` runs it and prints each gate's verdict from its EXIT CODE, its
  # time, and the coverage line the gate prints about itself; the entry files render the same list.
  # `mutates` marks a gate that plants and restores tracked files: under THEA_READ_ONLY it is NOT RUN,
  # and a NOT RUN is never counted as a pass — the run exits 2, incomplete, not 0.
  # THE FAST LOOP HOLDS THE REPOSITORY TO ITS OWN DONE SET, per changed file (3.20.0). Its first run applied
  # the pack's formatter to this harness, which had not adopted one then — every file "failed" a gate
  # the done set did not contain. Only these gates run per file; the rest wait for verify.
  fast_loop: [compiler_or_typechecker]
  # EVERY GATE DECLARES WHETHER ITS VERDICT CAN DEPEND ON THE MACHINE (3.33.0). MEASURED at 3.32.0:
  # `own_enforcement` was green here and RED in CI, because this Mac has no dotnet and skipped an F#
  # script that CI fed to a compiler. A PASS from a machine-dependent gate is a LOCAL pass, and reading
  # it as a verdict cost a full cycle. A machine-dependent row must say WHY, and verify labels its PASS
  # so nobody reads it as universal. A row that omits the field fails the build.
  done_set:
  - {id: contract, argv: [python, scripts/atlas.py, check], mutates: false, machine_dependent: false}
  - {id: planted_suite, argv: [python, scripts/atlas_test.py], mutates: true, machine_dependent: false}
  - {id: agent_controls, argv: [python, scripts/agent_test.py], mutates: false, machine_dependent: false}
  - {id: code_shape, argv: [python, scripts/astshape.py], mutates: false, machine_dependent: false}
  - {id: examples, argv: [python, scripts/exrun.py], mutates: false, machine_dependent: true,
     why_machine_dependent: 'it RUNS each example under its pack''s real toolchain, so a machine missing
       one skips what another machine executes — the skip count is printed beside the verdict'}
  - {id: context_cost, argv: [python, scripts/contextcost.py], mutates: false, machine_dependent: false}
  - {id: markdown, argv: [python, scripts/mdshape.py], mutates: false, machine_dependent: false}
  - {id: lint, argv: [ruff, check, .], mutates: false, machine_dependent: false}
  # THE PACK'S FORMATTER, ADOPTED ON ITS OWN TREE: one reformat commit (in .git-blame-ignore-revs);
  # files the cap forbids reformatting are listed in pyproject.toml [tool.ruff.format] exclude.
  - {id: format, argv: [ruff, format, --check, .], mutates: false, machine_dependent: false}
  # THE RUNG THEA SHIPS TO OTHER REPOSITORIES, finally run on this one (3.32.0). `--tracked` and
  # not a bare `check`: with no argument it swept zero files and exited 0, which is the vacuous
  # pass this repository refuses everywhere else.
  - {id: own_enforcement, argv: [python, scripts/enforce.py, check, --tracked], mutates: false,
     machine_dependent: true,
     why_machine_dependent: 'it runs each pack''s check-only compiler, so a machine without one
       SKIPS the file another machine REFUSES. This is the sighting the field exists for: clean on
       the author''s Mac and red in CI, on the same tree, at 3.32.0'}
  severity:
    blocker: merge_blocking
    error: merge_blocking
    warning: non_blocking_but_actionable
    info: report_only
    baseline: tracked_only_existing_findings
  baseline_rule: new_findings_must_not_be_absorbed_into_baseline
  independent_verifier: native_toolchain_or_github_security
  # EVERY CLASS THAT CHANGES CODE EXTENDS source_change. FOUND AT 2.29.0 by taskbench: handed this table,
  # Sonnet added formatter, typecheck and unit tests to an API change — and the policy did NOT, so a
  # public endpoint could merge uncompiled. The model was right and the declaration was the defect.
  profiles:
    source_change:
      required: [formatter, compiler_or_typechecker, unit_tests]
    api_change:
      extends: [source_change]
      required: [schema_validation, contract_tests, endpoint_tests, compatibility_check]
    dependency_change:
      extends: [source_change]
      required: [dependency_graph, dependency_review, vulnerability_scan, tests]
    security_sensitive:
      extends: [source_change]
      required: [codeql, secret_scan, static_analysis, tests]
    concurrency_change:
      extends: [source_change]
      required: [race_detection, cancellation_tests, timeout_tests, stress_test]
    performance_change:
      extends: [source_change]
      required: [benchmark, profiler, representative_workload, regression_threshold]
    retrieval_change:
      extends: [source_change]
      required: [chunk_boundary_test, freshness_stamp, hybrid_recall_check, citation_check]
    quantum_change:
      extends: [source_change]
      required: [simulator_run, shot_count_declared, noise_model_declared, resource_estimate,
                 classical_baseline_comparison]
  tiers:
    fast: [formatter, compiler_or_typechecker, focused_tests]
    standard: [fast, static_analysis, applicable_security_and_dependency_checks]
    deep: [standard, property_or_fuzz, mutation_if_mature, performance_if_relevant]
    release: [deep, integration_tests, artifact_verification, supply_chain_verification]

# FUNCTIONALITY FIRST — THE ORDER A FEATURE IS BUILT IN, DECLARED SO IT CAN BE ARGUED WITH.
# The failure it prevents: a presentation layer built against an interface that does not exist yet,
# which then dictates the schema underneath it. Each step names the gate class that judges it, so
# the order is not advice — it is the sequence in which this repository's own gates apply.
build_order:
  - step: schema_and_types          # migrations, DDL, typed attributes, indexes, units
    gate: api_change
  - step: state_machine             # the transitions, as pure functions with no I/O
    gate: source_change
  - step: integration_tests         # the transitions against a real store, including the edges
    gate: source_change
  - step: api_contract              # the schema exposed, with limits, timeouts and idempotency
    gate: api_change
  - step: presentation              # last, and a plain CLI must already do everything it can do
    gate: source_change
build_order_rule: a step may not begin until the step above it has passed its gate

task_profiles:
  default: [native, focused_context, focused_verify]
  implementation: [native, semantic_context, tests, diff_review]
  debugging: [native_debugger, focused_repro, regression_test, diff_review]
  endpoint: [native_http, schema_contract, integration_test, browser_if_needed]
  database: [native_db, read_only_dbhub, migration_test, plan_review]
  security: [native_security, codeql, semgrep, secret_scan, dependency_review]
  reliability: [timeouts, cancellation, health_readiness, telemetry, smoke_test]
  mutation: [existing_tests, mutation_tool_if_mature, bounded_mutants, regression_gate]
  performance: [profiler, benchmark, representative_workload, regression_threshold]
  polyglot: [schema_or_abi, native_tools_both_sides, boundary_test, e2e_if_needed]
  research: [primary_sources, isolated_context, prototype, measurement]
  # RETRIEVAL IS A TASK WITH ITS OWN FAILURES AND NO SOURCE-CHANGE GATE NOTICES ONE. A chunk that
  # ends mid-function, an index invalidated by mtime and an answer with no citation all pass a
  # formatter, a typechecker and a unit suite.
  retrieval: [ast_chunking, hybrid_search, checksum_invalidation, sidecar_metadata, citations]
  autonomous_agent: [narrow_tools, sandbox, budget, approval, effects, audit]
  # QUANTUM IS A DOMAIN WITH ITS OWN DECLARATIONS, NOT ANOTHER LANGUAGE CONVENTION. A quantum
  # result with no shot count, no noise model and no classical baseline is not a measurement, and
  # nothing in a normal source-change gate would notice that. The profile names what must be
  # DECLARED before the run; quantum_change below is what must be produced by it.
  quantum: [native_simulator, shots_declared, noise_model_declared, qubit_budget_declared,
            resource_estimate, classical_baseline]

# THREE CLASSES OF DATA, AND THE FAILURE EACH ONE HAS THAT THE OTHERS DO NOT.
#
# A system that treats all three the same reaches for the mechanism it knows: everything becomes
# a document, gets embedded, and a question with an exact answer is served by similarity. The
# measured cost of that is not a wrong answer, it is a PLAUSIBLE one — a row that exists is
# paraphrased, a row that does not is invented, and neither is distinguishable from the other in
# the output. Each class below names how it is retrieved, what must be recorded beside it, and the
# way it fails, so the choice is made once here rather than re-guessed per question.
data_classes:
  structured:
    examples: [relational tables, key-value stores, columnar files, time series]
    retrieval: a deterministic query the agent WRITES and the system RUNS — never a fact recalled
    chunking: none; a row is already a unit and splitting one destroys its identity
    required_metadata: [schema_version, primary_key, units]
    gate: schema_validation
    fails_by: a query that returns zero rows and reads exactly like an empty result — ABSENT IS
      NOT ZERO, and the two are the same output unless the query prints its own row count
  semi_structured:
    examples: [json documents, yaml declarations, front matter, log lines, api payloads]
    retrieval: a path expression or a schema-validated extractor, with the schema named
    chunking: by declared node, never by length — a split object is not a smaller object
    required_metadata: [schema_id, source, extracted_at_contract]
    fails_by: a field that moved rather than vanished, so the extractor reads a default and every
      downstream number is confidently wrong
  unstructured:
    examples: [prose, 'raw source files', 'pdf and office documents', transcripts, issue threads]
    retrieval: hybrid — dense similarity for meaning AND sparse keyword for exact symbols
    chunking: ast_boundaries
    required_metadata: [path, checksum, symbols, route, last_verified_contract]
    fails_by: a chunk that ends mid-function, which retrieves as a confident fragment of something
      that was never true on its own

# WHERE A FACT LIVES, AND WHY IT MAY NOT LIVE ANYWHERE ELSE.
#
# The three layers are not a ranking, they are a decision about VOLATILITY. Putting a volatile fact
# in the layer that cannot be updated is the defect, and its signature is that nothing in the
# output looks wrong: a stale weight and a fresh one produce the same confident sentence. Each
# layer therefore declares what it must NEVER hold, and who closes the gap when it does.
knowledge_layers:
  parametric:
    holds: [behaviour, output shape, domain vocabulary, refusal style, formatting conventions]
    never_holds: anything that changes without a release — a version, a price, a file, a roster,
      a schedule, a threshold
    staleness: silent, and undetectable from the output alone
    closed_by: the retrieved layer, which carries a freshness stamp the parametric layer cannot
  retrieved:
    holds: [source files, live declarations, records, documentation, measurements]
    never_holds: the rules for HOW to answer — a retrieved instruction is an injection surface
    staleness: visible, because every record carries its checksum and the contract it was read at
    closed_by: the invalidation rule below, and a citation the reader can open
  in_context:
    holds: [the task, the plan, the diff, 'the last few tool results']
    never_holds: durable knowledge; a fact that mattered twice belongs in a file, not in a window
    staleness: bounded by the session, which is why it is the wrong place for anything reusable
    closed_by: the entry paths and the budgets in context_policy

# HOW SOMETHING IS INDEXED, STATED ONCE SO IT IS NOT RE-DECIDED PER INGESTION.
retrieval_policy:
  chunking: ast_boundaries
  # A FIXED CHARACTER COUNT IS THE DEFAULT AND IT IS THE DEFECT. It splits a function in half and
  # both halves retrieve well, because similarity does not know the unit was broken.
  never_chunk_by: [fixed_character_count, fixed_token_count, page_boundary]
  search: [dense_similarity, sparse_keyword]
  search_rule: hybrid, because a dense-only index cannot find an exact symbol and a keyword-only
    index cannot find a paraphrase — and the question that needs each one looks the same
  invalidation: content_checksum
  # NEVER A MODIFICATION TIME. A checkout, a clone and a format-on-save all move mtime without
  # changing a byte, and a restored file changes bytes without moving it far enough to notice.
  never_invalidate_by: [modification_time, file_size, cache_ttl_alone]
  sidecar_fields: [path, checksum, symbols, route, class, last_verified_contract]
  citation_rule: every retrieved claim carries the path and the checksum it was read at, or it is
    reported as unsourced rather than blended into the answer
  # THE NAMED CLOSER FOR THE GAP `atlasindex` DECLARES ABOUT ITSELF. Its dense arm is TF-IDF and
  # says so: it matches VOCABULARY OVERLAP, so a paraphrase sharing no terms is missed. The closer
  # is not "a bigger model" — it is a representation that carries STRUCTURE, because two functions
  # can share no tokens and be the same control flow, which is the same insight `astshape.py`
  # already enforces by canonical AST. A scorer swapped in here inherits the boundary, citation
  # and invalidation rules unchanged; only the similarity changes.
  semantic_closer: a structural code representation — syntax tree and control flow, not token
    overlap — supplied by the consumer and swapped in for the cosine arm
  # AND IT IS EVALUATED RATHER THAN ADOPTED. A retrieval change is scored on a held-out set with
  # its recall reported, exactly as the retrieval_change gate requires; a scorer that is believed
  # because it is newer is the thing `overfitting` warns about, arriving as an upgrade.
  evaluation: recall at a declared k over a held-out query set, reported beside the arm it replaced
    — never adopted on the strength of being newer

# TWO WORDS THAT BELONG TOGETHER, AND THE REASON THE PAIR IS UNEQUAL.
#
# Almost every rule in this repository is one of these underneath. Naming the pair makes the rule
# portable: the same asymmetry that decides where a guard goes also decides how a budget is set
# and what a refusal costs. `atlas.py why <id>` prints one; the roster is checked, so a pair
# cannot be added without saying where it is applied.
asymmetries:
  prevention_detection:
    pair: [cheap_to_prevent, expensive_to_detect]
    why: a defect made unrepresentable costs one design decision; the same defect detected costs a
      guard, its tests, its exemptions and every future reader who has to understand it
    applied_at: the duplicate-key loader, the parse-first check, and never_writable
  silence_noise:
    pair: [silent_failure, noisy_failure]
    why: a noisy failure is bounded by the time it takes to read; a silent one is unbounded,
      because nothing marks when it began
    applied_at: every roster that prints its count, and every gate that prints its coverage
  write_read:
    pair: [written_once, read_forever]
    why: the cost of a declaration is paid by one author; the cost of prose that restates it is
      paid by every reader, on every session, forever
    applied_at: the generated blocks, the entry-path ratchet, and the instrument roster
  loss_upside:
    pair: [bounded_loss, unbounded_upside]
    why: a search that can only lose what it declared in advance may run as long as it likes; one
      that cannot is a position, not an experiment
    applied_at: the task-contract budgets, the audit byte cap, and the refusal to auto-execute
  sensitivity_specificity:
    pair: [proves_it_bites, proves_it_bites_nothing_else]
    why: a mutation test answers the first and says nothing about the second, and only the second
      decides whether a guard survives contact with a real tree
    applied_at: the clean-sweep requirement beside every planted defect
  declaration_rendering:
    pair: [declared_identity, rendered_form]
    why: a rendering changes without notice and the break is silent; an identity is what a
      consumer may branch on
    applied_at: the route record, the gate ids, and the frozen output schema

# HOW A PARSER FAILS QUIETLY — EACH SHAPE, THE DEFECT IT PRODUCES, AND WHAT REFUSES IT HERE.
#
# Every rule below was earned by a break in this tree, not collected from advice. They share one
# property: the failure is INVISIBLE at the point it happens. A file that does not parse produces
# no output; a file that parses WRONG produces confident output. The second is worse, and most of
# these are the second.
#
# `atlas.py check` refuses a rule with no enforcer, so this table cannot become a reading list.
parser_discipline:
  comments_are_not_a_regex:
    defect: stripping `//` with a regex deletes the rest of any line containing the delimiter,
      including the one inside a URL. The friendly outcome is a parse error; the unfriendly one is
      a file that still parses after a value was silently truncated
    measured: a task configuration in this repository, on the first attempt to read it
    enforced_by: atlascore.read_jsonc, which tracks string state and consumes escapes whole
    enforced_by_ref: atlascore.read_jsonc
    sole_reader: '//[^\n]*'
  one_reader_per_path_listing:
    defect: each inline path listing split its output its own way — on newlines, on whitespace, or
      not at all when the listing failed — so a quoted or spaced path vanished and a directory outside
      any repository listed nothing and passed
    enforced_by: atlascore.ls_files, which splits on NUL and refuses when the listing cannot answer
    enforced_by_ref: atlascore.ls_files
    sole_reader: '"ls-files"'
  one_python_parser:
    defect: each instrument parsed the same source again and handled a syntax error its own way —
      one crashed the contract on a file the parse check already reports, one skipped it, one
      raised — and every re-parse paid the cost the shared tree exists to remove
    enforced_by: atlascore.parsed_python, content-keyed, None on a file that does not parse
    enforced_by_ref: atlascore.parsed_python
    sole_reader: 'ast.parse('
  every_tracked_artifact_parses:
    defect: a configuration file that does not parse is a capability that silently does nothing —
      it still looks present to whoever wrote it, and every document check passes over it
    measured: TWO host configs carried `\$` — not a valid JSON escape — so neither file loaded at
      all, and the tasks they declared had never run
    enforced_by: atlas.check, which parses every tracked Python and every tracked JSON, first,
      because nothing below that check means anything otherwise
    enforced_by_ref: atlas.check
  a_duplicate_key_is_a_collision:
    defect: a mapping loader keeps the LAST duplicate and reports nothing, so a route, an
      instrument or a role answers with something nobody chose and the diff reads as an addition
    measured: a second `.fs` key moved every F# file to another pack
    enforced_by: atlascore.StrictLoader, which refuses a duplicate rather than resolving it
    enforced_by_ref: atlascore.StrictLoader
  refuse_rather_than_pick_a_winner:
    defect: a parser that resolves an ambiguous input is worse than one that errors, because the
      ambiguity leaves no trace and the wrong answer is indistinguishable from the right one
    enforced_by: packmanifest._check, which REFUSES a schema keyword it does not implement instead
      of skipping it — the validator is wrong loudly or not at all
    enforced_by_ref: packmanifest._check
  a_shell_quote_that_evaluates:
    defect: a double-quoted shell string evaluates backticks, $(...) and $VAR, so text that merely
      MENTIONS a command runs it and is replaced by its output
    measured: one commit message on this repository's own main branch, where a phrase in backticks
      vanished and the loss is permanent short of rewriting shared history
    enforced_by: 'a single-quoted heredoc for every message with prose in it — the convention this
      repository already follows, stated here because the exception is what cost something'
    enforced_by_ref: agentpolicy.shell_verdict
  a_lenient_dialect_is_still_a_dialect:
    defect: JSONC permits comments and trailing commas that JSON does not, so a file an editor
      accepts fails every other reader, and the disagreement surfaces far from the edit
    enforced_by: atlascore.read_jsonc for reading, and the parse check for refusing what no reader
      would accept
    enforced_by_ref: atlascore.read_jsonc
  a_checker_never_crashes_on_what_another_checker_owns:
    defect: a guard that RAISES on malformed input takes the whole contract down and hides every
      other finding, including the one that would have named the malformed file. The crash reads
      as a broken harness rather than as a broken input
    measured: THREE sightings in one session — the import guard, the host guard, and the audit
      reader, each meeting the planted defect another rule was written to report
    enforced_by: 'each guard catching the parse error and continuing; `atlas.check` parses every
      tracked source and every tracked JSON FIRST, so the owner of that finding always reports it'
    enforced_by_ref: atlascore.parsed_python
  a_mutation_that_did_not_mutate:
    defect: a string replace with no match returns the input unchanged and says nothing — in a
      test it plants nothing and passes; in an EDIT it writes nothing and the script prints ok.
      It COMPOUNDS when each edit is anchored on the one written just before it
    measured: three fixtures naming a literal that had moved; and at 2.27.0 three failure-mode
      records lost in a chain — the first erased, so each later anchor was gone — with zero errors
    enforced_by: atlas_test.mutated refusing an identical plant; safeedit.replace_once refusing 0 or
      2+ matches; anchoring on a COMMITTED key, never on a sibling written in the same batch
    enforced_by_ref: atlas_test.mutated
  a_restore_is_a_write:
    defect: restoring saved bytes overwrites whatever another writer put there in the meantime, so
      an undo erases work it never saw
    measured: at 2.27.0 an entry written during a background suite run vanished; reproduced
      deterministically by writing inside mutated()
    enforced_by: mutated() comparing the file to what it planted before restoring, keeping any
      other version beside it and failing loudly; suite_lock allowing one mutating suite per tree
    enforced_by_ref: atlas_test.mutated
  verify_a_structured_write_by_parsing_it:
    defect: a byte-exact read-back proves the write landed, not that it means what was intended —
      an unquoted ` #` in a YAML value starts a comment, and the next line becomes a stray key
    measured: at 2.27.0 write_verified passed on an atlas.yaml that no longer parsed; the parse run
      after it is what refused it
    enforced_by: parsing a structured file after writing it and asserting each intended key exists
      — never trusting the writing script's exit code
    enforced_by_ref: safeedit.write_yaml_verified
  an_exit_code_of_zero_is_not_a_verdict:
    defect: a multi-step action whose steps each exit 0 can still have done nothing — arming a
      merge on an already-merged request, or deleting what was already gone, exits 0
    measured: at 2.27.0 branchstate --land printed ok on every step and stranded its own landing
    enforced_by: every multi-step action here reads its RESULT back and exits on that final verdict
      (land() exits 0 only on `armed`); every suite asserts its own case count
    enforced_by_ref: branchstate.land

# STRICT ON THE OUTSIDE, REASONED ON THE INSIDE — AND WHICH IS WHICH IS DECLARED, NOT FELT.
#
# This repository was built almost entirely out of hard bounds, and hard bounds alone have one
# predictable failure: the wall that cannot move gets worked AROUND. It was worked around twice in
# the session that produced this block — a ratchet refused a genuine capability, and the cost was
# paid by deleting something real rather than by admitting the wall should move. The third time
# the honest answer was different, and it needed a name.
#
# The name is BOUNDED AUTONOMY: hard invariants on the perimeter, declared reasoning room inside
# it. The middle tier is the whole point. A system with only hard rules is brittle and gets
# bypassed; a system with none is a wild agent; a system that never says WHICH IS WHICH leaves
# every reader to guess, and they guess generously about their own change.
#
# THE TEST FOR WHICH TIER SOMETHING BELONGS IN: what does being wrong cost, and is it reversible?
# Irreversible or externally observable -> hard. Costly but recoverable, and visible in a diff ->
# bounded. Judged by its output rather than its path -> dynamic.
governance_tiers:
  hard:
    means: fails closed, no reasoning, no escape. There is no argument to have at the boundary
    test: being wrong is irreversible, or is observable by somebody outside this repository
    here: ['the agent controls', never_writable, approval binding, 'the parse-first check', 'the duplicate-key loader', secret handling, 'the required status checks']
    on_breach: refuse, and say which control refused
  bounded:
    means: a declared envelope. Free to reason INSIDE it; moving the wall is allowed and must NAME
      what earned the move, in the declaration, where a reviewer meets it in the diff
    test: being wrong is costly and recoverable, and the move is visible to a reader
    here: ['every ratchet — entry_paths', install_footprint, code_shape, 'example_coverage — the tool budget', 'the unpushed bound', 'and the gates a risk modifier adds']
    adds_rule: PROPORTIONALITY and REVERSIBILITY — an addition must resolve a case that was
      actually met, not one that was imagined, and must be removable without touching anything
      else. `raised_for` is where it says which
    cuts_rule: ZERO LOSS — a removal must preserve the declared output. What is cut is overhead;
      a contract is never cut to fit a budget, it is renegotiated in the open
    on_breach: allowed, named, and reviewed — an unnamed move is the breach, not the move itself
  dynamic:
    means: free, because what is checked is the OUTPUT contract rather than the path taken to it
    test: the result is judged by a gate, so the route to it carries no risk of its own
    here: [wording, 'the order of sections in a document', 'which instrument to run first', 'how a report is laid out', 'which of two equivalent implementations is chosen']
    on_breach: nothing to breach; the gates judge the result and the path is not a claim

# THE MISTAKES A CODING AGENT ACTUALLY MAKES HERE — EVERY ONE COMMITTED IN THIS REPOSITORY.
#
# Not a list of things that could go wrong. Each row below was done, by an agent, in this tree,
# and caught by something. They are collected because they REPEAT: the same shape arrives wearing
# a different file every time, and an agent that has read the shape recognises it one sighting
# earlier than one that has only read the fix.
#
# Every row names what REFUSES it now. A failure mode with no refusal is a warning, and a warning
# is a thing you read once — `atlas.py check` refuses a row that names none.
#
# The sightings count is the point. One is a bug; two is a missing rule and writing that rule is
# part of the fix; three means the evidence was there twice and nothing was done.
agent_failure_modes:
  a_guard_matched_on_the_tool_name_rather_than_the_act:
    enforced_by: [agentpolicy.argument_paths, agent_test.argument_cases]
    shape: a pre-edit guard keys on the NAME of the tool that edits — Edit, Write, MultiEdit — and the agent writes the same files through a shell heredoc instead, so the guard never fires. It is present, correct, reachable, and blind to the path actually taken
    looks_like: an agent walking into the exact traps the place it is editing has already recorded, while the guard that would have handed it that list reports nothing, because reporting nothing is what it does when it does not match
    tell: the guard has no misses to show. A matcher that never fired and a matcher that fired and found nothing print the same silence — and the agent's own edit log is the only place the mismatch is visible
    prevented_by: match the ACT, never the tool that performs it — a matcher that names tools is a roster of renderings, and the shell is always the rendering nobody enumerated. Where the matcher cannot be widened, write repository files through the tools the guard does watch
    closed_by: the host's own PreToolUse matcher, which lives outside this repository and is the only place this can be fixed; this tree can record the shape and can never refuse it. MEASURED at 3.38.0 while building this contract — scripts/ had already recorded a_guard_that_crashes_on_another_guards_input and a_plant_left_by_a_killed_run, and both were then committed by an agent that never saw the list
    sightings: 3
  a_partial_edit_set_from_a_failed_assert:
    enforced_by: [atlas_rules_test.declaration_plant_cases]
    shape: a script editing several files asserts on an anchor part-way through — the files before the assert are written, the rest are not, and the tree is left half-changed while the traceback scrolls past under a later tool's green
    looks_like: a clean contract check over a rule nothing checks. The declaration landed, its enforcer did not, and every count still printed
    tell: a LINTER's pass read as covering the whole edit. Ruff said all checks passed because what it linted was valid — it had no opinion about the half that was never written
    prevented_by: resolve every anchor BEFORE writing anything, or give each file its own run; and never read a later tool's verdict as coverage of an earlier tool's failure
    sightings: 1
  a_generated_block_whose_input_is_the_index:
    enforced_by: [atlas.generated_errors]
    shape: a generated block computed over the TRACKED set drifts the instant `git add` changes that set, so regenerating before staging leaves the block stale and the commit is refused by a tree that was green a moment earlier
    looks_like: a pre-commit refusal nobody can reproduce, because re-running the check after the refusal passes — the index moved between the two
    tell: the same block named twice in one session, each time after staging
    prevented_by: regenerate AFTER staging and stage again — stage, `check --fix`, stage. The index is an input, so it is part of the run rather than something done to the run
    sightings: 4
  a_restore_from_a_stale_journal:
    enforced_by: [safeedit.restore_leftovers, atlas_guards_test.plant_journal_cases]
    shape: a plant journal left by a killed run is applied AFTER its tree was refreshed from elsewhere, writing pre-plant bytes over newer content that the journal knows nothing about
    looks_like: a file reverting to an older version with no edit in the diff that anyone made, and a gate failing on content the author never wrote
    tell: a restore that reports success on a tree it was not taken from
    prevented_by: restore BEFORE syncing, never after — a journal describes the tree it was taken from, so applying it to a different one is a write, not a repair
    closed_by: worktree_policy/sync_rule, which states that the sync is part of the run rather than a setup step somebody remembers, and safeedit's journal, which refuses a restore whose file no longer matches what was planted
    sightings: 1
  a_walk_over_paths_another_session_owns:
    enforced_by: [staleness.worktrees, vanish_test.vanished_lane_cases]
    shape: a walk lists paths another session owns (worktrees, temp lanes, lock holders), then opens each one;
      a sibling removes one between the listing and the open, and the walk raises instead of reporting it
    looks_like: a planted suite that dies with FileNotFoundError on a temp directory no file in the diff names,
      and passes on the rerun
    tell: 'the missing path is under a temp root or another lane, and `git worktree list` no longer shows it'
    prevented_by: 'a listed path is a claim, not a handle: the per-path read catches the vanish and reports the
      row PRUNABLE; `git -C <path>` (exit 128) is safe, `cwd=<path>` raises before git runs'
    sightings: 1
  a_working_directory_snapshotted_on_every_turn:
    enforced_by: [agentpolicy.dispatch_cwd]
    shape: an agent snapshots or indexes its working directory once per turn, so the SIZE OF THE cwd
      becomes a per-turn cost — and the cost is charged to the model's apparent latency, where nothing
      about the prompt, the token count or the tool roster predicts it
    looks_like: a slow agent that still answers correctly; a status of BROKEN on a binary that works
    tell: turn time is flat across wildly different context sizes, and the agent's own log names the
      directory — halving the context made the turn SLOWER, while the bare model served 31k tokens in 2.2s
    sightings: 1
    prevented_by: refuse a tree-sized cwd at dispatch (home, a filesystem root, a temp root) and pass a
      project directory; measure one prompt across several cwds before blaming the model or the tokens
  a_fault_that_fails_fast_masking_a_slower_correct_path:
    enforced_by: [agentpolicy.dispatch_cwd]
    shape: a broken artefact makes an expensive operation abort early, so the system is FASTER while
      faulty; repairing the artefact restores the full cost and the fix reads as a regression
    looks_like: a correct cleanup that made things measurably worse, and a temptation to revert it
    tell: removing a stale lock, cache or marker increased the time it was supposed to reduce
    sightings: 1
    prevented_by: after removing a mask, RE-MEASURE — a mask hides a cost rather than removing it, so
      the number to fix is the one the mask was hiding, not the mask
  a_commit_hash_read_as_the_content_it_carries:
    enforced_by: [staleness.lane_verdict]
    shape: a lane is judged merged by whether its commit HASHES reach the base, and a squash merge lands
      the same content under a new hash
    looks_like: a lane reported active with work ahead of the base
    tell: commits ahead of the base, and `git diff` against the base is empty
    sightings: 1
    prevented_by: compare the tree the lane carries with the base, never only the commit count
  a_run_that_loses_everything_on_one_hang:
    enforced_by: [callshape.forbidden_call_errors]
    shape: a batch has no bound on a call, or does not catch the bound expiring, and writes results only at
      the end — so one hung call ends the run and discards every result already finished
    looks_like: a long run that "failed", with nothing recorded to show for the part that worked
    tell: "the output shows finished lines for earlier models, and the evidence file holds none of them"
    sightings: 1
    prevented_by: every subprocess call carries a timeout (guarded); a benchmark catches the expiry as one
      non-answer and records after each model
  a_check_proven_on_one_shape_of_input:
    enforced_by: [enforce.measure, cli_test._mcp_problems, shellsplit.pipeline_refusal]
    shape: 'a check or a compatibility claim is verified where it was tried — a whole package, one dialect, one protocol revision — then declared for every input of its kind, and refuses correct input of another shape'
    looks_like: a verified command, and a hook that suddenly rejects good code; a passing MCP probe, and a client that cannot connect
    tell: a correct example fails the check while a planted break in it is refused too; or every probe passes and the real client is refused
    sightings: 7
    prevented_by: 'enforce measure runs every check on every correct example first; the MCP probe asks with every declared revision, and a revision captured from a refused real client is declared by that client name'
  a_flow_value_split_on_a_comma:
    enforced_by: [atlascore.StrictLoader]
    shape: an unquoted comma inside a YAML flow mapping ends the value; the rest becomes a key holding
      null, and a loader that only refuses duplicates accepts the truncated record
    looks_like: a declaration that reads complete in the file and is half missing once loaded
    tell: 'the loaded record has a key made of words and no value, and the field it split from ends mid-sentence'
    sightings: 3
    prevented_by: the strict loader refuses a flow entry with no value at parse time, and values are GENERATED by
      `safeedit.py quote`, proven to read back in plain and flow position — never hand-quoted
  a_wait_that_matches_itself:
    shape: a wait or a kill selects processes by a pattern that the waiting or killing command's own
      command line also contains, so it waits on itself forever or kills its own shell
    looks_like: a long job still running, or an unexplained exit 144
    tell: "the job's output file already holds its final line while the wait loop keeps sleeping"
    sightings: 2
    prevented_by: the harness's background-task notification or a PID instead of a hand-written wait loop; a
      `pgrep -f` pattern bracketed on its first character (`[s]leep`) cannot match its own shell, and `thea shell`
      refuses the unbracketed form (3.44.0)
    enforced_by: [agentpolicy.shell_verdict]
  a_search_that_skips_what_it_cannot_see:
    shape: a sweep runs through a shadowed search tool — the Claude Code shell replaces grep and find
      with an embedded ugrep that honours .gitignore and reads -E alternation differently — so ignored
      files are never searched and the sweep reports clean
    looks_like: a clean sweep
    tell: 'a Python scanner over the same paths finds hits that grep in an agent shell did not'
    sightings: 1
    unenforceable: the shadowing is generated by the Claude Code harness shell, outside this tree, and no
      documented setting disables it
    closed_by: sweeps use `command grep` or a scanner that walks the paths itself; ad-hoc grep is a hint
    prevented_by: a STANDING VERDICT (graduated from intake at 3.2.0) — no in-tree guard can reach the harness shell
  a_gate_that_aliases_another:
    enforced_by: [atlasinv._inv_gates_resolve_distinctly, agentpolicy.gate_resolution]
    shape: many gate names resolve to one command — the plain test runner, a bare runtime, a bare build
      tool — so each reads as its own passed check while one run proved only the first
    looks_like: broad gate coverage, every name resolving
    tell: 'race_detection resolves to `go test` without -race, and so do timeout, auth and contract tests'
    sightings: 1
    prevented_by: gates_resolve_distinctly fails any collision outside gate_alias_groups, and a bare runtime
      or library driver resolves to absent with its closer
  a_generator_that_reads_the_disk_not_the_tree:
    enforced_by: [contextcost.example_coverage, exrun.examples]
    shape: a generator or count walks the directory on disk, so local build output and ignored
      files enter a document that CI, on a clean checkout, renders differently
    looks_like: a green pre-commit and a red Contract job on the same commit
    tell: 'the generated table links to files under an ignored build directory that exist only on the machine that ran the example'
    sightings: 3
    prevented_by: example walks read the tracked tree. DECLARED BLIND SPOT, a promise to come back —
      about 25 other globs still walk the disk, over directories no build writes into today
  an_allowed_binary_whose_argument_nothing_adjudicated:
    enforced_by: [agentpolicy.argument_verdict, agentpolicy.argument_paths]
    shape: a control checks argv[0] against an allowance and a denial list and stops, so a path
      carried in the command's ARGUMENTS reaches a decider that was never called
    looks_like: a narrow-tools control with a correct sandbox decider beside it
    tell: 'the sandbox function is correct and complete, and grep finds no call site that passes it a command argument'
    sightings: 4
    prevented_by: argument_paths resolves the paths a command carries and hands each to the same
      path_verdict the sandbox control already names, so there is no second copy of the rules
  a_success_rendering_read_as_an_answer:
    enforced_by: [resilience.missing, resilience.answer_or_refuse]
    shape: a call is counted as answered because its status code or exit code said so, while its
      payload carried nothing — and the empty answer is then scored as a WRONG one
    looks_like: a successful request with a token count beside it
    tell: 'one answer path in the same file refuses an empty payload and another returns it, so the predicate was written twice and one copy is missing a clause'
    sightings: 4
    prevented_by: every answer path judges its payload through one predicate that names the paths it
      requires, and a numeric zero or false stays an answer because those are values
  a_check_satisfied_by_a_rendering:
    enforced_by: [atlas.check, atlasgen.current_version_errors, freshness.last_contract, handoff_test.freshness_shallow_case]
    shape: a check asks whether a value appears ANYWHERE in a file, so any rendering of it satisfies
      the check while the one line that states it is stale
    looks_like: a passing version check
    tell: 'the navigation line names an old version, and the check passes because a generated table in the same file carries the new one'
    sightings: 2
    prevented_by: version_sites names a pattern for the one line that states the version
  a_class_that_skipped_its_base:
    enforced_by: [agentpolicy.required_gates]
    shape: a specialised policy class lists its own requirements and silently drops the base ones
      every member of the family needs
    looks_like: a complete checklist for the special case
    tell: 'an API or security change must pass its own gates but not the compile, format and unit tests every code change needs'
    sightings: 1
    prevented_by: profiles declare `extends`, and required_gates resolves the base first
  a_non_answer_scored_as_wrong:
    enforced_by: [taskbench.score]
    shape: a scorer maps a refusal, a decline or an unparsed format onto WRONG, so the number
      measures the prompt or the parser instead of the model
    looks_like: a large, clean improvement
    tell: 'a blind arm scores near zero on a yes/no question, below a coin flip, because the model declined to guess'
    sightings: 2
    prevented_by: score returns None for a non-answer, and a run holding any None is refused
  a_named_mechanism_that_does_not_exist:
    enforced_by: [atlasgen.missing_path_errors]
    shape: policy prose sends work to a job, file or workflow that nothing implements
    looks_like: a covered case, with a place named for it
    tell: 'the policy says a scheduled workflow runs these examples, and the workflows directory holds no such file'
    sightings: 1
    prevented_by: every backticked path in a document must exist, and a place is named by its path
  a_bad_result_captioned_and_passed:
    enforced_by: [taskbench.record, taskbench.score]
    shape: a result that is bad or off-goal gets a caption (a chance baseline, a footnote, "sample")
      and the work moves on, instead of the cause being diagnosed and fixed on the run that produced it
    looks_like: an honest report — the number is true, and the defect behind it ships
    tell: 'a surprising score is published beside a baseline or caveat, with no miss ever printed'
    sightings: 1
    prevented_by: taskbench refuses to record a non-answer, or an arm where Thea scores BELOW blind,
      and --misses prints every wrong answer so the cause is named before any number is kept
  a_count_typed_into_prose:
    tell: 'a number in a document disagrees with what the tool prints today, and no tool generated that number'
    enforced_by: [atlas.generated_errors, atlasgen.measured_block, atlasgen.typed_size_errors]
    shape: writing a number into a document instead of generating it or naming the instrument
    looks_like: an accurate sentence, on the day it is written
    sightings: 3
    prevented_by: the generated blocks, and a reviewer who asks where a number came from
  a_mutation_planted_where_the_checker_never_reads:
    shape: a test plants a defect in a source file, and the checker under test runs in the same process
      with that module already imported, so the planted code is never loaded
    looks_like: a mutation test of a code rule
    tell: the planted file differs on disk and the in-process verdict does not move; a subprocess would see it
    sightings: 1
    prevented_by: plant a code-shaped defect in the object the checker receives (a parser, a record), or
      run the checker in a subprocess — never edit a module the running suite already imported
    unenforceable: a guard refusing mutation of any loaded module misfires on cases that read source TEXT
    closed_by: the reviewer of any new case that mutates scripts/*.py, asking whether the check re-imports it
  a_fixture_that_names_what_it_could_read:
    tell: 'the test''s hard-coded value no longer exists in the file, so its planted edit changes nothing and the test still passes'
    enforced_by: [atlas_test.mutated]
    shape: a test anchoring on a literal — a version, a budget, a file list — that later moves
    looks_like: a passing test that planted nothing
    sightings: 4
    prevented_by: atlas_test.mutated, which refuses when the planted text equals the original
  a_turn_spent_rewording_instead_of_building:
    tell: a ratchet breach fixed by trimming and re-running the check, once per sentence, until it passes
    enforced_by: [contextcost._largest_parts, atlasinv._inv_code_blobs_are_bounded]
    shape: an agent treating a failing cap as a writing exercise — cut a phrase, re-measure, repeat — instead of reading what the check names and building the fix once
    looks_like: steady progress; it is the same measurement taken several times
    sightings: 2
    prevented_by: a breach names its largest parts, so the cut is chosen once; measure every cap BEFORE editing and plan against it
  a_local_tweak_that_edited_a_public_repository:
    tell: a one-line edit to a file under ~/.claude that turns up as an unpushed commit on a public repository's main
    enforced_by: [contextcost.skill_cost_errors]
    shape: a user-config path that is a SYMLINK into a tracked repository, so editing the convenient copy edits the repository with all its gates
    looks_like: a local preference change, until the push is refused by a branch rule
    sightings: 1
    prevented_by: the shipped copy carrying its own budget, so the edit is judged here rather than discovered in a consumer's per-turn budget; and landing it through a lane like any other change
  a_plant_left_by_a_killed_run:
    tell: a reviewer's verify reported a contract drift the source never contained — the planted value, verbatim
    enforced_by: [safeedit.plant_leftovers, safeedit.restore_leftovers, atlas_guards_test.plant_journal_cases]
    shape: a test that plants a defect and restores it in a finally block, killed by a timeout before the finally runs
    looks_like: a real defect in the repository, found by the repository's own checker
    sightings: 1
    prevented_by: a journal written before every plant, a check that refuses a leftover, SIGTERM turned into an exit, and --restore
  a_read_only_audit_that_ran_a_mutating_suite:
    tell: an agent told to read only ran the planted suite in a worktree another session was editing
    enforced_by: [safeedit.suite_holds_worktree, atlas_guards_test.read_only_cases]
    shape: a process that plants and restores tracked files running beside an editor it cannot see
    looks_like: a clean tree afterwards, because the restore put its own bytes back over the edit
    sightings: 2
