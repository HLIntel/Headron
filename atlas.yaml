    sightings: 1
    prevented_by: 'key streamed tool-call deltas by their index within the choice, assign an id when the provider omits one, and refuse a finished call that still has none rather than dropping it'
    unenforceable: 'no stream parser lives in this tree; the parser is the client''s'
    closed_by: 'a conformance case in the client that replays a recorded id-less stream and asserts the call executes'
  a_second_claimant_of_a_singleton:
    shape: 'two instances of a control-plane daemon — one started by the desktop app, one from a terminal or a package manager''s service — both claim work from the same queue, so tasks run twice, race on the same worktree, or are acknowledged by one and executed by neither'
    looks_like: 'duplicated or vanished work with every process healthy and every probe green'
