# "NO MODULE OUTSIDE X MAY CALL Y" IS A ROW HERE, NOT A FUNCTION (3.31.0). Three guards in this
# tree were the same guard with different literals — measured 0.859 AST-similar for two of them and
# 0.67 for the third — and `allowed_duplicate_structures: 0` missed all three because it requires
# AST identity. Three copies had already drifted: different rosters, different exemptions. The logic
# now lives once in callshape.py and each rule is data, reviewed like a declaration.
#
# A row cannot be added without a planted case: callshape_cases refuses a row no case exercises,
# the way every denied_commands row must carry a sample. An exemption states its reason HERE, so the
# reason travels with the rule instead of ageing inside code nobody opens.
forbidden_calls:
  bare_sleep:
    why: 'a fixed sleep standing in for a condition is too long on a fast day and too short on a slow one, and hides which'
    aliases: [time]
    attrs: [sleep]
    roster: [scripts, fuzz]
    exempt_files: [resilience.py]
    exempt_reason: 'resilience owns every wait in this tree, so the one real sleep lives there'
    message: 'calls time.sleep — wait on a condition with resilience.wait_until instead'
  yaml_loader_bypass:
    why: 'MEASURED at 2.27.0 — the strict loader claimed every YAML read and 11 bypassed it, so a duplicate key resolved to its LAST value on those paths'
    aliases: [yaml, _yaml]
    attrs: [load, safe_load, full_load, unsafe_load, load_all, safe_load_all]
    roster: [scripts, fuzz]
    exempt_files: [atlascore.py]
    exempt_suffix: _test.py
    exempt_reason: 'atlascore OWNS the strict loader, and a test harness calls the raw loader on purpose to BUILD a document the strict one must refuse'
    message: 'calls a PyYAML loader directly — it bypasses the duplicate-key refusal AND the parse cache; use atlascore.strict_yaml'
  subprocess_without_timeout:
    why: 'FOUND at 3.6.0 — a model call hung past its timeout and 42 other calls had no bound at all, git included, which waits forever on a credential prompt'
    aliases: [subprocess, _sp, sp]
    attrs: [run, check_output, check_call, call]
    roster: [scripts]
    requires_keyword: timeout
    message: 'runs a subprocess with no timeout — a hang is unbounded'
  raw_tree_walk:
    why: 'MEASURED at 3.50.0 — one contract run called ast.walk over a million times, instruments re-walking the trees parsed_python already shares; routing them through atlascore.walked cut CPU in every paired run'
    aliases: [ast, _ast]
    attrs: [walk]
    roster: [scripts, fuzz]
    exempt_files: [atlascore.py]
    exempt_reason: 'atlascore OWNS the one walk, cached beside the shared trees it walks'
    message: 'calls ast.walk directly — it re-walks a shared tree every caller already has; use atlascore.walked'

# A GUARD THAT SKIPS A MISSING INPUT MUST NAME WHO REFUSES THE ABSENCE (3.47.0). `if not path.exists():
# continue` inside a check prints what a clean pass prints, so deleting the input turns the guard green.
# Each skip below is kept only because the function it names refuses the absence — resolved against the
# tree — or because absence is the valid state and the reason says so. callshape.blind_skip_errors
# refuses any other skip, and any row here whose skip is gone.
absent_input_owners:
  atlasinv.py:duplicate_prose_errors:
    owned_by: contextcost.entry_cost_errors
    reason: 'an entry path naming a file that does not exist is entry_cost_errors'' finding'
  atlasinv.py:_inv_host_is_not_a_capability:
    reason: 'an editor task file is optional; a tree with none has no host-only logic to refuse'

# WHAT THE HOST SHAPES READ (3.47.0). scripts/hostshape.py decides twelve shapes that break on the operator's
# host rather than in this tree; these are its defaults, and a host may pass its own. Each value is a CLASS
# (a glob, a floor, a bound), never a path on any one machine.
host_shapes:
  baseline_max_age_hours: 26
  min_binary_bytes: 16384
  sweep_walk_limit: 50000
  app_state_globs: ['.*/plugins/*', '.*/themes/*', '.*/workspace*', '.*/cache/*', '.trash/*', '*.sqlite', '*.sqlite-*', '*.db']
  source_markers: [Modelfile, Dockerfile, Containerfile, Makefile, '*.py', '*.sh', '*.md', '*.toml', '*.yaml', '*.yml']
  derivable_dirs: [pip, uv, npm, _cacache, go-build, yarn, pnpm, huggingface, torch, ms-playwright]

# THE INSTRUMENT ROSTER'S DENOMINATOR (3.31.0). It was `scripts/*.py`, an enumeration BY SUFFIX, and
# `scripts/heavyidle.mjs` is a declared instrument that sat OUTSIDE its own completeness check — so a
# second non-Python script needed no row and nothing would have fired. The denominator is now every
# file directly under scripts/ except the ones named here, each with its reason.
#
# THE BIAS IS DELIBERATE. A new SCRIPT of any language is included and fails loudly until it is
# declared; a new DATA file is also included and fails loudly until it is named below. Loud in both
# directions beats an extension list that silently stops looking.
# THE ENFORCEMENT RUNG, RUN ON THIS REPOSITORY AT LAST (3.32.0). `enforce.py` is the rung Thea ships to
# OTHER repositories, and it had never run on this one: `enforce.py check` was wired into no hook and no
# workflow here. Running it found three defects in it, which is what an unshipped arm always hides.
#
# `install` also refused here with no way forward — core.hooksPath points at a TRACKED hooks directory,
# which is this repository's own code and must not be rewritten by a program. That refusal is right; the
# missing half was that nothing then ran the rung. It is now a line in .githooks/pre-commit, and a
# planted case refuses a hook that drops it.
enforcement:
  undecided_exits:
    why: 'a classifier that gives "could not decide" and "decided no" one label turns absence of evidence
      into evidence of absence — and this rung already says SKIP IS NOT PASS, which is the same rule'
    pytest: [5]
    reason: 'exit 5 from pytest means NO TEST WAS COLLECTED, so it ran nothing and decided nothing.
      Measured here: scripts/agent_test.py and scripts/agent_properties_test.py are named *_test.py and
      are standalone harnesses with their own main, not pytest suites, so pytest collected nothing and
      the rung called a working harness refused'
  planted_failure_paths:
    'benchmarks/agent/': 'every task under this prefix is a PLANTED bug whose FAILING test IS the
      artifact — it is the task an agent benchmark asks a model to fix. A rung that refuses these
      refuses the fixture for being the fixture, and a guard that fires on correct content gets
      switched off'

instrument_roster:
  # AN INSTRUMENT NO GATE AND NO INVARIANT REACHES (3.31.0). Four were measured here by taking the
  # transitive import closure of verification_policy/done_set plus every script named in a workflow.
  # Each has a real reason, and until now NONE of them said so anywhere — which is the declared blind
  # spot this repository refuses in every other roster. A new unreached instrument now fails until it
  # is either wired or named here with what it costs and what would run it.
  unreached:
    'codexbrief.py': 'it is a deliberately on-demand projection for agent runtimes; its output is consumed as a compact context packet rather than as a repository verification gate'
    'agentbench.py': 'it spends money on a real model per run, so it is run deliberately and its
      record is what the benchmark floors read'
    'taskbench.py': 'the same — a measured run against real models, read afterwards through its record'
    'heavyidle.mjs': 'it measures idle time in a store outside this repository, so it has nothing to
      assert about this tree and is run by the owner against that store'
    'packprobe.py': 'it runs each pack''s real toolchain, and a machine without one would report an
      absent compiler as a finding — so it is run deliberately per machine. It is also the declared
      closer for two other instruments, which is exactly why it must be named here rather than
      quietly unreached'

  not_a_script:
    requirements.txt: 'a pip input read by the install, not an instrument that proves anything'
    edges.py: 'the case -> enforcer edge that atlas_test.py imports; its proof and limits are that instrument''s, and THEA_CASES_FULL=1 is its control route'
    identity_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    chatskill.py: 'the chat-skill builders that atlasgen.py maps into GENERATED_FILES; its proof and limits are that instrument''s'
    floor_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    vanish_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    consumer_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    installcheck.py: 'the documented-install runner that `cli_test.py --install` runs and atlasinv checks statically; its proof and limits are that instrument''s'
    shebang_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    fetch_test.py: 'a case module that atlas_guards_test.py imports; its proof and limits are that instrument''s'
    requirements.lock.txt: 'the hash-pinned closure of that input, verified by the build, not an instrument'
    build-requirements.lock.txt: 'the hash-pinned build tools the release job installs, not an instrument'

# EVERY INSTRUMENT, WHAT IT PROVES, AND WHO CLOSES WHAT IT DOES NOT.
#
# A number with no instrument beside it is rhetoric, and an instrument whose limits are unnamed is
# read as proving more than it does. Until 1.3.0 those limits lived in README prose as "blind
# spots": true, dated, and owned by nobody. Here every entry MUST name a closer — another
# instrument, or a command a person runs — and `atlas.py check` fails on an entry that leaves
# `closed_by` empty and on any scripts/*.py this roster does not name. A blind spot with no owner
# is therefore unrepresentable rather than merely discouraged.
#
# README's instrument table is GENERATED from this block, so it cannot drift from it.
# A FRONT END IS DECLARED, NOT BUILT (3.7.0). Declared so its contract exists before its code:
# it is one more READER of the records the CLI already emits, never a second implementation of a
# verdict. Nothing reads this block as capability — status says so, and the day one is built it
# must pass through `thea commands --json` and the output schemas like every other reader.
front_end:
  status: planned
  reads:
  - "thea-commands/1 (the roster)"
  - "tools/atlas-output.schema.json (route, gate, plan and process records)"
  - "thea-mcp tools/list (for a front end that is itself an MCP client)"
  first_screen: a file path in, its route, the numbered gates that prove a change, and each gate's
    live verdict — the same answer `thea gate <file>` prints
  refuses: any verdict it computed itself; any write the CLI would not make; a copy of the roster
  closed_by: the owner deciding it earns its weight — until then the CLI and MCP route are the interface

instruments:

  'agents.py':
    script: scripts/agents.py
    proves: which agent sessions this machine saw within the live window, one per agent — a hook record and
      an MCP record in the same directory count once, an MCP-only agent still counts, a torn record is
      reported and fails the listing, and a hook payload with no session id writes nothing; and that only the
      modules it declares in NETWORK_MODULES import a network library, so Thea's data stays on the machine
    does_not_prove: that a session is honest about its name or that every agent was seen — an agent with
      neither hooks nor the MCP server never reports, and it prints that blind spot every run; nor that a
      subprocess (git, a package manager) Thea starts stays offline — those talk to remotes the user set
    closed_by: agents_test.py, which plants each registry state; a hosted team dashboard that counts from
      its own server side for the plans that rely on the count
  'agents_test.py':
    script: scripts/agents_test.py
    proves: the agent registry bites — a double-counted hooked agent, a missed MCP-only agent, a stale
      session counted as running, an invented session id, a torn record skipped silently and a hook that
      exits 2 on bad input each fail a named case, as does a network import outside NETWORK_MODULES
    does_not_prove: that a real agent runtime sends the payload fields the hook reads; its inputs are planted
    closed_by: atlas_test.py, which runs it inside its own counted main
  'codexbrief.py':
    script: scripts/codexbrief.py
    proves: a bounded machine-readable context packet resolves from Thea's existing route, scope, task/change gates, labels and local failure traps without duplicating those declarations
    does_not_prove: that the suggested next action is correct or that a consumer obeys the packet; it is a projection of declarations, not verification
    closed_by: the route, plan and gate instruments that own each field, plus the consuming runtime's own outcome measurement
  'heavyidle.mjs':
    script: scripts/heavyidle.mjs
    proves: a multi-GB artefact that nothing has touched is reported with its size in ALLOCATED bytes and
      its idle age, against a bound declared in BYTES and a window declared in days, with the count of
      items it measured printed beside the finding count
    does_not_prove: that a finding is UNREFERENCED — it measures idle time only, and a live dependency can
      sit untouched for a year; only a code search over the tree shows whether anything still calls it
    closed_by: the owner, who greps for the artefact before removing it and records a restore command
  'hostshape.py':
    script: scripts/hostshape.py
    proves: a record the host hands in — a harness baseline, a step journal, a change and probe log, a process
      list, a sweep plan, a tracked-path list, a per-cwd root probe — is refused on each host shape the ledger
      names, and an absent or one-sided record is itself a finding
    does_not_prove: that the host runs it, or that the record is honest; a check nobody schedules catches nothing
    closed_by: the host job each ledger row names, which calls the check on its own schedule and fails on its exit code
  'mdshape.py':
    script: scripts/mdshape.py
    proves: every tracked Markdown file is in a class with a rule — a living note under its byte cap, free of
      narration and reachable from an entry or a path reference; a record append-only in a commit or a branch
      and rotated at its cap; a generated file left to its generator
    does_not_prove: that a living note is correct or a record was right when written — only the shape a reader
      relies on, that the first is current by construction and the second is exactly what was seen
    closed_by: a reviewer reading the note against the system it describes
  'brainstorm.py':
    script: scripts/brainstorm.py
    proves: a strategic brainstorm record diverged to the declared floor with a do_nothing baseline, scored every
      option on every axis, pre-mortemed each with a kill signal, chose an option no other dominates, escalated a
      one-way door to a named approver, and ends in a step with its proof
    does_not_prove: that the options were the right ones or the scores honest — only the shape that makes a bad
      choice visible
    closed_by: the approver named for a one-way door, and the proof the record's next step names
  'port.py':
    script: scripts/port.py
    proves: a file, a place or a tree resolves to one record — route, stack tier, place, labels, the gates with
      their commands, the ledger's lessons with their moves, the documents to read and the next commands —
      at three lenses and five frames, and every thea command sits on some lens's menu
    does_not_prove: that a gate passes or a lesson applies — it routes to the things that decide both
    closed_by: the gates and lessons it names, each proven by its own instrument
  'vaultlinks.py':
    script: scripts/vaultlinks.py
    proves: a wikilink graph resolves the way the note-taking tool itself resolves — exact relative path
      first, then a unique leaf filename — so a dangling link, a bare link whose stem is not unique, and an
      island are each counted under a stated definition rather than a plausible approximation
    does_not_prove: that an unreferenced attachment is orphaned, or that an island is a defect; a generated
      query can reference a file the filename scan cannot see, and daily notes and archives are terminal by
      design, which is why they are bucketed rather than counted
    closed_by: the owner, who judges each ambiguous link against the linking note's context
  'providers.py':
    script: scripts/providers.py
    proves: a measurement reaches any OpenAI-compatible provider through one path, at a declared pace,
      with keys read by NAME from the environment and never printed; a missing key is refused by name
    does_not_prove: that the vendor's quota is free of other jobs on the same key — it sees the sum
    closed_by: the owner, who pauses sibling jobs on a shared key before a large run
  'atlas_guards_test.py':
    script: scripts/atlas_guards_test.py
    proves: the guards added at 2.27.0-2.28.0 bite — each plants its defect and asserts the contract
      refuses it, counted in atlas_test's own CASES so a skipped case moves the asserted total
    does_not_prove: anything atlas_test.py does not already claim; it is that suite, split for shape
    closed_by: atlas_test.py, which runs it inside its own counted main
  'handoff_test.py':
    script: scripts/handoff_test.py
    proves: a handoff binds one artifact to route evidence, bounded context and acceptance commands
    does_not_prove: that a recipient implements the requested change correctly
    closed_by: atlas_test.py, which runs it inside its own counted main
  'judge_test.py':
    script: scripts/judge_test.py
    proves: a typed judgment acts at its bar, takes `below` under it, lets a declared fact beat p, refuses a
      misspelt fact or a bad p, fails a bar its outcomes do not support, and refuses a record with an
      undeclared answer, a coin-flip bar or a default it does not offer
    does_not_prove: that any caller's probability is calibrated — only that a miscalibrated bar is caught
    closed_by: atlas_test.py, which runs it inside its own counted main
  'model_test.py':
    script: scripts/model_test.py
    proves: the vendored student loader matches the golden fixture, `thea model --json` is the record the
      dashboard reads with an exit code that follows the verdict, and the sha, staleness and fallback guards
      each kill a mutant that removes them
    does_not_prove: that the golden fixture covers every state a caller will send
    closed_by: atlas_test.py, which runs it inside its own counted main
  'schedtargets_test.py':
    script: scripts/schedtargets_test.py
    proves: the scheduler sweep bites — a deleted repo, a green-on-dead wrapper, a macOS path on linux,
