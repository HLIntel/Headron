version: 0.8.0
default_flow: MODEL.md -> docs/INDEX.md -> atlas.yaml -> runtime_adapter -> domain_guide -> pattern -> verify

hard_invariants:
  - no_unbounded_growth
  - immutable_first
  - schema_first
  - explicit_deadlines
  - least_privilege
  - independent_verification
  - auditable_changes
  - rollback_high_impact
  - one_source_of_truth
  - atlas_consistency
  - ide_is_not_enforcement
  - ci_enforces_contract
  - polyglot_boundaries_are_contracts
  - durable_artifacts_are_reachable_or_declared
  - mcp_is_task_scoped
  - native_language_tools_are_authoritative

artifact_routes:
  '.py': python
  '.pyi': python
  '.rs': rust
  '.go': go
  '.ts': typescript
  '.tsx': typescript
  '.c': c
  '.h': c
  '.cpp': cpp
  '.cc': cpp
  '.hpp': cpp
  '.zig': zig
  '.mojo': mojo
  '.jl': julia
  '.ex': elixir
  '.exs': elixir
  '.gleam': gleam
  '.nim': nim
  '.v': v
  '.odin': odin
  '.ha': hare
  '.fut': futhark
  '.hs': haskell
  '.lhs': haskell
  '.fs': fsharp
  '.fsx': fsharp
  '.chpl': chapel
  '.bqn': bqn
  '.ua': uiua
  '.lean': lean4
  '.carbon': carbon
  '.roc': roc
  '.qs': quantum/qsharp
  '.cu': cuda
  '.cuh': cuda
  '.sql': sql
  '.sh': bash
  '.bash': bash
  '.wat': webassembly
  '.wasm': webassembly

routing_policy:
  precedence:
    - explicit_path_or_task_override
    - artifact_extension
    - project_manifest
    - language_directory
    - issue_labels
    - generic_fallback
  canonical_outputs:
    guide: languages/<route>/README.md
    native_tools: languages/<route>/README.md
    runtime: models/<runtime>/README.md
    mcp: integrations/MCP-LANGUAGE-MATRIX.md
    verification: docs/VERIFY.md
  issue_labels:
    kind_prefix: 'kind/'
    language_prefix: 'lang/'
    area_prefix: 'area/'
    runtime_prefix: 'runtime/'
    mcp_prefix: 'mcp/'
    risk_prefix: 'risk/'
    status_prefix: 'status/'

branch_policy:
  default_base: main
  permanent_language_branches: false
  language_lane_pattern: 'lang/<language>/<topic>'
  topic_patterns:
    feature: 'feat/<topic>'
    fix: 'fix/<topic>'
    research: 'research/<topic>'
    security: 'security/<topic>'
  worktree_pattern: '../Code-Development-wt/<language>-<topic>'
  isolation_rule: one_mutable_writer_per_worktree

issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  debugging: [vscode, language_debugger, runtime_debugger, profiler]
  gpu: [cuda, mojo, futhark, chapel, julia]
  security: [static_analysis, dependency_scan, secret_scan]
  polyglot: [schema, ownership, compatibility, integration_test]
  drift: [links, routes, versions, orphans, dependencies, environment]
  mcp: [github, serena, playwright, context7, dbhub, semgrep]
  routing: [atlas, extension, manifest, issue_labels]
  branch: [worktree, language_lane, topic_branch, merge]

task_routes:
  mechanical: [fast_model, cli, focused_verify]
  implementation: [coding_model, language_stack, tests]
  debugging: [vscode, language_debugger, focused_repro, regression_test]
  architecture: [strong_reasoning, atlas, adr, worktree]
  research: [research_model, primary_sources, isolated_context]
  security_review: [verifier, scanners, isolated_context]
  performance_review: [profiler, benchmark, workload]
  parallel_development: [git_worktree, vscode_multi_root, opencode_workspace]
  polyglot_change: [schema_first, boundary_contract, native_toolchains, integration_test]
  autonomous_agent: [narrow_tools, sandbox, budget, approval, audit]
runtime_roles:
  vscode: interactive_ide_agent_host
  opencode: terminal_agent_workspace
  github_actions: authoritative_repository_verification
  cli: deterministic_local_harness
