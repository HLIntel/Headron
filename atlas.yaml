# A READING SERVED FROM A CACHE IS NOT A MEASUREMENT OF NOW.
#
# Two of these bit in a single session, and both LOOKED like a failed change rather than a stale
# read: a merge state that reported CLEAN while the required checks were still running, and a
# language bar that showed the old number for minutes after the fix had already merged. In both
# cases the authoritative source was one call away and disagreed with the page.
#
# The rule is not "distrust caches" — it is that every external reading names WHICH cache serves
# it and WHAT defeats that cache, so a stale number is diagnosable instead of being re-fixed.
# `atlas.py check` refuses an entry that names no authority.
  a_rebase_that_runs_before_a_push_that_will_be_refused:
    shape: a fetch-rebase-push chain rebases FIRST, so when the push is refused — branch protection, a
      missing permission, a required review — the local tip has already been reset onto the remote and the
      commit is no longer on the branch
    looks_like: one push error, read as the only failure; the branch then reports ahead=0 and a clean tree,
      exactly as if nothing had been written
    tell: 'a push or gate error and ahead=0 in the same run, and the commit is reachable only from `git reflog`'
    sightings: 2
    enforced_by: [branchstate.land]
    still_open: an agent rebasing in its own ad-hoc shell is outside any script here; the tag only covers a
      landing that goes through `branchstate.py --land`, which is the only supported path on a protected branch
    closed_by: tag the lane tip by NAME before any land or rebase, so recovery does not depend on the
      reflog; on a protected branch commit to a feature branch and open a PR, never rebase the protected
      branch; and when a push is refused, read the tag or `git reflog` before re-doing the work
    prevented_by: 'dry-run the push (`git push --dry-run`) or read the branch protection BEFORE rebasing'
  a_reclaim_undone_by_the_producer_that_was_never_disabled:
    shape: a derived or downloaded artefact is deleted, the space is measured and reported reclaimed, and
      the process that PRODUCED it is still enabled — so it is re-created on its next eligible window and
      the reclaim silently reverses
    looks_like: a correct before/after and a real df delta, both taken before the producer next runs
    tell: the artefact returns at its original size with nobody asking for it, and its producer's setting
      was never read
    sightings: 1
    unenforceable: the producer is a vendor feature outside this tree, and nothing here can read a browser
      flag or an OS setting to know whether it is still on
    closed_by: disable the producer FIRST, then delete, then verify the artefact stays gone across one full
      cycle of it — a reclaim is not measured until the producer has had a turn
    prevented_by: before reporting any reclaim, name WHAT WRITES the thing and whether that is still running
  a_prerequisite_reported_as_the_capability:
    shape: one of several conditions a capability needs is satisfied and the capability is reported working
      — a bridge registered with no client installed, a key present but unauthorised, a route added that
      nothing calls, a roster widened that no reader reads, a model listed by a provider's roster or a
      health endpoint answering 200 read as the model being able to serve the task
    looks_like: an honest, verified fix that names correctly the one thing it actually checked
    tell: list every condition the capability needs and check each one; the feature still does nothing end
      to end
    sightings: 2
    unenforceable: which conditions a capability needs is judgement about the system being fixed, not a
      property this tree can enumerate
    closed_by: exercise the capability END TO END before reporting it, or state plainly which conditions
      were not checked and that the fix is therefore unproven
    prevented_by: a fix is reported as PREREQUISITE SATISFIED until something has been driven through it
  a_round_trip_that_drops_what_the_format_allowed:
    shape: a config is read with a permissive parser, edited as objects, and written back with a STRICT
      serialiser that cannot represent what the format allowed — comments, key order, trailing commas.
      The parse succeeded, the write succeeded, and the file is now missing the part no schema describes
    looks_like: a clean diff of the change you intended, with a suspicious number of DELETIONS beside it
    tell: 'the added and removed line counts are both large for a change that only appends; removed
      lines are comments, or are identical to added ones except for encoding'
    sightings: 2
    enforced_by: [safeedit.add_entry, atlas_guards_test.ledger_entry_cases]
    closed_by: serialise only the NEW objects and splice them in as TEXT, then VERIFY BY READ-BACK that
      the comment count did not fall. Never round-trip a whole commented file through a strict writer
    prevented_by: a JSONC or YAML file with comments is edited as TEXT, never as a parsed object graph.
      The comments are the load-bearing part - they record why a line exists, which no key name carries

  a_silence_read_as_a_verdict:
    shape: 'a probe that got NO RESPONSE — a timeout, a refused connection, the machine asleep — is recorded as the thing it probed being down, and a pruner then removes it'
    looks_like: 'a tidy tuning run: lanes that kept failing were retired'
    tell: 'the retired rows all carry http 000 or null, several from the same run, and none ever answered with a refusal'
    sightings: 1
    prevented_by: 'three outcomes, never two: answered yes, answered no, did not answer. Only an answer moves a verdict, and a run where most probes are silent is a blackout that changes nothing'
    enforced_by: [enforce._undecided]
  a_credential_typed_into_a_command:
    shape: 'a secret is written as a literal inside a command — echoed into a keys file, passed as a flag, pasted into a block handed to someone else — so it lands in shell history, the transcript and wherever the command runs'
    looks_like: 'a convenient one-liner that sets the key up'
    tell: 'a known credential prefix (a KGAT, ghp, sk or AKIA token) appears inside the command text itself rather than as a variable name'
    sightings: 1
    prevented_by: 'refer to credentials by NAME from the keys file; a command that must set one reads it from a prompt or the environment'
    enforced_by: [agentpolicy.shell_verdict]
  a_quote_that_outlived_its_text:
    shape: 'a test locates its target by QUOTING the file it plants into — an anchor, a sentence, an index call — and an edit to that file removes the quoted text, so the test crashes or silently applies nothing'
    looks_like: 'a clean `thea check` followed by a suite that dies minutes in with substring not found'
    tell: 'the failing line is an .index( or .replace( on a literal that no longer occurs in the file it reads'
    sightings: 7
    prevented_by: 'read every quoted anchor statically, before the suite runs: mutation anchors, plant tables and file quotes alike'
    enforced_by: [plantcheck.plant_anchor_errors]
  a_first_idea_argued_as_the_only_option:
    shape: 'a strategic choice is made by elaborating the first option that came to mind; alternatives appear only to be dismissed, doing nothing is never costed, and a one-way door is walked through without anyone owning it'
    looks_like: 'a confident plan with a rationale'
    tell: 'the plan names no option it rejected, no signal that would make it wrong, and no one who approved an irreversible step'
    sightings: 1
    prevented_by: 'a brainstorm record: at least three options with a do_nothing baseline, scored on declared axes, each pre-mortemed with a kill signal, and a choice no other option dominates'
    enforced_by: [brainstorm.record_errors]
  a_command_handed_over_with_an_assumed_path:
    shape: 'a command block is handed to a person to run on THEIR machine naming paths the author never saw there, so it fails on the first line that assumed'
    looks_like: 'a copy-ready block'
    tell: 'no such file or directory on a path the author inferred from a convention, never listed on that machine'
    sightings: 1
    prevented_by: 'resolve paths inside the command (`thea --where`, `git -C "$(...)"`, a search) or name only paths seen on that machine'
    enforced_by: [schedtargets.job_faults, schedtargets_test.run]
    closed_by: 'the runtime output style that governs command blocks, which requires resolved or verified paths'
  a_guard_that_passes_when_its_input_is_missing:
    shape: 'a guard answers a MISSING input the way it answers a clean one — `if not path.exists(): continue` or `return []` — so deleting, renaming or never creating the file it checks turns the guard green'
    looks_like: 'a guard that has passed on every run since a move, with nothing in its output to say it read nothing'
    tell: 'delete the input and run the guard: it still exits 0. A clean pass and a pass over nothing print the same silence'
    sightings: 1
    prevented_by: 'a guard refuses an absent input, or names the other guard that refuses it; absence is a finding unless the declaration says it is the valid state'
    enforced_by: [callshape.blind_skip_errors]
  a_window_declared_past_what_the_lane_serves:
    shape: 'a harness is told its context window is larger than the serving lane actually accepts, so the compaction threshold — a fraction of the DECLARED window — is never reached; each turn carries the whole history, and the session grows until the lane rejects a request'
    looks_like: 'a long session that was fine, then every request refused as too long, with compaction never having run once'
    tell: 'per-turn input tokens rise monotonically across the session and no compaction event appears in the log; the declared window exceeds the lane''s served maximum'
    sightings: 1
    prevented_by: 'declare the window as the MINIMUM of what the model supports and what the serving lane accepts, and set compaction against that number'
    unenforceable: 'the window lives in a harness configuration and the cap in a serving lane, both outside this tree'
    closed_by: 'a per-lane check in the harness that reads the lane''s served maximum and refuses a declared window above it'
  a_stream_delta_missing_its_identity:
    shape: 'a provider streams a tool call whose delta carries no id — or an id only on the first chunk — and a client that keys calls by id drops, merges or misattributes it; the tool never runs and the turn ends as if the model chose not to call'
    looks_like: 'a model that "refuses" to use tools on one provider and uses them correctly on another'
