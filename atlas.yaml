  read_every_quoted_anchor_before_the_suite:
    move: 'check every string a test quotes from another file against that file statically, before any planted suite runs'
    when: 'editing a document or source file that tests quote, or adding a test that locates text by quoting it'
    verification: '`python scripts/plantcheck.py` reports zero findings over all anchors'
    evidence: 'six suite runs died on a stale quote before the anchors were read statically'
    pairs: [a_quote_that_outlived_its_text]
    proven_by: [plantcheck.plant_anchor_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  diverge_before_converging:
    move: 'write the choice as a brainstorm record — three options with a do_nothing baseline, axes, pre-mortems, kill signals — and converge only on an undominated option'
    when: 'a strategic or architectural choice, a new route or agent, anything irreversible or expensive to undo'
    verification: '`thea brainstorm <record>` exits 0'
    evidence: 'fleet and routing choices made by elaborating one idea were reworked when the unconsidered option surfaced'
    pairs: [a_first_idea_argued_as_the_only_option]
    proven_by: [brainstorm.record_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 1
  splice_new_objects_as_text:
    move: 'insert new keys into a hand-formatted config as TEXT at a known anchor and read the file back; never reserialise the whole file'
    when: 'adding entries to a JSON, JSONC, YAML or TOML file someone formats by hand'
    verification: 'the diff shows only the added lines, and the file still parses'
    evidence: 'a whole-file reserialise of an agent config turned a 40-line addition into a 134-line diff'
    pairs: [a_round_trip_that_drops_what_the_format_allowed]
    proven_by: [safeedit.write_yaml_verified]
    kinds: [reusable, ai_beneficial]
    reused: 1
  run_a_script_by_its_shebang:
    move: 'run a script as ./x or by the interpreter its first line names, never by its suffix; an rc of 2 from a wrong interpreter is NOT RUN, not FAIL'
    when: invoking any test or guard script whose interpreter is not obvious from its name
    verification: the interpreter in the command equals the one on line 1 of the script
    evidence: a zsh guard suite run under bash returned 2 and was read as a failing test
    pairs: [a_suffix_read_as_the_interpreter]
    proven_by: [atlascore.shebang_gate_argv]
    kinds: [reusable, ai_beneficial]
    reused: 0
  ahead_zero_means_sweep:
    move: 'when a lane reads ahead=0 against its base, remove its worktree, branch and tags in the same step'
    when: after a lane lands or is found already merged
    verification: worktree list and branch list no longer name the lane
    evidence: 'merged lanes left worktrees, branches and tags behind across sessions'
    pairs: [a_finished_worker_leaves_its_resources_running]
    proven_by: [branchstate.worktree_report, branchstate.sweep_remotes]
    kinds: [reusable, ai_beneficial]
    reused: 0
  scope_a_refusal_to_its_pipeline:
    move: 'judge a shell refusal against the one pipeline it concerns, never the whole command line'
    when: a hook or gate refuses a compound command
    verification: a planted command whose refused shape sits in a different statement passes
    evidence: 'the shell hook refused an exit code read after a separate, later command'
    pairs: [a_check_proven_on_one_shape_of_input]
    proven_by: [shellsplit.pipeline_refusal]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 0
  generate_every_quoted_value:
    move: 'print every quoted value with the format''s own emitter — `safeedit.py quote` for a scalar, `safeedit.py entry` for a whole ledger entry — never type the quotes'
    when: 'adding or editing any YAML value, ledger entry or config scalar that holds prose'
    verification: 'the entry reads back equal to its fields, which safeedit.add_entry refuses otherwise, and `atlas.py check` exits 0'
    evidence: 'an apostrophe in a hand-quoted ledger value stopped the whole file parsing — the failure safeedit.yaml_value was written for, repeated because nothing routed edits through it'
    pairs: [a_value_quoted_by_hand]
    proven_by: [safeedit.add_entry, safeedit.yaml_value]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 0
  declare_a_surface_before_loading_it:
    move: 'declare each connector, plugin, MCP server or skill in an allowlist with why it loads and its CLI equivalent, before enabling it'
    when: adding any tool surface to an agent
    verification: 'the surface bound check passes with the new entry, and the loaded count equals the declared count'
    evidence: 'a plugin landed with no allowlist entry, the second surface to grow undeclared'
    pairs: [an_unallowlisted_tool_surface_that_grows]
    proven_by: [atlasinv._inv_tool_surfaces_are_bounded]
    kinds: [reusable, ai_beneficial]
    reused: 0
  sweep_only_what_regenerates:
    move: 'sweep a cache only after proving its owner regenerates every target; anything installed or authored is moved, never deleted'
    when: 'purging any cache, tool store or temporary tree'
    verification: 'the sweep check refuses a planted source file in the target, and the purged tools still run after'
    evidence: 'a cache purge removed installed tools, the second sweep to delete a source'
    pairs: [a_cache_sweep_that_deletes_a_source_file]
    proven_by: [hostshape.sweep_errors]
    kinds: [reusable, frameworkable, ai_beneficial]
    reused: 0
  wait_on_a_shared_lock_under_one_deadline:
    move: 'retry a shared lock every time it frees, under one deadline for the whole wait, never a fixed retry count'
    when: a step refuses NOT RUN because a sibling process holds a machine-wide lock
    verification: 'fake two lost races then a pass: land returns 0 after three attempts; a single-retry mutant returns 75'
    evidence: a file-mechs land lost the suite lock twice and pushed nothing; the loop replaced the single retry (3.50.0)
    pairs: [a_shared_lock_retried_once_against_siblings]
    proven_by: [handoff_test.land_wait_case]
    kinds: [reusable, ai_beneficial]
    reused: 1
  read_the_one_line_that_states_a_value:
    move: 'anchor a freshness check on the one line that states the value, never on any rendering of it in the file'
    when: 'a check verifies a version, count or path is current inside a file that also carries generated copies of it'
    verification: a shallow clone or a stale navigation line is refused although a generated table in the same file carries the new value
    evidence: freshness judged a path current from a rendered table while its stating line was old; last_contract reads the stating line (3.50.0)
    pairs: [a_check_satisfied_by_a_rendering]
    proven_by: [handoff_test.freshness_shallow_case]
    kinds: [reusable, ai_beneficial]
    reused: 1
  put_a_worktree_beside_its_repo:
    move: 'create every worktree beside its repository as <repo>-wt/<name>, and read a tree''s files through files_under, which stops at any directory holding its own .git'
    when: 'a lane, a testbed or a session needs a second checkout, or a new reader walks a tree from its root'
    verification: 'plant a nested worktree holding a network import: network_modules still lists only the tree''s own leak, in git and outside it'
    evidence: copies under .claude/worktrees failed the network-module case on files no branch held (3.51.0)
    pairs: [a_worktree_inside_the_tree_it_copies]
    proven_by: [agents_test._nested_reads]
    kinds: [reusable, ai_beneficial]
    reused: 1
  run_the_repo_by_its_declared_interpreter:
    move: 'run a repository''s scripts through the interpreter its manifest declares (`uv run python scripts/<x>.py`, or the installed launcher), never a bare `python3` whose version PATH decides'
    when: 'invoking any Python script, test or contract check in a repository whose pyproject.toml declares requires-python'
    verification: '`uv run python scripts/atlas.py doctor` exits 0, and a bare-interpreter run below the floor exits 2 with NOT RUN instead of a traceback'
    evidence: 'five sessions ran atlascore.py or safeedit.py under a 3.9 system python3 and read ModuleNotFoundError: tomllib as a broken contract'
    pairs: [an_interpreter_below_the_declared_floor]
    proven_by: [atlascore.refuse_below_floor, floor_test.below_floor_case]
    kinds: [reusable, ai_beneficial]
    reused: 0
staleness_discipline:
  platform_language_bar:
    reading: what the forge reports a repository is written in
    cached_by: the repository page, recomputed asynchronously after a push to the default branch
    authority: the forge's languages API, which is computed on request rather than served from the
      page cache
    measured: the page read 61% Markdown for several minutes after the correction had merged and
      the API already reported 0.5%
  merge_state:
    reading: whether a pull request can be merged
    cached_by: the application's own status cache, which can report CLEAN before the required
      checks on the newest commit have started
    authority: the check-runs for the HEAD COMMIT, by SHA — a status without a SHA beside it is
      about some commit, not about this one
    measured: a CLEAN reading on a commit whose required checks were all in_progress
  parsed_declaration:
    reading: the contract's own view of atlas.yaml and the manifests
    cached_by: an in-process memo, which makes a planted defect on disk invisible to the harness
      that is supposed to detect it
    authority: the cache-clearing call every mutation makes before re-running the check
    measured: a mutation test that edited a schema and passed against the bytes already held
  toolchain_presence:
    reading: whether a declared tool exists
    cached_by: nothing — and that is the point; absence is re-measured per machine rather than
      recorded, because a tool present on one host is a fact about that host
    authority: the pack probe, run where the question is being asked

# WHAT A PERSON OR AN AGENT SHOULD HAVE BEFORE THEY START — AND WHAT THEY SHOULD NOT INSTALL.
#
# The 35 packs answer "what does THIS file need". Nothing answered "what do I need at all", so the
# answer defaulted to whatever the last tutorial installed, and an environment accretes: every
# addition is obviously worth it on the day it is made, and nothing ever measures the sum.
#
# THE `never_by_default` LIST IS THE HALF THAT DOES THE WORK. A baseline that only says what to add
# is a shopping list, and a shopping list is how a workstation ends up with four linters that
# disagree and six servers holding credentials for a task nobody is doing.
#
# `atlas.py doctor` answers which of the required rows THIS machine has; `packprobe.py --mode
# smoke` answers the per-language ones. Nothing here is installed by anything in this repository.
developer_baseline:
  required:
    # Without these the atlas itself does not run, and `doctor` says so per row with what breaks.
    interpreter: {why: 'the harness is Python and declares its floor in pyproject'}
    version_control: {why: 'the router reads the tracked tree, and every roster is derived from it'}
  recommended:
    one_formatter_per_language:
      why: a second formatter is not more rigour, it is a diff that alternates between two authors
    a_language_server:
      why: it answers "where is this defined" without a grep that matches a comment
    a_debugger_you_have_actually_attached:
      why: a debugger nobody has attached is not in the environment, it is in the manifest
    a_terminal_multiplexer_or_worktrees:
      why: one mutable writer per worktree is the isolation rule; without it parallel work shares
        a tree and the loser is whoever pulled last
  never_by_default:
    a_second_linter: refuses nothing the first one allowed, and disagrees with it on style
    a_formatter_on_save_in_a_shared_repository: rewrites files nobody reviewed into every diff
    a_credential_helper_that_caches_without_expiry: a cache miss is not a revocation
    an_always_on_agent_with_write_access: the budget and approval controls exist because
      unattended write access has no natural stopping point
  mcp:
    # AN MCP SERVER IS TASK-SCOPED OR IT IS AMBIENT ACCESS. The profiles in
    # integrations/MCP-PROFILES.md name which servers a TASK justifies; this says what to enable
    # at all, and the rule that decides. A server enabled for a task that ended is a standing
    # capability nobody chose.
    rule: enable the profile the task names, and nothing else; disable it when the task ends
    cost_nobody_counts: every enabled server's tool descriptions are paid on EVERY request, not on
      the request that uses them — an unused server is a subscription, not an option
    review_trigger: before adding one, ask what already answers the question and what the server
      can reach that the task does not need
# SIX CLAIMS, NOT ONE — AND A MANIFEST ENTRY MAKES ONLY THE FIRST.
#
# A tool name written in a manifest is read as saying the tool exists, runs here, is new enough,
# was actually used, passed, and decides the role. Those are six claims with six different owners,
# and collapsing them is exactly how a pack reads as exercised when nothing has ever run it. The
# ladder is declared once; a pack may CLAIM a rung in its own `verification` block, and the rungs
# above `declared` each name the environment they were measured in — because "it ran" is a fact
# about a machine, not about a pack.
#
# THE RUNGS ARE ORDERED. Claiming a rung asserts every rung below it, so a pack cannot claim it
# passed without claiming it was available.
tool_claims:
  declared:
    means: a name is written in a manifest and conforms to the entry grammar
    owner: the pack author
    proven_by: atlas.py check
  available:
    means: PATH resolves it on the machine asking the question
    owner: the machine, never the pack — absence here is a fact about the host
    proven_by: packprobe.py --mode smoke
  version_compatible:
    means: it reports a version at or above the floor the pack declares
    owner: the machine
    proven_by: packprobe.py --mode version
  executed:
    means: it was run against real code in this repository, not merely resolved
    owner: continuous integration, or a codespace carrying that one toolchain
    proven_by: exrun.py for a route that ships an example
  passed:
    means: that run exited zero
    owner: continuous integration
    proven_by: the workflow's exit code, never a line of its output
  authoritative:
    means: its verdict DECIDES the role for this pack, so a gate resolves to it
    owner: the pack's own declaration
    proven_by: gate_tools resolving the role to this entry

# WHEN TO REACH FOR WHICH PACK — BECAUSE 35 PACKS IS A CATALOGUE UNTIL SOMETHING NARROWS IT.
#
# A roster of languages answers "what is supported" and never "what should I use", so the default
# wins: whichever language the author already knows, for every problem. Each axis below is a NEED,
# the packs that answer it, and — the half that does the work — when NOT to reach for that axis at
# all, because most of these are the wrong answer most of the time.
#
# `atlas.py pick` prints them. EVERY route must appear in at least one axis: a pack reachable only
# by already knowing its name is a pack nobody selects, and `check` refuses one.
#
# MATURITY IS STATED, NOT IMPLIED BY PRESENCE. A pack exists here because its toolchain is
# declarable, never because it is recommended for production — and a reader who cannot tell those
# apart will read a roster as an endorsement.
# WHAT GITHUB'S LINGUIST CALLS EACH PACK, or `null` where it classifies the language at all.
# MEASURED at 2.27.0: langbar.py carried an enumerated suffix table of 13 entries and argued in its
# own comment that a fuller table "would be a second roster that narrows". It had already narrowed
# — the tree holds 53 routed suffixes and the live API reported F#, Haskell, Dockerfile and
# Markdown that the projection did not know existed. The map is now COMPLETE over routes and
# `check` refuses a route missing from it, so a new pack cannot enter the tree and leave the bar
# behind. `null` is a real answer: Linguist has no entry for these languages, so counting them
# would invent a bar GitHub will never render.
linguist_names:
  bash: Shell
  bqn: BQN
  cloudflare: null
  c: C
  carbon: null
  chapel: Chapel
  cpp: C++
  cuda: Cuda
  elixir: Elixir
  forth: Forth
  fsharp: F#
  futhark: Futhark
  gleam: Gleam
  go: Go
  hare: Hare
  haskell: Haskell
  julia: Julia
  lean4: Lean
  mojo: Mojo
  nim: Nim
  ocaml: OCaml
  odin: Odin
  python: Python
  quantum/qsharp: "Q#"
  quantum/silq: null
  r: R
  roc: Roc
  rust: Rust
  scala: Scala
  sql: SQL
  swift: Swift
  typescript: TypeScript
  uiua: Uiua
  v: V
  webassembly: WebAssembly
  zig: Zig

# WHO DECIDES EACH STOP AND ESCALATE CONDITION — a function, or a named closer. Declared at 2.27.0
# after an audit found `reproduction_not_obtained` listed as a stop condition that NOTHING decided:
# the same shape as a gate that resolves to silence, recurring in a second roster. Nine of these
# are decided by code; the rest are closed by a person or a platform control and SAY so, because
# a condition nobody owns is a stop that never fires. process_condition_errors refuses the third
# state — a condition some process names and this map does not.
process_conditions:
  approval_required: {decided_by: agentpolicy.approval_verdict}
  production_access_needed: {decided_by: agentpolicy.approval_verdict}
  budget_exhausted: {decided_by: agentpolicy.budget_verdict}
  scope_expanded: {decided_by: agentpolicy.scope_verdict}
  policy_denied: {decided_by: agentpolicy.command_verdict}
  plan_drift: {decided_by: agentrun.plan_drift}
  options_undiverged: {decided_by: brainstorm.undiverged}
  choice_dominated: {decided_by: brainstorm.dominated_choice}
  one_way_door: {decided_by: brainstorm.one_way_door}
  gate_refused: {decided_by: agentrun.run_gates}
  audit_chain_broken: {decided_by: agentaudit.verify}
  lock_outside_declared_range: {decided_by: atlas.declaration_errors}
  secret_detected: {closed_by: 'the platform secret scan and push protection, declared in
      config/github-controls.json and audited live by ghaudit.py'}
  reproduction_not_obtained: {closed_by: 'a person reading the reproduction record — no function
      decides whether a reproduction is real, and saying so is the point'}
  root_cause_outside_scope: {closed_by: 'the task owner, who widens the contract or files it'}
  both_sides_need_changing: {closed_by: 'the owners of both sides of the boundary'}
  boundary_untested: {closed_by: 'a reviewer checking the boundary has a contract test'}
  breaking_change_detected: {closed_by: 'the API owner, per the deprecation window'}
  schema_unversioned: {closed_by: 'the API owner, who versions the schema before it ships'}
  regression_threshold_crossed: {closed_by: 'a reviewer reading the benchmark against its declared threshold'}
  measurement_not_reproducible: {closed_by: 'whoever re-runs the measurement on a quiet machine'}
  workload_not_representative: {closed_by: 'the owner of the production workload being modelled'}

# ROUTING BY FILENAME — routing_policy.precedence declared `project_manifest` and nothing implemented
# it until 2.28.0. A Worker's config is `.toml` or `.json`, extensions every other tool shares, so an
# extension route would capture tsconfig.json with it; the filename is the identity.
project_manifests:
  wrangler.toml: cloudflare
  wrangler.json: cloudflare
  wrangler.jsonc: cloudflare

# WHAT EACH RUNTIME LOADS BY ITSELF, Claude first — declared once, measured on every build into the
# README by contextcost.tokens, and checked against each adapter's own "How it loads" section.
runtime_entry:
- {runtime: Claude Code, id: claude, loads: CLAUDE.md, adapter: models/claude/README.md}
- {runtime: Codex, id: openai_codex, loads: AGENTS.md, adapter: models/openai/README.md}
- {runtime: Cursor, id: cursor, loads: AGENTS.md, adapter: models/cursor/README.md}
- {runtime: opencode, id: opencode, loads: AGENTS.md, adapter: models/opencode/README.md}
- {runtime: Hermes, id: hermes, loads: .agent/bootstrap.json, adapter: models/hermes/README.md}
- {runtime: 'any model given a link', id: generic_llm, loads: llms.txt, adapter: models/llm/README.md}
- {runtime: 'any chat assistant', id: chat, loads: CHAT.md, adapter: models/chat/README.md}

# A RUNTIME KEEPS ITS OWN TOOLS (3.8.0). Thea is ADDED to an agent's layer, never swapped in for it:
# Claude Code, Codex, Cursor, opencode and Hermes each keep the file, shell, search, edit and
# subagent tools they ship with, configured where that runtime configures them, and each may add,
# replace or drop its own tools without asking Thea. Thea reaches every one of them through the
# mechanisms they ALREADY have — a shell runs the CLI, git runs the pre-commit hook, an MCP client
# may mount the read-only route — so nothing an install writes needs to touch a runtime's tool
# configuration, and nothing here may. `agent_policy` narrows commands only inside a run that a
# declared task contract opted into; it is never written by an install and never edits a runtime.
# Checked by atlasinv.native_agent_tool_errors: every runtime_entry id is declared below, an install
# writes no runtime's tool configuration, a tracked tool configuration disables no native tool, and
# each adapter says under "Native tools stay" how that runtime keeps them.
native_agent_tools:
  rule: thea_adds_never_subtracts
  reaches_through: [cli, git_hook, mcp_read_only]
  # RESOLVED, never typed: `git rev-parse --git-path hooks` honours core.hooksPath, so the path an install
  # writes is read from git at check time and compared against every runtime's configuration.
  install_writes: [git_hooks/pre-commit, git_hooks/pre-commit.legacy]
  denying_values: [deny, disabled, "off"]
  disabling_keys: [deny, disabled_tools, disabledTools, excludeTools, exclude_tools, blocked_tools]
  runtimes:
    claude: {tool_config: [.claude/settings.json, .claude/settings.local.json, .mcp.json], thea_via: [cli, git_hook, mcp_read_only]}
    openai_codex: {tool_config: [.codex/config.toml], thea_via: [cli, git_hook, mcp_read_only]}
    cursor: {tool_config: [.cursor/mcp.json, .cursor/cli.json], thea_via: [cli, git_hook, mcp_read_only]}
    opencode: {tool_config: [opencode.json, opencode.jsonc, .opencode/opencode.json], thea_via: [cli, git_hook, mcp_read_only]}
    hermes: {tool_config: [], thea_via: [cli, git_hook], none_because: 'Hermes configures its tools in its own home outside any repository and .agent/bootstrap.json is the file of Thea that it reads rather than its tool configuration'}
    generic_llm: {tool_config: [], thea_via: [], none_because: 'a model given a link has no tools of its own to keep; it reads llms.txt'}
    chat: {tool_config: [], thea_via: [], none_because: 'a chat window runs nothing; it reads CHAT.md'}

# A CHAT CANNOT RUN THE HARNESS, AND IT IS STILL WORTH ROUTING. ChatGPT, Claude.ai, Gemini, Grok or
# a local model in a chat window is where research, ideas and second opinions happen, often FOR an
# agent. Nothing here needs a command: CHAT.md is generated from this block and carries the install
# text, the processes and a route table, so a chat routes a file by reading one page it fetched.
# Checked by atlasinv.chat_errors: every process names steps, a return and a stop, and the install
# text stays under its byte cap — a ratchet, because it is pasted into every session.
# THE FIRST REPLY TO SOMEONE WHO SHARED THE LINK (3.3.0). Observed: a chat given only the link returned
# an accurate summary and offered to do nothing — the user learned what Thea is and got none of it.
# Every entry file now tells the reader to say what it can do NOW, by setting, then ask for the work.
first_sweep:
  # OBSERVED AT 3.11.0: a chat given the link returned an accurate inventory of the repository and offered
  # a file-by-file review — and did nothing under Thea, filed nothing, and said nothing about working from
  # it. Describing the rulebook is not using it; the reply now has to do all three.
  instruction: 'In your first reply to someone who shared this link: say you are working under Thea for the
    rest of this session; do one thing from it now in your setting (below) — route their file, list the
    gates their change needs, or check a pasted diff; and if you see a gap or a mistake in Thea itself, file
    it with the report verb rather than describing it. If the Thea chat skill is not loaded, hand them it now
    (CHAT.md, Install the chat skill). Then ask for their file or task. Never stop at a summary.'
  settings:
    a chat with no tools: name the format, typecheck and test commands for any file they name (the route
      table below, then that pack's tools.yaml), review a pasted diff against the gates, and turn a goal
      into the checklist of gates its change class requires
    a chat that keeps instructions: paste the Install block once, and every later chat starts routed,
      labels its claims and files breaks with the report verb
    an agent with a shell: clone a release tag and run `python scripts/atlas.py gate <file>` — the
      numbered commands that prove a change to that file — then `python scripts/enforce.py install` in
      the repository being changed, so a commit that fails its own toolchain's check is refused
    a repository's CI: call the reusable workflow, and drift fails the pull request
    a retrieval or RAG pipeline: run the retrieval_change gates — chunk boundaries, a freshness stamp,
      hybrid recall and citation checks — so an answer is grounded in what was actually retrieved
    an autonomous agent run: write a task contract, and `python scripts/sandboxgen.py docker <contract>`
      prints the host sandbox it needs — no network, read-only root, only the worktree writable
    a chat or agent with memory: 'save verdicts by id (a gate, a change class, a ledger entry) with their
      contract version, never a paraphrase: an id re-checks against the tree, a summary drifts'

# WHO HANDS WHAT TO WHOM (3.3.0). Work crosses kinds of AI: a person asks a chat, a chat hands the work
# to an agent, an agent asks a model, several agents share one task, an agent reports back through a chat.
# Each pairing names the mechanism that serves it and the ARTIFACT that crosses — a file or a record a
# machine can check, never a paraphrase that drifts on the way across.
topologies:
  person and chat:
    how: 'the Install block in CHAT.md, pasted once'
    hands: 'an answer with its claims labelled and the gate that proves it'
  chat to agent:
    how: 'the handoff process in CHAT.md'
    hands: 'a task contract that validates against tools/agent-task.schema.json'
  agent to model:
    how: 'the one line `atlas.py gate` returns, as the whole context'
    hands: 'a single command, measured as the most accurate and cheapest context'
  agent to agent:
    how: 'one lane each (a worktree and branch), landed with `branchstate.py --land`'
    hands: 'a pull request plus the ledger entries it added'
  agent to person or chat:
    how: '`atlas.py gate <file> --json` and the outcome agentrun.py writes into the contract'
    hands: 'machine-checkable records, never a summary of them'
  chat and chat:
    how: 'the same Install block in each'
    hands: 'ledger entries filed with the report verb, so one chat''s mistake teaches the next'
  anyone to Thea:
    how: 'the report verb, or skills/thea/SKILL.md'
    hands: 'a ledger entry that becomes a guard or an intake that must graduate'

# DRIFT REVIEW, TRIGGERED BY A STRUCTURAL CHANGE — NOT BY A CLOCK (3.6.0). A file left untouched while the
# code around it moves keeps the assumptions it was written with: names, imports, gates, counts. When a
# change touches policy, the harness, a schema, a manifest or an entry file, every file older than the
# horizon that REFERENCES something the change touched is surfaced for review in the same session.
# The tier shares are declared defaults (a locality heuristic), not a measurement of this tree.
drift_review:
  horizon_hours: 24
  structural: [atlas.yaml, scripts/, tools/, languages/, .github/, CLAUDE.md, AGENTS.md, llms.txt, CHAT.md, skills/]
  tiers: {hot: 0.15, cold: 0.15}

# WHAT A REQUEST MEANS, PER VERB. Added at 2.29.0: no entry file mapped "use", "install", "open",
# "run" or "pull" to an action, so a chat, an agent and a bare model each guessed — and guessed
# differently. Declared once here; CHAT.md and llms.txt render it whole, and CLAUDE.md, AGENTS.md and
# .agent/bootstrap.json point at it, because their entry budget has no room for a second copy.
intents:
  use:
    means: work under Thea's rules on your own code
    agent: run `python scripts/atlas.py gate <file>` and the commands it prints (exit code is the verdict); `python scripts/enforce.py install` makes every commit prove itself
    chat: install the chat skill (the install verb) once; until then paste the Install block from CHAT.md, route each file from CHAT.md and fetch only that pack's tools.yaml
  install:
    means: put the harness on a machine
    agent: 'README''s `install` block (clone the tag, install editable, `thea doctor`; CI runs it); in a clone, `python -m pip install --require-hashes -r scripts/requirements.lock.txt`'
    chat: install the chat skill as CHAT.md's first section says (build the zip, or link the release asset), and give the user the `install` block of README.md for a machine
  open:
    means: start reading it
    agent: load only your runtime's entry file, then `python scripts/atlas.py port <path>`; never read the tree breadth-first
    chat: fetch llms.txt or CHAT.md from the raw base and nothing else until a route names it
  run:
    means: execute its checks
    agent: '`python scripts/atlas.py check` for the whole contract; judge the exit code, never the output'
    chat: a chat cannot run it; hand the user the command and name the gate it proves
  pull:
    means: fetch or update a copy
    agent: pin a release tag, never main; to update a clone, `git pull --ff-only` then `python scripts/atlas.py check`
    chat: fetch raw files at a release tag, never main
  report:
    means: record a break, mistake or bad result so Thea learns to prevent it
    agent: 'run `failures <id> --draft ''<text>''`, then `skills/thea/SKILL.md`'
    chat: answer with a ready-to-paste ledger entry (id, shape, looks_like, tell, prevented_by)

chat:
  install_max_bytes: 1200
  install: |-
    You are working with Thea, the Heartland Engineering Atlas (github.com/HLIntel/thea-software).
    1. Route first. Find the file's pack in CHAT.md, fetch only that pack's tools.yaml. Never read the whole repository.
    2. Fetch, never recall. A tool, command or version from memory is a hypothesis; the fetched file is the answer. Name the file.
    3. Label claims CONFIRMED (file or measurement named), INFERRED or UNCERTAIN. A number nobody measured is "unmeasured".
    4. Refuse rather than invent. "none", "unsupported" and "not verifiable here" are real answers.
    5. Pick a process from CHAT.md and stop where it says. End code advice with the gate that proves it, never "should work".
  processes:
    research:
      when: a factual or technical question
      steps: ['restate the question', 'fetch primary sources', 'label every claim', 'name what would refute the answer']
      returns: the answer, its sources, and what stays unverified
      stop_when: no primary source exists — say so instead of answering from memory
    ideas:
      when: a goal with constraints and no plan yet
      steps: ['state goal and hard constraints', 'list at least five options including one unconventional',
              'break each one (how it fails)', 'rank by cost and reversibility']
      returns: the ranked options and ONE next step
      stop_when: an option needs a fact nobody has — mark it and move on
    perspectives:
      when: a design, plan or claim that needs a second opinion
      steps: ['answer as builder, attacker, operator and end user', 'name where they disagree', 'resolve or state the trade']
      returns: the disagreements and a synthesis
      stop_when: the roles agree — say so, do not invent conflict
    review:
      when: a pasted diff, file or document
      steps: [route it, "check it against the pack's gates and this repository's failure modes", rank findings]
      returns: findings, each with the gate or evidence that proves it
      stop_when: a finding needs a run a chat cannot do — hand it to an agent with the gate named
    decide:
      when: a choice between approaches
      steps: [list options, trade-offs, 'what is measured versus assumed', 'the cost of reversing']
      returns: a decision record in the shape of systems/decisions.yaml
      stop_when: the deciding fact is unmeasured — name the measurement instead of choosing
    explain:
      when: someone asks what a system or repository does
      steps: [entry points, 'authoritative versus generated files', 'what is enforced versus only declared', external surfaces]
      returns: a map a newcomer can act on, with every claim labelled
      stop_when: the source is not available — explain only what was fetched
    handoff:
      when: the work needs code to run
      steps: [objective, allowed paths, 'the gate that proves it', 'the stop condition']
      returns: a task an agent can take, in the shape of the task contract
      stop_when: the gate is unknown — name the pack and leave the gate for the agent to resolve; never guess it

language_selection:

  default_workhorse:
    need: the ordinary case — a service, a script, a tool, a test suite
    packs: [python, typescript, go, rust]
    when_not: never reach past this row without a reason you can state in one sentence
    maturity: production
  manual_memory:
    need: no garbage collector, explicit lifetime, predictable latency
    packs: [rust, c, cpp, zig, nim, odin, hare, v]
    when_not: a managed runtime already meets the latency budget — measure before paying for this
    maturity: rust/c/cpp production; zig, nim, odin, hare and v are declarable, not recommended
  fearless_concurrency:
    need: many things in flight, and a failure model that is not "hope"
    packs: [go, rust, elixir, gleam, chapel]
    when_not: the work is IO-bound and a single process with async already saturates the link
    maturity: go, rust and elixir production; gleam and chapel declarable
  data_parallel_gpu:
    need: an array-shaped problem large enough that the transfer cost is worth paying
    packs: [cuda, mojo, futhark, chapel, julia]
    when_not: the array fits in cache, or the kernel would spend its life waiting on memory
    maturity: cuda and julia production; mojo, futhark and chapel declarable
  array_notation:
    need: whole-array thinking, where a loop is the wrong unit of expression
    packs: [bqn, uiua, julia, r]
    when_not: the reader is not already fluent — density is a cost paid by everyone after you
    maturity: julia and r production; bqn and uiua declarable
  typed_functional:
    need: making an illegal state unrepresentable, rather than validating it later
    packs: [haskell, ocaml, fsharp, scala, elixir, gleam, roc]
    when_not: the domain has no invariants worth encoding; a type system is not free
    maturity: haskell, ocaml, fsharp and scala production; roc declarable
  proof_and_verification:
    need: a property PROVED, not tested — where being wrong is not recoverable
    packs: [lean4, quantum/silq]
    when_not: a property test over a few thousand cases would settle it; proof is the expensive tool
    maturity: declarable; reach for it when the cost of being wrong exceeds the cost of proving
  quantum:
    need: a circuit, a simulator, a shot count and a classical baseline to beat
    packs: [quantum/qsharp, quantum/silq]
    when_not: almost always — a quantum result with no classical baseline is not a result
    maturity: research
  portable_sandboxed:
    need: untrusted or portable execution with a declared import surface
    packs: [webassembly, rust, typescript, cloudflare]
    when_not: the code is trusted and local; a sandbox you do not need is a boundary to maintain
    maturity: production
  apple_platform:
    need: a first-class application on Apple's platforms
    packs: [swift]
    when_not: the surface is a web view; then it is a typescript problem wearing a native shell
    maturity: production
  data_and_query:
    need: the data is relational and the question has an exact answer
    packs: [sql, python, r]
    when_not: the question is about meaning rather than rows — see data_classes/unstructured
    maturity: production
  shell_and_glue:
    need: joining programs that already exist, on one machine, with exit codes
    packs: [bash]
    when_not: control flow exceeds a screen, or a value needs a type — reach for the workhorse row
    maturity: production
  stack_and_embedded:
    need: a tiny interpreter, a bootloader, or a machine with no room for a runtime
    packs: [forth, c, zig]
    when_not: the target has megabytes; the constraint has to be real to be worth the cost
    maturity: c production; forth and zig declarable
  systems_successors:
    need: evaluating a language positioned to replace one already in use here
    packs: [carbon, mojo, roc, v, hare, odin, gleam, nim]
    when_not: shipping. This axis is for EVALUATION — a successor language in production is a bet
      on its toolchain surviving, and that is a separate decision from liking the language
    maturity: evaluation only

# ONE IMPLEMENTATION, EVERY LANGUAGE. `atlas do <file> <action>` resolves an action through the
# pack the file routes to, so `format` runs that pack's declared formatter and nothing here knows
# which one that is. Change a pack's test runner and the action follows it; add a pack and it
# inherits all of these for free. This is what makes 35 manifests usable rather than descriptive —
# before it they were read BY the contract and by nobody else.
#
# `takes_file` is the whole subtlety: a formatter acts on one file, a test runner acts on a project,
# and appending a path to the second is how a green suite becomes a run of nothing.
pack_actions:
  format:  {role: formatter,           takes_file: true}
  check:   {role: compiler_or_runtime, takes_file: true}
  lsp:     {role: lsp,                 takes_file: false}
  test:    {role: test,                takes_file: false}
  scan:    {role: security,            takes_file: true}
  debug:   {role: debugger,            takes_file: true}
  profile: {role: profiler,            takes_file: true}
  bench:   {role: benchmark,           takes_file: false}
  fuzz:    {role: fuzz,                takes_file: false}
  mutate:  {role: mutation,            takes_file: false}
  deps:    {role: package_manager,     takes_file: false}

# THE STEPS A PROCESS MAY BE MADE OF. A free-text sequence is a sentence with bullet points: two
# processes would spell the same step differently and no instrument could tell they matched.
process_steps:
  route: resolve the artifact to a pack, a card and a manifest before reading anything else
  scope: declare the paths and commands this task may touch, and refuse the rest
  retrieve: load what the route named, plus the callers and tests of the symbol being changed
  plan: pick the task profile and change class, and resolve the gates they require
  edit: the smallest change that satisfies the objective, and no refactor beside it
  fast_verify: the cheapest gate that can fail, before the expensive one — localise, then prove
  full_verify: every gate the change class requires, judged on the exit code
  diff_audit: compare the diff against the paths the plan declared, before claiming anything
  accept: the acceptance record, INCLUDING the gates that did not run and why
  record: the outcome and the audit stream that can be recomputed
  escalate: stop, name the missing dependency or the approval needed, and do not proceed
  diverge: at least three genuinely different options, one of them do_nothing, before any is argued for
  premortem: for each option, how it fails as if it already had, and the signal that kills it
  converge: score every option on the declared axes and pick one no other option dominates

# A PROCESS IS THE ONE THING A CONSUMER WANTS AND THE ONE THING THIS TREE ONLY EVER IMPLIED.
# `task_profiles` says which tools, `verification_policy` says which gates, `build_order` says in
# what order a feature is built, `tool_profiles` says what may be activated — four rosters a
# reader had to join by hand, from prose, every single time. A consuming repository therefore
# depended on a PARAGRAPH, which is re-worded without notice, instead of on an identifier.
#
# Each process below joins them once under an id. `atlas process <id> --json` is the external
# reference; the generated documents are views of this, never a second definition.
#
# STOPPING CONDITIONS ARE PART OF THE PROCESS, NOT ADVICE BESIDE IT. A process with no declared
# stop is one that expands until something else notices, which is the failure the agent controls
# were built for — so `atlas.py check` refuses a process that declares none.
processes:
  strategic_brainstorm:
    returns: a brainstorm record that `thea brainstorm` passes — options, scores, pre-mortems, the choice, its next step and proof
    task_profile: research
    change_class: source_change
    sequence: [scope, diverge, premortem, converge, record, escalate]
    artifacts: [brainstorm_record, decision_record]
    stop_when: [options_undiverged, choice_dominated]
    escalate_when: [one_way_door]
  implementation:
    returns: the diff, every gate result including those NOT RUN, and the audit stream — as a pull request
    task_profile: implementation
    change_class: source_change
    sequence: [route, scope, retrieve, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [diff, gate_results, audit_stream]
    stop_when: [gate_refused, scope_expanded, budget_exhausted]
    escalate_when: [plan_drift, approval_required]
  debugging:
    returns: the failing test that reproduces it, the fix, and the regression test — as a pull request
    task_profile: debugging
    change_class: source_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, diff_audit, record]
    artifacts: [reproduction, regression_test, diff, gate_results]
    stop_when: [reproduction_not_obtained, gate_refused, budget_exhausted]
    escalate_when: [root_cause_outside_scope]
  endpoint:
    returns: the schema diff, the contract and endpoint test results — as a pull request
    task_profile: endpoint
    change_class: api_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record]
    artifacts: [schema, contract_test, integration_test, gate_results]
    stop_when: [schema_unversioned, gate_refused, scope_expanded]
    escalate_when: [breaking_change_detected, approval_required]
  security:
    returns: the finding, the fix, the scan results and the regression test — never a public issue before the fix
    task_profile: security
    change_class: security_sensitive
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [finding_list, gate_results, dependency_delta]
    stop_when: [secret_detected, gate_refused]
    escalate_when: [approval_required, production_access_needed]
  dependency_change:
    returns: the lockfile delta, the dependency review verdict and the gate results — as a pull request
    task_profile: default
    change_class: dependency_change
    sequence: [route, scope, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [lockfile_delta, dependency_graph, gate_results]
    stop_when: [lock_outside_declared_range, gate_refused]
    escalate_when: [approval_required]
  performance:
    returns: the baseline and the new measurement from the same workload, with the regression threshold verdict
    task_profile: performance
    change_class: performance_change
    sequence: [route, retrieve, plan, edit, fast_verify, full_verify, accept, record]
    artifacts: [baseline, benchmark_result, profile, gate_results]
    stop_when: [workload_not_representative, regression_threshold_crossed]
    escalate_when: [measurement_not_reproducible]
  polyglot:
    returns: the boundary contract, both sides' gate results and the boundary test — as a pull request
    task_profile: polyglot
    change_class: api_change
    sequence: [route, scope, retrieve, plan, edit, full_verify, diff_audit, accept, record]
    artifacts: [schema_or_abi, boundary_test, gate_results]
    stop_when: [boundary_untested, gate_refused]
    escalate_when: [both_sides_need_changing]
  autonomous_agent:
    returns: the task contract with its outcome written back, the audit stream, and a pull request landed with branchstate --land
    task_profile: autonomous_agent
    change_class: source_change
    sequence: [route, scope, plan, edit, fast_verify, full_verify, diff_audit, accept, record, escalate]
    artifacts: [task_contract, audit_stream, gate_results, environment_fingerprint]
    stop_when: [budget_exhausted, scope_expanded, policy_denied, audit_chain_broken]
    escalate_when: [approval_required, plan_drift]

tool_profiles:
  core-code: [native, github, serena_when_supported]
  docs: [native_docs, context7_when_needed]
  browser: [native_http, playwright]
  database: [native_db, dbhub_read_only]
  security: [native_security, codeql, semgrep, github_secret_controls, dependency_review]
  polyglot: [core-code, schema_abi, boundary_tests]

# THE AUTONOMOUS PROFILE, AS CONTROLS SOMETHING ENFORCES RATHER THAN WORDS AN AGENT READS.
#
# `task_profiles/autonomous_agent` named five controls from 2.0.0 and a sixth from 3.36.0 — narrow_tools, sandbox,
# budget, approval, audit — and until 2.26.0 not one of them was enforced by anything in this tree.
# An agent that simply did not read CLAUDE.md was subject to none of them. That is the gap this
# block closes, and it is the same gap three other rosters here already close: a DECLARED control
# and an ENFORCED control look identical from outside, and only the second survives being ignored.
#
# Every entry below names the FUNCTION that decides it. `atlas.py check` refuses a control whose
# enforcer does not resolve to a callable, exactly as it refuses an invariant with no owner and an
# instrument with no closer — so a control cannot be added here and left unwired.
#
# WHAT THIS IS NOT. A Python runner is not a security boundary, and saying so is not a disclaimer:
# it is the reason `sandbox_requirements` is addressed to the HOST and says so per row. The runner
# refuses what it can see. A sandbox refuses what it cannot.
# WHAT A PLACE IS, WHAT A CHANGE HERE PROVES, AND THE TRAPS ALREADY MET IN IT.
# Routing had two axes and needed three: `route <file>` answered with a language and `route <dir>`
# answered `none`, while every task contract already works in terms of allowed_paths. And the trap
# ledger was GLOBAL when the traps are local — an agent editing one directory had to read all 54
# shapes or none of them. Nothing here is new prose: `proves` names done_set gates, `never` names
# paths, `traps` names agent_failure_modes keys and `label` names a row of config/github-labels.json,
# each resolved against its own roster. Only `is` is free text, and it is one sentence.
# WHAT EACH LANGUAGE PROVES WORKS, AND WHETHER THIS REPOSITORY TOOK IT.
# `language_selection` answers WHICH language for which need. It never answered the other question:
# what MECHANISM a language demonstrated well enough that an agent contract should carry the same
# shape. Harvest the mechanism, never the syntax — a notation that borrowed Go's braces and not
# Go's context would have taken the part that does not matter.
#
# EVERY ROW IS harvested OR refused. There is no `planned`: a mechanism listed as someday-work is an
# aspiration, and an unshipped arm reads as covered. `as` resolves to a callable, an atlas key or a
# path; `because` is required on a refusal, so a no is a decision with a reason rather than silence.
language_mechanisms:
  a_declared_floor_refuses_forward:
    from: go
    proves: a module declaring a newer toolchain is REFUSED outright rather than built best-effort, so an old tool never silently checks the subset of rules it happens to understand
    status: harvested
    as: agentvocab.floor_errors
    note: MEASURED at 3.37.0 — the installed launcher reported contract 3.35.0 against a 3.37.0 checkout, two versions behind and answering anyway. atlas_version says which atlas WROTE a contract; min_contract_version says which may JUDGE it
  a_run_may_not_amend_its_own_declaration:
    from: go
    proves: a build that would need to change go.mod fails instead of changing it — the manifest governing the run is not writable by the run
    status: harvested
    as: agentpolicy.contract_errors
    note: verified against the instrument before it was proposed as new — a contract allowing a path that reaches never_writable is already refused, naming the file it would have rewritten. The candidate was recorded rather than built twice
  the_generated_marker_lives_in_the_artifact:
    from: go
    proves: a derived file declares that it is derived, so a tool decides hand-editability from the FILE and never from a roster of names that narrows when a new generator ships
    status: harvested
    as: atlasgen.generated_file_errors
    note: harvested in a different form and checked BOTH ways — a generator writing an undeclared file fails, and a declared file no generator writes fails, so the roster cannot silently narrow. A first-line marker would add nothing a JSON artifact could carry anyway
  visibility_from_path_position:
    from: go
    proves: a package under an internal directory may be imported only from the subtree rooted at its parent — a global lexical rule that needs no allowlist, so a new file there is protected the moment it exists
    status: refused
    because: nothing in this tree is laid out that way, so it would be a rule with zero instances — an arm built, measured and never exercised, which is the shape refused everywhere else here. The enumerated directory_scopes never-lists are short and each names a file that exists; when a subtree earns the pattern this becomes worth revisiting
  errors_are_values:
    from: go
    proves: a failure is a value the caller must handle, so an unhandled one is visible at the call site
    status: harvested
    as: agentpolicy.Verdict
    note: every refusal names the CONTROL that made it; a bare boolean cannot be argued with or audited
  context_deadline_propagation:
    from: go
    proves: a derived context carries a deadline no LATER than the one it derives from, so a child cannot outlive its parent
    status: harvested
    as: agenteffects.delegation_errors
    note: delegate has been a declarable effect and delegation_contract named six things a handoff carries, not one of them a budget — a bounded task could start an unbounded one
  deferred_cleanup:
    from: go
    proves: a release runs whatever path the function leaves by, so cleanup cannot be forgotten on the error branch
    status: refused
    because: the runner resolves gate argv FROM the atlas and executes nothing else, so a general defer would need a contract to carry full argv and command_name refuses that on purpose; the one case measured here, a killed run leaving a plant, is closed by safeedit's journal and `--restore`
  effects_in_the_type:
    from: haskell
    proves: what a computation may DO is part of its declaration, not a comment beside it
    status: harvested
    as: agenteffects.contract_effect_errors
  proof_before_acceptance:
    from: lean4
    proves: a result carries the obligation that discharges it, so an unproven result is a different kind of thing from a proven one
    status: harvested
    as: atlas.yaml/verification_policy
  exclusive_ownership:
    from: rust
    proves: one writer at a time, decided statically rather than hoped for
    status: harvested
    as: atlas_test.suite_lock
    note: partial and deliberately so — it holds a WORKTREE, not a path. A per-path lease needs a broker outside this repository, and the measured failure was two suites interleaving plants, which the worktree lock closes
  scoped_acquire_release:
    from: python
    proves: a resource taken inside a block is given back leaving it, including by exception
    status: harvested
    as: atlas_test.mutated
    note: every planted defect is restored byte for byte, and a third state is a concurrent writer rather than this test's business
  bounded_restart:
    from: elixir
    proves: a retry budget is part of the supervision declaration, so retrying forever is unrepresentable
    status: harvested
    as: agentpolicy.effective_budgets
  structural_conformance:
    from: typescript
    proves: a thing satisfies a contract by its SHAPE, without naming the contract it satisfies
    status: harvested
    as: packmanifest.validate
    note: a pack answers a gate by having the entry, never by declaring that it does
  declarative_query_over_a_schema:
    from: sql
    proves: ask for what you want and let the system resolve how, so the plan is inspectable
    status: harvested
    as: atlas.route_record
  exit_code_is_the_verdict:
    from: bash
    proves: a process states success in one place a machine reads, never in prose a reader interprets
    status: harvested
    as: scripts/verify.py
  no_hidden_allocation:
    from: zig
    proves: what a call may consume is passed in rather than taken, so the cost is at the call site
    status: harvested
    as: agentpolicy.budget_verdict
  exhaustive_match:
    from: ocaml
    proves: a case added to a type breaks every place that did not handle it, loudly and at build time
    status: harvested
    as: roster.instrument_roster_errors
    note: the same shape over rosters rather than over types — a script added with no row fails until it is declared
  a_measurement_collapses_state:
    from: quantum/qsharp
    proves: reading is an ACT, so a reading held and re-read is not the same claim as a fresh one
    status: harvested
    as: atlas.yaml/agent_failure_modes
    note: recorded here as a_cached_reading_read_as_a_measurement, after a cached reading was reported as a measurement
  undefined_behaviour_as_optimisation_licence:
    from: c
    proves: nothing this repository wants — it buys speed by making a wrong program's behaviour unbounded
    status: refused
    because: a parser or a policy that resolves an ambiguous input is worse than one that errors, because the ambiguity leaves no trace and the wrong answer is indistinguishable from the right one; `none` is a real answer here and refusing is the declared discipline
  isolate_per_request:
    from: cloudflare
    proves: a fresh, bounded execution context per unit of work, with no shared mutable state to leak
    status: refused
    because: this repository runs no service, and the isolation an agent run needs is decided by the HOST — the sandbox rows agentrun prints UNOBSERVED are exactly that boundary, and claiming it here would be claiming a control nothing in this tree observes

directory_scopes:
  .github:
    is: the authoritative verification surface — every workflow, the required checks, the review and ownership rules
    label: area/ci
    proves: [contract]
    never: [.github/workflows]
    traps: [a_verdict_printed_and_not_gated, a_pushed_lane_nothing_will_merge, a_local_green_read_as_a_verdict]
  .githooks:
    is: the checks that run on this machine before a commit or a push leaves it
    label: area/ci
    proves: [contract]
    never: []
    traps: [a_verdict_printed_and_not_gated, a_guard_that_crashes_on_another_guards_input]
  .vscode:
    is: the VS Code host's task, launch and MCP declarations, and the example an operator copies
    label: area/ide
