version: 0.5.1
default_flow: MODEL.md -> docs/INDEX.md -> atlas.yaml -> runtime_adapter -> domain_guide -> pattern -> verify
hard_invariants:
  - no_unbounded_growth
  - immutable_first
  - schema_first
  - explicit_deadlines
  - least_privilege
  - independent_verification
  - auditable_changes
  - rollback_high_impact
  - one_source_of_truth
  - atlas_consistency
artifact_routes:
  '.py': python
  '.pyi': python
  '.rs': rust
  '.go': go
  '.ts': typescript
  '.tsx': typescript
  '.c': c
  '.h': c
  '.cpp': cpp
  '.cc': cpp
  '.hpp': cpp
  '.zig': zig
  '.mojo': mojo
  '.jl': julia
  '.ex': elixir
  '.exs': elixir
  '.gleam': gleam
  '.nim': nim
  '.v': v
  '.odin': odin
  '.hs': haskell
  '.lhs': haskell
  '.fs': fsharp
  '.fsx': fsharp
  '.chpl': chapel
  '.bqn': bqn
  '.ua': uiua
  '.lean': lean4
  '.cu': cuda
  '.cuh': cuda
  '.sql': sql
  '.sh': bash
  '.bash': bash
  '.wat': webassembly
  '.wasm': webassembly
issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  gpu: [cuda, mojo, futhark, chapel, julia]
  numerical: [julia, python, fsharp, chapel, futhark]
  api: [python, go, rust, typescript]
  database: [sql, python, go, rust, typescript, fsharp]
  endpoint: [schema_first, auth, timeout, idempotency]
  webhook: [raw_body, signature, schema, idempotency, bounded_queue]
  agent: [model_router, narrow_tools, sandbox, budget, approval, audit]
  security: [static_analysis, secret_scan, dependency_scan, sandbox]
  performance: [benchmark, profiler, workload, cache_analysis]
  verification: [tests, property_testing, fuzzing, formal_methods]
task_routes:
  mechanical: [fast_model, direct_tool, focused_verify]
  implementation: [coding_model, language_stack, tests]
  architecture: [strong_reasoning, atlas, adr, worktree]
  research: [research_model, isolated_context, primary_sources, provenance]
  security_review: [verifier, scanners, isolated_context]
  performance_review: [profiler, benchmark, workload]
  autonomous_agent: [narrow_tools, sandbox, budget, approval, audit]