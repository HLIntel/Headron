version: 3.53.0

# WHO OWNS THIS TREE, DECLARED ONCE SO A RENAME IS ONE LINE RATHER THAN A SWEEP.
#
# Measured before this block existed: the owner appeared 39 times across 13 files, and most of
# them are LIVE — badge URLs, a CODEOWNERS handle, the `repository:` a reusable workflow checks
# out, the target the platform audit points at, and the banner's own filename. A rename done by
# find-and-replace flips all of them at once, and every one of them 404s until the account on the
# other side exists. That is not a rename, it is an outage with a commit message.
#
# So the owner is a DECLARATION. `identity.py` compares the tree against it and can rewrite the
# tree from it, and `atlas.py check` refuses a hardcoded owner anywhere this block does not allow.
# The switch becomes: change `owner` here, run the rewrite, verify, and move the repository on the
# platform — in that order, because the platform move is what makes the new URLs resolve.
identity:
  owner: HLIntel
  # THE PROJECT'S NAME, declared once and read by the generators — never typed into each surface.
  # Written Thea — a name, not an acronym in capitals; the expansion is what it stands for. Mixed in
  # from 2.28.0; since 3.0.0 the repository is named for it too — thea-software, a URL segment consumers
  # resolve. The full name, Thea Software, separates it from an existing Thea AI; Thea is the short form.
  project_name: Thea Software
  project_expansion: The Heartland Engineering Atlas
  # WHAT IT WAS. Kept so the half-applied check has something to look for: once a half is applied,
  # the PREVIOUS name must be gone from everything except the files declared to hold it literally.
  # Without this the check compared the new name against itself and flagged the finished state.
  previous_owner: Thea-Software
  previous_display_name: Heartland Intel
  repository: thea-software
  # THREE STRINGS, ALL LIVE, AND CONFLATING THEM IS WHY THIS WAS WRONG TWICE. The login is the
  # only one any link resolves against; the platform display name is what the account's own page
  # shows; the brand is what this repository's prose calls itself. They are allowed to differ and
  # they currently do, so all three are recorded rather than collapsed into one and re-guessed.
  #   login  HLIntel               — every badge, workflow checkout and audit target
  #   platform display name        — read from the account, not assumed
  #   display_name                 — what this tree calls itself in prose
  display_name: HLIntel LLC
  platform_display_name: Heartland Intel.
  # WHERE THE LITERAL STRING IS ALLOWED TO SURVIVE A RENAME. A licence names a copyright holder
  # at a point in time and is not a pointer; rewriting it silently would be rewriting a legal
  # record to match a configuration file. It stays on this list after being changed BY HAND at the
  # owner's instruction — the exemption is about who decides, not about which name is written.
  # Records, not pointers: the changelog states what the owner WAS, and the m8ven listing slug is
  # a third-party id still keyed to the old login (it 308-redirects); renaming either breaks it.
  # CODEOWNERS names a PERSON with write access; an organization is not one, and GitHub
  # rejects `* @<org>` as an unknown owner, so moving the repository never moves that line.
  literal_allowed: [LICENSE, docs/VERSIONING.md, config/github-controls.json, .github/CODEOWNERS]
  # THE BANNER IS AN ASSET, NOT A STRING, so a rename cannot carry it. The file has to be added
  # and the reference repointed in the same commit, or the landing page shows a broken image —
  # which the link checker DOES catch, because the README's header is HTML and every src in it is
  # checked. That guard was added after a banner was renamed twice and nothing noticed.
  banner: docs/assets/thea.webp
  # THE NEXT OWNER, STAGED BUT NOT APPLIED. Declaring it here makes the change reviewable BEFORE
  # it is live: a reader can see what the tree will become, and `identity.py --plan` prints every
  # file that would move. It is applied only when the platform account exists, because a URL that
  # resolves to nothing is worse than one that resolves to the old name.
  # OUTWARD DISPLAY IS RENAMED; STRUCTURE IS NOT. The distinction is the whole design of this
  # rename: a string a PERSON reads is branding and moves with the brand, while a string something
  # RESOLVES — an environment variable, a distribution name, a worktree path convention, the
  # contract's own printed identity — is an interface, and moving it breaks a consumer silently.
  # `rename_scope: display` is what keeps a sweep from becoming an API change.
  rename_scope: display

  # STRINGS A CONSUMER ALREADY DEPENDS ON. These are PUBLISHED: something outside this repository
  # reads them, so renaming one is an API change and not a rename. The environment variable is the
  # dangerous one — a consumer who sets the old name simply stops being read, the CLI falls back to
  # the directory it was installed from, and it RESOLVES SOMETHING, which is worse than failing. A
  # rename here needs a period where both are accepted and the old one says so, never a rewrite.
  published_interfaces:
    # RENAMED AT 3.0.0 with the repository, each with its compatibility path stated.
    THEA_ROOT: the environment variable a consumer sets to point at a checkout. CODE_DEVELOPMENT_ROOT,
      its pre-3.0 name, is still read as a fallback so no consumer resolves a different atlas silently
    thea-software: the distribution name in pyproject (3.53.0), formerly thea-harness and before that
      code-development-harness; the release workflow publishes it to the index once PYPI_PUBLISH is on.
      Git installs pin the repository, never the name, so the rename moved no existing pin
    Thea Software contract: the string this contract PRINTS as its own identity. Every measurement before 3.0.0
      is stamped against the old string, Code-Development contract, in docs/VERSIONING.md
    thea: the command an install puts on PATH (3.7.0); `atlas`, its earlier name, is still answered.
      `thea <instrument>` runs a declared instrument, so enforce, staleness and branchstate need no path
    thea-mcp: the same commands as MCP tools on stdio, read-only by construction (3.7.0)
    thea-commands/1: the `thea commands --json` record, frozen in tools/thea-commands.schema.json
    thea-software-wt: the worktree path convention the branch rules and the git example assert against —
      ../thea-software-wt beside a clone, which a fresh clone now names thea-software

  successor:
    # APPLIED after 3.51.0: the organization login moved Thea-Software -> HLIntel (the old login answers 404;
    # "Thea Software" inside thea-software read twice). The display name stayed Heartland Intel.
    # STAGED 3.0.0, ON THE PLATFORM FIRST: the account login moved HeartlandTechnology -> HeartlandIntel
    # (confirmed: the old login now answers 404) and the repository was renamed Code-Development -> thea -> thea-software (the brand is Thea Software: a Thea AI already exists).
    # GitHub redirects repository links under the old owner until someone claims that login and makes a
    # repository with the same name, so every pointer here moves to the new names now.
    owner: HLIntel
    owner_confirmed: true
    owner_kind: organization
    display_name: HLIntel LLC
    platform_name: Heartland Intel.
    namespace_collision: HeartlandSoftware is an existing unrelated organisation on the platform
    repository: thea-software
    repository_casings: [Code-Development]
    banner: docs/assets/thea.webp
    banner_ready: true
    banner_applied: true
    owner_ready: true
    owner_applied: true
    repository_ready: true
    repository_applied: true
    blocked_on: nothing on the platform; this tree is applying both halves
default_flow: MODEL.md -> docs/INDEX.md -> atlas.yaml -> runtime_adapter -> language_guide -> operating_card -> tool_manifest -> boundary -> task_route -> scoped_tools -> verify

