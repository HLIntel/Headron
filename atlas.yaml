agent_policy:
  # THE SHELL SHAPES A REGEX DECIDES (3.44.0): each row a measured sighting, read by agentpolicy.shell_verdict;
  # each reason names the replacing move, so a refusal teaches rather than blocks.
  shell_shapes:
    - pattern: '\b(?:pgrep|pkill)\b[^;&|]*\s-[a-zA-Z]*f[a-zA-Z]*\s+[''\"]?(?!\[)[^\s''\"\[;&|]+[''\"]?(?:\s|$|[;&|])'
      reason: '`pgrep -f`/`pkill -f` on this pattern also matches the shell running it — the wait never ends, the kill takes its caller. Bracket the first character (`[s]leep`), use a PID, or wait on the harness notification'
      refuses: ["while pgrep -f sleep; do :; done"]
      allows: ["pgrep -f '[s]leep 60'"]
      # macOS pgrep/pkill never match themselves or an ANCESTOR (the man page: "nor its ancestors" unless -a),
      # so the shape cannot occur there: 27 refusals in seven days of one owner's darwin shells were all
      # false. It still occurs on a Linux host reached over ssh, which `unless_remote` keeps refused (3.50.0).
      exempt_platforms: [darwin]
      unless_remote: '\bssh\b'
    - pattern: '(?:^|[;&|(]\s*|\b(?:then|do|else)\s+)(?:print|printf)\s+(?:-r\s+)?[''\"]-'
      reason: 'a literal beginning with a dash is read by print/printf as an OPTION: zsh `print` prints nothing, bash `printf` exits 2 — use `printf ''%s\n'' ''---''` or `print -r -- ''---''`'
      refuses: ["print \"---\" > note.md"]
      allows: ["printf '%s\\n' '---'"]
    # ECHO IS NARROWER THAN PRINT (3.50.0). Measured in bash and zsh: echo swallows only an EXACT option
    # word (`-n`, `-e`, `-E`, a combination, and in zsh a lone `-`) and prints `---`, `--`, `-x` and
    # `- item` unchanged. The old shared row refused 16 harmless echoes in seven days and none that lost text.
    - pattern: '(?:^|[;&|(]\s*|\b(?:then|do|else)\s+)echo\s+(?:-[neE]+\s+)*[''\"]-[neE]*[''\"](?=\s|$|[;&|)])'
      reason: 'echo reads a literal that is exactly `-`, `-n`, `-e` or `-E` as an OPTION and prints nothing — use `printf ''%s\n'' ''-n''`'
      refuses: ["echo \"-n\" > flag.txt", "echo '-'"]
      allows: ["echo \"--- KEYS\"", "echo '- Start the server'", "echo \"-- strict\""]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+rm\b(?=[^;&|\n]*--cached)(?=[^;&|\n]*\s-[a-zA-Z]*r)'
      # FALSE REFUSAL, MEASURED at 3.50.0: an agent unstaging a directory it had only `git add`ed — never
      # committed, so no clone could lose it — was refused. A string cannot see the index, so the row stays
      # and its reason names the move that is never wrong for a staged-only path.
      reason: '`git rm -r --cached` untracks a directory, and every other clone DELETES it on its next pull — add it to .gitignore and keep it tracked, or untrack only once every clone holds a copy. A path only staged, never committed, is unstaged with `git reset -- <path>`'
      refuses: ["git rm -r --cached skills/synced"]
      allows: ["git rm --cached notes.tmp"]
    # A GIT ROW MATCHES `git` AT COMMAND POSITION ONLY (3.49.0). Measured twice in one session: the
    # pull row refused `grep -n "git pull"` and a grep for its own reason, because `\bgit\b` matched
    # inside a quoted argument. Each git row below opens with the same anchor: start, a separator,
    # or then/do/else, then optional VAR=value, `command`, and `-C <dir>`.
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+pull\b(?![^;&|\n]*(?:--rebase|--ff-only|\s-r\b))'
      reason: 'a bare `git pull` merges, and on a conflict leaves the half-merge in the tree — every later pull then refuses. Use `git pull --rebase --autostash` (or `--ff-only`), and abort on conflict'
      refuses: ["git -C ~/vault pull origin main", "cd ~/vault && git pull"]
      allows: ["git pull --rebase --autostash origin main", "grep -rn \"git pull\" scripts"]
    # NEVER DESTROY UNCOMMITTED WORK, NEVER FORCE A BACKUP, BYPASS IS THE OWNER'S CALL: three rules the
    # owner's instructions declared and nothing enforced, so an agent shell could break each silently.
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+push\b(?=[^;&|\n]*(?:\s--force(?![-\w])|\s-[a-zA-Z]*f[a-zA-Z]*\b|\s\+[\w./-]))'
      reason: 'a forced push overwrites the forge''s history: commits anyone else pushed vanish with no warning. Rebase onto the remote and push plain; on a lane only you push, `--force-with-lease` refuses when the remote moved'
      refuses: ["git push --force origin main", "git -C repo push -uf origin lane", "git push origin +lane"]
      allows: ["git push --force-with-lease origin lane", "git push -u origin lane"]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+reset\b(?=[^;&|\n]*\s--hard\b)'
      reason: '`git reset --hard` discards every uncommitted edit in the tree with no stash and no undo. `git stash push -u` first, or `git reset --keep`, which refuses when it would drop a local change'
      refuses: ["git reset --hard origin/main"]
      allows: ["git reset --keep HEAD~1", "git commit -m \"refuse git reset --hard and git push --force\""]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+clean\b(?=[^;&|\n]*\s(?:-[a-zA-Z]*f|--force\b))'
      reason: '`git clean -f` deletes untracked files, which were never committed, so nothing restores them. Read `git clean -n` first, then delete the named paths, or `git stash push -u`'
      refuses: ["git clean -fdx"]
      allows: ["git clean -nd"]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+(?:checkout\b(?=[^;&|\n]*\s(?:--|\.)(?:\s|$))|restore\b(?![^;&|\n]*--staged))'
      reason: 'discards the uncommitted edits to those paths with no stash and no undo. `git stash push -- <path>` keeps them recoverable; `git restore --staged` only unstages'
      refuses: ["git checkout -- scripts/atlas.py", "git restore ."]
      allows: ["git checkout -b lane origin/main", "git restore --staged notes.md"]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+(?:commit|push|merge|rebase|am|cherry-pick|revert)\b(?=[^;&|\n"'']*\s--no-verify\b)'
      reason: '`--no-verify` skips the pre-commit and pre-push rungs, so a red gate lands looking green. The bypass is the owner''s call: fix the rung, or ask'
      refuses: ["git commit --no-verify -m wip"]
      allows: ["git commit -m wip"]
    - pattern: '(?:^|[;&|(\n]\s*|\b(?:then|do|else)\s+)(?:[A-Za-z_]\w*=\S*\s+)*(?:command\s+)?git(?:\s+-[Cc]\s+\S+)*\s+(?:rebase|add|commit|checkout|reset|stash|clean|restore)\b(?=[^;&|\n"'']*\s(?:-i|--interactive|-p|--patch)(?:\s|$))'
      reason: 'an interactive git command waits on an editor or a y/n prompt that an agent shell never answers, so it hangs until the tool times out. Name the paths and commits; script a rebase with `GIT_SEQUENCE_EDITOR`'
      refuses: ["git rebase -i HEAD~3", "cd repo\ngit add -p"]
      allows: ["GIT_SEQUENCE_EDITOR=true git rebase --autosquash origin/main"]
    - pattern: '(?:--(?:host|bind|ip|listen|address|addr)[= ]|\s-[bH]\s+)[''\"]?(?:0\.0\.0\.0|\[?::\]?)(?=[''\":\s;&|]|$)'
      reason: 'binds EVERY interface — on a VPS, a cloud box or shared Wi-Fi the port is public the moment it starts. Bind 127.0.0.1 and reach it over a private overlay or an SSH tunnel; a public service sits behind a TLS proxy that authenticates (`thea decide network_exposure`)'
      refuses: ["uvicorn app:app --host 0.0.0.0 --port 8000"]
      allows: ["uvicorn app:app --host 127.0.0.1"]
    - pattern: '\bpython3?\s+-m\s+http\.server\b(?![^;&|]*(?:--bind|\s-b)\s)'
      reason: '`python -m http.server` with no `--bind` serves the working directory — `.env`, `.git`, keys — on every interface. Add `--bind 127.0.0.1`'
      refuses: ["python3 -m http.server 8000"]
      allows: ["python3 -m http.server --bind 127.0.0.1 8000"]
    - pattern: '\b(?:docker|podman)\b[^;&|]*\s(?:-p|--publish)(?:\s+|=)[''\"]?(?!127\.0\.0\.1:|localhost:|\[::1\]:)(?:\d+:)?\d+(?::\d+)?\b'
      reason: 'a published container port binds all interfaces, and Docker writes its own firewall rules ahead of ufw — the port is open even when ufw says it is blocked. Publish as `-p 127.0.0.1:<host>:<container>`'
      refuses: ["docker run -p 8080:8080 img"]
      allows: ["docker run -p 127.0.0.1:8080:8080 img"]
    - pattern: '\b(?:KGAT_[0-9a-f]{16,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}|hf_[A-Za-z0-9]{30,}|xox[abpr]-[A-Za-z0-9-]{10,})'
      reason: 'a credential typed into a command line lands in shell history, the agent transcript and any file the line redirects to — and a command handed to someone else runs wherever they paste it. Pass it by NAME from the keys file (`set -a; . ~/.claude-keys.env; set +a`), never as a literal'
  schema: tools/agent-task.schema.json
  # THE AUTHORED FORM IS THE ONE THAT RUNS (3.48.0). The .json beside it is the compiler's oracle
  # (the .thea must compile to it by contract hash), never a second contract anyone writes.
  reference_contract: tools/agent-task.example.thea
  # WHEN A CONTROL CAN STILL REFUSE, AS A CLOSED ORDERED SET. Harvested from Cloudflare Pingora,
  # whose proxy filters attach to NAMED phases and where the ability to stop a request before it
  # leaves the box is a property of WHICH PHASE a filter is in, never of what the filter does.
  # This repository already wrote the rule for exactly one control — "a budget checked afterwards is
  # a report, not a control" — and left the other five to be inferred.
  #
  # THE ORDER IS THE POINT. Anything at `acceptance` has already happened: it can only describe.
  refusal_phases: [contract_parse, plan, pre_call, post_call, acceptance]
  controls:
    narrow_tools:
      refuses_at: pre_call
      phase_note: the command is judged before it is spawned
      enforced_by: agentpolicy.command_verdict
      refuses: a command outside the contract's allowed_commands, or matching a denied_commands
        pattern whatever the contract allows
    sandbox:
      refuses_at: pre_call
      phase_note: a path is judged before it is read or written
      enforced_by: agentpolicy.path_verdict
      refuses: a read or write outside allowed_paths, inside forbidden_paths, or escaping the
        repository root by traversal or symlink — including one carried as an ARGUMENT to an
        otherwise allowed command, which argument_paths resolves and this decider then judges
    budget:
      refuses_at: pre_call
      phase_note: the call that would cross a budget is refused BEFORE it runs
      enforced_by: agentpolicy.budget_verdict
      refuses: the call that would cross a declared budget, BEFORE it runs — a budget checked
        afterwards is a report, not a control
    approval:
      refuses_at: pre_call
      phase_note: a token is checked before the action it binds
      enforced_by: agentpolicy.approval_verdict
      refuses: a high-impact action whose token is absent, expired, or bound to a different
        contract, base commit, action or diff
    effects:
      refuses_at: pre_call
      phase_note: what a command exercises is judged before it is spawned
      enforced_by: agenteffects.effect_verdict
      refuses: a command that EXERCISES an effect the contract did not declare — `git` is an
        ordinary allowance and `git push` reaches a reader outside this repository, so what a
        command DOES is a different question from whether the program is allowed, and a contract
        that answers only the second one leaves the first to be inferred from a tool name
    audit:
      refuses_at: post_call
      phase_note: it RECORDS; nothing is refused at write time, which is why the chain is what refuses later
      enforced_by: agentaudit.append
      refuses: nothing at write time, because it RECORDS; the chain it writes is what
        `agentaudit.py verify` refuses when the hashes no longer recompute

  # WHAT A CONTRACT MAY NOT RAISE. A contract is written by the same agent these controls bound,
  # so a budget it declares for itself is a preference. These are the ceilings; a contract may
  # declare less and never more, and `agentpolicy.budget_verdict` reads the lower of the two.
  default_budgets:
    tool_calls: 40
    wall_clock_seconds: 900
    files_changed: 20
    lines_changed: 600
    retries: 3
    output_bytes: 1000000

  # WHAT A TASK MAY DO, AS A KIND RATHER THAN AS A PATH OR A COMMAND NAME. `network` was the only
  # effect a contract could name, and `acceptance/side_effects` was the only thing that said
  # anything survived the run — so a task allowed to deploy, to spend, or to start another agent
  # read exactly like one allowed to run a formatter, and the reader had to infer the difference
  # from a command name. Each effect here is DERIVED from the contract's own fields, so a contract
  # that under-declares is refused BEFORE it runs and one that over-declares is refused too: asking
  # for authority a task does not exercise is the least-privilege invariant, one level up.
  #
  # requires_approval is not advice. An effect marked true must appear in `approval_required`, and
  # the approval control already binds a token to the contract hash, the base commit and the action.
  effect_classes:
    execute:
      means: a command runs at all, so something outside this process decides what happens next
      implied_by: a non-empty allowed_commands
      refused_by: agenteffects.effect_verdict
      requires_approval: false
    network:
      means: the task reaches a host outside the worktree, which no diff of this repository records
      implied_by: network set to anything other than denied
      refused_by: agenteffects.effect_verdict
      requires_approval: true
    external:
      means: a side effect outside this repository survives the run and cannot be reverted by git
      implied_by: acceptance/side_effects set to external_with_approval
      refused_by: agenteffects.effect_verdict
      requires_approval: true
    delegate:
      means: the task starts another agent, whose budget and scope this contract does not bound
      implied_by: an allowed command matching effect_patterns/delegate
      refused_by: agenteffects.effect_verdict
      requires_approval: true
    deploy:
      means: a change reaches somewhere a reader outside this repository observes it
      implied_by: an allowed command matching effect_patterns/deploy
      refused_by: agenteffects.effect_verdict
      requires_approval: true
    money:
      means: the run can spend, and a spend is the one effect no rollback undoes
      implied_by: an allowed command matching effect_patterns/money
      refused_by: agenteffects.effect_verdict
      requires_approval: true

  # The command names that IMPLY an effect, searched against the program name and against the whole
  # quoted argv. A pattern rather than a list of names, because a roster of enumerated tools narrows
  # the moment a new one is installed beside it and narrows SILENTLY.
  effect_patterns:
    delegate: '\b(claude|codex|opencode|thea\s+delegate|agentrun)\b'
    deploy: '\b(vercel|netlify|fly|heroku|kubectl|helm|terraform|serverless|gh-pages)\b|\bnpm\s+publish\b|\bgit\s+push\b'
    money: '\b(stripe|aws|gcloud|az|doctl|railway)\b'

  # REFUSED WHATEVER THE CONTRACT ALLOWS. Each pattern is searched against the quoted argv, and
  # each names WHY, because a deny list whose rows carry no reason is edited by whoever is blocked.
  # This is not the boundary — `allowed_commands` is. This is the floor under it.
  denied_commands:
    privilege_escalation:
      pattern: '^(sudo|doas|su)\b'
      why: a runner that can elevate has no budget, because everything below it can be rewritten
    piped_remote_code:
      pattern: '\b(curl|wget)\b[^|]*\|\s*(sh|bash|zsh|python3?)\b'
      why: fetching and executing in one step leaves nothing for a reviewer or an audit to name
    history_rewrite:
      pattern: '^git\s+(push\s+(-f|--force)|reset\s+--hard|clean\s+-[a-zA-Z]*f|filter-branch|update-ref\s+-d)\b'
      why: the repository is the evidence; an agent that can rewrite it can hide the change it made
    credential_read:
      pattern: '(\.ssh/|\.aws/|\.netrc|id_rsa|id_ed25519|\.claude-keys|/credentials\b)'
      why: a task that needs a credential asks for approval; a task that reads one is exfiltration
    recursive_delete:
      pattern: '\brm\s+-[a-zA-Z]*r[a-zA-Z]*f|\brm\s+-[a-zA-Z]*f[a-zA-Z]*r'
      why: the one command whose mistake cannot be reviewed afterwards
    audit_tampering:
      pattern: '\.agent/audit'
      why: an audit stream the subject can edit records what the subject chose to record

  # AN ARGUMENT IS A PATH THE SANDBOX NEVER SAW (3.29.0). `command_verdict` read argv[0] and the
  # denial patterns and stopped there; `path_verdict` was correct and was simply never handed the
  # command's own arguments. So `sort -o ../escape.txt README.md` had an allowed binary, matched no
  # denial, and wrote outside the contract. MEASURED as a live escape in two sibling agent builds
  # that share one forked enforcer, including a target that did not yet exist: their check branched
  # on whether the path EXISTED, so the only paths it adjudicated were the ones already there.
  #
  # NOT EVERY ARGUMENT IS A PATH, and this is where the first version of the rule died: adjudicating
  # all of argv refuses `pattern` in `grep -i pattern file` as outside allowed_paths, and a guard
  # that fires on correct code gets switched off. So the roster is a PATTERN first and a list second:
  #   - `always` holds for EVERY binary, named or not, because absolute and traversing are a path
  #     and nothing else whatever reads them.
  #   - the per-binary maps refine it, and they cannot be a pattern: `-o` is an output file for
  #     `sort` and only-matching for `grep`, `-f` is `--follow` for tail and `--file` for grep.
  #     DECLARED BLIND SPOT: a binary absent from these maps is bounded by `always` alone, so an
  #     output flag nobody has named here reaches any path inside allowed_paths; a clean pass is
  #     never full coverage of a binary these maps do not name.
  argument_paths:
    always: 'an argument, or the value half of an --option=value, that is absolute or contains a .. segment'
    adjudicated_by: agentpolicy.path_verdict, the same decider the sandbox control already names
    output_flags:
      sort: ['-o', '--output']
      openssl: ['-out']
    writes_arguments: [tee, truncate]
    refused_flags:
      find: ['-delete', '-exec', '-execdir', '-ok', '-okdir', '-fprint', '-fprintf', '-fls']
      sed: ['-i', '--in-place']
      awk: ['-i', '--in-place']
      sort: ['--files0-from']

  # PATHS NO CONTRACT MAY ALLOW, WHATEVER IT DECLARES. Two shapes, both of which a contract
  # written by the agent it bounds would otherwise permit itself:
  #   - the policy that bounds the task, the runner that applies it, and the audit stream that
  #     records it. A task that can edit any of those is not bounded by them.
  #   - a GENERATED file. Editing one is a write to the output instead of the declaration, and the
  #     next `index --write` silently reverts it — which reads as sabotage and is a wrong-file
  #     write. The generated roster is NOT restated here; it is read from the generator, because a
  #     second copy of it would narrow the first time a generated file was added beside it.
  never_writable:
    - .agent/audit
    - tools/agent-task.schema.json
    - scripts/agentpolicy.py
    - scripts/agentaudit.py
    - scripts/agentrun.py

  # ADDRESSED TO THE HOST, NOT TO THE RUNNER, AND EACH ROW SAYS WHICH. `observed_by: host` means
  # this repository cannot prove it and does not claim to; the runner prints those rows as
  # UNOBSERVED rather than passing over them, so a task that ran outside a sandbox never reads as
  # one that ran inside it. `atlas.py check` refuses a row whose observer does not resolve.
  sandbox_requirements:
    filesystem:
      requirement: the repository writable, everything else read-only or absent
      observed_by: agentpolicy.path_verdict
    workspace_lifetime:
      requirement: an isolated temporary directory, removed when the task ends
      observed_by: agentrun.workspace_report
    home_directory:
      requirement: no access to the invoking user's home, ssh keys, or cloud configuration
      observed_by: host
      reference: config/agent-sandbox.json
    network:
      requirement: default deny, with an explicit per-task allowlist
      observed_by: host
      reference: config/agent-sandbox.json
    identity:
      requirement: a non-root user holding no ambient cloud or registry credentials
      observed_by: host
      reference: config/agent-sandbox.json
    resources:
      requirement: bounded cpu, memory and process count, killed by the host rather than asked
      observed_by: host
      reference: config/agent-sandbox.json

  # AN APPROVAL IS BOUND TO WHAT WAS APPROVED, OR IT IS A HABIT. A generic "yes, proceed" survives
  # the diff growing, the base commit moving and the action changing underneath it — which is the
  # failure, not an edge case. Each binding below is a field of the token; each invalidation is a
  # comparison `agentpolicy.approval_verdict` makes before the action runs.
  approval:
    required_for: [network_enablement, dependency_change, workflow_change, security_change,
                   production_access, push, merge, release]
    approver_roles: [owner, security]
    expires_after_seconds: 900
    binds_to: [contract_hash, repository, base_commit, action, diff_hash]
    invalidated_by: [expiry, base_commit_changed, diff_hash_changed, action_changed,
                     allowed_paths_changed]

  # AN AUDIT IS A CHAIN OR IT IS A LOG. A log the subject can append to can also be rewritten, and
  # a rewritten log is indistinguishable from an honest one. Each event carries the hash of the one
  # before it, so a removed or edited event breaks every hash after it and `agentaudit.py verify`
  # names the first break.
  audit:
    stream: .agent/audit
    # EVERY STORE CYCLES, AND THE BOUND IS IN BYTES. A count of events says nothing about a
    # stream whose events grow; the cap is refused at append time and the refusal is itself the
    # last event, so a truncated stream and a finished one are never the same file.
    max_stream_bytes: 4000000
    chain: sha256 over the previous event hash and this event's canonical body
    redaction: arguments and output are recorded as hashes and byte counts, never echoed — but the
      event kind, the exit code and the paths are recorded in full, because a log redacted past the
      point of establishing what happened is not an audit
    events: [task_created, plan_resolved, policy_denied, command_started, command_finished,
             file_changed, approval_presented, approval_refused, budget_exhausted, gate_result,
             scope_expanded, task_finished]

# A GATE IS A WORD UNTIL SOMETHING CAN RESOLVE IT TO A COMMAND.
#
# `verification_policy` names the gates a change class requires and the packs declare the tools,
# and nothing joined the two: a runner reading "unit_tests" had no way to learn what runs them
# here, so the gate was satisfied by an agent saying it was. Each gate below names the MANIFEST
# AUTHORITY ROLE that answers it, which makes the 35 tool manifests load-bearing rather than
# descriptive — change a pack's test runner and the gate resolves to the new one.
#
# `role: none` is a real answer and the more useful half of this table: a gate that no pack tool
# can run is a DECLARATION or a platform control, and saying which beats resolving it to the
# nearest command that would have printed a zero. Every `none` names what closes it, and
# `atlas.py check` refuses a gate with no entry and a `none` with no closer.
# GATES THAT MAY SHARE ONE COMMAND, BY DESIGN: the same tool gathering different evidence. Every other
# pair of gates resolving to one command in one pack FAILS the invariant gates_resolve_distinctly —
# found at 2.30.0, when 21 gates resolved to the plain test runner and read as 21 different checks.
gate_alias_groups:
  - [unit_tests, tests, focused_tests]
  - [profiler, allocation_profile]
  - [static_analysis, applicable_security_and_dependency_checks]
  - [benchmark, load_test]
  - [property_or_fuzz, invariant_property_test]

gate_tools:
  # A FORMATTER'S NAME REWRITES; THE GATE CHECKS (3.9.0). `gate` handed back bare `ruff format`, which
  # reformats every file under the working directory, and a gate is a question, not an edit. Each verb is
  # the tool's own check-only mode, which exits non-zero on an unformatted file; a formatter with none
  # (gofmt -l exits 0 either way) is ABSENT and names its closer rather than passing on a listing.
  formatter:
    role: formatter
    takes_path: true
    closed_by: the pack's formatter run by hand, then a diff review — no check-only mode that fails is declared for it
    verbs:
      ruff format: [ruff, format, --check]
      clang-format: [clang-format, --dry-run, --Werror]
      fantomas: [fantomas, --check]
      gleam format: [gleam, format, --check]
      mix format: [mix, format, --check-formatted]
      ocamlformat: [ocamlformat, --check]
      ormolu: [ormolu, --mode, check]
      prettier: [prettier, --check]
      roc format: [roc, format, --check]
      rustfmt: [rustfmt, --check]
      scalafmt: [scalafmt, --test]
      shfmt: [shfmt, -d]
      swift-format: [swift-format, lint, --strict]
      zig fmt: [zig, fmt, --check]
  # A RUNTIME'S NAME IS NOT A TYPE CHECK (2.30.0): the gate handed back bare `bash`, `python3`, `node` —
  # which EXECUTE the file. Each toolchain names its check-only command; a runtime without one is absent.
  # Verified on a machine with each installed: bash -n, py_compile, node --check, nim check, gleam check,
  # zig ast-check, go vet, ocamlopt. The compilers named as themselves compile the file they are given.
  # MEASURED AT 3.4.0 by enforce.py, on correct example files: bare -fsyntax-only and -typecheck refused
  # valid C++20 and async Swift; ocamlopt wrote .cmi/.cmx/.o beside the source; node --check cannot parse
  # TypeScript. Each verb below now passes its example and refuses a planted break. A tool that checks a
  # whole package or project runs from the directory holding its marker file, with no file argument.
  # A CHECK WITH NO OPERAND CHECKS NOTHING (3.9.0): the python verb reads sys.argv[1:], so the command
  # printed without the file exited 0 having parsed zero files. `takes_path` appends the file unless the
  # verb runs per project (per_directory), which is exactly what enforce.check_file already did.
  compiler_or_typechecker:
    role: compiler_or_runtime
    takes_path: true
    # A MARKER IS MATCHED AS A GLOB, not compared as a name (3.32.1). `dotnet build` is
    # project-scoped and a .NET project file is named after its project, so no exact filename
    # could ever match it. MEASURED: without the row, CI fed a bare .fsx to `dotnet build`, which
    # found no project and refused, while this Mac SKIPPED the same file for having no dotnet.
    per_directory: {'go vet ./...': go.mod, gleam check: gleam.toml, tsc --noEmit: tsconfig.json,
                    'dotnet build': '*.?sproj'}
    closed_by: the pack's unit_tests gate, which compiles or loads every file it tests
    verbs:
      bash: [bash, -n]
      python3: [python3, -c, 'import ast,sys; [ast.parse(open(f, encoding="utf-8").read(), f) for f in sys.argv[1:]]']
      node: [node, --check]
      nim: [nim, check]
      gleam: [gleam, check]
      zig: [zig, ast-check]
      go: [go, vet, ./...]
      ocamlopt: [ocamlc, -i]
      tsc: [tsc, --noEmit]
      rustc: [rustc]
      clang: [clang, -std=c17, -fsyntax-only]
      clang++: [clang++, -std=c++20, -fsyntax-only]
      nvcc: [nvcc]
      ghc: [ghc, -fno-code]
      swiftc: [swiftc, -parse-as-library, -typecheck]
      scalac: [scalac]
      dotnet: [dotnet, build]
      lean: [lean]
      chpl: [chpl]
      qsc: [qsc]
      futhark: [futhark, check]
      odin: [odin, check]
      roc: [roc, check]
      wrangler deploy --dry-run --config: [wrangler, deploy, --dry-run, --config]
  # BEHAVIOUR AT COMMIT, BOUNDED (3.16.0): a staged file that IS a test runs under its own runner, when that
  # runner takes one file. The hook proved parsing only; a test file is the one place behaviour is cheap to prove.
  # A WATCH-MODE RUNNER NEVER EXITS (3.50.0): bare `vitest` on a terminal watches forever, so the gate hung
  # where a subprocess without a TTY passed. `run_once` names the single-run spelling and leaves every other
  # runner as the pack declared it; `verbs` would have made each runner it does not list ABSENT.
  unit_tests: {role: test, per_file_runners: [pytest, vitest, jest, bats], run_once: {vitest: [vitest, run]}}
  tests: {role: test, run_once: {vitest: [vitest, run]}}
  focused_tests: {role: test, run_once: {vitest: [vitest, run]}}
  schema_validation: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  contract_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  endpoint_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  race_detection: {role: test, verbs: {go test: [go, test, -race, ./...]}, closed_by: "tests written for races and run under a race detector the toolchain provides — a thread sanitizer build where one exists"}
  cancellation_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  timeout_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  stress_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  static_analysis: {role: security}
  # A PACKAGE MANAGER'S NAME IS NOT A GATE. Found at 2.28.0: both gates resolved to the bare tool
  # (`cargo`, `go mod`, `uv`), which prints help and proves nothing — a gate that reads as covered
  # and runs no check. `verbs` names the built-in command that does the gate's job, keyed by what the
  # pack's role resolves to; a manager with no built-in verb is ABSENT and names its closer.
  dependency_graph:
    role: package_manager
    closed_by: Dependency Review on the pull request, which diffs the resolved graph
    verbs:
      uv: [uv, tree]
      pnpm: [pnpm, list, --depth, Infinity]
      npm: [npm, ls, --all]
      cargo: [cargo, tree]
      go mod: [go, mod, graph]
      swift package: [swift, package, show-dependencies]
      dotnet add package: [dotnet, list, package, --include-transitive]
      mix: [mix, deps.tree]
      opam: [opam, tree]
      gleam add: [gleam, deps, list]
  vulnerability_scan:
    role: package_manager
    closed_by: Dependency Review and Dependabot security updates on the pull request
    verbs:
      npm: [npm, audit]
      pnpm: [pnpm, audit]
      dotnet add package: [dotnet, list, package, --vulnerable, --include-transitive]
  benchmark: {role: benchmark}
  profiler: {role: profiler}
  property_or_fuzz: {role: fuzz}
  mutation_if_mature: {role: mutation}
  simulator_run: {role: compiler_or_runtime, verbs: {silq: [silq]}, closed_by: "a quantum pack's simulator, driven from its tests; meaningless outside quantum packs"}
  compatibility_check:
    role: none
    closed_by: no tool in one pack answers whether two versions of an API agree; the breaking and
      public_schema risk modifiers add consumer_impact_review, which is a person
  dependency_review:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  codeql:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  secret_scan:
    role: none
    closed_by: the platform control, declared in config/github-controls.json and audited live
  representative_workload:
    role: none
    closed_by: a DECLARATION about what the benchmark ran, not a command; the performance task
      profile requires it be named and a reviewer judges whether it is representative
  regression_threshold:
    role: none
    closed_by: a declared number the benchmark's own output is compared against
  shot_count_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  noise_model_declared:
    role: none
    closed_by: a declaration the quantum task profile requires before the run, not after
  resource_estimate:
    role: none
    closed_by: the simulator's own estimator, reported beside the run rather than gated on
  classical_baseline_comparison:
    role: none
    closed_by: a second run of the classical implementation, named in the quantum task profile
  artifact_verification:
    role: none
    closed_by: the release workflow's provenance step, which signs what it built
  supply_chain_verification:
    role: none
    closed_by: the platform's dependency and provenance controls, audited live
  integration_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  chunk_boundary_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  hybrid_recall_check: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  citation_check: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  freshness_stamp:
    role: none
    closed_by: a declaration recorded beside the index — the checksum and the contract version each
      record was read at; a stamp produced at query time restates when the question was asked
  authorization_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  session_invalidation_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  signature_verification_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  replay_protection_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  delivery_retry_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  quota_accounting_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  rotation_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  revocation_path_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  known_answer_tests: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  forward_compatibility_test: {role: test, verbs: {}, closed_by: "tests written for this concern and run by the pack's unit_tests gate — the gate names what the tests must cover, it has no command of its own"}
  invariant_property_test: {role: fuzz}
  no_plaintext_at_rest_check: {role: security, verbs: {}, closed_by: "a test that reads the stored bytes back and fails on plaintext; no linter answers it"}
  allocation_profile: {role: profiler}
  load_test: {role: benchmark}
  performance_if_relevant:
    role: none
    closed_by: the performance_change gate, which is the class to pick when it IS relevant; a tier
      entry that is optional by name cannot be resolved to a command without deciding that question
  consumer_impact_review:
    role: none
    closed_by: a person who knows who calls this; no tool in the producing repository can see the
      consumers, which is the whole reason a breaking change needs one
  parameter_review:
    role: none
    closed_by: a reviewer against the primary specification for the algorithm in question
  lock_order_review:
    role: none
    closed_by: a reviewer; a deadlock a test did not reach is not a deadlock a linter finds
  side_channel_note:
    role: none
    closed_by: a written statement of what was and was not considered, read at review
  cache_behaviour_note:
    role: none
    closed_by: a written statement beside the benchmark, because the number alone hides the cause
  migration_path:
    role: none
    closed_by: a document the reviewer reads, naming the steps and the point of no return
  rollback_rehearsal:
    role: none
    closed_by: the rehearsal itself, against a real store, in the release tier — a rollback never
      exercised is a plan, not a control
  version_bump:
    role: none
    closed_by: the contract's own version-site check, which refuses a tree whose declared sites disagree
  deprecation_window:
    role: none
    closed_by: a declared period, stated at the point of deprecation rather than at removal
  deprecation_policy_check:
    role: none
    closed_by: the repository's declared policy for how long a surface survives after it is replaced
  generated_client_regeneration:
    role: none
    closed_by: the consuming repository's own build, which is where a stale generated client fails
  applicable_security_and_dependency_checks: {role: security}

# A CHANGE CLASS IS THE FLOOR, AND ON ITS OWN IT IS TOO COARSE. `api_change` gates an added
# optional field and a removed endpoint identically, so the gates that matter for the second are
# absent from the first and nobody notices — the class passed. A MODIFIER only ever ADDS gates, so
# the class remains the floor and a modifier cannot be used to get a cheaper run. `atlas.py check`
# refuses a modifier whose `applies_to` is not a declared change class.
risk_modifiers:
  additive_endpoint:
    applies_to: api_change
    adds: [deprecation_policy_check]
  breaking_endpoint:
    applies_to: api_change
    adds: [consumer_impact_review, migration_path, version_bump, deprecation_window]
  auth_boundary:
    applies_to: api_change
    adds: [authorization_tests, session_invalidation_test, codeql, secret_scan]
  webhook:
    applies_to: api_change
    adds: [signature_verification_test, replay_protection_test, delivery_retry_test]
  public_schema:
    applies_to: api_change
    adds: [consumer_impact_review, version_bump, generated_client_regeneration]
  rate_limit:
    applies_to: api_change
    adds: [load_test, quota_accounting_test]
  credential_handling:
    applies_to: security_sensitive
    adds: [rotation_test, no_plaintext_at_rest_check, revocation_path_test]
  cryptography:
    applies_to: security_sensitive
    adds: [known_answer_tests, parameter_review, side_channel_note]
  shared_mutable_state:
    applies_to: concurrency_change
    adds: [invariant_property_test, lock_order_review]
  hot_path:
    applies_to: performance_change
    adds: [allocation_profile, cache_behaviour_note]
  schema_migration:
    applies_to: dependency_change
    adds: [forward_compatibility_test, rollback_rehearsal]

# WHAT A NATIVE TOOL IS AUTHORITATIVE FOR — AND WHAT NO ENTRY IN A MANIFEST ANSWERS AT ALL.
# `native_language_tools_are_authoritative` is true, and it was read as more than it says: a
# compiler accepting a program proves the program is well formed, never that it is correct, and a
# green unit suite proves nothing about how the thing behaves in production. Collapsing those into
# one word per pack is how a passing gate becomes a claim nobody made. Every manifest role belongs
# to EXACTLY ONE class below, and the two classes with no role are the point of the table: they
# are declared empty, with a closer, rather than silently answered by the nearest tool.
authority_classes:
  syntax:
    roles: [formatter]
    closed_by: the formatter is the authority and there is nothing above it
  type:
    roles: [compiler_or_runtime, lsp]
    closed_by: a type that holds says nothing about the value flowing through it — behavior below
  behavior:
    roles: [test, fuzz, mutation, debugger]
    closed_by: tests answer for the cases written; property and mutation runs widen that, and the
      gap that remains is named per change class in verification_policy
  security:
    roles: [security]
    closed_by: a pack's scanner plus the repository-level gates in the security_sensitive profile
  performance:
    roles: [benchmark, profiler]
    closed_by: a benchmark answers for the workload it ran; the representative workload is named
      by the performance_change gate
  supply_chain:
    roles: [package_manager]
    closed_by: dependency review and vulnerability scanning in the dependency_change gate
  reference:
    roles: [docs, research]
    closed_by: primary documentation is the source; a summary of it is not
  boundary:
    roles: []
    closed_by: NOTHING IN ONE PACK — a boundary is a contract between two, so it is answered by the
      polyglot task profile's boundary test and by the schema or ABI both sides read
  operational:
    roles: []
    closed_by: NOTHING IN A MANIFEST — no declared tool proves production readiness; the running
      service's own telemetry, the reliability task profile and the release tier answer for it

# WHEN A COPY OF THIS TREE EARNS ITS KEEP, AND WHEN IT LIES.
# A mutating suite LOCKS the tree it runs in — one suite per worktree, by construction — so a run
# and an edit cannot share one. MEASURED at 3.37.0: every edit in a long session waited ~330 s for
# the suite to release the tree, and two overlapping runs were started to avoid that wait, which
# made a reader see live plants as failures. A second worktree has its own lock; that is the whole
# reason a copy is worth having, and it is also the reason a copy must be synced before every run.
worktree_policy:
  kinds:
    main: the checkout the repository was cloned into — it holds the default branch and is never the tree a long suite runs in
    lane: a branch under work, matching branch_policy/worktree_pattern, which lands and is then removed
    testbed: a DETACHED throwaway a suite runs in, synced from the tree under test before every run
  testbed_rule: a testbed holds no branch and carries no commits of its own. It is synced FROM the tree under test before each run and removed when the work that needed it lands — a testbed left behind answers questions about a tree nobody is editing any more, and answers them confidently
  sync_rule: the copy IS the thing under test. A result from a testbed describes the bytes that were synced into it, so an edit made after the sync is outside that verdict and the sync is part of the run, never a setup step somebody remembers
  remote_rule: a remote or cloud copy sees only what was PUSHED. It can verify pushed state and can say NOTHING about uncommitted work, so a green remote run is not a verdict on the tree in front of you — it is a verdict on the tree the remote could see
  reported_by: branchstate.worktree_report

branch_policy:
  # HOW MUCH UNPUSHED WORK IS TOO MUCH — BOUNDED BY WHAT GROWS, NOT BY HOW MANY BRANCHES HOLD IT.
  #
  # The question that produced this was "cap at four branches, or five, or six?" Measured at
  # 2.26.0 this tree had THREE branches and TWO worktrees, so every one of those caps was already
  # satisfied and none would ever have fired — while eight commits sat unpushed on one branch for
  # roughly three hours. A container count is not the quantity; commits and time are what is lost
  # when a worktree is destroyed, so those are what is bounded.
  #
  # THE NUMBERS COME FROM THAT SESSION. Eight commits means a cap of five fires ONCE, in the
  # middle, while acting on it is still cheap; a cap of three would have fired three times in the
  # same session, and a guard that fires three times an hour gets silenced. `branchstate.py`
  # reports it and never pushes — pushing is an outward-facing act, not a tidy-up.
  # "PUSHED" IS NOT ONE STATE, AND CONFLATING THEM COST REAL TIME IN ONE SESSION. A branch was
  # pushed and the change was reported as landed; the forge's landing page shows the DEFAULT
  # branch, so it showed the old content and the work read as lost. Then the merge happened and
  # the page still showed the old content, because the page is cached. Four distinct states, three
  # of which look identical from a terminal:
  landed_states:
    committed: the work is in local history and survives nothing but this disk
    pushed: a remote holds the branch — recoverable if the machine dies, and invisible on the
      landing page, which renders the default branch and not yours
    merged: the default branch contains it, which is the first state a reader can stumble onto
    published: the rendered page shows it, which lags the merge by a cache and is the ONLY state
      anybody outside actually observes
  # A PUSH REJECTED FOR A STALE REF IS A RACE, NEVER A REASON TO FORCE. Seen this session on a
  # backup remote: `cannot lock ref 'refs/heads/main': is at <a> but expected <b>` means another
  # writer advanced the remote between the fetch and the push. The commits a force would remove
  # are that writer's, and they are usually the ones nobody has a second copy of.
  push_conflict_rule:
    symptom: cannot lock ref, non-fast-forward, or a rejection naming two differing hashes
    cause: another writer advanced the remote after this one read it
    do: fetch, rebase onto the new remote head, re-run the gates, push once more
    never: force, or a lease on a branch whose other writer is an automation that will not notice
    escalate_after: one failed retry — a second race is two writers, which is a scheduling problem
      and not a git problem
  landing_rule:
    rule: pull, rebase, push, pull request and armed auto-merge are ONE step — branchstate.py
      --land; after a merge, branchstate.py --sync fast-forwards the default branch and
      deletes finished lanes with `git branch -d`, whose refusal is the guard
    why: a pushed lane with nothing armed to merge it looks finished from the terminal and is
      invisible on the landing page; it was reported done while stranded, and found by the owner
    gate: the required status checks — auto-merge waits on them, so nothing lands on red
    enforced_by: branchstate.landing_verdict, which fails a pushed, unmerged branch that nothing
      will merge
    enforced_by_ref: branchstate.landing_verdict
  unpushed_bound:
    max_commits: 5
    max_age_hours: 2
    max_branches_with_unpushed: 3
    remote_max_age_hours: 24
    # Heads the forge creates and deletes itself; a fresh clone fetched a merge queue's and failed on it.
    forge_owned_prefixes: ['gh-readonly-queue/']
    why: measured on a session that reached eight unpushed commits over three hours on one branch;
      a branch-count cap of four, five or six would have printed a clean pass over all of it; four
      remote heads from pull requests closed unmerged sat days on the forge, so a remote head no
      local branch tracks is bounded too, and `--sync` deletes it once merged or closed
  default_base: main
  permanent_language_branches: false
  language_lane_pattern: 'lang/<language>/<topic>'
  topic_patterns:
    feature: 'feat/<topic>'
    fix: 'fix/<topic>'
    research: 'research/<topic>'
    security: 'security/<topic>'
  worktree_pattern: '../thea-software-wt/<language>-<topic>'
  isolation_rule: one_mutable_writer_per_worktree

# THE WORDS AN ISSUE ROUTE MAY USE THAT ARE NOT A ROUTE, GATE, PROFILE, RUNTIME OR MCP SERVER (3.11.0).
# A closed list, so a typo in issue_routes is refused by declcheck.issue_route_errors instead of read as a topic.

# THE MEASURED BENEFITS, HELD (3.14.0). Each row reads a recorded benchmark and takes the WORST model's
# ratio; below its floor the build fails (the benefit regressed), and above it by more than slack it fails
# too, naming the new floor — so a gain is locked in by the run that earned it. `scoreboard.py` prints them.
benchmark_floors:
- {id: routing_accuracy_routed, file: benchmarks/ab-latest.json, path: models.*.routed, num: correct, den: asked, floor: 0.94, measured_by: abtest.py, evidence: 'self-authored questions, held-out split'}
- {id: routing_accuracy_scoped, file: benchmarks/ab-latest.json, path: models.*.scoped, num: correct, den: asked, floor: 0.94, measured_by: abtest.py, evidence: 'self-authored questions, held-out split'}
- {id: diagnose_with_thea, file: benchmarks/tasks-latest.json, path: models.*.diagnose.thea, num: correct, den: asked, floor: 0.96, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: plan_with_thea, file: benchmarks/tasks-latest.json, path: models.*.plan.thea, num: correct, den: asked, floor: 1.0, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: hygiene_with_thea, file: benchmarks/tasks-latest.json, path: models.*.hygiene.thea, num: correct, den: asked, floor: 1.0, measured_by: taskbench.py, evidence: 'self-authored tasks'}
- {id: handoff_gates_right, file: benchmarks/workflow-latest.json, path: handoff.*.thea, num: gates_right, den: asked, floor: 1.0, measured_by: workflowbench.py, evidence: 'self-authored handoffs'}
- {id: tokens_per_routed_question, file: benchmarks/ab-latest.json, path: models.*.routed, field: tokens_per_question, ceiling: 220, slack: 10, measured_by: abtest.py, evidence: 'the most expensive model per question, lower is better'}
- {id: tokens_per_scoped_question, file: benchmarks/ab-latest.json, path: models.*.scoped, field: tokens_per_question, ceiling: 130, slack: 10, measured_by: abtest.py, evidence: 'the most expensive model per question, lower is better'}
- {id: agent_tasks_solved_with_thea, file: benchmarks/agent-latest.json, path: arms.thea, num: solved, den: attempted, floor: 1.0, measured_by: agentbench.py, evidence: 'three self-authored single-file bug fixes, one run each; the blind arm also solved all three, a ceiling effect'}
- {id: agent_gates_clean_with_thea, file: benchmarks/agent-latest.json, path: arms.thea, num: gates_clean, den: attempted, floor: 1.0, measured_by: agentbench.py, evidence: 'four self-authored tasks, one run; blind 3/4, the fourth left unformatted — a sample, not an edge'}
- {id: commit_breaks_refused, file: benchmarks/enforce-latest.json, path: '', num: refused, den: planted, floor: 1.0, measured_by: enforce.py measure, evidence: 'planted breaks in the repos own examples'}

# ROLES AN AGENT TAKES ON, BY THE USER'S DIRECTIVE (3.19.0). One agent is often several in a session:
# it implements, then reviews, then verifies — and a role switch that is not declared is scope drift.
# Each role names the task profile it runs under, what it may and may not do, what it hands back, and
# when it ends; `thea role <name>` prints it and `thea resume` says where interrupted work stands.
agent_roles:
  implementer: {task_profile: implementation, process: implementation, may: 'edit the paths the plan declared and run their gates', may_not: 'refactor beside the change or widen scope', hands_back: 'the diff and every gate result, NOT RUN included', ends_when: 'thea verify exits 0'}
  debugger: {task_profile: debugging, process: debugging, may: 'reproduce, bisect and add the failing test first', may_not: 'fix before the failure is reproduced', hands_back: 'the reproducing test and the fix', ends_when: 'the reproducing test passes and verify exits 0'}
  reviewer: {task_profile: default, may: 'read the diff, run gates and name findings', may_not: 'edit the code under review', hands_back: 'findings as path:line — what — fix, ranked', ends_when: 'every changed file has been read against its gates'}
  verifier: {task_profile: default, may: 'run thea verify and read its record', may_not: 'change code to make a gate pass', hands_back: 'the verify record, PASS FAIL and NOT RUN per gate', ends_when: 'verify has run once on the final tree'}
  researcher: {task_profile: research, may: 'read, search and fetch sources', may_not: 'edit the tree or state an unsourced number', hands_back: 'claims labelled CONFIRMED REPORTED INFERRED or UNCERTAIN, each sourced', ends_when: 'the question is answered or declared unanswerable here'}
  orchestrator: {task_profile: autonomous_agent, process: autonomous_agent, may: 'split work into lanes with task contracts and land them', may_not: 'edit inside a lane it handed off', hands_back: 'landed pull requests and each lane outcome', ends_when: 'every lane is landed or escalated'}

# A DECISION RESTS ON EVIDENCE (3.21.0): data with its source, the trend, and the human side — who pays for
# the wrong choice. A new record in systems/decisions.yaml without all three is refused; these predate the
# rule, and the list may only SHRINK — a record leaves it the moment its evidence is added.
decision_evidence_backlog: []

# THE TIME-BOXED SESSION (3.22.0), read by cadence.py and refused by declcheck.cadence_errors when it stops
# adding up. Weights are minutes of the declared box and must sum to it; exactly one phase is the RESERVE,
# which is entered on the clock whatever the state — a verification budget taken from the end is the budget
# that gets dropped. The expiry rule lowers the SCOPE and never the BAR: the clock running out is not
# authority to weaken a test. Provenance for every choice is in scripts/cadence.py.
cadence:
  box_minutes: 30
  wip: 1
  phases:
  - {id: localize, weight: 3, does: 'read only what the diagnosis needs; declare ONE change and the one test that will prove it', exits: 'one named change, one named test, one file family in scope'}
  - {id: baseline, weight: 2, does: 'run the suite BEFORE editing', exits: 'a known exit code; if it is already red, the goal becomes explaining the red'}
  - {id: repair, weight: 15, does: 'the single declared change, and nothing beside it', exits: 'the edits are complete'}
  - {id: verify, weight: 7, reserve: true, does: 'index --write, then the full done set; fix causes, never floors or caps', exits: 'verify exits 0 and the pull request is opened'}
  - {id: close, weight: 3, does: 'capture the learning, hand off, name the next action', exits: 'a verdict written: DONE, BLOCKED or DEFERRED'}
  checkpoints: [0.33, 0.67]
  definition_of_done: ['python scripts/verify.py exits 0', 'a pull request is opened']
  on_expiry:
  - 'green and openable: finish, open the pull request, DONE'
  - 'not green: stop editing, commit the work in progress on its branch, do NOT open a pull request, record the last failing assertion verbatim and the one next action, DEFERRED'
  - 'entangled or no baseline was taken: revert to the green baseline and hand back the diagnosis — a clean revert with a correct diagnosis beats a half-landed change'
  never_under_pressure:
  - 'weaken, skip or xfail a test, or narrow the suite it runs'
  - 'relax the definition of done, or open a pull request for a reviewer to finish'
  - 'start a second change because the first one stalled'
  measure: [definition_of_done_met, verification_ran_and_its_exit_code, reserve_held, minutes_over_box, wip_breaches, rework_rate, cost_per_done_session]

# WHAT A HANDOFF MUST CARRY (3.23.0), printed by delegate.py and refused by declcheck.delegation_errors.
# Measured across 200 traces of 7 multi-agent frameworks (MAST, arXiv:2503.13657): specification issues and
# inter-agent misalignment are the two largest failure categories. Both are brief quality, not model quality.
delegation_contract:
  required:
    goal: {ask: 'one sentence: the outcome, not the method', why: 'a delegate given a method solves the method; given an outcome it can find a better route'}
    scope: {ask: 'the files or directories it may read and change; everything else is out', why: 'an unscoped delegate reads the tree and returns an essay — the failure the atlas exists to prevent, one level down'}
    acceptance: {ask: 'the command or observable that judges ITS work', why: 'without one it judges itself, and a self-judged result is the premature-commitment shape'}
    returns: {ask: 'the shape of the answer — path:line, a verdict, a record', why: 'a narrative costs more to read than the sweep cost to run'}
    forbidden: {ask: 'what it must not do, including what looks helpful: widening scope, fixing while there, editing what it was asked to review', why: 'the helpful-looking action is the one that silently expands the diff'}
    read_only: {ask: 'THEA_READ_ONLY=1 unless this delegate IS the editing agent', why: 'an audit that can write races the editor; measured here when a read-only audit ran the planting suite beside live edits'}
  # WHAT A DELEGATE RETURNS IS NOT ALL ONE KIND OF THING, and treating it as one wastes the
  # delegation. "Confirm it with an instrument" is right for a claim about THIS tree and impossible
  # for a claim about a published API — re-running that one only spends the tokens the delegate was
  # sent to save. So every returned claim carries one of four labels, and the label decides what
  # the caller owes it. MEASURED at 3.38.0: of four harvested mechanism candidates, three were
  # CONFIRMED against this tree in seconds and two of those turned out to be already built — a
  # check that cost nothing and saved building them twice.
  return_labels:
    CONFIRMED:
      means: the delegate ran an instrument in THIS tree and reports its verdict
      caller_owes: re-run that instrument. It is cheap, it is local, and a delegate's green is still a hypothesis
    REPORTED:
      means: a primary source is named — a documented endpoint, a spec, a file in another project
      caller_owes: check the SOURCE is named and reachable, never re-derive the finding. Re-running a lookup the delegate already did is the cost the delegation existed to avoid, and it does not make the claim more true
    INFERRED:
      means: the delegate reasoned from what it read and no source states it outright
      caller_owes: this is where the caller's own reasoning belongs, and it is labelled INFERRED wherever it lands. It may inform a decision; it may never be recorded as a measurement
    UNCERTAIN:
      means: the delegate could not establish it and says so
      caller_owes: nothing but honesty — a declared gap is an OUTPUT, not a failed brief. A delegate that returns no UNCERTAIN over a wide question has probably guessed somewhere
  on_return:
  - 'what comes back is a HYPOTHESIS until an instrument in this repository confirms it — never land a delegate result on its own authority'
  - 'a result that names no file and no command is not a finding; ask again with the brief, or drop it'
  - 'if two delegates disagree, the instrument decides — never the more confident answer'

# EVERY INPUT A SCRIPT READS IS DECLARED (3.26.0), and every declared input is read. Harvested from a
# sibling build, where a guard found its own author's debris: a variable read by the code and named in no
# roster is green on the machine that has it and BLANK on a fresh clone — not an error, a wrong answer.
# Names only; a value never enters this tree. `set_by` says who supplies it, so an absent one is diagnosable.
declared_inputs:
  THEA_ROOT: {why: 'the atlas an installed CLI resolves against, when it is not the checkout it was run from', set_by: the operator, absent: 'the installed launcher falls back to its own resolution'}
  THEA_NO_FETCH: {why: 'set to 1, an installed CLI with no declared root refuses instead of downloading its release atlas', set_by: the operator, absent: 'the release tarball of the installed version is fetched, sha256-checked, into the user cache'}
  XDG_CACHE_HOME: {why: 'where an installed CLI caches the release atlas it fetched, under thea/atlas-<version>', set_by: 'the operator, or the desktop session', absent: '~/.cache is used'}
  CODE_DEVELOPMENT_ROOT: {why: 'the pre-rename name for the same root, still answered so an older caller keeps working', set_by: the operator, absent: 'THEA_ROOT is used instead'}
  THEA_MCP_ISOLATE: {why: 'makes every MCP call spawn a fresh interpreter instead of forking the warm server — the old route, kept behind a switch', set_by: the operator, absent: 'calls fork from the warm server while its loaded modules still match their files'}
  THEA_READ_ONLY: {why: 'marks a session that may not plant defects or edit — audits and subagents set it', set_by: the caller, absent: 'the run may write, which the planting suite requires'}
  THEA_CASES_FULL: {why: 'runs every planted case through the whole check as well as its declared enforcer, so the staged route is never the only proof an edge is real', set_by: 'the operator, or a control run', absent: 'each case naming an enforcer runs preflight plus that enforcer alone'}
  THEA_SUITE_PID: {why: 'the process id of the planting suite that holds the worktree, so its own writes are not refused as a concurrent editor', set_by: 'atlas_test.py, on itself', absent: 'any writer is treated as concurrent while the lock is held'}
  THEA_WORKER: {why: 'the worker id a journaled step is recorded under, so two writers in one checkout resume their own steps', set_by: 'the worker or its launcher', absent: 'the parent process id stands in, which is unique per launch and unstable across a resume'}
  ATLAS_LOCK_WAIT: {why: 'seconds the planting suite waits for the worktree lock before refusing to interleave', set_by: the caller, absent: 'the declared default wait applies'}
  NO_COLOR: {why: 'the cross-tool convention (no-color.org) that verdicts are printed without colour', set_by: 'the operator or the terminal', absent: 'colour is used only when stdout is a terminal'}
  ATLAS_TASK: {why: 'the task profile a continuous-integration run resolves gates for', set_by: the workflow, absent: 'the default task profile'}
  ATLAS_CHANGE: {why: 'the change class a continuous-integration run resolves gates for', set_by: the workflow, absent: 'source_change'}
  ATLAS_PATHS: {why: 'the paths a continuous-integration run routes, when it is not deriving them from the diff', set_by: the workflow, absent: 'the changed paths are derived from the pull request'}
  ATLAS_PROCESS: {why: 'the named process a continuous-integration run reports against', set_by: the workflow, absent: 'no process is reported'}
  GIT_DIR: {why: 'git''s own override naming the repository a command reads; files_under strips it (and GIT_WORK_TREE) so a hook''s or a caller''s repository never answers for another tree', set_by: 'git, inside its hooks, or the operator', absent: 'git discovers the repository from the working directory'}
  THEA_BASE: {why: 'the commit a pull request diff is read from, so scope judges base..HEAD and the receipt names it', set_by: the workflow, absent: 'scope reads the working tree and the receipt base is null'}
  GITHUB_BASE_REF: {why: "the pull request's base branch, to diff against it", set_by: GitHub Actions, absent: 'the declared default base'}
  HERMES_HOME: {why: 'where an agent runtime keeps its scheduled job list, so the scheduler sweep reads the live one', set_by: 'the operator or that runtime', absent: 'the sweep reads the job list under the home directory'}
  GROQ_API_KEY: {why: 'reaches one measurement provider in the agent-control suite; a NAME only, never a value in this tree', set_by: the operator, absent: 'that arm reports NOT RUN rather than a simulated number'}
  THEA_PRIVATE_TERMS: {why: 'a file of names only the owner knows — projects, routers, fleet — that the public tree may never carry; the list itself stays untracked', set_by: the operator, absent: 'no private-name check runs, and none is claimed'}
  THEA_ROUTER_URL: {why: 'the chat-completions address of the operator''s own local OpenAI-compatible router', set_by: the operator, absent: 'the router provider is tried at the declared local default and refuses by name if nothing answers'}
  THEA_HOME: {why: 'where the agent registry keeps one record per live session, so a test plants its own and never touches the real one', set_by: 'the operator, or a test on itself', absent: '~/.thea is used'}
  VAULT: {why: 'the knowledge store a link check walks, which lives outside this repository', set_by: the operator, absent: 'the link check reports it cannot see the store'}
  VAULT_INBOX: {why: 'where that store receives new notes', set_by: the operator, absent: 'the inbox is skipped'}
  VAULT_TERMINAL: {why: 'the terminal-facing subset of that store', set_by: the operator, absent: 'that subset is skipped'}

# THE PUBLIC-REPOSITORY RULE AS DATA (3.18.0), enforced by leaks.py: placeholders a pattern may match on
# purpose, and the runtime stores that must stay gitignored because they record paths and hosts.
public_surface:
  placeholders: [/home/u/, noreply@anthropic.com, noreply@github.com, '@example.', user@host, t@t]
  never_tracked: [.agent/audit/probe.jsonl, run.log, .bash_history, .zsh_history, trace.trace, .thea/state]
  # THE PRIVACY PROMISE, ENFORCED: Thea's records stay on the machine that ran them. Only these modules may
  # import a network library, each run by its own command with the user's own keys or remote (leaks.py).
  # atlas_cli.py opens one: a bare index install fetches its own release tarball, sha256-checked (3.53.0).
  # installcheck.py clones and installs: the published source reaches the repository, every source the package index.
  network_modules: [scripts/abtest.py, scripts/atlas_cli.py, scripts/ghaudit.py, scripts/installcheck.py, scripts/providers.py, scripts/resilience.py]

# THE INSTALL THE DOCUMENTS GIVE, DECLARED ONCE (3.52.0). Rendered into README.md and docs/CONSUMING.md as the
# `install` block and executed by scripts/installcheck.py in CI. `{repo}` and `{tag}` are filled per source; a
# line elsewhere that installs Thea is refused (documented_install_runs). The index route is absent on purpose:
# the index answered 404 for the name, and a row here is executed, so it returns only once a release is there.
install_commands:
  index:
    label: no checkout
    command: uv tool install thea-software && thea doctor
    proves: the latest index release installs without a checkout, fetches its own sha256-checked release tree and `thea doctor` exits 0; it installs what is published, never the tree under review
  release_checkout:
    label: or, editable
    command: git clone --depth 1 --branch {tag} {repo} ~/thea && uv tool install --editable ~/thea && thea doctor
    proves: a clone of the tag, installed editable, resolves its own atlas and `thea doctor` exits 0

# A symbol named only by its own definition is deleted or declared here WITH its reason (orphans.py).
orphan_exemptions: {}

issue_route_terms: [atlas, binary_artifact, compatibility, dependencies, dependency_scan, environment, extension, fuzz, generated_artifact, http, integration_test, issue_labels, language_debugger, language_lane, links, manifest, merge, migration, module_size, mutation_test, orphans, ownership, payload_size, property_test, query_plan, regression, routes, runtime_debugger, schema, task_profile, topic_branch, transaction, versions, webhook, worktree]

issue_routes:
  memory: [rust, c, cpp, zig, nim, hare, odin]
  concurrency: [go, rust, elixir, gleam, chapel, typescript, python]
  debugging: [vscode, language_debugger, runtime_debugger, profiler]
  gpu: [cuda, mojo, futhark, chapel, julia]
  # ZERO-COPY AND KERNEL BYPASS are a real domain with real packs behind them, and they are a
  # ROUTING concern rather than anything this harness does: the harness is a Python contract and
  # will never move a packet. An issue about a data path that must not allocate belongs to the
  # manual-memory packs, whose own tools answer for it.
  zero_copy: [rust, c, cpp, zig, go]
  # ON-DEVICE INFERENCE is where quantisation lives — a model small enough for static memory is a
  # constraint on the language and the allocator, not on the model alone.
  on_device_inference: [c, cpp, rust, zig, mojo]
  security: [static_analysis, dependency_scan, secret_scan, codeql]
  polyglot: [schema, ownership, compatibility, integration_test]
  drift: [links, routes, versions, orphans, dependencies, environment]
  mcp: [github, serena, playwright, context7, dbhub, semgrep]
  routing: [atlas, extension, manifest, issue_labels, task_profile]
  branch: [worktree, language_lane, topic_branch, merge]
  endpoint: [schema, http, webhook, integration_test]
  database: [schema, migration, transaction, query_plan]
  mutation: [property_test, fuzz, mutation_test, regression]
  blob: [module_size, generated_artifact, binary_artifact, payload_size]

runtime_roles:
  # A HOST IS NOT A MODEL, and the difference decides where a runtime belongs. `model_routes` says
  # which MODEL answers a kind of work; these say what a RUNTIME is for. Multica is the second kind
  # and only the second kind: it is one interface in which several agents are reachable at once,
  # each over its own native CLI, so it appears here and in no model route. It loads no entry file
  # of its own -- the CLIs it drives each read theirs -- so it has no runtime_entry row either.
  multica: multi_agent_host
  vscode: interactive_ide_agent_host
  opencode: terminal_agent_workspace
  github_actions: authoritative_repository_verification
  cli: deterministic_local_harness
  native_toolchain: authoritative_language_verification
