    prevented_by: 'deleting a script and every hook, status line and scheduler entry that names it in the same change, and a sweep that resolves every path a hook or scheduled job executes or changes into — on the host that runs it — and fails on one that is missing; a wrapper never turns a missing target into exit zero'
    unenforceable: 'harness settings files live in the user home and each project, outside this tree'
    closed_by: 'a host sweep over every settings file and every scheduler on each host that resolves each executed path, mutation-tested with a planted missing script and clean on the real settings'
  a_heartbeat_that_reports_liveness_not_health:
    shape: 'an unattended host sends a periodic beat that proves only the beat ran — memory, disk, a port — while its scheduled work is dead: a timer enabled but never armed, jobs ending on timeout, a job runner logging errors. The alerter watches for a MISSING beat, so a host that beats on schedule over dead work is green forever'
    looks_like: 'a monitored host with a recent, cheerful heartbeat and no alert ever sent'
    tell: 'the beat payload names no scheduled job; the newest run of the hourly audit predates the beat by hours; non-zero exit codes in the run log that nothing reads'
    sightings: 1
    prevented_by: 'the beat is fail-closed: it is sent only when an audit newer than its own max age passed — audit FAIL, audit stale or audit missing sends one FAIL beat and then withholds, which turns any failure into the missing-beat alert the alerter already proves. The audit itself fails on an enabled timer that is not armed, a failed unit, a non-zero run since the last audit, an errored job, and an empty roster'
